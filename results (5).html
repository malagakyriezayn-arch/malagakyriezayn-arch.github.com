<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171329">

  <title>Results | Eurovision Rewind</title>
  <meta name="description" id="metaDesc" content="Eurovision Rewind scoreboards for every edition.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Eurovision Rewind">
  <meta property="og:title" id="ogTitle" content="Results | Eurovision Rewind">
  <meta property="og:description" id="ogDesc" content="Eurovision Rewind scoreboards for every edition.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.460.0"></script>

  <style>
    :root {
      --white: #ffffff;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Montserrat", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at 10% 0%, rgba(112, 83, 213, .25), transparent 40%),
        radial-gradient(ellipse at 100% 35%, rgba(52, 166, 175, .13), transparent 38%),
        linear-gradient(145deg, #171329, #101522 65%, #171329);
      background-attachment: fixed;
    }

    @media (hover: none) {
      body { background-attachment: scroll; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .header-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 18px;
    }

    .pill-header {
      display: flex;
      animation: header-arrive 700ms cubic-bezier(.2,.75,.25,1) both;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      min-height: 62px;
      padding: 8px 16px;
      background: var(--glass, rgba(255, 255, 255, 0.09));
      border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.20));
      border-radius: 999px;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      max-width: 125px;
      height: 42px;
      flex-shrink: 0;
      text-decoration: none;
    }

    .brand img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      padding: 0;
      color: white;
      background: transparent;
      border: 0;
      border-radius: 50%;
      text-decoration: none;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .nav-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .nav-icon svg {
      display: block;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .nav-icon:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    /* MAIN (empty - add your content here) */

    main {
      width: min(1180px, 94%);
      margin: 0 auto;
      padding: 26px 0 80px;
    }

    /* =========================
       CUSTOM FONT
       Put your font file in a "fonts" folder and name it results-font.ttf
       (or .otf / .woff / .woff2), or change the file names below.
    ========================= */

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-MediumItalic.otf") format("opentype");
      font-weight: 500;
      font-style: italic;
      font-display: swap;
    }

    /* =========================
       SCOREBOARD SIZES AND COLOURS
       Change any value here. Open results.html?tune to adjust them with sliders.
    ========================= */

    :root {
      --results-font: "ResultsFont", "Neulis", "Montserrat", sans-serif;
      --font-weight: 700;

      /* Shapes: height and width */
      --board-w: 1100px;                          /* whole board */
      --row-h: clamp(38px, 5.2cqw, 56px);         /* height of every row */
      --row-gap: 6px;                             /* space between rows */
      --col-gap: 22px;                            /* space between the two columns */
      --cell-gap: 0px;                            /* space between rank / flag / name (0 = connected) */
      --rank-w: clamp(40px, 6cqw, 64px);          /* rank block width */
      --points-w: clamp(56px, 8.5cqw, 92px);      /* points block width */
      --flag-w: clamp(46px, 6.6cqw, 72px);        /* rectangular flag width (height = row height) */
      --font-size: clamp(14px, 2.25cqw, 24px);    /* text size */
      --name-pad: 16px;                           /* space inside the name block */
      --row-radius: 12px;                         /* rounded ends of each row */

      /* Colours */
      --board-bg: #1a1560;
      --rank-bg: #5a2aa3;
      --flag-bg: #2b2478;
      --name-bg: #ffffff;
      --points-bg: #ffffff;
      --text: #ffffff;
      --name-text: #1c1a55;
      --points-text: #1c1a55;
    }

    @media (max-width: 720px) {
      :root {
        --row-h: 46px;
        --row-gap: 5px;
        --rank-w: 46px;
        --points-w: 64px;
        --flag-w: 54px;
        --font-size: 16px;
        --name-pad: 10px;
        --row-radius: 10px;
      }
    }

    /* Edition tabs */

    .edition-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
    }

    .edition-tabs a {
      min-width: 74px;
      animation: tab-arrive 500ms cubic-bezier(.2,.75,.25,1) both;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      padding: 9px 18px;
      color: #c2bfd6;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .edition-tabs a:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }

    .edition-tabs a.active {
      color: #fff;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    a:focus-visible {
      outline: 2px solid #c9bdff;
      outline-offset: 3px;
    }

    /* Heading */

    .results-head {
      margin-bottom: 18px;
      text-align: center;
      animation: heading-arrive 750ms 100ms cubic-bezier(.2,.75,.25,1) both;
    }

    .year {
      color: #fff;
      font-family: var(--results-font);
      font-size: clamp(48px, 10vw, 92px);
      font-weight: var(--font-weight);
      line-height: 1;
      text-shadow:
        -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
        0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000;
    }

    .sub {
      margin-top: 10px;
      color: #c2bfd6;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .round-picker {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 14px auto 20px;
    }

    .round-picker button {
      min-height: 36px;
      padding: 8px 15px;
      color: #d2cde5;
      font: 700 12px "Montserrat", sans-serif;
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, color .2s ease;
    }

    .round-picker button:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); color: #fff; }
    .round-picker button.active { color: #fff; background: linear-gradient(135deg,#6f5bd9,#4d3da6); border-color: transparent; }
    .round-picker button.add-round { border-style: dashed; color: #c7baff; }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 12px;
      color: #ffd28a;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 210, 138, 0.1);
      border: 1px solid rgba(255, 210, 138, 0.3);
      border-radius: 999px;
    }

    [hidden] { display: none !important; }

    @keyframes header-arrive {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes tab-arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes heading-arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes row-arrive {
      from { opacity: 0; transform: translateX(-14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Scoreboard */

    .board-wrap {
      container-type: inline-size;
      width: 100%;
      max-width: var(--board-w);
      margin: 0 auto;
      padding: clamp(12px, 2.2vw, 26px);
      background:
        radial-gradient(ellipse at 0% 0%, rgba(120, 90, 255, .28), transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(60, 150, 255, .16), transparent 50%),
        linear-gradient(160deg, #241b7c, var(--board-bg) 62%, #150f4a);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(6, 4, 30, .5), inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .board {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      grid-template-rows: repeat(var(--per-col, 8), var(--row-h));
      column-gap: var(--col-gap);
      row-gap: var(--row-gap);
    }

    .row {
      position: relative;
      display: flex;
      gap: var(--cell-gap);
      overflow: hidden;
      border-radius: var(--row-radius);
      box-shadow: 0 4px 14px rgba(6, 4, 36, .38);
      min-width: 0;
      height: var(--row-h);
      color: var(--text);
      font-family: var(--results-font);
      font-size: var(--font-size);
      font-weight: var(--font-weight);
      line-height: 1;
      transform-origin: center left;
      /* "backwards" (not "both") so the hover effect still works after the intro */
      animation: row-arrive 520ms cubic-bezier(.2,.75,.25,1) backwards;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .row:hover {
      z-index: 1;
      transform: translateX(5px) scale(1.012);
      filter: brightness(1.12);
    }

    .row:nth-child(1) { animation-delay: 180ms; }
    .row:nth-child(2) { animation-delay: 220ms; }
    .row:nth-child(3) { animation-delay: 260ms; }
    .row:nth-child(4) { animation-delay: 300ms; }
    .row:nth-child(5) { animation-delay: 340ms; }
    .row:nth-child(6) { animation-delay: 380ms; }
    .row:nth-child(7) { animation-delay: 420ms; }
    .row:nth-child(8) { animation-delay: 460ms; }
    .row:nth-child(n+9) { animation-delay: 500ms; }

    .cell {
      display: flex;
      align-items: center;
    }

    .rank {
      flex: none;
      justify-content: center;
      width: var(--rank-w);
      font-weight: 800;
      background: linear-gradient(180deg, color-mix(in srgb, var(--rank-bg) 88%, #fff), var(--rank-bg));
      border-radius: var(--row-radius) 0 0 var(--row-radius);
    }

    .flag {
      flex: none;
      width: var(--flag-w);
      overflow: hidden;
      background: var(--flag-bg);
    }

    .name {
      flex: 1;
      min-width: 0;
      padding: 0 var(--name-pad);
      color: var(--name-text);
      font-weight: 800;
      background: var(--name-bg);
    }

    .points {
      flex: none;
      justify-content: center;
      width: var(--points-w);
      margin-left: 3px;
      color: var(--points-text);
      font-weight: 900;
      background: var(--points-bg);
      border-radius: 0 var(--row-radius) var(--row-radius) 0;
    }

    .country {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Flag image: the full rectangular flag (local file or flagcdn.com) */

    .flag-img {
      display: block;
      flex: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .row .flag-img {
      animation: flag-pop 700ms cubic-bezier(.2,.75,.25,1) backwards;
      animation-delay: inherit;
      transition: transform 400ms cubic-bezier(.2,.75,.25,1);
    }

    .row:hover .flag-img {
      transform: scale(1.12);
    }

    @keyframes flag-pop {
      from { opacity: 0; transform: scale(1.35); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Light sweep across a row on hover */

    .row::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .28) 50%, transparent 65%);
      transform: translateX(-120%);
    }

    .row:hover::after {
      transform: translateX(120%);
      transition: transform 650ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .row, .row .flag-img { animation: none; }
      .row::after { display: none; }
    }

    /* While editing with ?data, skip the intro animation so typing feels instant */
    body.editing .row {
      animation: none;
    }

    .empty {
      padding: 46px 18px;
      color: #fff;
      font-family: var(--results-font);
      font-size: clamp(16px, 3vw, 22px);
      text-align: center;
      background: var(--rank-bg);
    }

    /* Size tuner (only with ?tune) */

    body.tuning main {
      padding-bottom: 56vh;
    }

    .tuner {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      max-height: 52vh;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      overflow: auto;
      background: rgba(17, 19, 27, 0.96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .tuner > * { max-width: 560px; margin-left: auto; margin-right: auto; }

    .tuner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .tuner h2 { font-size: 15px; }
    .tuner h2 small { margin-left: 8px; color: #65d5d0; font-size: 11px; font-weight: 600; }
    .tuner.collapsed #tuneBody { display: none; }

    .tune-row {
      display: grid;
      grid-template-columns: 1fr 1.4fr 52px;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: #c2bfd6;
      font-size: 12px;
      font-weight: 600;
    }

    .tune-row input { width: 100%; }
    .tune-row output { text-align: right; color: #fff; }

    .tune-login {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px auto 4px;
    }

    .tune-login input {
      flex: 1 1 150px;
      padding: 10px 12px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .tuner button {
      padding: 10px 16px;
      color: #fff;
      font: 700 12px "Montserrat", sans-serif;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }

    .tuner button.ghost {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .tuner button.small { padding: 6px 12px; }

    .tune-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tune-note { min-height: 18px; margin-top: 10px; color: #65d5d0; font-size: 12px; }
    .tune-note.error { color: #ff9b9b; }

    .tool-tabs { display: flex; gap: 6px; }

    .tuner button.tab {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .tuner button.tab.active {
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    .tool-mode { margin-bottom: 10px; color: #65d5d0; font-size: 12px; font-weight: 600; }

    .data-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      grid-template-areas:
        "rank country points"
        "rank heart   btns";
      gap: 6px 8px;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .data-rank { grid-area: rank; color: #c2bfd6; font-size: 12px; font-weight: 700; text-align: center; }
    .data-country { grid-area: country; }
    .data-points { grid-area: points; width: 92px; }
    .data-heart { grid-area: heart; }
    .data-btns { grid-area: btns; display: flex; gap: 4px; }

    .data-row input {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .data-row .data-heart { font-size: 11px; font-weight: 500; }

    .tuner .data-btns button {
      padding: 8px 10px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .edition-tools {
      margin: 0 auto 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }

    .edition-tools summary {
      color: #65d5d0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .edition-form {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .edition-form label {
      display: flex;
      flex: 1 1 150px;
      flex-direction: column;
      gap: 4px;
      color: #c2bfd6;
      font-size: 11px;
      font-weight: 600;
    }

    .edition-form label:first-child:has(input[type="number"]) { flex: 0 0 110px; }

    .edition-form input {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .hint {
      margin-top: 10px;
      color: #c2bfd6;
      font-size: 12px;
      font-weight: 600;
    }

    .row.clickable { cursor: pointer; }
    /* Voting-only entrants count as voters but are excluded from the finalist board. */
    .row.voter-only { display: none; }

    .row.clickable:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    /* ---------- Detail window (opens when a country is clicked) ---------- */

    dialog.detail {
      position: fixed;
      inset: 0;
      margin: auto;
      width: min(660px, calc(100% - 24px));
      max-width: none;
      max-height: min(88vh, 780px);
      padding: 0;
      overflow: visible;
      color: #fff;
      font-family: var(--results-font);
      background: transparent;
      border: 0;
    }

    dialog.detail::backdrop {
      background: rgba(8, 6, 30, 0.76);
      backdrop-filter: blur(4px);
    }

    dialog.detail[open] { animation: detail-in 420ms cubic-bezier(.2,.9,.25,1.08); }
    dialog.detail[open]::backdrop { animation: backdrop-in 320ms ease; }
    dialog.detail.closing { animation: detail-out 200ms ease forwards; }
    dialog.detail.closing::backdrop { animation: backdrop-out 200ms ease forwards; }

    @keyframes detail-in {
      from { opacity: 0; transform: translateY(34px) scale(.92); }
      to { opacity: 1; transform: none; }
    }
    @keyframes detail-out {
      to { opacity: 0; transform: translateY(18px) scale(.96); }
    }
    @keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes backdrop-out { to { opacity: 0; } }

    .detail-card {
      max-height: min(88vh, 780px);
      padding: 16px;
      overflow: auto;
      background:
        radial-gradient(ellipse at 0% 0%, rgba(120, 90, 255, .3), transparent 55%),
        linear-gradient(160deg, #261d80, var(--board-bg) 65%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(4, 2, 24, .65);
    }

    .detail-head {
      display: flex;
      align-items: stretch;
      min-height: 58px;
      font-weight: 800;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(6, 4, 36, .38);
    }

    .detail-rank,
    .detail-total,
    .detail-close {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
    }

    .detail-rank {
      width: 58px;
      font-size: 22px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--rank-bg) 88%, #fff), var(--rank-bg));
      border-radius: 12px 0 0 12px;
    }

    .detail-total {
      min-width: 88px;
      padding: 0 12px;
      margin-left: 3px;
      color: var(--points-text);
      font-size: 20px;
      font-weight: 900;
      white-space: nowrap;
      background: var(--points-bg);
    }

    .detail-name {
      display: flex;
      flex: 1;
      align-items: stretch;
      min-width: 0;
    }

    .detail-name .flag-img {
      width: 70px;
      height: auto;
      background: var(--flag-bg);
    }

    .detail-name h2 {
      display: flex;
      flex: 1;
      align-items: center;
      min-width: 0;
      padding: 0 16px;
      overflow: hidden;
      color: var(--name-text);
      font-size: 22px;
      font-weight: inherit;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--name-bg);
    }

    .detail-close {
      width: 48px;
      margin-left: 3px;
      color: #fff;
      font: inherit;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.32);
      border: 0;
      border-radius: 0 12px 12px 0;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .detail-close:hover { background: rgba(255, 70, 90, .8); transform: rotate(90deg); }

    .detail-close:focus-visible,
    .detail-tabs button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .detail-tabs {
      display: flex;
      gap: 6px;
      margin-top: 14px;
    }

    .detail-tabs button {
      padding: 8px 18px;
      color: #d9d2ff;
      font: 700 12px "Montserrat", sans-serif;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease, transform 200ms ease;
    }

    .detail-tabs button:hover { transform: translateY(-1px); background: rgba(255, 255, 255, .18); }
    .detail-tabs button.active { color: #fff; background: var(--rank-bg); border-color: transparent; }

    .detail-section h3 {
      display: flex;
      justify-content: space-between;
      margin: 20px 0 9px;
      color: #d9d2ff;
      font: 700 12px "Montserrat", sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    /* Rows slide in one after another every time the list is drawn (open or switch tab) */

    .vline {
      display: flex;
      min-height: 46px;
      margin-bottom: 5px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(6, 4, 36, .3);
      animation: line-in 460ms cubic-bezier(.2,.75,.25,1) backwards;
      animation-delay: calc(var(--i, 0) * 55ms + 120ms);
    }

    @keyframes line-in {
      from { opacity: 0; transform: translateX(-22px); }
      to { opacity: 1; transform: none; }
    }

    .vpoints {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 58px;
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(180deg, color-mix(in srgb, var(--rank-bg) 88%, #fff), var(--rank-bg));
      border-radius: 10px 0 0 10px;
    }

    .vnames {
      display: flex;
      flex: 1;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 16px;
      min-width: 0;
      padding: 8px 14px;
      color: var(--name-text);
      font-size: 16px;
      font-weight: 800;
      background: var(--name-bg);
      border-radius: 0 10px 10px 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      animation: chip-in 380ms cubic-bezier(.2,.9,.3,1.2) backwards;
      animation-delay: calc(var(--i, 0) * 55ms + 260ms);
    }

    @keyframes chip-in {
      from { opacity: 0; transform: scale(.7); }
      to { opacity: 1; transform: none; }
    }

    .chip .flag-img {
      width: 34px;
      height: 24px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
    }

    .detail-empty {
      padding: 14px;
      color: #d9d2ff;
      font-size: 14px;
      background: rgba(255, 255, 255, .08);
      border-radius: 10px;
      animation: line-in 400ms ease backwards 150ms;
    }

    /* Header blocks fly in once, when the window opens */

    dialog.detail.fresh .detail-rank,
    dialog.detail.fresh .detail-name .flag-img,
    dialog.detail.fresh .detail-name h2,
    dialog.detail.fresh .detail-total,
    dialog.detail.fresh .detail-close {
      animation: part-in 520ms cubic-bezier(.2,.8,.25,1) backwards;
    }
    dialog.detail.fresh .detail-name .flag-img { animation-name: part-flag; animation-delay: 80ms; }
    dialog.detail.fresh .detail-name h2 { animation-delay: 140ms; }
    dialog.detail.fresh .detail-total { animation-delay: 200ms; }
    dialog.detail.fresh .detail-close { animation-delay: 260ms; }

    @keyframes part-in { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
    @keyframes part-flag { from { opacity: 0; transform: scale(1.5); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      dialog.detail[open], dialog.detail[open]::backdrop, dialog.detail.closing,
      .vline, .chip, .detail-empty, dialog.detail.fresh * { animation: none !important; }
    }

    @media (max-width: 720px) {
      dialog.detail { inset: auto 0 0; margin: 0; width: 100%; }
      dialog.detail[open] { animation-name: sheet-in; }
      dialog.detail.closing { animation-name: sheet-out; }
      .detail-card { padding: 12px; border-radius: 20px 20px 0 0; }
      .detail-rank { width: 46px; font-size: 18px; }
      .detail-total { min-width: 68px; font-size: 17px; }
      .detail-name .flag-img { width: 54px; }
      .detail-name h2 { font-size: 18px; padding: 0 10px; }
      .vpoints { width: 46px; font-size: 17px; }
      .vnames { font-size: 14px; padding: 8px 10px; }
      .chip .flag-img { width: 30px; height: 21px; }
    }

    @keyframes sheet-in { from { opacity: .4; transform: translateY(100%); } to { opacity: 1; transform: none; } }
    @keyframes sheet-out { to { opacity: .4; transform: translateY(100%); } }

    /* Points editor: votes */

    .vote-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
      color: #c2bfd6;
      font-size: 12px;
      font-weight: 600;
    }

    .data-category-title {
      margin: 18px 0 10px;
      padding: 8px 10px;
      color: #65d5d0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      background: rgba(101, 213, 208, 0.08);
      border-left: 3px solid #65d5d0;
      border-radius: 4px;
    }

    .data-item {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .data-item .data-row {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .votes-editor {
      margin-top: 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }

    .votes-editor h4 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: #65d5d0;
      font-size: 12px;
    }

    .votes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .vote-pick { display: flex; align-items: center; gap: 8px; }

    .vote-pick span {
      width: 22px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .vote-pick select {
      flex: 1;
      min-width: 0;
      padding: 8px;
      color: #fff;
      font: 600 12px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .vote-pick select option { color: #000; }

    @media (max-width: 520px) {
      .votes-grid { grid-template-columns: 1fr; }
    }

    /* MOBILE NAVIGATION */

    @media (max-width: 700px) {
      .header-wrapper {
        padding: 12px;
      }

      .pill-header {
        min-height: 54px;
        padding: 6px 10px;
      }

      .brand {
        max-width: 90px;
        height: 36px;
      }

      .nav-icons {
        gap: 2px;
      }

      .nav-icon {
        width: 38px;
        height: 38px;
      }

      .nav-icon svg {
        width: 20px;
        height: 20px;
      }
    }

    @media (max-width: 380px) {
      .pill-header {
        padding: 5px 7px;
      }

      .brand {
        max-width: 62px;
        height: 31px;
      }

      .nav-icons {
        gap: 0;
      }

      .nav-icon {
        width: 35px;
        height: 35px;
      }

      .nav-icon svg {
        width: 18px;
        height: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================================================
       EXTRAS: search, sort, winner strip, share, tie ranks...
    ========================================================= */

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .skip {
      position: absolute;
      top: -70px;
      left: 12px;
      z-index: 200;
      padding: 10px 16px;
      color: #1c1a55;
      font: 800 13px "Montserrat", sans-serif;
      text-decoration: none;
      background: #fff;
      border-radius: 10px;
    }

    .skip:focus { top: 12px; }

    .nav-icon.active { background: rgba(255, 255, 255, 0.18); }

    .winner-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 18px;
      width: 100%;
      max-width: var(--board-w);
      margin: 0 auto 14px;
      padding: 12px 16px;
      background: linear-gradient(135deg, rgba(255, 207, 74, .2), rgba(255, 207, 74, .05));
      border: 1px solid rgba(255, 207, 74, .5);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(6, 4, 30, .35);
      animation: heading-arrive 650ms cubic-bezier(.2,.75,.25,1) backwards;
    }

    .winner-strip.clickable { cursor: pointer; transition: transform .2s ease, filter .2s ease; }
    .winner-strip.clickable:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .winner-strip:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .ws-label {
      color: #ffcf4a;
      font: 800 12px "Montserrat", sans-serif;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .ws-tile {
      display: flex;
      align-items: stretch;
      height: 46px;
      overflow: hidden;
      color: var(--name-text);
      font-family: var(--results-font);
      font-size: 20px;
      font-weight: 800;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(6, 4, 36, .4);
    }

    .ws-tile .flag-img { width: 64px; height: 100%; }
    .ws-name, .ws-pts { display: flex; align-items: center; padding: 0 14px; }
    .ws-pts { color: #1b1830; font-weight: 900; background: #ffcf4a; }
    .ws-note { color: #e6dfff; font-size: 13px; font-weight: 600; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: var(--board-w);
      margin: 0 auto 14px;
    }

    .search input {
      width: min(270px, 78vw);
      padding: 10px 16px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(255, 255, 255, .08);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .search input::placeholder { color: #b9b4d6; }
    .search input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .sort { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 6px; }

    .pill, .sort button {
      padding: 9px 15px;
      color: #d2cde5;
      font: 700 12px "Montserrat", sans-serif;
      text-decoration: none;
      background: rgba(255, 255, 255, .07);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, color .2s ease;
    }

    .pill:hover, .sort button:hover { color: #fff; background: rgba(255, 255, 255, .15); transform: translateY(-2px); }
    .sort button.active { color: #fff; background: linear-gradient(135deg, #6f5bd9, #4d3da6); border-color: transparent; }
    .pill:focus-visible, .sort button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    /* Search: other countries fade out */

    .row { transition: transform 180ms ease, filter 180ms ease, opacity 250ms ease; }
    .row.dim { opacity: .22; filter: saturate(.4); }
    .row.match { box-shadow: 0 0 0 2px #ffcf4a, 0 6px 22px rgba(255, 207, 74, .3); }
    .board.nofx .row { animation: none; }

    /* Leader and ties */

    .row.gold { box-shadow: 0 0 0 2px rgba(255, 207, 74, .65), 0 6px 22px rgba(255, 207, 74, .28); }
    .row.gold .rank { color: #1b1830; background: linear-gradient(180deg, #ffe07a, #ffcf4a); }
    .rank .eq { align-self: flex-start; margin: 6px 2px 0 0; font-size: .5em; opacity: .85; }

    /* Small extras inside the name block */

    .name .country { flex: 0 1 auto; }

    .extras {
      display: flex;
      flex: none;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      padding-left: 8px;
    }

    .t12 {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px 7px;
      color: #1b1830;
      font: 900 .55em "Montserrat", sans-serif;
      background: #ffcf4a;
      border-radius: 999px;
    }

    .t12 small { font-size: .9em; }

    .move { font: 800 .5em "Montserrat", sans-serif; }
    .move.up { color: #14995f; }
    .move.down { color: #d6334f; }

    .jt {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: #6a66a0;
      font: 700 .44em/1 "Montserrat", sans-serif;
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 720px) { .jt { display: none; } }

    /* A flag with no image: coloured block with the country's letters */

    .flag-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #fff;
      font: 800 .62em "Montserrat", sans-serif;
      letter-spacing: .5px;
      background: hsl(var(--h, 250) 45% 32%);
    }

    /* Detail window extras */

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      color: #d9d2ff;
      font: 700 12px "Montserrat", sans-serif;
    }

    /* Message after copying a link */

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      z-index: 300;
      padding: 10px 18px;
      color: #1c1a55;
      font: 700 13px "Montserrat", sans-serif;
      pointer-events: none;
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
      opacity: 0;
      transform: translate(-50%, 20px);
      transition: opacity .25s ease, transform .25s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      .winner-strip { animation: none; }
      .toast { transition: none; }
    }


    /* Semifinals: who qualified for the Grand Final */

    .qpill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      font: 800 .5em "Montserrat", sans-serif;
      white-space: nowrap;
      border-radius: 999px;
    }

    .qpill.yes { color: #052a1a; background: #3be08a; }
    .qpill.no { color: #2a2750; background: #bdb9d6; }
    .detail-meta .qpill { font-size: 12px; }

    .row.qualified:not(.gold) .rank { color: #052a1a; background: linear-gradient(180deg, #5cf0a3, #1fb46c); }
    .row.eliminated { filter: saturate(.55) brightness(.92); }
    .row.eliminated .name { background: #e6e4f1; }
    .row.eliminated:hover { filter: brightness(1.05); }

    /* In a row the tick or cross is enough (the green rank block and the buttons above explain it) */
    .extras .qpill .qt { display: none; }
    .extras .qpill { padding: 3px 8px; }


    /* =========================================================
       KEEP IT CALM: details are optional, controls are quiet
    ========================================================= */

    .toolbar { flex-direction: column; gap: 8px; margin-bottom: 12px; }

    .toolbar-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 10px;
    }

    .toolbar-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; }

    .link {
      padding: 4px 2px;
      color: #b9b4d6;
      font: 700 12px "Montserrat", sans-serif;
      text-decoration: none;
      background: none;
      border: 0;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      transition: color .2s ease, border-color .2s ease;
    }

    .link:hover, .link[aria-pressed="true"] { color: #fff; border-bottom-color: rgba(255, 255, 255, .5); }
    .link:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 4px; }

    .search input { width: min(230px, 70vw); padding: 9px 15px; }
    .sort button { padding: 8px 14px; }

    /* The small extras only show when "Show details" is on */
    .board:not(.details) .extras { display: none; }

    /* No glowing rings: the colours do the talking */
    .row.gold, .row.match { box-shadow: 0 4px 14px rgba(6, 4, 36, .38); }
    .row.dim { opacity: .28; }

    .winner-strip {
      gap: 8px 14px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 14px;
      box-shadow: none;
    }

    .ws-label { color: #ffd86b; font-size: 11px; }
    .ws-tile { height: 38px; font-size: 17px; box-shadow: none; }
    .ws-flag { flex: none; width: 52px; overflow: hidden; background: var(--flag-bg); }
    .ws-name, .ws-pts { padding: 0 12px; }
    .ws-note { color: #cfc8ea; font-size: 12px; }

  </style>
</head>

<body>

  <!-- =========================
       NAVIGATION
  ========================= -->
  <a class="skip" href="#board">Skip to the results</a>

  <header class="header-wrapper">

    <nav class="pill-header" aria-label="Main navigation">

      <a
        class="brand"
        href="index.html"
        aria-label="Home"
      >
        <img
          src="IMG_20261024_195602.png"
          alt="Eurovision Rewind logo"
        >
      </a>

      <div class="nav-icons">

        <!-- HOME -->
        <a
          class="nav-icon"
          href="index.html"
          aria-label="Home"
          title="Home"
        >
          <i data-lucide="house"></i>
        </a>

        <!-- ABOUT -->
        <a
          class="nav-icon"
          href="about.html"
          aria-label="About"
          title="About"
        >
          <i data-lucide="circle-user-round"></i>
        </a>

        <!-- EDITION ARCHIVE -->
        <a
          class="nav-icon"
          href="index.html"
          aria-label="Edition archive"
          title="Edition archive"
        >
          <i data-lucide="layout-grid"></i>
        </a>

        <!-- RESULTS (this page) -->
        <a
          class="nav-icon active"
          href="results.html"
          aria-label="Results"
          title="Results"
          aria-current="page"
        >
          <i data-lucide="trophy"></i>
        </a>

        <!-- VOTING MATRIX -->
        <a
          class="nav-icon"
          href="matrix.html"
          aria-label="Voting matrix"
          title="Voting matrix"
        >
          <i data-lucide="grid-3x3"></i>
        </a>

        <!-- SCOREBOARD -->
        <a
          class="nav-icon"
          href="scoreboard.html"
          aria-label="Live scoreboard"
          title="Live scoreboard"
        >
          <i data-lucide="medal"></i>
        </a>

        <!-- SETTINGS -->
        <a
          class="nav-icon"
          href="settings.html"
          aria-label="Settings"
          title="Settings"
        >
          <i data-lucide="settings"></i>
        </a>

      </div>
    </nav>
  </header>

  <main>
    <nav class="edition-tabs" id="tabs" aria-label="Choose an edition"></nav>

    <section class="results-head">
      <h1 class="year" id="year"></h1>
      <p class="sub" id="sub"></p>
      <nav class="round-picker" id="roundPicker" aria-label="Choose a voting round"></nav>
      <p class="hint" id="hint" hidden></p>
      <span class="badge" id="badge" hidden>Sample data - replace it in the EDITIONS list</span>
    </section>

    <section class="winner-strip" id="winnerStrip" hidden></section>

    <div class="toolbar" id="toolbar" hidden>
      <div class="toolbar-main">
        <label class="search">
          <span class="sr-only">Search a country</span>
          <input type="search" id="search" placeholder="Search a country…  ( / )" autocomplete="off" spellcheck="false">
        </label>
        <div class="sort" id="sort" role="group" aria-label="Sort the scoreboard"></div>
        <div class="sort" id="qualFilter" role="group" aria-label="Show qualifiers" hidden></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="status-config.js"></script>
  <script>
    /* =========================================================
       EDITIONS AND RESULTS  (edit this part)
       - One entry per edition. Rows are listed from 1st place down.
       - Each row is { country, points }. Optional: rank, heart, votes.
       - votes = the points THIS country gave. Order: 12, 10, 8, 7, 6, 5, 4, 3, 2, 1
           votes: { jury: ["Ukraine", "Georgia", ...], tele: ["Spain", ...] }
         "Points received" is worked out automatically from everyone's votes.
         Edit votes in the browser with results.html?data instead of typing them.
       - You can also edit points in the browser: open results.html?data
       - An edition with an empty results list shows a "coming soon" message.

       FLAG IMAGES
       Every row shows the full rectangular flag of the country.
       Flags are picked up automatically from the folder set in FLAG_FOLDER.
       The file name is the country name in lowercase with dashes:
         "France"          -> images/flags/france.png
         "North Macedonia" -> images/flags/north-macedonia.png
       As soon as a country name is typed (or added to a list), its flag appears.
       If there is no file for a country, flagcdn.com is used as a backup (needs internet).
       For one special row, add  heart: "images/flags/other-file.png"  (image override).
       Countries missing from FLAG_CODES below need a file or an override.
    ========================================================= */

    const FLAG_FOLDER = "images/flags/";    // the folder that holds your flag files ("" = only use flagcdn.com)
    const FLAG_EXTS = [".png", ".svg", ".webp", ".jpg"];   // file types to look for, in this order (remove the ones you don't use)

    const FLAG_CODES = {
      "albania":"al","andorra":"ad","armenia":"am","australia":"au","austria":"at","azerbaijan":"az",
      "belarus":"by","belgium":"be","bosnia-and-herzegovina":"ba","bulgaria":"bg","croatia":"hr",
      "cyprus":"cy","czechia":"cz","czech-republic":"cz","denmark":"dk","estonia":"ee","finland":"fi",
      "france":"fr","georgia":"ge","germany":"de","greece":"gr","hungary":"hu","iceland":"is",
      "ireland":"ie","israel":"il","italy":"it","latvia":"lv","lithuania":"lt","luxembourg":"lu",
      "malta":"mt","moldova":"md","monaco":"mc","montenegro":"me","morocco":"ma","netherlands":"nl",
      "north-macedonia":"mk","norway":"no","poland":"pl","portugal":"pt","romania":"ro","russia":"ru",
      "san-marino":"sm","serbia":"rs","slovakia":"sk","slovenia":"si","spain":"es","sweden":"se",
      "switzerland":"ch","turkey":"tr","turkiye":"tr","ukraine":"ua","united-kingdom":"gb","uk":"gb",
      "england":"gb-eng","scotland":"gb-sct","wales":"gb-wls","kosovo":"xk","liechtenstein":"li",
      "kazakhstan":"kz","kyrgyzstan":"kg","uzbekistan":"uz","tajikistan":"tj","turkmenistan":"tm",
      "vietnam":"vn","cambodia":"kh","laos":"la","mongolia":"mn","bhutan":"bt","philippines":"ph",
      "bangladesh":"bd","thailand":"th","rep-of-korea":"kr","republic-of-korea":"kr","south-korea":"kr",
      "north-korea":"kp","nepal":"np","malaysia":"my","japan":"jp","china":"cn","india":"in",
      "indonesia":"id","singapore":"sg","myanmar":"mm","sri-lanka":"lk","pakistan":"pk","brunei":"bn",
      "timor-leste":"tl","taiwan":"tw","hong-kong":"hk","maldives":"mv","afghanistan":"af",
      "usa":"us","united-states":"us","canada":"ca","brazil":"br","mexico":"mx","argentina":"ar",
      "new-zealand":"nz","south-africa":"za","egypt":"eg","lebanon":"lb","tunisia":"tn","algeria":"dz",
      "jordan":"jo","saudi-arabia":"sa","united-arab-emirates":"ae","qatar":"qa","iran":"ir"
    };

    const SAMPLE_BASE = [
      { country: "France",          points: 248 },
      { country: "Ukraine",         points: 177 },
      { country: "Georgia",         points: 176 },
      { country: "Armenia",         points: 175 },
      { country: "Spain",           points: 152 },
      { country: "Albania",         points: 145 },
      { country: "North Macedonia", points: 141 },
      { country: "Poland",          points: 139 },
      { country: "Netherlands",     points: 93 },
      { country: "Malta",           points: 92 },
      { country: "Italy",           points: 73 },
      { country: "Portugal",        points: 73 },
      { country: "Croatia",         points: 70 },
      { country: "Azerbaijan",      points: 66 },
      { country: "Cyprus",          points: 50 },
      { country: "Montenegro",      points: 49 }
    ];

    // Vote groups and the order of the points a country can give.
    const VOTE_GROUPS = [
      { key: "jury", label: "Jury" },
      { key: "tele", label: "Televote" }
    ];
    const VOTE_POINTS = [12, 10, 8, 7, 6, 5, 4, 3, 2, 1];

    // DEMO VOTES so you can try the detail window. Delete this and the
    // ".map(...)" below when you have real votes.
    const SAMPLE_ROWS = SAMPLE_BASE.map((row, index) => {
      const hash = (text) => [...text].reduce((sum, char) => sum + char.charCodeAt(0), 0);
      const others = SAMPLE_BASE.map((item) => item.country).filter((name) => name !== row.country);
      const pick = (seed) => others
        .map((name) => [name, (hash(name) * (index + 3) + seed * 7) % 97])
        .sort((a, b) => a[1] - b[1])
        .slice(0, 10)
        .map(([name]) => name);

      return { ...row, votes: { jury: pick(1), tele: pick(5) } };
    });

    const EDITIONS = [
      { year: 2026, city: "Vienna, Austria",     sample: true, results: SAMPLE_ROWS },
      { year: 2027, city: "Zagreb, Croatia",     sample: true, results: SAMPLE_ROWS },
      { year: 2028, city: "Yerevan, Armenia",    sample: true, results: SAMPLE_ROWS },
      { year: 2029, city: "Zürich, Switzerland", results: [],
        emptyText: "Results will appear here after the Grand Final in Zürich." }
    ];

    /* =========================================================
       PAGE CODE (no need to edit below)
    ========================================================= */

    const $ = (id) => document.getElementById(id);
    const board = $("board");
    const columnQuery = window.matchMedia("(max-width: 720px)");

    // Published results (from the database) and unpublished edits (?data only)
    let savedData = {};
    let drafts = {};
    let afterRoundChange = () => {};

    // Subsets (Semifinal 1, ...) are shared through the database like the Grand Final:
    //   savedRounds[year] = published subsets  [{ name, rows }]
    //   draftRounds[year] = the subset list being edited with ?data (names, in order)
    let savedRounds = {};
    let draftRounds = {};

    // Editions added with ?data (year -> host city). A city can also replace the one in the file.
    // In draftCities, null means "delete this added edition".
    let savedCities = {};
    let draftCities = {};

    // Editions written in the file, plus the ones added with ?data, in year order.
    function allEditions() {
      const list = EDITIONS.map((edition) => ({ ...edition }));
      const cities = { ...savedCities, ...draftCities };

      Object.keys(cities).forEach((key) => {
        const year = Number(key);
        const city = cities[key];
        const found = list.find((edition) => edition.year === year);

        if (city === null) {
          if (found && !EDITIONS.some((edition) => edition.year === year)) list.splice(list.indexOf(found), 1);
          return;
        }

        if (found) found.city = city;
        else list.push({ year, city, results: [] });
      });

      return list.sort((a, b) => a.year - b.year);
    }

    const rowsFor = (edition) =>
      drafts[edition.year] || savedData[edition.year] || edition.results;
    let activeRound = "Grand Final";

    const roundDataKey = (year, round) => "resultsRoundData:" + year + ":" + encodeURIComponent(round);

    function savedRoundRows(year, name) {
      const found = (savedRounds[year] || []).find((round) => round.name.toLowerCase() === String(name).toLowerCase());
      return found ? found.rows : [];
    }

    function roundNames(year) {
      return draftRounds[year] ? draftRounds[year].slice() : (savedRounds[year] || []).map((round) => round.name);
    }

    function roundRows(edition, round = activeRound) {
      if (round === "Grand Final") return rowsFor(edition);
      return drafts[roundDataKey(edition.year, round)] || savedRoundRows(edition.year, round);
    }

    // Links like results.html#2028/semifinal-1 open a subset directly.
    const roundKey = (name) => slug(name) || name;

    function hashRoundSlug() {
      try { return decodeURIComponent(location.hash.replace("#", "").split("/")[1] || ""); }
      catch (error) { return ""; }
    }

    function goToYear(year) {
      activeRound = "Grand Final";
      history.replaceState(
        null,
        "",
        location.pathname + location.search.replace(/([?&]edition=)\d+/, "$1" + year) + "#" + year
      );
    }

    function selectRound(name) {
      activeRound = name;
      const hash = "#" + currentYear() + (name === "Grand Final" ? "" : "/" + roundKey(name));
      history.replaceState(null, "", location.pathname + location.search + hash);
    }

    function currentYear() {
      const wanted =
        new URLSearchParams(location.search).get("edition") ||
        location.hash.replace("#", "").split("/")[0];

      if (allEditions().some((edition) => String(edition.year) === wanted)) {
        return Number(wanted);
      }

      // Default: the latest edition that has results.
      const withResults = allEditions().filter((edition) => rowsFor(edition).length);
      return (withResults[withResults.length - 1] || allEditions()[0]).year;
    }

    function slug(name) {
      return String(name)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    // Every place a flag could come from, best first.
    function flagUrls(item) {
      const key = slug(item.country);
      const urls = [];

      if (item.heart) urls.push(item.heart);
      if (FLAG_FOLDER && key) FLAG_EXTS.forEach((ext) => urls.push(FLAG_FOLDER + key + ext));
      if (FLAG_CODES[key]) urls.push("https://flagcdn.com/w160/" + FLAG_CODES[key] + ".png");

      return urls;
    }

    const flagSrc = (item) => flagUrls(item)[0] || "";

    const same = (a, b) =>
      String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();

    // Keep votes tidy: { jury: [10 names], tele: [10 names] } (blank = no vote)
    function cleanVotes(votes) {
      if (!votes) return undefined;
      const out = {};

      VOTE_GROUPS.forEach(({ key }) => {
        const raw = votes[key];
        if (!raw) return;
        const list = Array.isArray(raw) ? raw : Object.values(raw);
        const names = VOTE_POINTS.map((_, i) => String(list[i] || "").trim());
        if (names.some(Boolean)) out[key] = names;
      });

      return Object.keys(out).length ? out : undefined;
    }

    const groupsWithVotes = (rows) =>
      VOTE_GROUPS.filter(({ key }) => rows.some((row) => row.votes && row.votes[key]));

    // Remember which file worked (and which countries have none) so each flag is only searched for once.
    const flagFound = new Map();
    const flagMissing = new Set();

    function initials(name) {
      const words = String(name).replace(/[^\p{L}\p{N} ]/gu, " ").split(/\s+/).filter(Boolean);
      const letters = words.length > 1 ? words.map((word) => word[0]).join("") : (words[0] || "?");
      return letters.slice(0, 3).toUpperCase();
    }

    // Shown when no flag file exists for a country: its letters on a coloured block.
    function flagFallback(name) {
      const block = document.createElement("div");
      const hue = [...String(name)].reduce((sum, char) => (sum * 31 + char.charCodeAt(0)) % 360, 17);
      block.className = "flag-img flag-fallback";
      block.style.setProperty("--h", hue);
      block.textContent = initials(name);
      block.setAttribute("aria-hidden", "true");
      return block;
    }

    function flagImage(name, rows) {
      const key = slug(name);
      if (flagMissing.has(key)) return flagFallback(name);

      const row = rows.find((item) => same(item.country, name));
      let urls = flagUrls(row || { country: name });
      if (flagFound.has(key)) urls = [flagFound.get(key), ...urls.filter((url) => url !== flagFound.get(key))];

      const image = document.createElement("img");
      let tried = 0;

      image.className = "flag-img";
      image.alt = "";
      image.decoding = "async";
      image.loading = "eager";

      image.addEventListener("load", () => flagFound.set(key, urls[tried]));

      // If a file is missing, try the next source; if all fail, show the letters instead.
      image.addEventListener("error", () => {
        tried += 1;
        if (tried < urls.length) {
          image.src = encodeURI(urls[tried]);
        } else {
          flagMissing.add(key);
          if (image.parentNode) image.replaceWith(flagFallback(name));
          else image.style.visibility = "hidden";
        }
      });

      if (urls.length) image.src = encodeURI(urls[0]);
      else return flagFallback(name);

      return image;
    }

    /* ---------- Ranks (ties share a place), stats and the extras on each row ---------- */

    const view = { key: "", year: 0, edition: null, rows: [], finalists: [], groups: [], hasVotes: false,
                   stats: new Map(), official: new Map(), moves: new Map(), qualified: null };
    let sortMode = "final";   // final | jury | tele | az
    let qualFilter = "all";   // all | yes | no  (semifinals only)
    let detailsOn = false;    // small extras on each row (12s, jury / televote, moves)
    try { detailsOn = localStorage.getItem("resultsDetails") === "1"; } catch (error) { detailsOn = false; }
    let query = "";

    // Places where equal values share the same rank (two countries on 120 are both 5th).
    function rankLabels(list, valueOf) {
      return list.map((item) => {
        const value = valueOf(item);
        if (value === null || value === undefined || Number.isNaN(value)) return { rank: null, tie: false };
        const higher = list.filter((other) => valueOf(other) > value).length;
        const tie = list.some((other) => other !== item && valueOf(other) === value);
        return { rank: higher + 1, tie };
      });
    }

    const pointsOf = (item) =>
      item.points === undefined || item.points === null || item.points === "" ? null : Number(item.points);

    // Jury points, televote points and number of 12s each country received.
    function statsFor(rows) {
      const stats = new Map();
      rows.filter((row) => !row.voterOnly).forEach((row) => {
        const entry = { twelves: 0 };
        VOTE_GROUPS.forEach(({ key }) => { entry[key] = 0; });
        stats.set(row.country.toLowerCase(), entry);
      });

      rows.forEach((giver) => {
        VOTE_GROUPS.forEach(({ key }) => {
          ((giver.votes && giver.votes[key]) || []).forEach((name, position) => {
            const entry = stats.get(String(name || "").trim().toLowerCase());
            if (!entry || same(name, giver.country)) return;
            entry[key] += VOTE_POINTS[position];
            if (position === 0) entry.twelves += 1;
          });
        });
      });

      return stats;
    }

    // How far each country moved compared with the edition before (Grand Final only).
    function movesFor(year, finalists) {
      const moves = new Map();
      const earlier = allEditions().filter((item) => item.year < year && rowsFor(item).length);
      const previous = earlier[earlier.length - 1];
      if (!previous) return moves;

      const before = rowsFor(previous).filter((item) => !item.voterOnly);
      const beforeLabels = rankLabels(before, pointsOf);
      const wasRank = new Map(before.map((item, i) => [slug(item.country), item.rank || beforeLabels[i].rank || i + 1]));
      const nowLabels = rankLabels(finalists, pointsOf);

      finalists.forEach((item, i) => {
        const was = wasRank.get(slug(item.country));
        const rank = item.rank || nowLabels[i].rank || i + 1;
        if (was && was !== rank) moves.set(item.country.toLowerCase(), { delta: was - rank, year: previous.year });
      });

      return moves;
    }

    // Semifinals: a country qualified when it is a finalist in the Grand Final of the same year.
    const isQualified = (item) => (view.qualified ? view.qualified.has(slug(item.country)) : null);

    function qualPill(qualified) {
      const pill = document.createElement("span");
      pill.className = "qpill " + (qualified ? "yes" : "no");
      pill.title = qualified ? "Qualified for the Grand Final" : "Did not qualify for the Grand Final";
      pill.append(qualified ? "✓" : "✕");
      const text = document.createElement("span");
      text.className = "qt";
      text.textContent = qualified ? "Qualified" : "Out";
      pill.append(text);
      return pill;
    }

    function buildRow(item, index, rows, clickable, meta) {
      meta = meta || {};
      const row = document.createElement("div");
      row.className = "row" + (item.voterOnly ? " voter-only" : "") + (meta.gold ? " gold" : "") +
        (meta.qual === true ? " qualified" : meta.qual === false ? " eliminated" : "");
      row.dataset.country = item.country;

      const rank = document.createElement("div");
      rank.className = "cell rank";
      rank.textContent = String(meta.rank || item.rank || index + 1).padStart(2, "0");

      if (meta.tie) {
        const eq = document.createElement("sup");
        eq.className = "eq";
        eq.title = "Tied on points";
        eq.textContent = "=";
        rank.prepend(eq);
      }

      const flag = document.createElement("div");
      flag.className = "cell flag";
      flag.append(flagImage(item.country, rows));

      const name = document.createElement("div");
      name.className = "cell name";

      const country = document.createElement("span");
      country.className = "country";
      country.textContent = item.country;
      country.title = item.country;
      name.append(country);

      // Small extras: 12-point badge, move since last edition, jury / televote split
      const extras = document.createElement("span");
      extras.className = "extras";

      if (meta.qual !== null && meta.qual !== undefined) extras.append(qualPill(meta.qual));

      if (meta.twelves) {
        const badge = document.createElement("span");
        badge.className = "t12";
        badge.title = meta.twelves + (meta.twelves === 1 ? " time" : " times") + " 12 points received";
        badge.textContent = "12";
        if (meta.twelves > 1) {
          const times = document.createElement("small");
          times.textContent = "×" + meta.twelves;
          badge.append(times);
        }
        extras.append(badge);
      }

      if (meta.move) {
        const move = document.createElement("span");
        const places = Math.abs(meta.move.delta);
        move.className = "move " + (meta.move.delta > 0 ? "up" : "down");
        move.textContent = (meta.move.delta > 0 ? "▲" : "▼") + places;
        move.title = (meta.move.delta > 0 ? "Up " : "Down ") + places + (places === 1 ? " place" : " places") + " compared with " + meta.move.year;
        extras.append(move);
      }

      if (meta.breakdown && meta.breakdown.length) {
        const split = document.createElement("span");
        split.className = "jt";
        meta.breakdown.forEach(([label, value]) => {
          const line = document.createElement("span");
          line.textContent = label + " " + value;
          split.append(line);
        });
        extras.append(split);
      }

      if (extras.children.length) name.append(extras);

      const points = document.createElement("div");
      points.className = "cell points";
      const shown = meta.value !== undefined ? meta.value : item.points;
      points.textContent = shown === undefined || shown === null ? "" : shown;

      row.append(rank, flag, name, points);

      if (clickable) {
        row.classList.add("clickable");
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        row.setAttribute("aria-label", item.country + (meta.rank ? ", place " + meta.rank : "") + (shown !== undefined && shown !== null ? ", " + shown + " points" : "") +
          (meta.qual === true ? ", qualified for the Grand Final" : meta.qual === false ? ", did not qualify" : "") + ": show detailed points");
        row.addEventListener("click", () => openDetail(item.country));
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openDetail(item.country);
          }
        });
      }

      return row;
    }

    // Draws the rows in the chosen order (Final / Jury / Televote / A-Z).
    function renderBoard() {
      const { finalists, rows, stats, hasVotes, official, moves } = view;
      board.classList.toggle("details", detailsOn);

      const entries = finalists.map((item, i) => ({ item, i }))
        .filter(({ item }) => qualFilter === "all" || !view.qualified || (qualFilter === "yes") === isQualified(item));
      const stat = (entry) => stats.get(entry.item.country.toLowerCase()) || {};
      const byGroup = sortMode === "jury" || sortMode === "tele";

      if (sortMode === "az") entries.sort((a, b) => a.item.country.localeCompare(b.item.country));
      else if (byGroup) entries.sort((a, b) => (stat(b)[sortMode] || 0) - (stat(a)[sortMode] || 0) || a.i - b.i);

      const groupLabels = byGroup ? rankLabels(entries, (entry) => stat(entry)[sortMode] || 0) : null;
      const showMoves = activeRound === "Grand Final" && !byGroup;

      board.innerHTML = "";

      entries.forEach((entry, position) => {
        const key = entry.item.country.toLowerCase();
        const place = byGroup ? groupLabels[position] : (official.get(key) || {});
        const value = byGroup ? (stat(entry)[sortMode] || 0) : entry.item.points;
        const s = stat(entry);

        const meta = {
          rank: place.rank,
          tie: place.tie,
          value,
          gold: place.rank === 1 && Number(value) > 0,
          qual: isQualified(entry.item),
          twelves: hasVotes ? s.twelves : 0,
          move: showMoves ? moves.get(key) : null,
          breakdown: hasVotes ? view.groups.map(({ key: groupKey, label }) => [
            groupKey === "jury" ? "J" : groupKey === "tele" ? "T" : label.charAt(0), s[groupKey] || 0]) : null
        };

        board.append(buildRow(entry.item, position, rows, hasVotes, meta));
      });

      layoutColumns();
      applySearch();
    }

    // Slides the rows from their old place to the new one.
    function withFlip(update) {
      const first = new Map();
      board.querySelectorAll(".row").forEach((row) => first.set(row.dataset.country, row.getBoundingClientRect()));
      board.classList.add("nofx");
      update();
      setTimeout(() => board.classList.remove("nofx"), 800);

      if (reduceMotion.matches) return;

      board.querySelectorAll(".row").forEach((row) => {
        const before = first.get(row.dataset.country);
        if (!before) return;
        const after = row.getBoundingClientRect();
        const dx = before.left - after.left;
        const dy = before.top - after.top;
        if (!dx && !dy) return;

        row.animate(
          [{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }],
          { duration: 650, easing: "cubic-bezier(.3,.8,.25,1)" }
        );
      });
    }

    const live = (text) => {
      $("live").textContent = "";
      setTimeout(() => { $("live").textContent = text; }, 40);
    };

    function applySearch() {
      const wanted = slug(query);
      let hits = 0;

      board.querySelectorAll(".row").forEach((row) => {
        const hit = !wanted || slug(row.dataset.country).includes(wanted);
        row.classList.toggle("dim", !hit);
        row.classList.toggle("match", Boolean(wanted) && hit);
        if (hit) hits += 1;
      });

      applySearch.hits = hits;
      return hits;
    }

    function sortOptions() {
      return [
        { key: "final", label: "Final" },
        ...view.groups.map(({ key, label }) => ({ key, label })),
        { key: "az", label: "A–Z" }
      ];
    }

    function renderSortButtons() {
      const options = sortOptions();
      if (!options.some((option) => option.key === sortMode)) sortMode = "final";

      $("sort").innerHTML = "";
      options.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = option.label;
        button.classList.toggle("active", option.key === sortMode);
        button.setAttribute("aria-pressed", String(option.key === sortMode));
        button.addEventListener("click", () => {
          if (sortMode === option.key) return;
          sortMode = option.key;
          renderSortButtons();
          withFlip(renderBoard);
          live("Sorted by " + option.label);
        });
        $("sort").append(button);
      });
    }

    function renderQualButtons() {
      const box = $("qualFilter");
      box.hidden = !view.qualified;
      box.innerHTML = "";
      if (!view.qualified) { qualFilter = "all"; return; }

      const yes = view.finalists.filter((item) => isQualified(item)).length;
      const options = [
        ["all", "All " + view.finalists.length],
        ["yes", "✓ Qualified " + yes],
        ["no", "✕ Out " + (view.finalists.length - yes)]
      ];

      options.forEach(([key, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.classList.toggle("active", key === qualFilter);
        button.setAttribute("aria-pressed", String(key === qualFilter));
        button.addEventListener("click", () => {
          if (qualFilter === key) return;
          qualFilter = key;
          renderQualButtons();
          withFlip(renderBoard);
          live(label);
        });
        box.append(button);
      });
    }

    function renderWinner() {
      const strip = $("winnerStrip");
      const list = view.finalists.filter((item) => pointsOf(item) !== null);

      strip.hidden = list.length === 0;
      strip.classList.remove("clickable");
      strip.removeAttribute("role");
      strip.removeAttribute("tabindex");
      strip.onclick = strip.onkeydown = null;
      if (!list.length) return null;

      const top = list.find((item) => (view.official.get(item.country.toLowerCase()) || {}).rank === 1) || list[0];
      const others = list.filter((item) => item !== top).sort((a, b) => pointsOf(b) - pointsOf(a));
      const next = others[0];
      const gap = next ? pointsOf(top) - pointsOf(next) : 0;
      const grand = activeRound === "Grand Final";

      strip.innerHTML = "";

      const label = document.createElement("span");
      label.className = "ws-label";
      label.textContent = grand ? "🏆 Winner" : "🥇 First in " + activeRound;

      const tile = document.createElement("div");
      tile.className = "ws-tile";
      const flagBox = document.createElement("div");
      flagBox.className = "ws-flag";
      flagBox.append(flagImage(top.country, view.rows));
      const nameBox = document.createElement("div");
      nameBox.className = "ws-name";
      nameBox.textContent = top.country;
      const pointsBox = document.createElement("div");
      pointsBox.className = "ws-pts";
      pointsBox.textContent = pointsOf(top);
      tile.append(flagBox, nameBox, pointsBox);

      const note = document.createElement("span");
      note.className = "ws-note";
      if (next) note.textContent = gap > 0 ? "+" + gap + " ahead of " + next.country : "Level on points with " + next.country;

      strip.append(label, tile, note);

      if (view.hasVotes) {
        strip.classList.add("clickable");
        strip.setAttribute("role", "button");
        strip.tabIndex = 0;
        strip.setAttribute("aria-label", top.country + ": show detailed points");
        strip.onclick = () => openDetail(top.country);
        strip.onkeydown = (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openDetail(top.country); }
        };
      }

      return top;
    }

    // Page title and the text shown when the link is shared.
    function updateMeta(edition, top) {
      const grand = activeRound === "Grand Final";
      const verb = grand ? " won" : " finished first";
      const title = edition.year + " " + (grand ? "Results" : activeRound + " Results") +
        (top ? " – " + top.country + verb : "") + " | Eurovision Rewind";
      const text = top
        ? "Eurovision Rewind " + edition.year + (edition.city ? " in " + edition.city : "") + ": " + top.country + verb +
          " with " + pointsOf(top) + " points. See the full scoreboard and who voted for whom."
        : "Eurovision Rewind scoreboards for every edition.";

      document.title = title;
      $("metaDesc").setAttribute("content", text);
      $("ogTitle").setAttribute("content", title);
      $("ogDesc").setAttribute("content", text);
    }

    /* ---------- Share links ---------- */

    // #2028 (Grand Final), #2028/semifinal-1, and with a country: #2028/grand-final/france
    function hashFor(country) {
      const round = activeRound !== "Grand Final" ? "/" + roundKey(activeRound) : (country ? "/grand-final" : "");
      return "#" + currentYear() + round + (country ? "/" + slug(country) : "");
    }

    function shareUrl(country) {
      const url = new URL(location.href);
      url.searchParams.delete("data");
      url.searchParams.delete("tune");
      if (url.searchParams.has("edition")) url.searchParams.set("edition", currentYear());
      url.hash = hashFor(country);
      return url.toString();
    }

    function toast(text) {
      const box = $("toast");
      // A modal window hides everything behind it, so show the message inside it.
      (detail.open ? detail : document.body).append(box);
      box.textContent = text;
      box.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => box.classList.remove("show"), 2200);
    }

    async function copyLink(url) {
      try {
        await navigator.clipboard.writeText(url);
      } catch (error) {
        const field = document.createElement("textarea");
        field.value = url;
        field.style.cssText = "position:fixed;opacity:0";
        document.body.append(field);
        field.select();
        try { document.execCommand("copy"); } catch (inner) { /* the link is in the address bar anyway */ }
        field.remove();
      }
      toast("Link copied");
    }

    // A link like #2028/grand-final/france opens that country's window.
    function openFromHash() {
      let wanted = "";
      try { wanted = decodeURIComponent(location.hash.replace("#", "").split("/")[2] || ""); } catch (error) { wanted = ""; }
      if (!wanted || detail.open || !view.hasVotes) return;

      const found = view.finalists.find((item) => slug(item.country) === wanted);
      if (found) openDetail(found.country);
    }

    function layoutColumns() {
      const count = board.children.length;
      const columns = columnQuery.matches ? 1 : 2;
      board.style.setProperty("--per-col", Math.max(1, Math.ceil(count / columns)));
    }

    function render() {
      const year = currentYear();
      const edition = allEditions().find((item) => item.year === year);

      // Work out which subset is open before reading any rows.
      const rounds = ["Grand Final", ...roundNames(year)];
      const wanted = hashRoundSlug();
      if (wanted) {
        activeRound = rounds.find((round) => roundKey(round) === wanted || round === wanted) || "Grand Final";
      } else if (!rounds.includes(activeRound)) {
        activeRound = "Grand Final";
      }

      const rows = roundRows(edition, activeRound);
      const finalists = rows.filter((item) => !item.voterOnly);
      const customised = activeRound !== "Grand Final" || Boolean(savedData[year] || drafts[year]);
      const hasVotes = groupsWithVotes(rows).length > 0;

      $("tabs").innerHTML = "";
      allEditions().forEach((item) => {
        const link = document.createElement("a");
        link.href = "#" + item.year;
        link.textContent = item.year;
        if (item.year === year) {
          link.classList.add("active");
          link.setAttribute("aria-current", "true");
        }
        $("tabs").append(link);
      });

      $("year").textContent = edition.year;
      $("sub").textContent = activeRound + " · " + edition.city;

      const roundPicker = $("roundPicker");
      roundPicker.innerHTML = "";
      roundPicker.hidden = rounds.length < 2;
      rounds.forEach((round) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = round;
        button.classList.toggle("active", round === activeRound);
        button.setAttribute("aria-pressed", String(round === activeRound));
        button.addEventListener("click", () => { selectRound(round); render(); afterRoundChange(); });
        roundPicker.append(button);
      });

      $("badge").hidden = !edition.sample || customised || (savedRounds[year] || []).length > 0;
      $("hint").hidden = !hasVotes;
      $("hint").textContent = "Tap a country to see who gave and received its points.";

      board.innerHTML = "";
      const hasResults = finalists.length > 0;
      board.hidden = !hasResults;
      $("empty").hidden = hasResults;
      $("empty").textContent = activeRound === "Grand Final"
        ? (edition.emptyText || "Results for this edition are coming soon.")
        : "Results for " + activeRound + " are coming soon." +
          (new URLSearchParams(location.search).has("data") ? " Add its countries with the editor below." : "");

      // Everything the board, winner strip and toolbar need
      const groups = groupsWithVotes(rows);
      const labels = rankLabels(finalists, pointsOf);

      if (view.key !== year + "|" + activeRound) { sortMode = "final"; qualFilter = "all"; view.key = year + "|" + activeRound; }

      view.year = year;
      view.edition = edition;
      view.rows = rows;
      view.finalists = finalists;
      view.groups = groups;
      view.hasVotes = hasVotes;
      view.stats = statsFor(rows);
      view.official = new Map(finalists.map((item, i) => [item.country.toLowerCase(),
        { rank: item.rank || labels[i].rank, tie: item.rank ? false : labels[i].tie }]));
      view.moves = activeRound === "Grand Final" ? movesFor(year, finalists) : new Map();

      // Semifinals: the Grand Final line-up of the same year tells who qualified.
      view.qualified = null;
      if (activeRound !== "Grand Final" && hasResults) {
        const lineup = new Set(rowsFor(edition).filter((item) => !item.voterOnly).map((item) => slug(item.country)));
        if (finalists.some((item) => lineup.has(slug(item.country)))) view.qualified = lineup;
      }

      $("toolbar").hidden = !hasResults;
      $("watchLink").hidden = !hasVotes;
      $("watchLink").href = "scoreboard.html#" + year + (activeRound !== "Grand Final" ? "/" + roundKey(activeRound) : "");
      renderSortButtons();
      renderQualButtons();
      syncDetailsButton();

      const top = hasResults ? renderWinner() : ($("winnerStrip").hidden = true, null);
      updateMeta(edition, top);

      renderBoard();
      openFromHash();
    }

    /* ---------- Detail window: who gave and received a country's points ---------- */

    const detail = $("detail");
    const detailState = { country: "", group: "" };

    function votesLine(points, names, rows) {
