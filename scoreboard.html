<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171329">

  <title>Scoreboard | Eurovision Rewind</title>
  <meta name="description" content="Watch the points come in, country by country, in every Eurovision Rewind edition.">
  <link rel="icon" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.460.0"></script>

  <style>
    :root {
      --white: #ffffff;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Montserrat", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at 10% 0%, rgba(112, 83, 213, .25), transparent 40%),
        radial-gradient(ellipse at 100% 35%, rgba(52, 166, 175, .13), transparent 38%),
        linear-gradient(145deg, #171329, #101522 65%, #171329);
      background-attachment: fixed;
    }

    @media (hover: none) {
      body { background-attachment: scroll; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* NAVIGATION */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 13px 5%;
      background: rgba(19, 17, 39, .72);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .nav-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.075);
      box-shadow: 0 8px 30px rgba(0,0,0,.16);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      color: #d0ccdf;
      font-size: 11px;
      font-weight: 600;
      transition: .25s ease;
    }

    .nav-link svg {
      width: 16px;
      height: 16px;
    }

    .nav-link:hover {
      color: white;
      background: rgba(255,255,255,.09);
    }

    .nav-link.active {
      color: white;
      background: linear-gradient(135deg, #806be8, #5545ae);
      box-shadow: 0 4px 18px rgba(103,81,210,.25);
    }

    .nav-home {
      width: 40px;
      padding: 0;
    }

    /* MAIN (empty - add your content here) */

    main {
      width: min(1180px, 94%);
      margin: 0 auto;
      padding: 30px 0 80px;
    }

    /* =========================
       CUSTOM FONT
       Put the font files in a "fonts" folder next to this page.
    ========================= */

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-MediumItalic.otf") format("opentype");
      font-weight: 500;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --artist-font: "ResultsFont", "Neulis", "Montserrat", sans-serif;
      --muted: rgba(255, 255, 255, 0.7);
      --line: rgba(255, 255, 255, 0.16);
      --rank-bg: #7b2c8a;
      --name-bg: #913e9f;
      --board-bg: #571f64;
    }

    [hidden] { display: none !important; }

    a:focus-visible,
    button:focus-visible,
    select:focus-visible {
      outline: 2px solid #c9bdff;
      outline-offset: 3px;
    }

    .page-head { margin-bottom: 22px; text-align: center; }

    .page-head h1 {
      color: #fff;
      font-family: var(--artist-font);
      font-size: clamp(36px, 7.5vw, 62px);
      font-weight: 500;
      letter-spacing: -1px;
      line-height: 1.05;
    }

    .page-head p {
      max-width: 580px;
      margin: 12px auto 0;
      color: var(--muted);
      font-family: var(--artist-font);
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 12px;
      color: #ffd28a;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 210, 138, 0.1);
      border: 1px solid rgba(255, 210, 138, 0.3);
      border-radius: 999px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .chips a,
    .chips button {
      min-width: 74px;
      padding: 9px 18px;
      color: #c2bfd6;
      font: 700 13px "Montserrat", sans-serif;
      letter-spacing: 0.6px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .chips a:hover,
    .chips button:hover { color: #fff; background: rgba(255, 255, 255, 0.13); }

    .chips .active {
      color: #fff;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    .empty {
      padding: 40px 18px;
      color: var(--muted);
      font-family: var(--artist-font);
      font-size: 17px;
      text-align: center;
    }

    .flag-img {
      display: block;
      flex: none;
      width: 34px;
      height: 24px;
      object-fit: cover;
      background: #2b2478;
    }

    select.pick {
      padding: 10px 14px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    select.pick option { color: #000; }

    /* =========================
       VOTING MATRIX
    ========================= */

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .seg { display: flex; gap: 6px; }

    .seg button {
      padding: 9px 16px;
      color: #c2bfd6;
      font: 700 12px "Montserrat", sans-serif;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
    }

    .seg button.active {
      color: #fff;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    /* MOBILE */

    @media (max-width: 560px) {
      .site-header {
        padding: 10px 12px;
      }

      .navbar {
        gap: 8px;
      }

      .brand-logo {
        width: 35px;
        height: 35px;
      }

      .nav-pill {
        gap: 2px;
        padding: 4px;
      }

      .nav-link {
        min-height: 35px;
        padding: 0 9px;
        font-size: 0;
      }

      .nav-home {
        width: 35px;
      }

      main {
        width: 92%;
        padding-top: 22px;
        padding-bottom: 60px;
      }
    }

    @media (max-width: 350px) {
      .brand-logo {
        width: 29px;
        height: 29px;
      }

      .nav-link {
        padding: 0 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *, *::before, *::after {
        transition: none !important;
      }
    }
    /* =========================================================
       SCOREBOARD THEME (same look as results.html)
    ========================================================= */

    :root {
      --rank-bg: #5a2aa3;
      --flag-bg: #2b2478;
      --name-bg: #ffffff;
      --board-bg: #1a1560;
      --name-text: #1c1a55;
      --row-radius: 12px;
    }

    @keyframes heading-arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes row-arrive {
      from { opacity: 0; transform: translateX(-14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes flag-pop {
      from { opacity: 0; transform: scale(1.35); }
      to { opacity: 1; transform: scale(1); }
    }

    .page-head { animation: heading-arrive 750ms 100ms cubic-bezier(.2,.75,.25,1) both; }

    .page-head h1 {
      font-size: clamp(34px, 7vw, 60px);
      font-weight: 700;
      letter-spacing: -0.5px;
      text-shadow:
        -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
        0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000;
    }

    .chips a, .chips button, .seg button {
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .chips a:hover, .chips button:hover, .seg button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }

    @media (prefers-reduced-motion: reduce) {
      .page-head, .matrix tbody tr, .vbar, .chosen .flag-img { animation: none !important; }
    }

    /* =========================================================
       LIVE SCOREBOARD
    ========================================================= */

    :root { --sb-row-h: 52px; --sb-gap: 6px; --sb-col-gap: 22px; }

    .panel {
      background:
        radial-gradient(ellipse at 0% 0%, rgba(120, 90, 255, .28), transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(60, 150, 255, .16), transparent 50%),
        linear-gradient(160deg, #241b7c, var(--board-bg) 62%, #150f4a);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(6, 4, 30, .5), inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    /* ----- Stage: who is voting and what they give ----- */

    .stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 22px;
      margin-bottom: 14px;
      padding: 18px 20px;
    }

    .stage-label {
      display: block;
      margin-bottom: 8px;
      color: #cfc8ff;
      font: 700 11px "Montserrat", sans-serif;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .stage-block { min-width: 0; }

    .tile {
      display: flex;
      align-items: stretch;
      min-height: 62px;
      overflow: hidden;
      color: var(--name-text);
      font-family: var(--artist-font);
      font-size: clamp(18px, 3.4vw, 28px);
      font-weight: 800;
      background: var(--name-bg);
      border-radius: var(--row-radius);
      box-shadow: 0 4px 14px rgba(6, 4, 36, .4);
    }

    .tile .flag-img { width: 88px; height: auto; align-self: stretch; }

    .tile .tile-name {
      display: flex;
      flex: 1;
      align-items: center;
      min-width: 0;
      padding: 0 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tile.idle { color: #8a86ad; font-weight: 700; }
    .tile.idle .tile-name { padding-left: 18px; }

    .tile .award-pts {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      color: #fff;
      font-size: clamp(26px, 4.6vw, 38px);
      font-weight: 900;
      background: linear-gradient(180deg, color-mix(in srgb, var(--rank-bg) 88%, #fff), var(--rank-bg));
    }

    .tile .award-pts.gold { color: #1b1830; background: linear-gradient(180deg, #ffe07a, #ffcf4a); }

    .tile.swap { animation: tile-in 520ms cubic-bezier(.2,.8,.25,1); }
    .tile.swap .flag-img { animation: flag-pop 600ms cubic-bezier(.2,.75,.25,1); }
    .tile.hit .award-pts { animation: pts-pop 600ms cubic-bezier(.2,1.4,.3,1); }

    @keyframes tile-in { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes pts-pop { 0% { transform: scale(.5); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      grid-column: 1 / -1;
      gap: 6px;
      min-height: 34px;
    }

    .award {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 12px 0 0;
      overflow: hidden;
      color: var(--name-text);
      font-size: 13px;
      font-weight: 800;
      background: #fff;
      border-radius: 9px;
      box-shadow: 0 2px 8px rgba(6, 4, 36, .35);
      animation: chip-in 420ms cubic-bezier(.2,.9,.3,1.2) backwards;
    }

    .award b {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      min-width: 30px;
      color: #fff;
      font-weight: 900;
      background: var(--rank-bg);
    }

    .award.gold b { color: #1b1830; background: #ffcf4a; }
    .award .flag-img { width: 28px; height: 20px; border-radius: 3px; }

    @keyframes chip-in { from { opacity: 0; transform: scale(.6) translateY(8px); } to { opacity: 1; transform: none; } }

    /* ----- Controls ----- */

    .transport {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tbtn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      color: #fff;
      font: 700 12px "Montserrat", sans-serif;
      background: rgba(255, 255, 255, .09);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .tbtn:hover:not(:disabled) { transform: translateY(-2px); background: rgba(255, 255, 255, .17); }
    .tbtn:disabled { opacity: .4; cursor: default; }
    .tbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .tbtn.main {
      padding: 12px 26px;
      font-size: 14px;
      background: linear-gradient(135deg, #7b4bd9, #5a2aa3);
      border-color: transparent;
      box-shadow: 0 8px 22px rgba(90, 42, 163, .5);
    }

    .tbtn.main.playing { animation: breathe 1.6s ease-in-out infinite; }
    @keyframes breathe { 50% { box-shadow: 0 8px 30px rgba(155, 108, 255, .85); } }

    .speed { display: inline-flex; gap: 4px; margin-left: 6px; }
    .speed button.active { color: #fff; background: var(--rank-bg); border-color: transparent; }

    .progress {
      width: min(560px, 90%);
      height: 6px;
      margin: 4px auto 6px;
      overflow: hidden;
      background: rgba(255, 255, 255, .12);
      border-radius: 999px;
    }

    .progress i {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #9b6cff, #ffcf4a);
      border-radius: inherit;
      transition: width 450ms ease;
    }

    .status-line { margin-bottom: 14px; color: #cfc8ff; font: 600 12px "Montserrat", sans-serif; text-align: center; }

    /* ----- Voting order strip ----- */

    .voters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      padding: 4px 2px 8px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .voters button {
      flex: none;
      padding: 0;
      overflow: hidden;
      background: none;
      border: 2px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      opacity: .45;
      transition: opacity .25s ease, transform .2s ease, border-color .25s ease;
    }

    .voters button .flag-img { width: 36px; height: 26px; }
    .voters button:hover { opacity: 1; transform: translateY(-2px); }
    .voters button.done { opacity: .9; }
    .voters button.current { opacity: 1; border-color: #ffcf4a; transform: translateY(-3px); box-shadow: 0 6px 14px rgba(255, 207, 74, .35); }

    /* ----- Follow panel ----- */

    .follow {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
      padding: 14px 16px;
      animation: tile-in 420ms cubic-bezier(.2,.8,.25,1);
    }

    .follow-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .follow-head .tile { flex: 1; min-width: 220px; min-height: 52px; font-size: 20px; }
    .follow-head .tile .flag-img { width: 70px; }
    .follow-head .tile .award-pts { font-size: 22px; min-width: 58px; }

    .follow button.x {
      padding: 8px 14px;
      color: #fff;
      font: 700 12px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, .3);
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }

    .follow-note { color: #cfc8ff; font-size: 13px; }

    /* ----- Board ----- */

    .board-wrap { padding: clamp(12px, 2.2vw, 26px); }

    .board { position: relative; width: 100%; }

    .sb-row {
      --r: 0; --c: 0;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      width: var(--sb-w, 100%);
      height: var(--sb-row-h);
      overflow: hidden;
      color: var(--text, #fff);
      font-family: var(--artist-font);
      font-size: clamp(14px, 2.2vw, 22px);
      border-radius: var(--row-radius);
      box-shadow: 0 4px 14px rgba(6, 4, 36, .38);
      cursor: pointer;
      transform: translate(
        calc(var(--c) * (100% + var(--sb-col-gap))),
        calc(var(--r) * (var(--sb-row-h) + var(--sb-gap)))
      );
      transition: transform 800ms cubic-bezier(.3,.8,.25,1), box-shadow 300ms ease;
    }

    .sb-row.entering {
      animation: sb-enter 600ms cubic-bezier(.2,.75,.25,1) backwards;
      animation-delay: calc(var(--i, 0) * 28ms);
    }

    @keyframes sb-enter { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: none; } }

    .sb-row:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .sb-row:hover { box-shadow: 0 6px 20px rgba(6, 4, 36, .55), 0 0 0 1px rgba(255, 255, 255, .4); }

    .sb-row .cell { display: flex; align-items: center; }

    .sb-row .rank {
      flex: none;
      justify-content: center;
      width: clamp(40px, 6vw, 62px);
      font-weight: 800;
      background: linear-gradient(180deg, color-mix(in srgb, var(--rank-bg) 88%, #fff), var(--rank-bg));
      transition: background .6s ease, color .6s ease;
    }

    .sb-row .flagbox { flex: none; width: clamp(46px, 7vw, 72px); background: var(--flag-bg); overflow: hidden; }
    .sb-row .flag-img { width: 100%; height: 100%; }

    .sb-row .name {
      flex: 1;
      min-width: 0;
      padding: 0 14px;
      color: var(--name-text);
      font-weight: 800;
      background: #fff;
    }

    .sb-row .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .sb-row .points {
      position: relative;
      flex: none;
      justify-content: center;
      width: clamp(56px, 9vw, 88px);
      margin-left: 3px;
      color: var(--name-text);
      font-weight: 900;
      background: #fff;
      transition: background .4s ease, color .4s ease;
    }

    .sb-row.gain { z-index: 3; animation: row-gain 1100ms ease; }
    .sb-row.gain .points { color: #fff; background: #7b4bd9; }
    .sb-row.gain.gold .points { color: #1b1830; background: #ffcf4a; }

    @keyframes row-gain {
      0% { box-shadow: 0 4px 14px rgba(6, 4, 36, .38); }
      25% { box-shadow: 0 0 0 3px #fff, 0 0 30px rgba(155, 108, 255, .9); }
      100% { box-shadow: 0 4px 14px rgba(6, 4, 36, .38); }
    }

    .sb-row.gain.gold { animation-name: row-gold; }
    @keyframes row-gold {
      0% { box-shadow: 0 4px 14px rgba(6, 4, 36, .38); }
      25% { box-shadow: 0 0 0 3px #ffcf4a, 0 0 36px rgba(255, 207, 74, .95); }
      100% { box-shadow: 0 4px 14px rgba(6, 4, 36, .38); }
    }

    .sb-row.pinned { box-shadow: 0 0 0 3px #ffcf4a, 0 6px 22px rgba(255, 207, 74, .35); }

    .sb-row.p1 .rank { color: #1b1830; background: linear-gradient(180deg, #ffe07a, #ffcf4a); }
    .sb-row.p2 .rank { color: #1b1830; background: linear-gradient(180deg, #eef0f6, #b9bfd0); }
    .sb-row.p3 .rank { color: #1b1830; background: linear-gradient(180deg, #e8a672, #c07a3f); }

    .float {
      position: absolute;
      right: 8px;
      top: 50%;
      padding: 2px 9px;
      color: #1b1830;
      font: 900 14px "Montserrat", sans-serif;
      pointer-events: none;
      background: #ffcf4a;
      border-radius: 999px;
      animation: float-up 1300ms ease-out forwards;
    }

/* Shows a message on the page instead of leaving it blank if something goes wrong. */
window.addEventListener("error", function (event) {
  var main = document.querySelector("main");
  if (!main || main.dataset.errorShown) return;
  main.dataset.errorShown = "1";
  var note = document.createElement("p");

  note.textContent = "Something went wrong while loading this page: " + event.message;
  main.prepend(note);
});

/* =========================================================
   Eurovision Rewind - shared helpers
   Used by participants.html, matrix.html and country.html
   (and, if present, by artists.html and results.html for heart flags).

   Keep this file in the same folder as the pages, next to status-config.js.
========================================================= */

(function () {
  "use strict";

  const CFG = window.STATUS_CONFIG || {};
  const configured = Boolean(CFG.dbUrl && CFG.apiKey && !/YOUR-/.test(CFG.dbUrl + CFG.apiKey));
  const BASE = (CFG.dbUrl || "").replace(/\/$/, "");

  /* ---------- Heart flags ----------
     Every country is shown by a heart image. The file is found from the country name:
       "North Macedonia" -> images/hearts/north-macedonia.png
     A different file can be set for any country with participants.html?add (Hearts tab). */

  const FLAG_FOLDER = "images/flags/";    // the folder that holds your flag files ("" = flagcdn.com only)
  const FLAG_EXTS = [".png", ".svg", ".webp", ".jpg"];   // file types to look for, in this order

  const FLAG_CODES = {
    "albania":"al","andorra":"ad","armenia":"am","australia":"au","austria":"at","azerbaijan":"az",
    "belarus":"by","belgium":"be","bosnia-and-herzegovina":"ba","bulgaria":"bg","croatia":"hr",
    "cyprus":"cy","czechia":"cz","czech-republic":"cz","denmark":"dk","estonia":"ee","finland":"fi",
    "france":"fr","georgia":"ge","germany":"de","greece":"gr","hungary":"hu","iceland":"is",
    "ireland":"ie","israel":"il","italy":"it","latvia":"lv","lithuania":"lt","luxembourg":"lu",
    "malta":"mt","moldova":"md","monaco":"mc","montenegro":"me","morocco":"ma","netherlands":"nl",
    "north-macedonia":"mk","norway":"no","poland":"pl","portugal":"pt","romania":"ro","russia":"ru",
    "san-marino":"sm","serbia":"rs","slovakia":"sk","slovenia":"si","spain":"es","sweden":"se",
    "switzerland":"ch","turkey":"tr","turkiye":"tr","ukraine":"ua","united-kingdom":"gb","uk":"gb",
    "england":"gb-eng","scotland":"gb-sct","wales":"gb-wls","kosovo":"xk","liechtenstein":"li",
    "kazakhstan":"kz","kyrgyzstan":"kg","uzbekistan":"uz","tajikistan":"tj","turkmenistan":"tm",
    "vietnam":"vn","cambodia":"kh","laos":"la","mongolia":"mn","bhutan":"bt","philippines":"ph",
    "bangladesh":"bd","thailand":"th","rep-of-korea":"kr","republic-of-korea":"kr","south-korea":"kr",
    "north-korea":"kp","nepal":"np","malaysia":"my","japan":"jp","china":"cn","india":"in",
    "indonesia":"id","singapore":"sg","myanmar":"mm","sri-lanka":"lk","pakistan":"pk","brunei":"bn",
    "timor-leste":"tl","taiwan":"tw","hong-kong":"hk","maldives":"mv","afghanistan":"af",
    "usa":"us","united-states":"us","canada":"ca","brazil":"br","mexico":"mx","argentina":"ar",
    "new-zealand":"nz","south-africa":"za","egypt":"eg","lebanon":"lb","tunisia":"tn","algeria":"dz",
    "jordan":"jo","saudi-arabia":"sa","united-arab-emirates":"ae","qatar":"qa","iran":"ir"
  };

  const VOTE_GROUPS = [
    { key: "jury", label: "Jury" },
    { key: "tele", label: "Televote" }
  ];
  const VOTE_POINTS = [12, 10, 8, 7, 6, 5, 4, 3, 2, 1];

  // Editions that always exist. More can be added with results.html?data.
  const EDITIONS_BASE = [
    { year: 2026, city: "Vienna, Austria" },
    { year: 2027, city: "Zagreb, Croatia" },
    { year: 2028, city: "Yerevan, Armenia" },
    { year: 2029, city: "Zürich, Switzerland" }
  ];

  const listOf = (value) => Array.isArray(value) ? value : Object.values(value || {});

  const same = (a, b) =>
    String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();

  function slug(name) {
    return String(name || "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/&/g, "and")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  function safeImage(value) {
    const text = String(value || "").trim();
    if (!text) return "";
    if (/^data:image\/(png|jpe?g|webp|gif|svg\+xml)[;,]/i.test(text)) return text;
    if (/^https?:\/\//i.test(text)) return text;
    if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return "";
    return text;
  }

  const imageSrc = (value) => {
    const safe = safeImage(value);
    return /^data:/i.test(safe) ? safe : encodeURI(safe).replace(/%25([0-9A-F]{2})/g, "%$1");
  };

  /* ---------- Loading data (cached in the browser, refreshed from the database) ---------- */

  const NODES = {
    hearts: "hearts",
    results: "results-data",
    participants: "participants",
    artists: "artists"
  };

  const store = {};

  function cached(name) {
    if (name in store) return store[name];
    try {
      store[name] = JSON.parse(localStorage.getItem("rw:" + name) || "null");
    } catch (error) {
      store[name] = null;
    }
    return store[name];
  }

  function keep(name, data) {
    store[name] = data;
    try {
      if (data && Object.keys(data).length) localStorage.setItem("rw:" + name, JSON.stringify(data));
      else localStorage.removeItem("rw:" + name);
    } catch (error) { /* storage full or blocked */ }
  }

  function load(name) {
    if (!configured) return Promise.resolve(cached(name));

    return fetch(BASE + "/" + NODES[name] + ".json", { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : null))
      .then((data) => { keep(name, data); return data; })
      .catch(() => cached(name));
  }

  /* ---------- Flag lookups ----------
     Every country is shown by its full rectangular flag. Sources, best first:
       1. the row's own image (a "heart" value on the row),
       2. your own file:  FLAG_FOLDER + country + FLAG_EXT  (only if FLAG_FOLDER is set),
       3. flagcdn.com, using the country code in FLAG_CODES.
     If one fails to load, the next is tried; if all fail the space stays empty. */

  function flagUrls(country, override) {
    const key = slug(country);
    const urls = [];

    if (safeImage(override)) urls.push(safeImage(override));
    if (FLAG_FOLDER && key) FLAG_EXTS.forEach((ext) => urls.push(FLAG_FOLDER + key + ext));
    if (FLAG_CODES[key]) urls.push("https://flagcdn.com/w160/" + FLAG_CODES[key] + ".png");

    return urls;
  }

  const heartPath = (country, override) => flagUrls(country, override)[0] || "";

  function flagImg(country, className, override) {
    const urls = flagUrls(country, override);
    const image = document.createElement("img");
    let tried = 0;

    image.className = className || "flag-img";
    image.alt = "";
    image.decoding = "async";

    image.addEventListener("error", () => {
      tried += 1;
      if (tried < urls.length) image.src = imageSrc(urls[tried]);
      else image.style.visibility = "hidden";
    });

    if (urls.length) image.src = imageSrc(urls[0]);
    else image.style.visibility = "hidden";

    return image;
  }

  /* ---------- Results and votes ---------- */

  function cleanVotes(votes) {
    if (!votes) return undefined;
    const out = {};

    VOTE_GROUPS.forEach(({ key }) => {
      const raw = votes[key];
      if (!raw) return;
      const list = listOf(raw);
      const names = VOTE_POINTS.map((_, i) => String(list[i] || "").trim());
      if (names.some(Boolean)) out[key] = names;
    });

    return Object.keys(out).length ? out : undefined;
  }

  function normRow(item) {
    return {
      country: String(item.country),
      points: item.points,
      ...(item.heart ? { heart: String(item.heart) } : {}),
      ...(item.voterOnly ? { voterOnly: true } : {}),
      ...(cleanVotes(item.votes) ? { votes: cleanVotes(item.votes) } : {})
    };
  }

  // { 2028: { city, grand: [rows], rounds: [{ name, rows }] } }
  function normalizeResults(data) {
    const out = {};

    Object.keys(data || {}).forEach((year) => {
      if (!Number.isInteger(Number(year))) return;
      const value = data[year];
      const rows = (list) => listOf(list).filter((item) => item && item.country).map(normRow);

      out[year] = {
        city: value && !Array.isArray(value) && value.city ? String(value.city) : "",
        grand: Array.isArray(value) ? rows(value) : rows(value && value.grand),
        rounds: Array.isArray(value) ? [] : listOf(value && value.rounds)
          .filter((round) => round && round.name)
          .map((round) => ({ name: String(round.name), rows: rows(round.rows) }))
      };
    });

    return out;
  }

  // Points one country gave another. group: "jury", "tele" or "total" (all groups added together).
  function pointsFor(giver, receiver, group) {
    const keys = group === "total" ? VOTE_GROUPS.map((item) => item.key) : [group];
    let sum = 0;

    keys.forEach((key) => {
      const list = (giver.votes && giver.votes[key]) || [];
      const position = list.findIndex((name) => same(name, receiver));
      if (position >= 0) sum += VOTE_POINTS[position];
    });

    return sum;
  }

  const groupsWithVotes = (rows) =>
    VOTE_GROUPS.filter(({ key }) => rows.some((row) => row.votes && row.votes[key]));

  /* ---------- Editions ---------- */

  // Every year that has a name, results or participants.
  function editions(results, participants) {
    const map = new Map(EDITIONS_BASE.map((edition) => [edition.year, edition.city]));

    Object.keys(results || {}).forEach((year) => {
      const city = results[year].city;
      if (city) map.set(Number(year), city);
      else if (!map.has(Number(year))) map.set(Number(year), "");
    });

    Object.keys(participants || {}).forEach((year) => {
      if (Number.isInteger(Number(year)) && !map.has(Number(year))) map.set(Number(year), "");
    });

    return [...map.entries()].map(([year, city]) => ({ year, city })).sort((a, b) => a.year - b.year);
  }

  /* ---------- Participants ---------- */

  function normEntry(item) {
    const number = (value) => (Number.isFinite(Number(value)) && value !== "" && value !== null ? Number(value) : 0);

    return {
      country: String(item.country || "").trim().slice(0, 60),
      artist: String(item.artist || "").trim().slice(0, 80),
      song: String(item.song || "").trim().slice(0, 100),
      semi: String(item.semi || "").trim().slice(0, 40),
      inFinal: item.inFinal === undefined ? true : Boolean(item.inFinal),
      semiOrder: number(item.semiOrder),
      finalOrder: number(item.finalOrder)
    };
  }

  // { 2029: [entries] }
  function normalizeParticipants(data) {
    const out = {};

    Object.keys(data || {}).forEach((year) => {
      if (!Number.isInteger(Number(year))) return;
      const value = data[year];
      const list = listOf(Array.isArray(value) ? value : value && value.entries)
        .filter((item) => item && item.country)
        .map(normEntry);
      if (list.length) out[year] = list;
    });

    return out;
  }

  /* ---------- Demo data (shown only until you publish real results) ---------- */

  const SAMPLE = [
    ["France", 248], ["Ukraine", 177], ["Georgia", 176], ["Armenia", 175],
    ["Spain", 152], ["Albania", 145], ["North Macedonia", 141], ["Poland", 139],
    ["Netherlands", 93], ["Malta", 92], ["Italy", 73], ["Portugal", 73],
    ["Croatia", 70], ["Azerbaijan", 66], ["Cyprus", 50], ["Montenegro", 49]
  ];

  function sampleResults() {
    const names = SAMPLE.map(([name]) => name);
    const hash = (text) => [...text].reduce((sum, char) => sum + char.charCodeAt(0), 0);

    const pick = (name, index, seed) => names
      .filter((other) => other !== name)
      .map((other) => [other, (hash(other) * (index + 3) + seed * 7) % 97])
      .sort((a, b) => a[1] - b[1])
      .slice(0, 10)
      .map(([other]) => other);

    const rows = SAMPLE.map(([country, points], index) =>
      normRow({ country, points, votes: { jury: pick(country, index, 1), tele: pick(country, index, 5) } }));

    return { 2028: { city: "Yerevan, Armenia", grand: rows, rounds: [], sample: true } };
  }

  function sampleParticipants() {
    return {
      2028: SAMPLE.map(([country], index) => normEntry({
        country,
        artist: "Artist",
        song: "Song Title",
        semi: index < 8 ? "Semi-final 1" : "Semi-final 2",
        inFinal: true,
        semiOrder: (index % 8) + 1,
        finalOrder: index + 1
      }))
    };
  }

  /* ---------- Admin sign-in (the same login as the other editors) ---------- */

  const SESSION_KEY = "statusAdminSession";
  let session = null;

  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (error) { session = null; }

  function saveSession(next) {
    session = next;
    if (next) localStorage.setItem(SESSION_KEY, JSON.stringify(next));
    else localStorage.removeItem(SESSION_KEY);
  }

  async function signIn(email, password) {
    const response = await fetch(
      "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + CFG.apiKey,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, returnSecureToken: true })
      }
    );
    const data = await response.json();
    if (!response.ok) throw new Error("Wrong email or password.");

    saveSession({
      email: data.email,
      idToken: data.idToken,
      refreshToken: data.refreshToken,
      expiresAt: Date.now() + Number(data.expiresIn) * 1000
    });
  }

  async function getToken() {
    if (!session) throw new Error("Sign in first.");
    if (session.expiresAt - Date.now() > 60000) return session.idToken;

    const response = await fetch(
      "https://securetoken.googleapis.com/v1/token?key=" + CFG.apiKey,
      {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(session.refreshToken)
      }
    );
    const data = await response.json();

    if (!response.ok) {
      saveSession(null);
      throw new Error("Your session ended. Please sign in again.");
    }

    saveSession({
      ...session,
      idToken: data.id_token,
      refreshToken: data.refresh_token,
      expiresAt: Date.now() + Number(data.expires_in) * 1000
    });

    return session.idToken;
  }

  // Writes a whole node ("participants", "hearts") to the database.
  async function publish(name, payload) {
    const token = await getToken();
    const response = await fetch(BASE + "/" + NODES[name] + ".json?auth=" + encodeURIComponent(token), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      let detail = "";
      try { detail = (await response.json()).error || ""; } catch (error) { detail = ""; }

      throw new Error(
        /permission/i.test(detail)
          ? 'Permission denied. Add the "' + NODES[name] + '" rule in Firebase (see the instructions) and Publish.'
          : "Could not save (error " + response.status + (detail ? ": " + detail : "") + ")."
      );
    }

    keep(name, payload);
  }

  window.RW = {
    configured,
    FLAG_FOLDER, FLAG_EXTS, FLAG_CODES, VOTE_GROUPS, VOTE_POINTS, EDITIONS_BASE,
    listOf, same, slug, safeImage, imageSrc,
    cached, load, keep, flagUrls, flagImg, heartPath, heartImg: flagImg,
    cleanVotes, normRow, normalizeResults, pointsFor, groupsWithVotes,
    editions, normEntry, normalizeParticipants,
    sampleResults, sampleParticipants,
    signedIn: () => Boolean(session),
    userEmail: () => (session && session.email) || "",
    signIn, signOut: () => saveSession(null), publish
  };
})();

  </script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
      const twoColumns = window.matchMedia("(min-width: 900px)");

      let results = {};
      let usingSample = false;
      let year = 0;
      let showName = "Grand Final";
      let group = "total";

      // The scoreboard being shown
      let rows = [];            // every row of the show
      let board = [];           // countries that can receive points: { name, row, el, base, points }
      let byName = new Map();
      let voters = [];          // { name, row, awards: [{ to, pts }], start, end }
      let steps = [];           // every single point, in order: { v, to, pts }
      let staticMode = false;   // no detailed votes: just animate the final points

      let idx = 0;              // how many points have been given
      let playing = false;
      let timer = 0;
      let speed = 1;
      let announced = -1;       // voter whose "votes from" banner is on screen
      let stageVoter = -1;
      let pinned = "";
      let finished = false;
      let received = new Map(); // country -> [{ voter, pts }]

      /* ---------- data (same as the voting matrix) ---------- */

      function readData() {
        results = RW.normalizeResults(RW.cached("results"));

        const hasRows = Object.values(results).some(
          (edition) => edition.grand.length || edition.rounds.some((round) => round.rows.length));

        usingSample = !hasRows;
        if (usingSample) results = RW.normalizeResults(RW.sampleResults());
      }

      const showsOf = (y) => {
        const edition = results[y];
        if (!edition) return [];
        return [{ name: "Grand Final", rows: edition.grand }, ...edition.rounds]
          .filter((show) => show.rows.length);
      };

      const hasVotes = (show) => RW.groupsWithVotes(show.rows).length > 0;

      function pickDefaults() {
        const [hashYear, hashShow] = location.hash.replace("#", "").split("/");
        const years = RW.editions(results, {}).map((edition) => edition.year);
        const withVotes = years.filter((y) => showsOf(y).some(hasVotes));
        const withRows = years.filter((y) => showsOf(y).length);

        year = years.includes(Number(hashYear))
          ? Number(hashYear)
          : (withVotes[withVotes.length - 1] || withRows[withRows.length - 1] || years[years.length - 1]);

        const shows = showsOf(year);
        const wanted = decodeURIComponent(hashShow || "");
        const match = shows.find((show) => RW.slug(show.name) === wanted || show.name === wanted);
        const grand = shows.find((show) => show.name === "Grand Final");

        showName = (match
          || (grand && hasVotes(grand) ? grand : null)
          || shows.find(hasVotes)
          || grand
          || shows[0]
          || { name: "Grand Final" }).name;
      }

      function setHash() {
        history.replaceState(null, "", location.pathname + "#" + year +
          (showName === "Grand Final" ? "" : "/" + RW.slug(showName)));
      }

      function firstShow(y) {
        const next = showsOf(y);
        const grand = next.find((show) => show.name === "Grand Final");
        return ((grand && hasVotes(grand) ? grand : null) || next.find(hasVotes) || grand || next[0] || { name: "Grand Final" }).name;
      }

      function renderControls(shows, groups) {
        $("years").innerHTML = "";
        RW.editions(results, {}).forEach((edition) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = edition.year;
          button.classList.toggle("active", edition.year === year);
          button.addEventListener("click", () => {
            year = edition.year;
            showName = firstShow(year);
            setHash();
            render();
          });
          $("years").append(button);
        });

        $("show").innerHTML = "";
        shows.forEach((show) => $("show").append(new Option(show.name, show.name)));
        $("show").value = showName;
        $("show").hidden = shows.length < 2;

        $("groups").innerHTML = "";
        const options = groups.length > 1
          ? [{ key: "total", label: "Total" }, ...groups]
          : groups.map((item) => ({ key: item.key, label: item.label }));

        if (!options.some((item) => item.key === group)) group = options.length ? options[0].key : "total";

        options.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = item.label;
          button.classList.toggle("active", item.key === group);
          button.addEventListener("click", () => { group = item.key; render(); });
          $("groups").append(button);
        });
        $("groups").hidden = options.length < 2;
      }

      /* ---------- small helpers ---------- */

      const heartOf = (name) => {
        const row = rows.find((item) => RW.same(item.country, name));
        return row && row.heart;
      };

      const flag = (name, cls) => RW.heartImg(name, cls || "flag-img", heartOf(name));

      function el(tag, cls, text) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function restartAnimation(node, cls) {
        node.classList.remove(cls);
        void node.offsetWidth;
        node.classList.add(cls);
      }

      // A fixed "draw" order for the voters, so the first one isn't always the winner.
      const drawKey = (name) => [...(name + year)].reduce((sum, char, i) => (sum * 31 + char.charCodeAt(0) * (i + 7)) % 9973, 7);

      /* ---------- build the scoreboard for the chosen show ---------- */

      function build() {
        stopPlaying();
        idx = 0; announced = -1; stageVoter = -1; finished = false; pinned = "";
        received = new Map();

        const shows = showsOf(year);
        const show = shows.find((item) => item.name === showName) || shows[0];
        rows = show ? show.rows : [];
        const groups = RW.groupsWithVotes(rows);

        renderControls(shows, groups);
        $("badge").hidden = !usingSample;

        const hide = (...ids) => ids.forEach((id) => { $(id).hidden = true; });
        hide("winner", "follow");
        $("board").innerHTML = "";

        if (!show) {
          hide("stage", "transport", "progress", "status", "voters", "boardWrap", "keys");
          $("empty").hidden = false;
          $("empty").textContent = "The results of " + year + " haven't been published yet.";
          return;
        }

        $("empty").hidden = true;
        $("boardWrap").hidden = false;

        const keys = group === "total" ? groups.map((item) => item.key) : [group];

        // Countries that can receive points
        board = [];
        byName = new Map();
        const addCountry = (name, row) => {
          if (byName.has(name.toLowerCase())) return byName.get(name.toLowerCase());
          const item = { name, row, base: board.length, points: 0, el: null };
          board.push(item);
          byName.set(name.toLowerCase(), item);
          return item;
        };

        rows.filter((row) => !row.voterOnly).forEach((row) => addCountry(row.country, row));

        // Voters and the points they give (lowest first, 12 last)
        voters = [];
        steps = [];

        rows
          .filter((row) => keys.some((key) => row.votes && row.votes[key]))
          .sort((a, b) => drawKey(a.country) - drawKey(b.country))
          .forEach((giver) => {
            const given = new Map();

            keys.forEach((key) => {
              ((giver.votes && giver.votes[key]) || []).forEach((name, position) => {
                if (!name || position >= RW.VOTE_POINTS.length || RW.same(name, giver.country)) return;
                const target = addCountry(name, null).name;
                given.set(target, (given.get(target) || 0) + RW.VOTE_POINTS[position]);
              });
            });

            const awards = [...given].map(([to, pts]) => ({ to, pts }))
              .sort((a, b) => a.pts - b.pts || a.to.localeCompare(b.to));
            if (!awards.length) return;

            const voter = { name: giver.country, row: giver, awards, start: steps.length };
            awards.forEach((award) => steps.push({ v: voters.length, to: award.to, pts: award.pts }));
            voter.end = steps.length;
            voters.push(voter);
          });

        staticMode = steps.length === 0;

        if (staticMode) {
          rows.filter((row) => !row.voterOnly).forEach((row) => {
            const item = byName.get(row.country.toLowerCase());
            if (item) item.final = Number(row.points) || 0;
          });
        }

        buildBoard();
        buildVoters();
        buildTransport();
        layout();
        applyIdx(0, "jump");
        if (staticMode) setTimeout(() => replayStatic(), 700);
      }

      function buildBoard() {
        board.forEach((item, i) => {
          const rowEl = el("div", "sb-row");
          rowEl.setAttribute("role", "listitem");
          rowEl.tabIndex = 0;
          rowEl.classList.add("entering");
          rowEl.addEventListener("animationend", (event) => {
            if (event.animationName === "sb-enter") rowEl.classList.remove("entering");
          });
          rowEl.style.setProperty("--i", Math.min(i, 24));

          const rank = el("div", "cell rank", String(i + 1).padStart(2, "0"));
          const flagBox = el("div", "cell flagbox");
          flagBox.append(flag(item.name));
          const name = el("div", "cell name");
          name.append(el("span", "", item.name));
          const points = el("div", "cell points", "0");

          rowEl.append(rank, flagBox, name, points);
          rowEl.addEventListener("click", () => togglePin(item.name));
          rowEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter") { event.preventDefault(); togglePin(item.name); }
          });

          item.el = rowEl;
          item.rankEl = rank;
          item.pointsEl = points;
          item.shown = 0;
          $("board").append(rowEl);
        });
      }

      function buildVoters() {
        const strip = $("voters");
        strip.innerHTML = "";
        strip.hidden = staticMode;

        voters.forEach((voter, vi) => {
          const button = el("button");
          button.type = "button";
          button.title = voter.name;
          button.setAttribute("aria-label", "Jump to the votes of " + voter.name);
          button.append(flag(voter.name));
          button.addEventListener("click", () => {
            stopPlaying();
            announced = vi;
            applyIdx(voter.end, "jump");
          });
          voter.button = button;
          strip.append(button);
        });
      }

      function buildTransport() {
        $("stage").hidden = staticMode;
        $("transport").hidden = false;
        $("progress").hidden = staticMode;
        $("status").hidden = false;
        $("keys").hidden = staticMode;

        ["bBack", "bNext", "bCountry", "bEnd", "speed"].forEach((id) => { $(id).hidden = staticMode; });
        $("bRestart").lastElementChild.textContent = staticMode ? "Replay" : "Restart";
        $("bPlay").hidden = staticMode;
        updatePlayButton();
      }

      /* ---------- layout: every row slides to its place ---------- */

      function layout() {
        const wide = twoColumns.matches && board.length > 6;
        const perColumn = wide ? Math.ceil(board.length / 2) : board.length;
        const rowH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sb-row-h")) || 52;
        const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sb-gap")) || 6;

        $("board").style.height = perColumn * (rowH + gap) - gap + "px";
        $("board").style.setProperty("--sb-w", wide ? "calc((100% - var(--sb-col-gap)) / 2)" : "100%");
        board.forEach((item) => item.el && item.el.style.setProperty("--sb-w", wide ? "calc((100% - var(--sb-col-gap)) / 2)" : "100%"));
        layout.perColumn = perColumn;
        layout.wide = wide;
        place();
      }

      function sorted() {
        return board.slice().sort((a, b) =>
          b.points - a.points || (staticMode ? a.base - b.base : a.name.localeCompare(b.name)));
      }

      function place() {
        const order = sorted();

        order.forEach((item, i) => {
          const column = layout.wide ? Math.floor(i / layout.perColumn) : 0;
          const line = layout.wide ? i % layout.perColumn : i;
          item.el.style.setProperty("--r", line);
          item.el.style.setProperty("--c", column);
          item.el.style.zIndex = String(100 - i);
          item.rankEl.textContent = String(i + 1).padStart(2, "0");
          item.el.classList.toggle("p1", finished && i === 0);
          item.el.classList.toggle("p2", finished && i === 1);
          item.el.classList.toggle("p3", finished && i === 2);
        });

        return order;
      }

      /* ---------- numbers ---------- */

      function tween(item, to, duration) {
        const from = item.shown;
        item.shown = to;
        cancelAnimationFrame(item.raf);

        if (reduce.matches || duration <= 0 || from === to) { item.pointsEl.textContent = to; return; }

        const start = performance.now();
        const frame = (now) => {
          const t = Math.min(1, (now - start) / duration);
          item.pointsEl.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3)));
          if (t < 1) item.raf = requestAnimationFrame(frame);
        };
        item.raf = requestAnimationFrame(frame);
      }

      /* ---------- the state after `k` points ---------- */

      function applyIdx(k, mode) {
        idx = Math.max(0, Math.min(steps.length, k));

        board.forEach((item) => { item.points = 0; });
        received = new Map();

        for (let i = 0; i < idx; i++) {
          const step = steps[i];
          const item = byName.get(step.to.toLowerCase());
          item.points += step.pts;
          if (!received.has(item.name)) received.set(item.name, []);
          received.get(item.name).push({ voter: voters[step.v].name, pts: step.pts });
        }

        const step = mode === "step" ? steps[idx - 1] : null;
        const wasFinished = finished;
        finished = !staticMode && steps.length > 0 && idx === steps.length;

        board.forEach((item) => tween(item, item.points, mode === "step" ? 650 : 380));
        const order = place();

        if (step) {
          const item = byName.get(step.to.toLowerCase());
          item.el.classList.remove("gain", "gold");
          void item.el.offsetWidth;
          item.el.classList.add("gain");
          if (step.pts >= 12) item.el.classList.add("gold");

          const badge = el("span", "float" + (step.pts >= 10 ? " big" : ""), "+" + step.pts);
          item.pointsEl.append(badge);
          badge.addEventListener("animationend", () => badge.remove());
          setTimeout(() => item.el.classList.remove("gain", "gold"), 1150);
        }

        if (mode !== "step" && idx > 0) stageVoter = steps[idx - 1].v;
        if (idx === 0 && mode !== "step") stageVoter = announced = -1;

        updateStage(step, mode === "step");
        updateVoters();
        updateFollow();
        updateStatus();

        if (finished) showWinner(order, mode === "step" && !wasFinished);
        else { $("winner").hidden = true; }

        updatePlayButton();
      }

      /* ---------- stage banner ---------- */

      function tile(name, extra) {
        const box = el("div", "tile");
        box.append(flag(name), el("div", "tile-name", name));
        if (extra) box.append(extra);
        return box;
      }

      function setTile(host, name, pts, swap) {
        host.className = "tile";
        host.innerHTML = "";
        host.append(flag(name), el("div", "tile-name", name));
        if (pts) host.append(el("div", "award-pts" + (pts >= 12 ? " gold" : ""), String(pts)));
        if (swap) restartAnimation(host, "swap");
      }

      function setIdle(host, text) {
        host.className = "tile idle";
        host.innerHTML = "";
        host.append(el("div", "tile-name", text));
      }

      function updateStage(step, animate) {
        if (staticMode) return;
        const voter = voters[stageVoter];

        if (!voter) {
          setIdle($("stVoter"), "Ready when you are");
          setIdle($("stAward"), "Press Start voting");
          $("chipsRow").innerHTML = "";
          return;
        }

        if ($("stVoter").dataset.voter !== String(stageVoter)) {
          setTile($("stVoter"), voter.name, 0, animate);
          $("stVoter").dataset.voter = String(stageVoter);
        }

        const shown = Math.max(0, Math.min(voter.awards.length, idx - voter.start));
        const last = shown ? voter.awards[shown - 1] : null;

        if (last) {
          setTile($("stAward"), last.to, last.pts, false);
          if (animate) { restartAnimation($("stAward"), "swap"); restartAnimation($("stAward"), "hit"); }
        } else {
          setIdle($("stAward"), "Here come the points…");
        }

        const row = $("chipsRow");
        const existing = row.children.length;
        const sameVoter = row.dataset.voter === String(stageVoter);

        if (!sameVoter || existing > shown) { row.innerHTML = ""; row.dataset.voter = String(stageVoter); }

        for (let i = row.children.length; i < shown; i++) {
          const award = voter.awards[i];
          const chip = el("span", "award" + (award.pts >= 12 ? " gold" : ""));
          chip.append(el("b", "", String(award.pts)), flag(award.to), document.createTextNode(award.to));
          if (!animate) chip.style.animation = "none";
          row.append(chip);
        }
      }

      function announce(vi) {
        announced = vi;
        stageVoter = vi;
        $("stVoter").dataset.voter = "";
        $("chipsRow").dataset.voter = "";
        setTile($("stVoter"), voters[vi].name, 0, true);
        $("stVoter").dataset.voter = String(vi);
        setIdle($("stAward"), "Here come the points…");
        $("chipsRow").innerHTML = "";
        $("chipsRow").dataset.voter = String(vi);
        updateVoters();
        updateStatus();
      }

      function updateVoters() {
        voters.forEach((voter, vi) => {
          voter.button.classList.toggle("done", idx >= voter.end);
          voter.button.classList.toggle("current", vi === stageVoter);
        });

        const current = voters[stageVoter];
        if (current && current.button.scrollIntoView && !reduce.matches) {
          const strip = $("voters");
          strip.scrollTo({ left: current.button.offsetLeft - strip.clientWidth / 2, behavior: "smooth" });
        }
      }

      function updateStatus() {
        if (staticMode) {
          $("status").textContent = "Detailed votes aren't published for this show, so this shows the final points.";
          return;
        }

        const done = voters.filter((voter) => idx >= voter.end).length;
        $("progressFill").style.width = (steps.length ? (idx / steps.length) * 100 : 0) + "%";
        $("status").textContent = finished
          ? "All " + voters.length + " countries have voted."
          : done + " of " + voters.length + " countries have voted";
      }

      /* ---------- follow a country ---------- */

      function togglePin(name) {
        pinned = pinned === name ? "" : name;
        updateFollow();
      }

      function updateFollow() {
        board.forEach((item) => item.el.classList.toggle("pinned", item.name === pinned));
        const panel = $("follow");

        if (!pinned) { panel.hidden = true; return; }

        const item = byName.get(pinned.toLowerCase());
        const order = sorted();
        const place = order.indexOf(item) + 1;

        panel.hidden = false;
        panel.innerHTML = "";

        const head = el("div", "follow-head");
        const t = el("div", "tile");
        t.append(flag(item.name), el("div", "tile-name", item.name + " · #" + place),
          el("div", "award-pts", String(item.points)));
        const close = el("button", "x", "Stop following");
        close.type = "button";
        close.addEventListener("click", () => togglePin(item.name));
        head.append(t, close);
        panel.append(head);

        const list = received.get(item.name) || [];
        if (!list.length) {
          panel.append(el("div", "follow-note", staticMode ? "Final points for this country." : "No points received yet."));
          return;
        }

        const chips = el("div", "chips-row");
        list.forEach((entry) => {
          const chip = el("span", "award" + (entry.pts >= 12 ? " gold" : ""));
          chip.style.animation = "none";
          chip.append(el("b", "", String(entry.pts)), flag(entry.voter), document.createTextNode(entry.voter));
          chips.append(chip);
        });
        panel.append(chips);
      }

      /* ---------- winner ---------- */

      function showWinner(order, celebrate) {
        const top = order[0];
        const panel = $("winner");
        panel.hidden = false;
        panel.innerHTML = "";

        const title = el("h2", "", "🏆 Winner of " + (showName === "Grand Final" ? "Eurovision Rewind " + year : showName));
        const box = el("div", "tile");
        box.append(flag(top.name), el("div", "tile-name", top.name), el("div", "award-pts gold", String(top.points)));
        const podium = el("div", "podium", order.slice(1, 3).map((item, i) => (i + 2) + ". " + item.name + " (" + item.points + ")").join("   ·   "));

        panel.append(title, box, podium);

        if (celebrate) {
          restartAnimation(panel, "winner");
          confetti();
          panel.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "nearest" });
        }
      }

      function confetti() {
        if (reduce.matches) return;
        const canvas = $("confetti");
        const ctx = canvas.getContext("2d");
        canvas.width = innerWidth;
        canvas.height = innerHeight;

        const colors = ["#ffcf4a", "#9b6cff", "#ffffff", "#3be08a", "#ff5c8a", "#5ec8ff"];
        const bits = Array.from({ length: 160 }, () => ({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.5,
          vx: (Math.random() - 0.5) * 4,
          vy: 2 + Math.random() * 4,
          size: 6 + Math.random() * 8,
          rot: Math.random() * 6,
          vr: (Math.random() - 0.5) * 0.3,
          color: colors[Math.floor(Math.random() * colors.length)]
        }));

        const start = performance.now();
        const frame = (now) => {
          const t = now - start;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          bits.forEach((bit) => {
            bit.x += bit.vx; bit.y += bit.vy; bit.rot += bit.vr; bit.vy += 0.03;
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - t / 5000);
            ctx.translate(bit.x, bit.y);
            ctx.rotate(bit.rot);
            ctx.fillStyle = bit.color;
            ctx.fillRect(-bit.size / 2, -bit.size / 4, bit.size, bit.size / 2);
            ctx.restore();
          });

          if (t < 5000) requestAnimationFrame(frame);
          else ctx.clearRect(0, 0, canvas.width, canvas.height);
        };
        requestAnimationFrame(frame);
      }

      /* ---------- playing ---------- */

      function updatePlayButton() {
        const button = $("bPlay");
        const label = button.querySelector(".lbl");
        button.classList.toggle("playing", playing);

        if (playing) { button.firstChild.textContent = "⏸ "; label.textContent = "Pause"; }
        else if (finished) { button.firstChild.textContent = "↺ "; label.textContent = "Watch again"; }
        else if (idx > 0) { button.firstChild.textContent = "▶ "; label.textContent = "Continue"; }
        else { button.firstChild.textContent = "▶ "; label.textContent = "Start voting"; }

        $("bBack").disabled = idx === 0;
        $("bRestart").disabled = !staticMode && idx === 0 && !playing;
        ["bNext", "bCountry", "bEnd"].forEach((id) => { $(id).disabled = finished; });
      }

      function schedule(ms) {
        clearTimeout(timer);
        timer = setTimeout(tick, ms / speed);
      }

      function tick() {
        if (!playing) return;
        if (idx >= steps.length) { stopPlaying(); return; }

        const next = steps[idx];

        if (next.v !== announced) {
          announce(next.v);
          schedule(1000);
          return;
        }

        applyIdx(idx + 1, "step");
        if (idx >= steps.length) { stopPlaying(); return; }

        const gap = steps[idx].v !== next.v ? 1300 : next.pts >= 12 ? 1400 : next.pts >= 10 ? 950 : 600;
        schedule(gap);
      }

      function startPlaying() {
        if (staticMode || steps.length === 0) return;
        if (finished) { applyIdx(0, "jump"); announced = -1; }
        playing = true;
        updatePlayButton();
        schedule(400);
      }

      function stopPlaying() {
        playing = false;
        clearTimeout(timer);
        if ($("bPlay")) updatePlayButton();
      }

      function nextPoint() {
        stopPlaying();
        if (idx >= steps.length) return;
        const next = steps[idx];
        if (next.v !== announced) announce(next.v);
        applyIdx(idx + 1, "step");
      }

      function nextCountry() {
        stopPlaying();
        if (idx >= steps.length) return;
        const vi = steps[idx].v;
        announced = vi;
        applyIdx(voters[vi].end, "jump");
      }

      function back() {
        stopPlaying();
        if (idx === 0) return;
        const target = idx - 1;
        announced = target > 0 ? steps[target - 1].v : -1;
        applyIdx(target, "jump");
        if (target > 0) stageVoter = steps[target - 1].v;
      }

      function restart() {
        stopPlaying();
        if (staticMode) { replayStatic(); return; }
        announced = -1;
        $("stVoter").dataset.voter = "";
        $("chipsRow").dataset.voter = "";
        applyIdx(0, "jump");
      }

      function toEnd() {
        stopPlaying();
        announced = voters.length - 1;
        applyIdx(steps.length, "step");
      }

      // No detailed votes: start from 0 and let every score climb to its final value.
      function replayStatic() {
        board.forEach((item) => { item.points = 0; tween(item, 0, 0); });
        place();

        setTimeout(() => {
          board.forEach((item) => { item.points = item.final || 0; tween(item, item.points, 1400); });
          place();
        }, 450);
      }

      /* ---------- events ---------- */

      $("bPlay").addEventListener("click", () => (playing ? stopPlaying() : startPlaying()));
      $("bNext").addEventListener("click", nextPoint);
      $("bCountry").addEventListener("click", nextCountry);
      $("bBack").addEventListener("click", back);
      $("bRestart").addEventListener("click", restart);
      $("bEnd").addEventListener("click", toEnd);

      $("speed").querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          speed = Number(button.dataset.speed);
          $("speed").querySelectorAll("button").forEach((item) => item.classList.toggle("active", item === button));
          if (playing) schedule(300);
        });
      });

      $("show").addEventListener("change", () => { showName = $("show").value; setHash(); build(); });

      document.addEventListener("keydown", (event) => {
        if (/^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName) || event.target.isContentEditable) return;
        if (staticMode || !steps.length) return;
        if (event.target.tagName === "BUTTON" && event.key === " ") return;

        if (event.key === " ") { event.preventDefault(); playing ? stopPlaying() : startPlaying(); }
        else if (event.key === "ArrowRight") { event.preventDefault(); event.shiftKey ? nextCountry() : nextPoint(); }
        else if (event.key === "ArrowLeft") { event.preventDefault(); back(); }
        else if (event.key === "End") { event.preventDefault(); toEnd(); }
        else if (event.key.toLowerCase() === "r") restart();
      });

      let resizeTimer = 0;
      window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 120); });
      twoColumns.addEventListener("change", layout);
      window.addEventListener("hashchange", () => { pickDefaults(); build(); });

      /* ---------- start ---------- */

      readData();
      pickDefaults();
      build();

      RW.load("results").then(() => { readData(); pickDefaults(); build(); });
      if (window.lucide) window.lucide.createIcons();
    })();
  </script>

</body>
</html>
