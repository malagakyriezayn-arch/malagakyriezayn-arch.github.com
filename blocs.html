<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171329">

  <title>Voting blocs | Eurovision Rewind</title>
  <meta name="description" content="An interactive map of the countries that exchange the most points in Eurovision Rewind.">
  <link rel="icon" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.460.0"></script>

  <style>
    :root {
      --white: #ffffff;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Montserrat", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at 10% 0%, rgba(112, 83, 213, .25), transparent 40%),
        radial-gradient(ellipse at 100% 35%, rgba(52, 166, 175, .13), transparent 38%),
        linear-gradient(145deg, #171329, #101522 65%, #171329);
      background-attachment: fixed;
    }

    @media (hover: none) {
      body { background-attachment: scroll; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* NAVIGATION */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 13px 5%;
      background: rgba(19, 17, 39, .72);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .nav-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.075);
      box-shadow: 0 8px 30px rgba(0,0,0,.16);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      color: #d0ccdf;
      font-size: 11px;
      font-weight: 600;
      transition: .25s ease;
    }

    .nav-link svg {
      width: 16px;
      height: 16px;
    }

    .nav-link:hover {
      color: white;
      background: rgba(255,255,255,.09);
    }

    .nav-link.active {
      color: white;
      background: linear-gradient(135deg, #806be8, #5545ae);
      box-shadow: 0 4px 18px rgba(103,81,210,.25);
    }

    .nav-home {
      width: 40px;
      padding: 0;
    }

    /* MAIN (empty - add your content here) */

    main {
      width: min(1180px, 94%);
      margin: 0 auto;
      padding: 30px 0 80px;
    }

    /* =========================
       CUSTOM FONT
       Put the font files in a "fonts" folder next to this page.
    ========================= */

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-MediumItalic.otf") format("opentype");
      font-weight: 500;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --artist-font: "ResultsFont", "Neulis", "Montserrat", sans-serif;
      --muted: rgba(255, 255, 255, 0.7);
      --line: rgba(255, 255, 255, 0.16);
      --rank-bg: #7b2c8a;
      --name-bg: #913e9f;
      --board-bg: #571f64;
    }

    [hidden] { display: none !important; }

    a:focus-visible,
    button:focus-visible,
    select:focus-visible {
      outline: 2px solid #c9bdff;
      outline-offset: 3px;
    }

    .page-head { margin-bottom: 22px; text-align: center; }

    .page-head h1 {
      color: #fff;
      font-family: var(--artist-font);
      font-size: clamp(36px, 7.5vw, 62px);
      font-weight: 500;
      letter-spacing: -1px;
      line-height: 1.05;
    }

    .page-head p {
      max-width: 580px;
      margin: 12px auto 0;
      color: var(--muted);
      font-family: var(--artist-font);
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 12px;
      color: #ffd28a;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 210, 138, 0.1);
      border: 1px solid rgba(255, 210, 138, 0.3);
      border-radius: 999px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .chips a,
    .chips button {
      min-width: 74px;
      padding: 9px 18px;
      color: #c2bfd6;
      font: 700 13px "Montserrat", sans-serif;
      letter-spacing: 0.6px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .chips a:hover,
    .chips button:hover { color: #fff; background: rgba(255, 255, 255, 0.13); }

    .chips .active {
      color: #fff;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    .empty {
      padding: 40px 18px;
      color: var(--muted);
      font-family: var(--artist-font);
      font-size: 17px;
      text-align: center;
    }

    .heart-img {
      flex: none;
      width: 34px;
      height: auto;
      aspect-ratio: 10 / 9;
      object-fit: contain;
    }

    select.pick {
      padding: 10px 14px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    select.pick option { color: #000; }

    /* =========================
       VOTING BLOCS MAP
    ========================= */

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .seg { display: flex; gap: 6px; }

    .seg button, .tog {
      padding: 9px 16px;
      color: #c2bfd6;
      font: 700 12px "Montserrat", sans-serif;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
    }

    .seg button.active, .tog.active {
      color: #fff;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    .slider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .slider input { width: 150px; }
    .slider output { min-width: 56px; color: #fff; }

    .map-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 900px) { .map-layout { grid-template-columns: 1fr; } }

    .map-card {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(124, 92, 255, 0.16), transparent 62%),
        rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 22px;
    }

    #map { display: block; width: 100%; height: auto; touch-action: pan-y; }
    #map .node { cursor: pointer; touch-action: none; outline: none; }

    .edge {
      fill: none;
      stroke-linecap: round;
      opacity: 0;
      transition: opacity 0.9s ease, stroke-width 0.2s ease;
    }

    .edges.show .edge { opacity: 0.8; }
    .edges.show .edge.dim { opacity: 0.06; }
    .edges.show .edge.hi { opacity: 1; }

    .node .pop { transform-box: fill-box; transform-origin: center; }
    .node.enter .pop { animation: pop 0.7s cubic-bezier(.2, .9, .3, 1.25) both; animation-delay: var(--d, 0ms); }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .node { transition: opacity 0.3s ease; }
    .node.dim { opacity: 0.18; }
    .node .halo { transition: opacity 0.3s ease; }
    .node.sel .halo { animation: pulse 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.3); opacity: 0.9; }
    }

    .node .label {
      fill: #fff;
      font: 500 11px var(--artist-font);
      text-anchor: middle;
      paint-order: stroke;
      stroke: rgba(10, 10, 22, 0.92);
      stroke-width: 3px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #map.names .node .label,
    .node.sel .label,
    .node.hov .label,
    .node.nb .label { opacity: 1; }

    .node .init {
      fill: #fff;
      font: 700 12px "Montserrat", sans-serif;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .hint {
      position: absolute;
      left: 14px;
      bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }

    .replay {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 8px 14px;
      color: #fff;
      font: 700 12px "Montserrat", sans-serif;
      background: rgba(20, 18, 40, 0.8);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
    }

    .side {
      padding: 18px;
      font-family: var(--artist-font);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 22px;
    }

    .side h2 {
      margin-bottom: 12px;
      color: #d4c7ff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .bloc {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 10px 12px;
      color: #fff;
      font-family: var(--artist-font);
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .bloc:hover { background: rgba(255, 255, 255, 0.11); }
    .bloc .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 15px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .bloc small { color: var(--muted); font-size: 12px; }
    .hearts { display: flex; flex-wrap: wrap; gap: 4px; }
    .hearts .heart-img { width: 26px; }

    .who { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .who .heart-img { width: 56px; }
    .who h3 { color: #fff; font-size: 24px; font-weight: 500; line-height: 1.1; }
    .who a { color: #d4c7ff; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

    .kv { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
    .kv b { color: #fff; font-weight: 500; }

    .partner { margin-bottom: 10px; color: #fff; font-size: 15px; }
    .partner .row { display: flex; align-items: center; gap: 8px; }
    .partner .heart-img { width: 26px; }
    .partner .row span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .partner small { display: block; margin: 2px 0 4px 34px; color: var(--muted); font-size: 12px; }
    .bar { height: 5px; margin-left: 34px; background: rgba(255, 255, 255, 0.14); border-radius: 3px; }
    .bar i { display: block; height: 100%; border-radius: 3px; }

    .back {
      margin-top: 10px;
      padding: 8px 14px;
      color: #fff;
      font: 700 12px "Montserrat", sans-serif;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
    }

    .subnav { margin-top: 24px; text-align: center; font-size: 13px; }
    .subnav a { margin: 0 8px; color: #d4c7ff; text-decoration: underline; text-underline-offset: 3px; }

    /* MOBILE */

    @media (max-width: 560px) {
      .site-header {
        padding: 10px 12px;
      }

      .navbar {
        gap: 8px;
      }

      .brand-logo {
        width: 35px;
        height: 35px;
      }

      .nav-pill {
        gap: 2px;
        padding: 4px;
      }

      .nav-link {
        min-height: 35px;
        padding: 0 9px;
        font-size: 0;
      }

      .nav-home {
        width: 35px;
      }

      main {
        width: 92%;
        padding-top: 22px;
        padding-bottom: 60px;
      }
    }

    @media (max-width: 350px) {
      .brand-logo {
        width: 29px;
        height: 29px;
      }

      .nav-link {
        padding: 0 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

  <script src="status-config.js"></script>
  <script>


/* Shows a message on the page instead of leaving it blank if something goes wrong. */
window.addEventListener("error", function (event) {
  var main = document.querySelector("main");
  if (!main || main.dataset.errorShown) return;
  main.dataset.errorShown = "1";
  var note = document.createElement("p");
  note.className = "empty";
  note.textContent = "Something went wrong while loading this page: " + event.message;
  main.prepend(note);
});

/* =========================================================
   Eurovision Rewind - shared helpers
   Used by participants.html, matrix.html and country.html
   (and, if present, by artists.html and results.html for heart flags).

   Keep this file in the same folder as the pages, next to status-config.js.
========================================================= */

(function () {
  "use strict";

  const CFG = window.STATUS_CONFIG || {};
  const configured = Boolean(CFG.dbUrl && CFG.apiKey && !/YOUR-/.test(CFG.dbUrl + CFG.apiKey));
  const BASE = (CFG.dbUrl || "").replace(/\/$/, "");

  /* ---------- Heart flags ----------
     Every country is shown by a heart image. The file is found from the country name:
       "North Macedonia" -> images/hearts/north-macedonia.png
     A different file can be set for any country with participants.html?add (Hearts tab). */

  const HEART_FOLDER = "images/hearts/";
  const HEART_EXT = ".png";

  const VOTE_GROUPS = [
    { key: "jury", label: "Jury" },
    { key: "tele", label: "Televote" }
  ];
  const VOTE_POINTS = [12, 10, 8, 7, 6, 5, 4, 3, 2, 1];

  // Editions that always exist. More can be added with results.html?data.
  const EDITIONS_BASE = [
    { year: 2026, city: "Vienna, Austria" },
    { year: 2027, city: "Zagreb, Croatia" },
    { year: 2028, city: "Yerevan, Armenia" },
    { year: 2029, city: "Zürich, Switzerland" }
  ];

  const listOf = (value) => Array.isArray(value) ? value : Object.values(value || {});

  const same = (a, b) =>
    String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();

  function slug(name) {
    return String(name || "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/&/g, "and")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  function safeImage(value) {
    const text = String(value || "").trim();
    if (!text) return "";
    if (/^data:image\/(png|jpe?g|webp|gif|svg\+xml)[;,]/i.test(text)) return text;
    if (/^https?:\/\//i.test(text)) return text;
    if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return "";
    return text;
  }

  const imageSrc = (value) => {
    const safe = safeImage(value);
    return /^data:/i.test(safe) ? safe : encodeURI(safe).replace(/%25([0-9A-F]{2})/g, "%$1");
  };

  /* ---------- Loading data (cached in the browser, refreshed from the database) ---------- */

  const NODES = {
    hearts: "hearts",
    results: "results-data",
    participants: "participants",
    artists: "artists"
  };

  const store = {};

  function cached(name) {
    if (name in store) return store[name];
    try {
      store[name] = JSON.parse(localStorage.getItem("rw:" + name) || "null");
    } catch (error) {
      store[name] = null;
    }
    return store[name];
  }

  function keep(name, data) {
    store[name] = data;
    try {
      if (data && Object.keys(data).length) localStorage.setItem("rw:" + name, JSON.stringify(data));
      else localStorage.removeItem("rw:" + name);
    } catch (error) { /* storage full or blocked */ }
  }

  function load(name) {
    if (!configured) return Promise.resolve(cached(name));

    return fetch(BASE + "/" + NODES[name] + ".json", { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : null))
      .then((data) => { keep(name, data); return data; })
      .catch(() => cached(name));
  }

  /* ---------- Heart lookups ---------- */

  // Preview a set of heart replacements without saving it in the browser.
  const setHearts = (map) => { store.hearts = map; };

  const heartMap = () => {
    const raw = cached("hearts");
    return raw && typeof raw === "object" ? raw : {};
  };

  // override (a row's own heart) -> the replacement set for this country -> images/hearts/<country>.png
  function heartPath(country, override) {
    return safeImage(override) || safeImage(heartMap()[slug(country)]) || HEART_FOLDER + slug(country) + HEART_EXT;
  }

  // A missing image keeps its space but stays invisible.
  function heartImg(country, className, override) {
    const image = document.createElement("img");
    image.className = className || "heart-img";
    image.src = imageSrc(heartPath(country, override));
    image.alt = "";
    image.decoding = "async";
    image.addEventListener("error", () => { image.style.visibility = "hidden"; });
    return image;
  }

  /* ---------- Results and votes ---------- */

  function cleanVotes(votes) {
    if (!votes) return undefined;
    const out = {};

    VOTE_GROUPS.forEach(({ key }) => {
      const raw = votes[key];
      if (!raw) return;
      const list = listOf(raw);
      const names = VOTE_POINTS.map((_, i) => String(list[i] || "").trim());
      if (names.some(Boolean)) out[key] = names;
    });

    return Object.keys(out).length ? out : undefined;
  }

  function normRow(item) {
    return {
      country: String(item.country),
      points: item.points,
      ...(item.heart ? { heart: String(item.heart) } : {}),
      ...(item.voterOnly ? { voterOnly: true } : {}),
      ...(cleanVotes(item.votes) ? { votes: cleanVotes(item.votes) } : {})
    };
  }

  // { 2028: { city, grand: [rows], rounds: [{ name, rows }] } }
  function normalizeResults(data) {
    const out = {};

    Object.keys(data || {}).forEach((year) => {
      if (!Number.isInteger(Number(year))) return;
      const value = data[year];
      const rows = (list) => listOf(list).filter((item) => item && item.country).map(normRow);

      out[year] = {
        city: value && !Array.isArray(value) && value.city ? String(value.city) : "",
        grand: Array.isArray(value) ? rows(value) : rows(value && value.grand),
        rounds: Array.isArray(value) ? [] : listOf(value && value.rounds)
          .filter((round) => round && round.name)
          .map((round) => ({ name: String(round.name), rows: rows(round.rows) }))
      };
    });

    return out;
  }

  // Points one country gave another. group: "jury", "tele" or "total" (all groups added together).
  function pointsFor(giver, receiver, group) {
    const keys = group === "total" ? VOTE_GROUPS.map((item) => item.key) : [group];
    let sum = 0;

    keys.forEach((key) => {
      const list = (giver.votes && giver.votes[key]) || [];
      const position = list.findIndex((name) => same(name, receiver));
      if (position >= 0) sum += VOTE_POINTS[position];
    });

    return sum;
  }

  const groupsWithVotes = (rows) =>
    VOTE_GROUPS.filter(({ key }) => rows.some((row) => row.votes && row.votes[key]));

  /* ---------- Editions ---------- */

  // Every year that has a name, results or participants.
  function editions(results, participants) {
    const map = new Map(EDITIONS_BASE.map((edition) => [edition.year, edition.city]));

    Object.keys(results || {}).forEach((year) => {
      const city = results[year].city;
      if (city) map.set(Number(year), city);
      else if (!map.has(Number(year))) map.set(Number(year), "");
    });

    Object.keys(participants || {}).forEach((year) => {
      if (Number.isInteger(Number(year)) && !map.has(Number(year))) map.set(Number(year), "");
    });

    return [...map.entries()].map(([year, city]) => ({ year, city })).sort((a, b) => a.year - b.year);
  }

  /* ---------- Participants ---------- */

  function normEntry(item) {
    const number = (value) => (Number.isFinite(Number(value)) && value !== "" && value !== null ? Number(value) : 0);

    return {
      country: String(item.country || "").trim().slice(0, 60),
      artist: String(item.artist || "").trim().slice(0, 80),
      song: String(item.song || "").trim().slice(0, 100),
      semi: String(item.semi || "").trim().slice(0, 40),
      inFinal: item.inFinal === undefined ? true : Boolean(item.inFinal),
      semiOrder: number(item.semiOrder),
      finalOrder: number(item.finalOrder)
    };
  }

  // { 2029: [entries] }
  function normalizeParticipants(data) {
    const out = {};

    Object.keys(data || {}).forEach((year) => {
      if (!Number.isInteger(Number(year))) return;
      const value = data[year];
      const list = listOf(Array.isArray(value) ? value : value && value.entries)
        .filter((item) => item && item.country)
        .map(normEntry);
      if (list.length) out[year] = list;
    });

    return out;
  }

  /* ---------- Demo data (shown only until you publish real results) ---------- */

  const SAMPLE = [
    ["France", 248], ["Ukraine", 177], ["Georgia", 176], ["Armenia", 175],
    ["Spain", 152], ["Albania", 145], ["North Macedonia", 141], ["Poland", 139],
    ["Netherlands", 93], ["Malta", 92], ["Italy", 73], ["Portugal", 73],
    ["Croatia", 70], ["Azerbaijan", 66], ["Cyprus", 50], ["Montenegro", 49]
  ];

  function sampleResults() {
    const names = SAMPLE.map(([name]) => name);
    const hash = (text) => [...text].reduce((sum, char) => sum + char.charCodeAt(0), 0);

    const pick = (name, index, seed) => names
      .filter((other) => other !== name)
      .map((other) => [other, (hash(other) * (index + 3) + seed * 7) % 97])
      .sort((a, b) => a[1] - b[1])
      .slice(0, 10)
      .map(([other]) => other);

    const rows = SAMPLE.map(([country, points], index) =>
      normRow({ country, points, votes: { jury: pick(country, index, 1), tele: pick(country, index, 5) } }));

    return { 2028: { city: "Yerevan, Armenia", grand: rows, rounds: [], sample: true } };
  }

  function sampleParticipants() {
    return {
      2028: SAMPLE.map(([country], index) => normEntry({
        country,
        artist: "Artist",
        song: "Song Title",
        semi: index < 8 ? "Semi-final 1" : "Semi-final 2",
        inFinal: true,
        semiOrder: (index % 8) + 1,
        finalOrder: index + 1
      }))
    };
  }

  /* ---------- Admin sign-in (the same login as the other editors) ---------- */

  const SESSION_KEY = "statusAdminSession";
  let session = null;

  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (error) { session = null; }

  function saveSession(next) {
    session = next;
    if (next) localStorage.setItem(SESSION_KEY, JSON.stringify(next));
    else localStorage.removeItem(SESSION_KEY);
  }

  async function signIn(email, password) {
    const response = await fetch(
      "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + CFG.apiKey,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, returnSecureToken: true })
      }
    );
    const data = await response.json();
    if (!response.ok) throw new Error("Wrong email or password.");

    saveSession({
      email: data.email,
      idToken: data.idToken,
      refreshToken: data.refreshToken,
      expiresAt: Date.now() + Number(data.expiresIn) * 1000
    });
  }

  async function getToken() {
    if (!session) throw new Error("Sign in first.");
    if (session.expiresAt - Date.now() > 60000) return session.idToken;

    const response = await fetch(
      "https://securetoken.googleapis.com/v1/token?key=" + CFG.apiKey,
      {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(session.refreshToken)
      }
    );
    const data = await response.json();

    if (!response.ok) {
      saveSession(null);
      throw new Error("Your session ended. Please sign in again.");
    }

    saveSession({
      ...session,
      idToken: data.id_token,
      refreshToken: data.refresh_token,
      expiresAt: Date.now() + Number(data.expires_in) * 1000
    });

    return session.idToken;
  }

  // Writes a whole node ("participants", "hearts") to the database.
  async function publish(name, payload) {
    const token = await getToken();
    const response = await fetch(BASE + "/" + NODES[name] + ".json?auth=" + encodeURIComponent(token), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      let detail = "";
      try { detail = (await response.json()).error || ""; } catch (error) { detail = ""; }

      throw new Error(
        /permission/i.test(detail)
          ? 'Permission denied. Add the "' + NODES[name] + '" rule in Firebase (see the instructions) and Publish.'
          : "Could not save (error " + response.status + (detail ? ": " + detail : "") + ")."
      );
    }

    keep(name, payload);
  }

  window.RW = {
    configured,
    HEART_FOLDER, HEART_EXT, VOTE_GROUPS, VOTE_POINTS, EDITIONS_BASE,
    listOf, same, slug, safeImage, imageSrc,
    cached, load, keep, setHearts, heartMap, heartPath, heartImg,
    cleanVotes, normRow, normalizeResults, pointsFor, groupsWithVotes,
    editions, normEntry, normalizeParticipants,
    sampleResults, sampleParticipants,
    signedIn: () => Boolean(session),
    userEmail: () => (session && session.email) || "",
    signIn, signOut: () => saveSession(null), publish
  };
})();

  
  </script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const NS = "http://www.w3.org/2000/svg";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const svgEl = (tag, attrs) => {
        const element = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach((key) => element.setAttribute(key, attrs[key]));
        return element;
      };

      const el = (tag, className, text) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      };

      const link = (name) => "country.html?c=" + encodeURIComponent(RW.slug(name));
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      /* ---------- Data ---------- */

      let results = {};
      let usingSample = false;
      let years = [];
      let yearSel = "all";
      let group = "total";

      // Made-up votes with a few friendly groups, used only until real votes are published
      function demoRows() {
        const base = RW.sampleResults()[2028].grand;
        const families = [
          ["Albania", "North Macedonia", "Croatia", "Montenegro"],
          ["Georgia", "Armenia", "Azerbaijan", "Ukraine", "Poland"],
          ["Spain", "Portugal", "France", "Italy"],
          ["Malta", "Cyprus", "Netherlands"]
        ];
        const family = (name) => families.findIndex((list) => list.includes(name));
        const hash = (text) => [...text].reduce((sum, char) => sum + char.charCodeAt(0), 0);

        return base.map((row, index) => {
          const pick = (seed) => base
            .filter((other) => other.country !== row.country)
            .map((other) => [other.country,
              (family(other.country) === family(row.country) ? 60 : 0) + ((hash(other.country) * (index + 3 + seed)) % 23)])
            .sort((a, b) => b[1] - a[1])
            .slice(0, 10)
            .map(([name]) => name);

          return { ...row, votes: { jury: pick(1), tele: pick(4) } };
        });
      }

      function readData() {
        results = RW.normalizeResults(RW.cached("results"));
        const hasVotes = Object.values(results).some((edition) => edition.grand.some((row) => row.votes));

        usingSample = !hasVotes;
        if (usingSample) results = RW.normalizeResults({ 2028: { grand: demoRows(), rounds: [] } });

        years = Object.keys(results).map(Number).filter((y) => results[y].grand.some((row) => row.votes)).sort((a, b) => a - b);
        if (yearSel !== "all" && !years.includes(Number(yearSel))) yearSel = "all";
      }

      const rowSets = () => (yearSel === "all" ? years : [Number(yearSel)]).map((y) => results[y].grand);

      // Points exchanged between every pair of countries
      function exchanges() {
        const names = new Map();
        const dir = new Map();

        rowSets().forEach((rows) => {
          const finalists = rows.filter((row) => !row.voterOnly);
          const remember = (row) => {
            const key = RW.slug(row.country);
            if (!names.has(key)) names.set(key, { name: row.country, heart: row.heart });
            else if (row.heart && !names.get(key).heart) names.get(key).heart = row.heart;
            return key;
          };

          rows.forEach((giver) => {
            const from = remember(giver);
            finalists.forEach((receiver) => {
              const to = remember(receiver);
              if (from === to) return;
              const points = RW.pointsFor(giver, receiver.country, group);
              if (points) dir.set(from + ">" + to, (dir.get(from + ">" + to) || 0) + points);
            });
          });
        });

        const pairs = new Map();
        dir.forEach((points, key) => {
          const [a, b] = key.split(">");
          const id = [a, b].sort().join("+");
          const pair = pairs.get(id) || { a: [a, b].sort()[0], b: [a, b].sort()[1], ab: 0, ba: 0, w: 0 };
          if (a === pair.a) pair.ab += points; else pair.ba += points;
          pair.w += points;
          pairs.set(id, pair);
        });

        return { names, pairs: [...pairs.values()] };
      }

      /* ---------- State of the picture ---------- */

      let W = 800;
      let H = 540;
      let model = { names: new Map(), pairs: [] };
      let minW = 1;
      let nodes = [];               // { key, name, heart, x, y, vx, vy, r, total, fixed, bloc }
      let links = [];               // { a, b, w, ab, ba, el }
      let blocs = [];               // { id, color, members: [nodes] }
      let alpha = 0;
      let frameId = 0;
      let selected = null;          // { type: "node" | "bloc", key }
      let hovered = null;
      const nodeByKey = new Map();
      const svg = $("map");

      function measure() {
        W = clamp(Math.round($("card").clientWidth || 800), 300, 1100);
        H = Math.round(W < 640 ? W * 1.3 : W * 0.66);
        svg.setAttribute("viewBox", "0 0 " + W + " " + H);
        svg.style.aspectRatio = W + " / " + H;
      }

      /* ---------- Blocs: groups of countries that are tied together ---------- */

      function findBlocs() {
        const label = new Map(nodes.map((node, index) => [node.key, index]));
        const neighbours = new Map(nodes.map((node) => [node.key, []]));
        links.forEach((item) => {
          neighbours.get(item.a.key).push([item.b.key, item.w]);
          neighbours.get(item.b.key).push([item.a.key, item.w]);
        });

        // Label propagation, in a fixed (seeded) order so the result is always the same
        let seed = 7;
        const random = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };

        for (let round = 0; round < 30; round += 1) {
          const order = nodes.map((node) => node.key).sort(() => random() - 0.5);
          let changed = false;

          order.forEach((key) => {
            const score = new Map();
            neighbours.get(key).forEach(([other, weight]) => score.set(label.get(other), (score.get(label.get(other)) || 0) + weight));
            if (!score.size) return;

            const top = Math.max(...score.values());
            const choices = [...score.entries()].filter(([, value]) => value === top).map(([id]) => id).sort((a, b) => a - b);
            const next = choices.includes(label.get(key)) ? label.get(key) : choices[0];

            if (next !== label.get(key)) { label.set(key, next); changed = true; }
          });

          if (!changed) break;
        }

        const groups = new Map();
        nodes.forEach((node) => {
          const id = label.get(node.key);
          if (!groups.has(id)) groups.set(id, []);
          groups.get(id).push(node);
        });

        const real = [...groups.values()].filter((members) => members.length > 1)
          .sort((a, b) => b.length - a.length);

        blocs = real.map((members, index) => ({
          id: index,
          color: "hsl(" + Math.round((index * 137.5 + 205) % 360) + " 72% 64%)",
          members
        }));

        nodes.forEach((node) => { node.bloc = null; });
        blocs.forEach((bloc) => bloc.members.forEach((node) => { node.bloc = bloc; }));
      }

      /* ---------- Building the picture ---------- */

      function nodeRadius(total, maxTotal) {
        const scale = W < 520 ? 0.78 : 1;
        return scale * (16 + 17 * Math.sqrt(total / (maxTotal || 1)));
      }

      function autoStrength() {
        const sorted = model.pairs.map((pair) => pair.w).sort((a, b) => b - a);
        const wanted = Math.round(nodes.length * 2.2);
        return sorted.length ? (sorted[Math.min(wanted, sorted.length) - 1] || 1) : 1;
      }

      function makeNodes(entrance) {
        const totals = new Map();
        model.pairs.forEach((pair) => {
          totals.set(pair.a, (totals.get(pair.a) || 0) + pair.w);
          totals.set(pair.b, (totals.get(pair.b) || 0) + pair.w);
        });

        const maxTotal = Math.max(1, ...totals.values());
        const old = new Map(nodeByKey);
        nodeByKey.clear();
        nodes = [];

        [...totals.keys()].sort().forEach((key, index) => {
          const info = model.names.get(key);
          const before = old.get(key);
          const angle = (index / totals.size) * Math.PI * 2;
          const node = before && !entrance ? before : {
            x: W / 2 + Math.cos(angle) * 12, y: H / 2 + Math.sin(angle) * 12, vx: 0, vy: 0
          };

          node.key = key;
          node.name = info.name;
          node.heart = info.heart;
          node.total = totals.get(key);
          node.r = nodeRadius(node.total, maxTotal);
          node.fixed = false;
          nodes.push(node);
          nodeByKey.set(key, node);
        });
      }

      function makeLinks() {
        links = model.pairs
          .filter((pair) => pair.w >= minW && nodeByKey.has(pair.a) && nodeByKey.has(pair.b))
          .map((pair) => ({ a: nodeByKey.get(pair.a), b: nodeByKey.get(pair.b), w: pair.w, ab: pair.ab, ba: pair.ba }));
        findBlocs();
      }

      function drawLinks() {
        const layer = $("edges");
        layer.innerHTML = "";
        const maxW = Math.max(1, ...links.map((item) => item.w));

        links.forEach((item) => {
          const line = svgEl("line", { class: "edge" });
          const same = item.a.bloc && item.a.bloc === item.b.bloc;
          line.setAttribute("stroke", same ? item.a.bloc.color : "rgba(255,255,255,0.34)");
          line.setAttribute("stroke-width", (1.2 + 6.5 * (item.w / maxW)).toFixed(1));

          const title = svgEl("title");
          title.textContent = item.a.name + " ↔ " + item.b.name + ": " + item.w + " points (" +
            item.ab + " + " + item.ba + ")";
          line.append(title);

          item.el = line;
          layer.append(line);
        });
      }

      function drawNodes(entrance) {
        const layer = $("nodes");
        layer.innerHTML = "";

        nodes.forEach((node, index) => {
          const g = svgEl("g", { class: "node" + (entrance ? " enter" : ""), tabindex: "0", role: "button" });
          g.setAttribute("aria-label", node.name + ", " + node.total + " points exchanged");
          g.style.setProperty("--d", index * 28 + "ms");

          const pop = svgEl("g", { class: "pop" });
          const color = node.bloc ? node.bloc.color : "rgba(255,255,255,0.7)";

          pop.append(svgEl("circle", { class: "halo", r: (node.r + 7).toFixed(1), fill: color, opacity: "0.3" }));

          const heartWidth = node.r * 2.15;
          const image = svgEl("image", {
            width: heartWidth.toFixed(1), height: (heartWidth * 0.9).toFixed(1),
            x: (-heartWidth / 2).toFixed(1), y: (-heartWidth * 0.45).toFixed(1),
            preserveAspectRatio: "xMidYMid meet"
          });
          image.setAttribute("href", RW.imageSrc(RW.heartPath(node.name, node.heart)));

          const initials = svgEl("text", { class: "init" });
          initials.textContent = node.name.split(/\s+/).map((part) => part[0]).join("").slice(0, 3).toUpperCase();
          initials.style.display = "none";
          image.addEventListener("error", () => { image.style.display = "none"; initials.style.display = ""; });

          pop.append(image, initials);
          g.append(pop);

          const label = svgEl("text", { class: "label", y: (node.r + 17).toFixed(1) });
          label.textContent = node.name;
          g.append(label);

          bindNode(g, node);
          node.el = g;
          layer.append(g);
        });
      }

      function paint() {
        nodes.forEach((node) => {
          if (node.el) node.el.setAttribute("transform", "translate(" + node.x.toFixed(1) + " " + node.y.toFixed(1) + ")");
        });

        links.forEach((item) => {
          if (!item.el) return;
          item.el.setAttribute("x1", item.a.x.toFixed(1));
          item.el.setAttribute("y1", item.a.y.toFixed(1));
          item.el.setAttribute("x2", item.b.x.toFixed(1));
          item.el.setAttribute("y2", item.b.y.toFixed(1));
        });
      }

      /* ---------- The physics ---------- */

      function tick() {
        alpha *= 0.978;
        const maxW = Math.max(1, ...links.map((item) => item.w));

        // Hearts push each other away
        for (let i = 0; i < nodes.length; i += 1) {
          for (let j = i + 1; j < nodes.length; j += 1) {
            const a = nodes[i];
            const b = nodes[j];
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            const d2 = dx * dx + dy * dy || 0.01;
            const d = Math.sqrt(d2);
            const minimum = a.r + b.r + 16;
            const force = 3200 / d2 + (d < minimum ? (minimum - d) * 0.1 : 0);
            dx /= d; dy /= d;
            a.vx -= dx * force; a.vy -= dy * force;
            b.vx += dx * force; b.vy += dy * force;
          }
        }

        // Bonds pull the two hearts together, harder for bigger exchanges
        links.forEach((item) => {
          const dx = item.b.x - item.a.x;
          const dy = item.b.y - item.a.y;
          const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const strength = item.w / maxW;
          const rest = 60 + 200 * (1 - strength);
          const force = (d - rest) * (0.012 + 0.04 * strength);
          item.a.vx += (dx / d) * force; item.a.vy += (dy / d) * force;
          item.b.vx -= (dx / d) * force; item.b.vy -= (dy / d) * force;
        });

        // Blocs gather around their own centre
        const centres = new Map(blocs.map((bloc) => [bloc.id, {
          x: bloc.members.reduce((sum, node) => sum + node.x, 0) / bloc.members.length,
          y: bloc.members.reduce((sum, node) => sum + node.y, 0) / bloc.members.length
        }]));

        nodes.forEach((node) => {
          node.vx += (W / 2 - node.x) * 0.0035;
          node.vy += (H / 2 - node.y) * 0.0035;

          if (node.bloc) {
            const centre = centres.get(node.bloc.id);
            node.vx += (centre.x - node.x) * 0.006;
            node.vy += (centre.y - node.y) * 0.006;
          }

          if (node.fixed) { node.vx = 0; node.vy = 0; return; }

          node.vx *= 0.78;
          node.vy *= 0.78;
          node.x = clamp(node.x + node.vx * (0.4 + alpha), node.r + 10, W - node.r - 10);
          node.y = clamp(node.y + node.vy * (0.4 + alpha), node.r + 10, H - node.r - 24);
        });
      }

      function frame() {
        frameId = 0;
        tick();
        paint();

        if (alpha < 0.55) $("edges").classList.add("show");
        if (alpha > 0.012 || nodes.some((node) => node.fixed)) frameId = requestAnimationFrame(frame);
      }

      function heat(amount) {
        alpha = Math.max(alpha, amount);
        if (!frameId) frameId = requestAnimationFrame(frame);
      }

      function settleNow() {
        for (let i = 0; i < 320; i += 1) tick();
        paint();
        $("edges").classList.add("show");
      }

      /* ---------- Selecting, hovering and dragging ---------- */

      function refreshHighlight() {
        const focus = selected || (hovered && { type: "node", key: hovered });
        const lit = new Set();
        const linked = new Set();

        if (focus && focus.type === "node") {
          lit.add(focus.key);
          links.forEach((item) => {
            if (item.a.key === focus.key || item.b.key === focus.key) {
              linked.add(item);
              lit.add(item.a.key);
              lit.add(item.b.key);
            }
          });
        }

        if (focus && focus.type === "bloc") {
          const bloc = blocs.find((item) => String(item.id) === String(focus.key));
          if (bloc) {
            bloc.members.forEach((node) => lit.add(node.key));
            links.forEach((item) => { if (lit.has(item.a.key) && lit.has(item.b.key)) linked.add(item); });
          }
        }

        nodes.forEach((node) => {
          node.el.classList.toggle("dim", Boolean(focus) && !lit.has(node.key));
          node.el.classList.toggle("sel", Boolean(focus) && focus.type === "node" && focus.key === node.key);
          node.el.classList.toggle("nb", Boolean(focus) && lit.has(node.key));
          node.el.classList.toggle("hov", false);
        });

        links.forEach((item) => {
          item.el.classList.toggle("hi", Boolean(focus) && linked.has(item));
          item.el.classList.toggle("dim", Boolean(focus) && !linked.has(item));
        });
      }

      function select(next) {
        selected = next;
        refreshHighlight();
        renderSide();
      }

      function toLocal(event) {
        const box = svg.getBoundingClientRect();
        return { x: (event.clientX - box.left) * (W / box.width), y: (event.clientY - box.top) * (H / box.height) };
      }

      function bindNode(g, node) {
        let start = null;

        g.addEventListener("pointerdown", (event) => {
          start = { x: event.clientX, y: event.clientY, moved: false };
          g.setPointerCapture(event.pointerId);
          node.fixed = true;
          heat(0.25);
          event.stopPropagation();
        });

        g.addEventListener("pointermove", (event) => {
          if (!start) return;
          if (Math.hypot(event.clientX - start.x, event.clientY - start.y) > 6) start.moved = true;
          if (!start.moved) return;

          const point = toLocal(event);
          node.x = clamp(point.x, node.r + 6, W - node.r - 6);
          node.y = clamp(point.y, node.r + 6, H - node.r - 6);
          heat(0.3);
        });

        const end = () => {
          if (!start) return;
          const moved = start.moved;
          start = null;
          node.fixed = false;
          if (!moved) select({ type: "node", key: node.key });
          heat(0.2);
        };

        g.addEventListener("pointerup", end);
        g.addEventListener("pointercancel", end);

        g.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select({ type: "node", key: node.key }); }
        });

        g.addEventListener("pointerenter", (event) => {
          if (event.pointerType !== "mouse" || selected) return;
          hovered = node.key;
          refreshHighlight();
        });

        g.addEventListener("pointerleave", () => {
          if (hovered !== node.key) return;
          hovered = null;
          refreshHighlight();
        });
      }

      svg.addEventListener("pointerdown", (event) => {
        if (event.target === svg) select(null);
      });

      /* ---------- The side panel ---------- */

      function heartsOf(list) {
        const row = el("div", "hearts");
        list.forEach((node) => {
          const image = RW.heartImg(node.name, "heart-img", node.heart);
          image.title = node.name;
          row.append(image);
        });
        return row;
      }

      function renderSide() {
        const side = $("side");
        side.innerHTML = "";

        if (selected && selected.type === "node") {
          const node = nodeByKey.get(selected.key);
          if (!node) { selected = null; return renderSide(); }

          const head = el("div", "who");
          head.append(RW.heartImg(node.name, "heart-img", node.heart));
          const text = el("div");
          text.append(el("h3", "", node.name));
          const open = el("a", "", "Open country page");
          open.href = link(node.name);
          text.append(open);
          head.append(text);
          side.append(head);

          const kv = (label, value) => {
            const row = el("div", "kv");
            row.append(el("span", "", label), el("b", "", value));
            return row;
          };

          side.append(kv("Points exchanged", String(node.total)));
          side.append(kv("Bloc", node.bloc ? "Bloc " + (node.bloc.id + 1) + " · " + node.bloc.members.length + " countries" : "Independent"));

          side.append(el("h2", "", "Closest allies"));
          const partners = model.pairs
            .filter((pair) => pair.a === node.key || pair.b === node.key)
            .map((pair) => {
              const other = pair.a === node.key ? pair.b : pair.a;
              const gave = pair.a === node.key ? pair.ab : pair.ba;
              const got = pair.a === node.key ? pair.ba : pair.ab;
              return { key: other, gave, got, w: pair.w };
            })
            .sort((a, b) => b.w - a.w)
            .slice(0, 6);

          const max = partners.length ? partners[0].w : 1;
          partners.forEach((partner) => {
            const info = model.names.get(partner.key);
            const box = el("div", "partner");
            const row = el("div", "row");
            row.append(RW.heartImg(info.name, "heart-img", info.heart), el("span", "", info.name), el("span", "", String(partner.w)));
            box.append(row, el("small", "", "gave " + partner.gave + " · received " + partner.got));
            const bar = el("div", "bar");
            const fill = el("i");
            fill.style.width = Math.max(6, (partner.w / max) * 100) + "%";
            fill.style.background = node.bloc ? node.bloc.color : "#a99bff";
            bar.append(fill);
            box.append(bar);
            side.append(box);
          });

          const back = el("button", "back", "Show all blocs");
          back.type = "button";
          back.addEventListener("click", () => select(null));
          side.append(back);
          return;
        }

        side.append(el("h2", "", "Blocs"));

        if (!blocs.length) {
          side.append(el("p", "kv", "No blocs at this bond strength. Lower the slider to join more countries."));
          return;
        }

        blocs.forEach((bloc) => {
          const item = el("button", "bloc");
          item.type = "button";
          if (selected && selected.type === "bloc" && String(selected.key) === String(bloc.id)) item.style.background = "rgba(255,255,255,0.14)";

          const top = el("div", "top");
          const dot = el("span", "dot");
          dot.style.background = bloc.color;
          top.append(dot, el("span", "", "Bloc " + (bloc.id + 1)));
          item.append(top, heartsOf(bloc.members), el("small", "", bloc.members.length + " countries"));
          item.addEventListener("click", () => select({ type: "bloc", key: bloc.id }));
          side.append(item);
        });

        const alone = nodes.filter((node) => !node.bloc);
        if (alone.length) {
          const item = el("div", "bloc");
          item.append(el("div", "top", "Independent"), heartsOf(alone), el("small", "", alone.length + " countries without a strong bond"));
          side.append(item);
        }
      }

      /* ---------- Controls ---------- */

      function renderControls() {
        $("years").innerHTML = "";
        $("years").hidden = years.length < 2;
        ["all", ...years].forEach((value) => {
          const button = el("button", "", value === "all" ? "All editions" : String(value));
          button.type = "button";
          button.classList.toggle("active", String(value) === String(yearSel));
          button.addEventListener("click", () => { yearSel = value; autoMin = true; build(true); });
          $("years").append(button);
        });

        const rows = rowSets().flat();
        const groups = RW.groupsWithVotes(rows);
        const options = groups.length > 1 ? [{ key: "total", label: "Total" }, ...groups] : groups;
        if (!options.some((item) => item.key === group)) group = options.length ? options[0].key : "total";

        $("groups").innerHTML = "";
        $("groups").hidden = options.length < 2;
        options.forEach((item) => {
          const button = el("button", "", item.label);
          button.type = "button";
          button.classList.toggle("active", item.key === group);
          button.addEventListener("click", () => { group = item.key; autoMin = true; build(true); });
          $("groups").append(button);
        });
      }

      let autoMin = true;

      // (Re)creates the whole picture. `fresh` makes the hearts fly out from the middle again.
      function build(fresh) {
        cancelAnimationFrame(frameId);
        frameId = 0;

        measure();
        renderControls();
        model = exchanges();
        selected = null;
        hovered = null;

        $("empty").hidden = model.pairs.length > 0;
        $("layout").hidden = model.pairs.length === 0;
        $("empty").textContent = "No votes have been published yet. Enter them with results.html?data and this map draws itself.";
        $("badge").hidden = !usingSample;
        if (!model.pairs.length) return;

        makeNodes(fresh);
        if (autoMin) minW = autoStrength();
        autoMin = false;

        const maxW = Math.max(1, ...model.pairs.map((pair) => pair.w));
        $("strength").max = String(maxW);
        $("strength").value = String(Math.min(minW, maxW));
        $("strengthOut").textContent = $("strength").value + "+";

        makeLinks();
        $("edges").classList.remove("show");
        drawLinks();
        drawNodes(fresh);
        renderSide();

        alpha = 1;
        if (reduceMotion) { settleNow(); }
        else { paint(); frameId = requestAnimationFrame(frame); }
      }

      $("strength").addEventListener("input", () => {
        minW = Number($("strength").value);
        $("strengthOut").textContent = minW + "+";
        selected = null;

        makeLinks();
        drawLinks();
        $("edges").classList.add("show");
        nodes.forEach((node) => {
          const halo = node.el.querySelector(".halo");
          halo.setAttribute("fill", node.bloc ? node.bloc.color : "rgba(255,255,255,0.7)");
        });
        refreshHighlight();
        renderSide();
        paint();
        heat(0.6);
      });

      $("names").addEventListener("click", () => {
        const on = $("names").classList.toggle("active");
        $("names").setAttribute("aria-pressed", String(on));
        svg.classList.toggle("names", on);
      });

      $("replay").addEventListener("click", () => build(true));

      // Keep the picture the right size when the window changes
      let resizeTimer = 0;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const oldW = W;
          const oldH = H;
          measure();
          if (Math.abs(W - oldW) < 8 || !nodes.length) return;

          nodes.forEach((node) => { node.x *= W / oldW; node.y *= H / oldH; node.r = nodeRadius(node.total, Math.max(...nodes.map((n) => n.total))); });
          drawNodes(false);
          refreshHighlight();
          heat(0.5);
        }, 200);
      });

      /* ---------- Start ---------- */

      svg.classList.add("names");
      readData();
      build(true);

      Promise.all([RW.load("hearts"), RW.load("results")]).then(() => {
        readData();
        autoMin = true;
        build(true);
      });
    })();

    if (window.lucide) window.lucide.createIcons();
  </script>

</body>
</html>
