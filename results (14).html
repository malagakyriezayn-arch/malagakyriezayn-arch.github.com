    // Stored per year as { grand: [rows], rounds: [{ name, rows }] }.
    // An older plain list of rows is read as the Grand Final.
    function useData(data) {
      savedData = {};
      savedRounds = {};
      savedCities = {};

      Object.keys(data || {}).forEach((year) => {
        const value = data[year];
        if (!Number.isInteger(Number(year))) return;
        if (value && !Array.isArray(value) && value.city) savedCities[year] = String(value.city);

        const grandList = Array.isArray(value) ? value : listOf(value && value.grand);
        const grand = grandList.filter((item) => item && item.country).map(normRow);
        const rounds = Array.isArray(value) ? [] : listOf(value && value.rounds)
          .filter((round) => round && round.name)
          .map((round) => ({
            name: String(round.name),
            rows: listOf(round.rows).filter((item) => item && item.country).map(normRow)
          }));

        if (grand.length) savedData[year] = grand;
        if (rounds.length) savedRounds[year] = rounds;
      });
    }

    // The published value for one year, rebuilt from what is currently saved.
    function savedYearValue(year) {
      const value = {};
      if (savedCities[year]) value.city = savedCities[year];
      if ((savedData[year] || []).length) value.grand = savedData[year];
      if ((savedRounds[year] || []).length) value.rounds = savedRounds[year];
      return Object.keys(value).length ? value : null;
    }

    // The whole database object, with some years replaced: { 2030: value, 2031: null, ... }
    function payloadWithMany(replacements) {
      const years = new Set([
        ...Object.keys(savedData), ...Object.keys(savedRounds), ...Object.keys(savedCities),
        ...Object.keys(replacements)
      ]);
      const out = {};

      years.forEach((key) => {
        const next = key in replacements ? replacements[key] : savedYearValue(key);
        if (next) out[key] = next;
      });

      return out;
    }

    const payloadWith = (year, value) => payloadWithMany({ [year]: value });

    try {
      useData(JSON.parse(localStorage.getItem(DATA_CACHE) || "null"));
    } catch (error) {
      useData(null);
    }

    // Running order comes from the participants page (shared cache with the other pages)
    try {
      usePeople(JSON.parse(localStorage.getItem("rw:participants") || "null"));
    } catch (error) {
      usePeople(null);
    }

    // Re-draw after a background refresh without replaying the intro animation or flashing the board
    function quietRender() {
      board.classList.add("nofx");
      render();
      setTimeout(() => board.classList.remove("nofx"), 900);
    }

    const peopleReady = !configured ? Promise.resolve() : fetch(PEOPLE_URL, { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : null))
      .then((data) => {
        const fresh = JSON.stringify(data);
        let same = false;
        try { same = localStorage.getItem("rw:participants") === fresh; } catch (error) { /* ignore */ }
        if (same) return;
        usePeople(data);
        try { if (data) localStorage.setItem("rw:participants", fresh); } catch (error) { /* not saved */ }
        quietRender();
      })
      .catch(() => {});

    const dataReady = !configured ? Promise.resolve() : fetch(DATA_URL, { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : null))
      .then((data) => {
        const fresh = data ? JSON.stringify(data) : null;
        let same = false;
        try { same = fresh !== null && localStorage.getItem(DATA_CACHE) === fresh; } catch (error) { /* ignore */ }
        if (same) { afterDataLoad(); return; }
        useData(data);
        try {
          if (fresh) localStorage.setItem(DATA_CACHE, fresh);
          else localStorage.removeItem(DATA_CACHE);
        } catch (error) { /* ignore */ }
        quietRender();
        afterDataLoad();
      })
      .catch(() => {});

    /* ---------- Tools: results.html?tune (sizes)  and  results.html?data (points) ---------- */

    const params = new URLSearchParams(location.search);
    const wantsSizes = params.has("tune");
    const wantsData = params.has("data");

    if (wantsSizes || wantsData) {
      document.body.classList.add("tuning");
      if (wantsData) document.body.classList.add("editing");
      $("tuner").hidden = false;

      const note = (text, isError) => {
        $("tuneNote").textContent = text;
        $("tuneNote").classList.toggle("error", Boolean(isError));
      };

      showLogin = () => { $("tuneLogin").hidden = Boolean(session); };

      $("tuneLogin").addEventListener("submit", async (event) => {
        event.preventDefault();
        note("Signing in...");

        try {
          const response = await fetch(
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + CFG.apiKey,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: $("tuneEmail").value.trim(),
                password: $("tunePassword").value,
                returnSecureToken: true
              })
            }
          );
          const data = await response.json();
          if (!response.ok) throw new Error("Wrong email or password.");

          session = {
            email: data.email,
            idToken: data.idToken,
            refreshToken: data.refreshToken,
            expiresAt: Date.now() + Number(data.expiresIn) * 1000
          };
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          $("tunePassword").value = "";
          showLogin();
          note("Signed in. Now press Confirm & publish.");
        } catch (error) {
          note(error.message, true);
        }
      });

      /* Tabs */

      const tools = [];
      if (wantsSizes) tools.push(["sizes", "Sizes", "sizesTool"]);
      if (wantsData) tools.push(["data", "Points", "dataTool"]);

      const tabButtons = {};

      function showTool(id) {
        tools.forEach(([key, , panelId]) => {
          $(panelId).hidden = key !== id;
          tabButtons[key].classList.toggle("active", key === id);
        });
        note("");
      }

      tools.forEach(([key, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab";
        button.textContent = label;
        button.addEventListener("click", () => showTool(key));
        tabButtons[key] = button;
        $("toolTabs").append(button);
      });

      $("toolToggle").addEventListener("click", () => {
        const collapsed = $("tuner").classList.toggle("collapsed");
        $("toolToggle").textContent = collapsed ? "Show" : "Hide";
      });

      /* ----- Sizes tool ----- */

      if (wantsSizes) {
        let changed = {};

        const measure = (name) => {
          const row = board.querySelector(".row");
          if (!row) return 0;

          const sizes = {
            "board-w": document.querySelector(".board-wrap").getBoundingClientRect().width,
            "row-h": row.getBoundingClientRect().height,
            "row-gap": parseFloat(getComputedStyle(board).rowGap) || 0,
            "col-gap": parseFloat(getComputedStyle(board).columnGap) || 0,
            "rank-w": row.querySelector(".rank").getBoundingClientRect().width,
            "points-w": row.querySelector(".points").getBoundingClientRect().width,
            "flag-w": (row.querySelector(".flag") || row).getBoundingClientRect().width,
            "font-size": parseFloat(getComputedStyle(row).fontSize),
            "cell-gap": parseFloat(getComputedStyle(row).columnGap) || 0,
            "name-pad": parseFloat(getComputedStyle(row.querySelector(".name")).paddingLeft) || 0,
            "row-radius": parseFloat(getComputedStyle(row.querySelector(".rank")).borderTopLeftRadius) || 0
          };

          return Math.round(sizes[name]);
        };

        const toHex = (value) => {
          const v = String(value || "").trim();
          if (/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase();
          if (/^#[0-9a-f]{3}$/i.test(v)) return "#" + v.slice(1).split("").map((c) => c + c).join("").toLowerCase();
          return "#000000";
        };

        const heading = (text) => {
          const h = document.createElement("h4");
          h.className = "tune-h";
          h.textContent = text;
          return h;
        };

        function buildSliders() {
          const host = $("tuneRows");
          host.textContent = "";
          $("tuneMode").textContent =
            "Editing the " + (mode() === "mobile" ? "phone" : "desktop") + " layout · colours apply to both";

          // Colour themes
          host.append(heading("Themes"));
          const bar = document.createElement("div");
          bar.className = "preset-bar";
          PRESETS.forEach((preset) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "preset";
            button.title = preset.name;
            const dots = ["board-bg", "rank-bg", "name-bg"].map((k) => '<i style="background:' + preset.colors[k] + '"></i>').join("");
            button.innerHTML = '<span class="dots">' + dots + "</span><b>" + preset.name + "</b>";
            button.addEventListener("click", () => {
              Object.entries(preset.colors).forEach(([name, value]) => {
                document.documentElement.style.setProperty("--" + name, value);
                changed[name] = value;
              });
              buildSliders();
              note("Previewing the " + preset.name + " theme. Press Confirm & publish to save for everyone.");
            });
            bar.append(button);
          });
          host.append(bar);

          // Sizes
          host.append(heading("Sizes"));
          SIZE_VARS.forEach(([name, label, min, max]) => {
            const wrap = document.createElement("label");
            wrap.className = "tune-row";

            const text = document.createElement("span");
            text.textContent = label;

            const input = document.createElement("input");
            input.type = "range";
            input.min = min;
            input.max = max;

            const output = document.createElement("output");
            const start = Math.min(max, Math.max(min, measure(name)));
            input.value = start;
            output.textContent = start + "px";

            // Moving a slider is the live preview. Nothing is saved yet.
            input.addEventListener("input", () => {
              document.documentElement.style.setProperty("--" + name, input.value + "px");
              output.textContent = input.value + "px";
              changed[name] = input.value + "px";
              note("Previewing. Press Confirm & publish to save for everyone.");
            });

            wrap.append(text, input, output);
            host.append(wrap);
          });

          // Colours
          host.append(heading("Colours"));
          const grid = document.createElement("div");
          grid.className = "color-grid";
          COLOR_VARS.forEach(([name, label]) => {
            const wrap = document.createElement("label");
            wrap.className = "color-row";

            const text = document.createElement("span");
            text.textContent = label;

            const input = document.createElement("input");
            input.type = "color";
            input.value = toHex(getComputedStyle(document.documentElement).getPropertyValue("--" + name));

            const output = document.createElement("output");
            output.textContent = input.value;

            input.addEventListener("input", () => {
              document.documentElement.style.setProperty("--" + name, input.value);
              output.textContent = input.value;
              changed[name] = input.value;
              note("Previewing. Press Confirm & publish to save for everyone.");
            });

            wrap.append(input, text, output);
            grid.append(wrap);
          });
          host.append(grid);
        }

        $("tuneConfirm").addEventListener("click", async () => {
          if (!configured) return note("Fill in status-config.js first.", true);
          if (!session) { showLogin(); return note("Sign in below, then press Confirm again.", true); }
          if (!Object.keys(changed).length) return note("Nothing to publish yet. Move a slider first.");

          note("Publishing...");

          try {
            const next = {
              desktop: { ...savedStyle.desktop },
              mobile: { ...savedStyle.mobile }
            };
            const colorChanged = {};
            const sizeChanged = {};
            Object.keys(changed).forEach((key) => { (isColorVar(key) ? colorChanged : sizeChanged)[key] = changed[key]; });
            const other = mode() === "mobile" ? "desktop" : "mobile";
            next[mode()] = { ...next[mode()], ...sizeChanged, ...colorChanged };
            next[other] = { ...next[other], ...colorChanged };

            await publish(STYLE_URL, next);
            savedStyle = next;
            localStorage.setItem(STYLE_CACHE, JSON.stringify(next));
            changed = {};
            note("Published. Everyone sees the new sizes now.");
          } catch (error) {
            note(error.message, true);
          }
        });

        $("tuneUndo").addEventListener("click", () => {
          changed = {};
          applySaved();
          buildSliders();
          note("Back to the last published sizes.");
        });

        $("tuneReset").addEventListener("click", async () => {
          if (!configured) return note("Fill in status-config.js first.", true);
          if (!session) { showLogin(); return note("Sign in below, then press Reset again.", true); }

          note("Resetting...");

          try {
            const strip = (o) => Object.fromEntries(Object.entries(o || {}).filter(([k]) => !isColorVar(k)));
            const next = { desktop: strip(savedStyle.desktop), mobile: strip(savedStyle.mobile) };
            next[mode()] = {};
            await publish(STYLE_URL, next);
            savedStyle = next;
            localStorage.setItem(STYLE_CACHE, JSON.stringify(next));
            changed = {};
            applySaved();
            buildSliders();
            note("Reset. This layout is back to the default sizes.");
          } catch (error) {
            note(error.message, true);
          }
        });

        stylesReady.then(buildSliders);
      }

      /* ----- Points tool ----- */

      if (wantsData) {
        const editionNow = () => allEditions().find((item) => item.year === currentYear());

        const applyDataFilter = () => {
          const wanted = slug($("dataFilter").value);
          $("dataRows").querySelectorAll(".data-item").forEach((box) => {
            const field = box.querySelector(".data-country");
            box.hidden = Boolean(wanted) && !slug(field ? field.value : "").includes(wanted);
          });
        };
        $("dataFilter").addEventListener("input", applyDataFilter);
        new MutationObserver(applyDataFilter).observe($("dataRows"), { childList: true });
        let voteGroup = VOTE_GROUPS[0].key;
        const openVotes = new Set();
        const openStatus = new Set();

        const presetList = document.createElement("datalist");
        presetList.id = "statusPresets";
        Object.keys(STATUS_COLORS).forEach((name) => presetList.append(new Option(name)));
        document.body.append(presetList);

        const copyRows = (rows) => rows.map((item) => ({
          country: item.country,
          points: item.points,
          ...(item.voterOnly ? { voterOnly: true } : {}),
          ...votingProp(item),
          ...(item.heart ? { heart: item.heart } : {}),
          ...statusProp(item),
          ...(item.votes ? { votes: JSON.parse(JSON.stringify(item.votes)) } : {})
        }));

        function editorDataKey(edition = editionNow()) {
          return activeRound === "Grand Final" ? String(edition.year) : roundDataKey(edition.year, activeRound);
        }

        function draft() {
          const edition = editionNow();
          const key = editorDataKey(edition);
          if (!drafts[key]) drafts[key] = copyRows(roundRows(edition, activeRound));
          return drafts[key];
        }

        function cleanRows(rows) {
          return rows
            .filter((item) => String(item.country).trim())
            .map((item) => {
              const points = Number(item.points);
              const votes = cleanVotes(item.votes);

              return {
                country: String(item.country).trim(),
                points: item.points !== "" && Number.isFinite(points) ? points : 0,
                ...(String(item.heart || "").trim() ? { heart: String(item.heart).trim() } : {}),
                ...(item.voterOnly ? { voterOnly: true } : {}),
                ...votingProp(item),
                ...statusProp(item),
                ...(votes ? { votes } : {})
              };
            });
        }

        function makeInput(className, value, placeholder, type) {
          const input = document.createElement("input");
          input.className = className;
          input.type = type || "text";
          input.value = value === undefined || value === null ? "" : value;
          input.placeholder = placeholder || "";
          if (type === "number") input.inputMode = "numeric";
          return input;
        }

        function makeButton(label, action, title) {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.action = action;
          button.textContent = label;
          button.title = title;
          button.setAttribute("aria-label", title);
          return button;
        }

        function buildGroupButtons() {
          $("voteGroups").innerHTML = "";
          $("voteGroups").hidden = VOTE_GROUPS.length < 2;

          const label = document.createElement("span");
          label.textContent = "Votes you are editing:";
          $("voteGroups").append(label);

          VOTE_GROUPS.forEach(({ key, label: text }) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "tab" + (key === voteGroup ? " active" : "");
            button.textContent = text;
            button.addEventListener("click", () => {
              voteGroup = key;
              buildEditor();
            });
            $("voteGroups").append(button);
          });
        }

        function buildVotesEditor(item, rows) {
          const box = document.createElement("div");
          box.className = "votes-editor";

          const title = document.createElement("h4");
          const groupLabel = VOTE_GROUPS.find((group) => group.key === voteGroup).label;
          const text = document.createElement("span");
          text.textContent = "Points given by " + item.country + " · " + groupLabel;
          const clear = makeButton("Clear", "clear-votes", "Clear these votes");
          title.append(text, clear);

          const grid = document.createElement("div");
          grid.className = "votes-grid";

          const names = [...new Set(rows
            .filter((row) => !row.voterOnly)
            .map((row) => String(row.country).trim())
            .filter((name) => name && !same(name, item.country)))];

          const current = (item.votes && item.votes[voteGroup]) || [];

          VOTE_POINTS.forEach((points, position) => {
            const wrap = document.createElement("label");
            wrap.className = "vote-pick";

            const value = document.createElement("span");
            value.textContent = points;

            const select = document.createElement("select");
            select.dataset.position = position;
            select.append(new Option("-", ""));
            names.forEach((name) => select.append(new Option(name, name)));

            const chosen = current[position] || "";
            if (chosen && !names.some((name) => same(name, chosen))) select.append(new Option(chosen, chosen));
            select.value = chosen;

            wrap.append(value, select);
            grid.append(wrap);
          });

          // A country that does not vote in this group has nothing to enter here
          if (!mayVote(item, voteGroup)) {
            const note = document.createElement("p");
            note.className = "data-note";
            note.textContent = (item.country || "This country") + " votes by " +
              (votesVia(item) === "jury" ? "jury only" : "televote only") + ", so there are no " + groupLabel + " points to enter.";
            box.append(title, note);
            return box;
          }

          box.append(title, grid);
          return box;
        }

        function buildStatusEditor(item) {
          const box = document.createElement("div");
          box.className = "votes-editor status-editor";

          const title = document.createElement("h4");
          const text = document.createElement("span");
          text.textContent = "Statuses of " + item.country;
          title.append(text, makeButton("Clear", "status-clear", "Remove all statuses"));
          box.append(title);

          (item.statuses || []).forEach((status, i) => {
            const line = document.createElement("div");
            line.className = "status-line";
            line.dataset.si = i;

            const name = makeInput("status-text", status.text, "Status, e.g. Host");
            name.setAttribute("list", "statusPresets");

            const color = document.createElement("input");
            color.type = "color";
            color.className = "status-color";
            color.title = "Pill colour";
            color.value = statusColor(status);

            const mode = document.createElement("span");
            mode.className = "status-mode";
            mode.textContent = isHex(status.color) ? "custom colour" : "auto colour";

            line.append(
              name, color, mode,
              makeButton("Auto", "status-auto", "Use the colour that belongs to this status name"),
              statusPill({ ...status, text: status.text || "Preview" }),
              makeButton("✕", "status-remove", "Remove this status")
            );
            box.append(line);
          });

          const add = makeButton("+ Add status", "status-add", "Add a status");
          box.append(add);

          const presets = document.createElement("div");
          presets.className = "status-presets";
          const label = document.createElement("span");
          label.textContent = "Quick add:";
          presets.append(label);

          Object.keys(STATUS_COLORS).forEach((name) => {
            const chip = statusPill({ text: name }, "button");
            chip.type = "button";
            chip.dataset.action = "status-preset";
            chip.dataset.preset = name;
            presets.append(chip);
          });

          box.append(presets);
          return box;
        }

        function buildEditor() {
          const edition = editionNow();
          const rows = roundRows(edition, activeRound);
          const key = editorDataKey(edition);

          $("editCity").value = edition.city;

          $("dataMode").textContent =
            "Editing " + edition.year + " · " + activeRound +
            (drafts[key] ? " · unpublished changes" : "") +
            " · switch round above to edit another result set";

          buildGroupButtons();
          $("dataRows").innerHTML = "";

          const orderedIndices = rows
            .map((item, index) => ({ item, index }))
            .sort((a, b) => Number(Boolean(a.item.voterOnly)) - Number(Boolean(b.item.voterOnly)) || a.index - b.index);
          let addedVoterHeading = false;
          let finalistRank = 0;

          orderedIndices.forEach(({ item, index }) => {
            if (!item.voterOnly) finalistRank += 1;
            if (item.voterOnly && !addedVoterHeading) {
              const heading = document.createElement("h3");
              heading.className = "data-category-title";
              heading.textContent = "Additional voters";
              $("dataRows").append(heading);
              addedVoterHeading = true;
            }

            const wrapper = document.createElement("div");
            wrapper.className = "data-item";
            wrapper.dataset.index = index;

            const line = document.createElement("div");
            line.className = "data-row";

            const rank = document.createElement("span");
            rank.className = "data-rank";
            rank.textContent = item.voterOnly ? "V" : String(finalistRank).padStart(2, "0");

            const buttons = document.createElement("span");
            buttons.className = "data-btns";
            buttons.append(
              makeButton(item.voterOnly ? "Voter only" : "Finalist", "toggle-voter", "Toggle between finalist and voting-only participant"),
              makeButton("↑", "up", "Move up"),
              makeButton("↓", "down", "Move down"),
              makeButton(votesVia(item) === "both" ? "Jury + tele" : votingLabel(item), "voting",
                "How this country votes: jury and televote, jury only, or televote only (click to change)"),
              makeButton("Votes", "votes", "Edit the points this country gave"),
              makeButton(
                cleanStatuses(item.statuses).length ? "Status (" + cleanStatuses(item.statuses).length + ")" : "Status",
                "status",
                "Edit this country's statuses and pill colours"
              ),
              makeButton("✕", "remove", "Remove row")
            );

            line.append(
              rank,
              makeInput("data-country", item.country, "Country"),
              makeInput("data-points", item.points, "Points", "number"),
              makeInput("data-heart", item.heart || "", flagSrc(item)),
              buttons
            );

            wrapper.append(line);

            if (item.country && openVotes.has(item.country.trim().toLowerCase())) {
              wrapper.append(buildVotesEditor(item, rows));
            }

            if (item.country && openStatus.has(item.country.trim().toLowerCase())) {
              wrapper.append(buildStatusEditor(item));
            }

            $("dataRows").append(wrapper);
          });
        }

        const indexOf = (element) => Number(element.closest(".data-item").dataset.index);

        // Remember the name before it is edited, so votes that mention it can follow a rename.
        $("dataRows").addEventListener("focusin", (event) => {
          if (event.target.classList.contains("data-country")) {
            event.target.dataset.previous = event.target.value;
          }
        });

        $("dataRows").addEventListener("input", (event) => {
          const statusLine = event.target.closest(".status-line");

          if (statusLine) {
            const item = draft()[indexOf(event.target)];
            const status = item.statuses[Number(statusLine.dataset.si)];

            if (event.target.classList.contains("status-text")) {
              status.text = event.target.value;
            } else if (event.target.classList.contains("status-color")) {
              status.color = event.target.value;
              statusLine.querySelector(".status-mode").textContent = "custom colour";
            }

            // Without a picked colour, the colour follows the status name.
            if (!isHex(status.color)) statusLine.querySelector(".status-color").value = statusColor(status);

            paintStatus(statusLine.querySelector(".spill"), { ...status, text: status.text || "Preview" });
            render();
            note("Previewing. Press Confirm & publish to save for everyone.");
            return;
          }

          if (!event.target.closest(".data-row")) return;

          const line = event.target.closest(".data-row");
          const item = draft()[indexOf(event.target)];
          const field = event.target;

          if (field.classList.contains("data-country")) {
            item.country = field.value;
            line.querySelector(".data-heart").placeholder = flagSrc(item);
          } else if (field.classList.contains("data-points")) {
            item.points = field.value === "" ? "" : Number(field.value);
          } else if (field.classList.contains("data-heart")) {
            if (field.value.trim()) item.heart = field.value.trim();
            else delete item.heart;
          }

          render();
          note("Previewing. Press Confirm & publish to save for everyone.");
        });

        $("dataRows").addEventListener("change", (event) => {
          const field = event.target;

          // A country was renamed: update every vote that named it.
          if (field.classList.contains("data-country")) {
            const before = (field.dataset.previous || "").trim();
            const after = field.value.trim();

            if (before && after && !same(before, after)) {
              draft().forEach((row) => {
                Object.values(row.votes || {}).forEach((list) => {
                  list.forEach((name, i) => { if (same(name, before)) list[i] = after; });
                });
              });
              openVotes.delete(before.toLowerCase());
              openVotes.add(after.toLowerCase());
              if (openStatus.delete(before.toLowerCase())) openStatus.add(after.toLowerCase());
            }

            buildEditor();
            render();
            return;
          }

          // A vote was picked
          if (field.matches(".vote-pick select")) {
            const item = draft()[indexOf(field)];
            item.votes = item.votes || {};
            item.votes[voteGroup] = item.votes[voteGroup] || VOTE_POINTS.map(() => "");
            item.votes[voteGroup][Number(field.dataset.position)] = field.value;

            const picked = item.votes[voteGroup].filter(Boolean);
            const repeated = picked.length !== new Set(picked.map((name) => name.toLowerCase())).size;

            render();
            note(
              repeated
                ? item.country + " has given points to the same country twice."
                : "Previewing. Press Confirm & publish to save for everyone.",
              repeated
            );
          }
        });

        $("dataRows").addEventListener("click", (event) => {
          const button = event.target.closest("button[data-action]");
          if (!button) return;

          const index = indexOf(button);
          const rows = draft();
          const action = button.dataset.action;

          if (action === "remove") rows.splice(index, 1);
          if (action === "toggle-voter") rows[index].voterOnly = !rows[index].voterOnly;

          if (action === "voting") {
            const next = { both: "jury", jury: "tele", tele: "both" }[votesVia(rows[index])];
            if (next === "both") delete rows[index].voting;
            else rows[index].voting = next;
          }

          if (action === "up" || action === "down") {
            const step = action === "up" ? -1 : 1;
            let other = index + step;
            while (rows[other] && Boolean(rows[other].voterOnly) !== Boolean(rows[index].voterOnly)) other += step;
            if (rows[other]) [rows[other], rows[index]] = [rows[index], rows[other]];
          }

          if (action === "votes") {
            const key = String(rows[index].country || "").trim().toLowerCase();
            if (!key) return note("Type the country name first.");
            if (openVotes.has(key)) openVotes.delete(key);
            else openVotes.add(key);
          }

          if (action === "status") {
            const key = String(rows[index].country || "").trim().toLowerCase();
            if (!key) return note("Type the country name first.");
            if (openStatus.has(key)) openStatus.delete(key);
            else {
              openStatus.add(key);
              if (!(rows[index].statuses || []).length) rows[index].statuses = [{ text: "" }];
            }
          }

          if (action.startsWith("status-")) {
            const item = rows[index];
            item.statuses = item.statuses || [];
            const line = button.closest(".status-line");
            const si = line ? Number(line.dataset.si) : -1;

            if (action === "status-add") item.statuses.push({ text: "" });
            if (action === "status-clear") item.statuses = [];
            if (action === "status-remove") item.statuses.splice(si, 1);
            if (action === "status-auto") delete item.statuses[si].color;
            if (action === "status-preset" && !item.statuses.some((st) => same(st.text, button.dataset.preset))) {
              const blank = item.statuses.findIndex((st) => !String(st.text || "").trim());
              if (blank >= 0) item.statuses[blank] = { text: button.dataset.preset };
              else item.statuses.push({ text: button.dataset.preset });
            }
          }

          if (action === "clear-votes") {
            if (rows[index].votes) delete rows[index].votes[voteGroup];
          }

          buildEditor();
          render();
        });

        $("dataAdd").addEventListener("click", () => {
          draft().push({ country: "", points: 0 });
          buildEditor();
          render();

          const countries = $("dataRows").querySelectorAll(".data-country");
          countries[countries.length - 1].focus();
        });

        $("dataAddVoter").addEventListener("click", () => {
          draft().push({ country: "", points: 0, voterOnly: true });
          buildEditor(); render();
          const fields = $("dataRows").querySelectorAll(".data-country");
          fields[fields.length - 1].focus();
          note("Added a voting-only participant. They can cast votes without appearing in the finalist scoreboard.");
        });

        const sameName = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

        function askSubsetName(question, start) {
          const label = prompt(question, start || "");
          if (!label || !label.trim()) return "";

          const name = label.trim();
          const taken = ["Grand Final", ...roundNames(editionNow().year)];
          if (taken.some((item) => sameName(item, name) && !sameName(item, start || ""))) {
            note("That name is already used in this edition.", true);
            return "";
          }
          return name;
        }

        $("dataAddSubset").addEventListener("click", () => {
          const name = askSubsetName("Enter a subset name (for example, Semifinal 1):");
          if (!name) return;

          const year = editionNow().year;
          draftRounds[year] = [...roundNames(year), name];
          selectRound(name);
          render();
          buildEditor();
          note(name + " added. Add its countries, then press Confirm & publish to share it.");
        });

        $("dataRenameSubset").addEventListener("click", () => {
          if (activeRound === "Grand Final") return note("The Grand Final cannot be renamed.", true);

          const year = editionNow().year;
          const name = askSubsetName("Rename this subset:", activeRound);
          if (!name || name === activeRound) return;

          const oldKey = roundDataKey(year, activeRound);
          const newKey = roundDataKey(year, name);

          // Carry the rows over to the new name.
          if (drafts[oldKey]) {
            drafts[newKey] = drafts[oldKey];
            delete drafts[oldKey];
          } else if (savedRoundRows(year, activeRound).length) {
            drafts[newKey] = copyRows(savedRoundRows(year, activeRound));
          }

          draftRounds[year] = roundNames(year).map((item) => (sameName(item, activeRound) ? name : item));
          selectRound(name);
          render();
          buildEditor();
          note("Renamed. Press Confirm & publish to share the new name.");
        });

        $("dataDeleteSubset").addEventListener("click", () => {
          if (activeRound === "Grand Final") return note("The Grand Final cannot be deleted.", true);
          if (!confirm('Delete "' + activeRound + '" and its results?')) return;

          const year = editionNow().year;
          const removed = activeRound;
          delete drafts[roundDataKey(year, removed)];
          draftRounds[year] = roundNames(year).filter((item) => !sameName(item, removed));
          selectRound("Grand Final");
          render();
          buildEditor();
          note(removed + " removed. Press Confirm & publish to remove it for everyone.");
        });

        // Countries from the subsets that are not in the Grand Final become voters only.
        $("dataNonQ").addEventListener("click", () => {
          if (activeRound !== "Grand Final") return note("Open the Grand Final first, then add the countries that did not qualify.");

          const edition = editionNow();
          const rows = draft();
          const known = new Set(rows.map((row) => String(row.country).trim().toLowerCase()));
          let added = 0;

          roundNames(edition.year).forEach((name) => {
            roundRows(edition, name).filter((item) => !item.voterOnly).forEach((item) => {
              const country = String(item.country).trim();
              if (!country || known.has(country.toLowerCase())) return;

              known.add(country.toLowerCase());
              rows.push({ country, points: 0, voterOnly: true, ...(item.heart ? { heart: item.heart } : {}) });
              added += 1;
            });
          });

          buildEditor();
          render();
          note(added
            ? added + " non-qualifying " + (added === 1 ? "country" : "countries") + " added as voters. Open Votes to enter their points."
            : "Every country from the subsets is already in the Grand Final.");
        });

        $("dataSort").addEventListener("click", () => {
          const all = draft();
          const sorted = all.filter((row) => !row.voterOnly)
            .sort((a, b) => (Number(b.points) || 0) - (Number(a.points) || 0));
          all.splice(0, all.length, ...sorted, ...all.filter((row) => row.voterOnly));
          buildEditor();
          render();
          note("Sorted by points. Tied countries keep their order.");
        });

        // Add up the points every country received (all vote groups) and use them as the totals.
        $("dataCalc").addEventListener("click", () => {
          const rows = draft();

          if (!groupsWithVotes(rows).length) return note("There are no votes to add up yet.", true);

          rows.filter((row) => !row.voterOnly).forEach((row) => {
            let sum = 0;

            rows.forEach((giver) => {
              VOTE_GROUPS.forEach(({ key }) => {
                const list = (giver.votes && giver.votes[key]) || [];
                VOTE_POINTS.forEach((points, position) => {
                  if (same(list[position], row.country)) sum += points;
                });
              });
            });

            row.points = sum;
          });

          buildEditor();
          render();
          note("Points now match the votes. Use Sort by points if the order changed.");
        });

        $("dataAddEdition").addEventListener("click", () => {
          const year = Number($("newYear").value);
          const city = $("newCity").value.trim();

          if (!Number.isInteger(year) || year < 1956 || year > 2100) return note("Enter a year between 1956 and 2100.", true);
          if (!city) return note("Enter the host city and country, for example Brussels, Belgium.", true);
          if (allEditions().some((item) => item.year === year)) return note(year + " already exists.", true);

          draftCities[year] = city;
          $("newYear").value = "";
          $("newCity").value = "";
          goToYear(year);
          render();
          buildEditor();
          note("Edition " + year + " added. Add its results, then press Confirm & publish to share it.");
        });

        $("dataSaveCity").addEventListener("click", () => {
          const edition = editionNow();
          const city = $("editCity").value.trim();

          if (!city) return note("Enter the host city and country.", true);

          draftCities[edition.year] = city;
          render();
          buildEditor();
          note("City updated. Press Confirm & publish to share it.");
        });

        $("dataDeleteEdition").addEventListener("click", () => {
          const edition = editionNow();

          if (EDITIONS.some((item) => item.year === edition.year)) {
            return note("Editions written in results.html can't be deleted here. Remove them from the EDITIONS list in the file.", true);
          }
          if (!confirm("Delete the " + edition.year + " edition and all of its results?")) return;

          pendingKeys(edition.year).forEach((key) => delete drafts[key]);
          delete draftRounds[edition.year];
          draftCities[edition.year] = null;
          goToYear(currentYear());
          render();
          buildEditor();
          note(edition.year + " removed. Press Confirm & publish to remove it for everyone.");
        });

        // Everything still unpublished for one edition.
        function pendingKeys(year) {
          return Object.keys(drafts).filter((key) =>
            key === String(year) || key.startsWith("resultsRoundData:" + year + ":"));
        }

        // Every edition with unpublished changes (including an added or deleted edition).
        function pendingYears() {
          const years = new Set([...Object.keys(draftCities), ...Object.keys(draftRounds)]);

          Object.keys(drafts).forEach((key) => {
            const match = key.match(/^resultsRoundData:(\d+):/);
            years.add(match ? match[1] : key);
          });

          return [...years].filter((year) => /^\d+$/.test(year)).map(Number);
        }

        function clearDrafts(year) {
          pendingKeys(year).forEach((key) => delete drafts[key]);
          delete draftRounds[year];
          delete draftCities[year];
        }

        // The value to publish: the Grand Final and every subset, drafts included.
        function draftYearValue(year) {
          const city = String(year) in draftCities ? draftCities[year] : savedCities[year];
          if (city === null) return null; // the added edition was deleted

          const grand = drafts[year] ? cleanRows(drafts[year]) : (savedData[year] || []);
          const rounds = roundNames(year).map((name) => {
            const key = roundDataKey(year, name);
            return { name, rows: drafts[key] ? cleanRows(drafts[key]) : savedRoundRows(year, name) };
          });

          const value = {};
          if (city) value.city = city;
          if (grand.length) value.grand = grand;
          if (rounds.length) value.rounds = rounds;
          return Object.keys(value).length ? value : null;
        }

        function applyYear(year, value, payload) {
          if (value && value.grand) savedData[year] = value.grand;
          else delete savedData[year];

          if (value && value.rounds) savedRounds[year] = value.rounds;
          else delete savedRounds[year];

          if (value && value.city) savedCities[year] = value.city;
          else delete savedCities[year];

          localStorage.setItem(DATA_CACHE, JSON.stringify(payload));
        }

        function forgetLocalSubsets(year) {
          Object.keys(localStorage)
            .filter((key) => key === "resultsRounds:" + year || key.startsWith("resultsRoundData:" + year + ":"))
            .forEach((key) => localStorage.removeItem(key));
        }

        // Subsets that older versions saved only in this browser: offer them for publishing.
        const importedYears = new Set();

        function importLocalSubsets() {
          const year = editionNow().year;
          if (importedYears.has(year)) return;
          importedYears.add(year);

          if (draftRounds[year] || (savedRounds[year] || []).length) return;

          let names = [];
          try { names = JSON.parse(localStorage.getItem("resultsRounds:" + year) || "[]"); } catch (error) { names = []; }
          if (!Array.isArray(names) || !names.length) return;

          draftRounds[year] = names;
          names.forEach((name) => {
            try {
              const rows = JSON.parse(localStorage.getItem(roundDataKey(year, name)) || "[]");
              if (Array.isArray(rows) && rows.length) drafts[roundDataKey(year, name)] = rows;
            } catch (error) { /* ignore */ }
          });

          buildEditor();
          render();
          note("Found " + names.length + " subset(s) saved only on this browser. Press Confirm & publish to share them.");
        }

        $("dataUndo").addEventListener("click", () => {
          pendingYears().forEach(clearDrafts);

          const inUrl = Number(new URLSearchParams(location.search).get("edition") || location.hash.replace("#", "").split("/")[0]);
          if (inUrl && !allEditions().some((item) => item.year === inUrl)) goToYear(currentYear());
          if (!["Grand Final", ...roundNames(currentYear())].includes(activeRound)) selectRound("Grand Final");

          buildEditor();
          render();
          note("Discarded all unpublished changes.");
        });

        $("dataConfirm").addEventListener("click", async () => {
          const years = pendingYears();

          if (!years.length) return note("Nothing to publish yet. Add or edit a row first.");
          if (!configured) return note("Fill in status-config.js first.", true);
          if (!session) { showLogin(); return note("Sign in below, then press Confirm again.", true); }

          const values = {};
          years.forEach((year) => { values[year] = draftYearValue(year); });
          const payload = payloadWithMany(values);

          note("Publishing...");

          try {
            await publish(DATA_URL, payload);

            years.forEach((year) => {
              applyYear(year, values[year], payload);
              clearDrafts(year);
              forgetLocalSubsets(year);
            });

            buildEditor();
            render();
            note("Published. Everyone sees the changes now.");
          } catch (error) {
            note(error.message, true);
          }
        });

        // Reset this round: the Grand Final goes back to the rows in the file;
        // a subset is emptied (use Delete subset to remove it completely).
        $("dataReset").addEventListener("click", async () => {
          const edition = editionNow();
          const year = edition.year;

          if (!configured) return note("Fill in status-config.js first.", true);
          if (!session) { showLogin(); return note("Sign in below, then press Reset again.", true); }

          const saved = savedYearValue(year) || {};
          const value = { ...saved };

          if (activeRound === "Grand Final") {
            delete value.grand;
          } else if (saved.rounds) {
            value.rounds = saved.rounds.map((round) => (sameName(round.name, activeRound) ? { name: round.name, rows: [] } : round));
          }

          const next = Object.keys(value).length ? value : null;
          const payload = payloadWith(year, next);

          note("Resetting...");

          try {
            await publish(DATA_URL, payload);
            applyYear(year, next, payload);
            delete drafts[activeRound === "Grand Final" ? year : roundDataKey(year, activeRound)];
            buildEditor();
            render();
            note(activeRound === "Grand Final"
              ? "Reset. The Grand Final shows the rows written in results.html."
              : "Reset. " + activeRound + " is empty again.");
          } catch (error) {
            note(error.message, true);
          }
        });

        window.addEventListener("hashchange", buildEditor);
        afterDataLoad = buildEditor;
        afterRoundChange = buildEditor;
        buildEditor();
        dataReady.then(importLocalSubsets);
        window.addEventListener("hashchange", importLocalSubsets);
      }

      showTool(tools[0][0]);
      showLogin();
    }

    render();

    // Render Lucide icons.
    const drawIcons = () => { if (window.lucide) window.lucide.createIcons(); };
    if (document.readyState === "complete") drawIcons();
    else window.addEventListener("load", drawIcons);
  </script>

</body>
</html>
