<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171329">

  <title>Results | Eurovision Rewind</title>
  <meta name="description" id="metaDesc" content="Eurovision Rewind scoreboards for every edition.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Eurovision Rewind">
  <meta property="og:title" id="ogTitle" content="Results | Eurovision Rewind">
  <meta property="og:description" id="ogDesc" content="Eurovision Rewind scoreboards for every edition.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.460.0" defer></script>

  <style>
    :root {
      --white: #ffffff;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Montserrat", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at 10% 0%, rgba(112, 83, 213, .25), transparent 40%),
        radial-gradient(ellipse at 100% 35%, rgba(52, 166, 175, .13), transparent 38%),
        linear-gradient(145deg, #171329, #101522 65%, #171329);
      background-attachment: fixed;
    }

    @media (hover: none) {
      body { background-attachment: scroll; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .header-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 18px;
    }

    .pill-header {
      display: flex;
      animation: header-arrive 700ms cubic-bezier(.2,.75,.25,1) both;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      min-height: 62px;
      padding: 8px 16px;
      background: var(--glass, rgba(255, 255, 255, 0.09));
      border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.20));
      border-radius: 999px;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      max-width: 125px;
      height: 42px;
      flex-shrink: 0;
      text-decoration: none;
    }

    .brand img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      padding: 0;
      color: white;
      background: transparent;
      border: 0;
      border-radius: 50%;
      text-decoration: none;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .nav-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .nav-icon svg {
      display: block;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .nav-icon:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    /* MAIN (empty - add your content here) */

    main {
      width: min(1180px, 94%);
      margin: 0 auto;
      padding: 26px 0 80px;
    }

    /* =========================
       CUSTOM FONT
       Put your font file in a "fonts" folder and name it results-font.ttf
       (or .otf / .woff / .woff2), or change the file names below.
    ========================= */

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-MediumItalic.otf") format("opentype");
      font-weight: 500;
      font-style: italic;
      font-display: swap;
    }

    /* =========================
       SCOREBOARD SIZES AND COLOURS
       Change any value here. Open results.html?tune to adjust them with sliders.
    ========================= */

    :root {
      --results-font: "ResultsFont", "Neulis", "Montserrat", sans-serif;
      --font-weight: 700;

      /* Shapes: height and width */
      --board-w: 1100px;                          /* whole board */
      --row-h: clamp(38px, 5.2cqw, 56px);         /* height of every row */
      --row-gap: 6px;                             /* space between rows */
      --col-gap: 22px;                            /* space between the two columns */
      --cell-gap: 0px;                            /* space between rank / flag / name (0 = connected) */
      --rank-w: clamp(40px, 6cqw, 64px);          /* rank block width */
      --points-w: clamp(56px, 8.5cqw, 92px);      /* points block width */
      --flag-w: clamp(46px, 6.6cqw, 72px);        /* rectangular flag width (height = row height) */
      --font-size: clamp(14px, 2.25cqw, 24px);    /* text size */
      --name-pad: 16px;                           /* space inside the name block */
      --row-radius: 12px;                         /* rounded ends of each row */

      /* Colours */
      --board-bg: #1a1560;
      --rank-bg: #5a2aa3;
      --flag-bg: #2b2478;
      --name-bg: #ffffff;
      --points-bg: #ffffff;
      --text: #ffffff;
      --name-text: #1c1a55;
      --points-text: #1c1a55;
    }

    @media (max-width: 720px) {
      :root {
        --row-h: 46px;
        --row-gap: 5px;
        --rank-w: 46px;
        --points-w: 64px;
        --flag-w: 54px;
        --font-size: 16px;
        --name-pad: 10px;
        --row-radius: 10px;
      }
    }

    /* Edition tabs */

    .edition-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
    }

    .edition-tabs a {
      min-width: 74px;
      animation: tab-arrive 500ms cubic-bezier(.2,.75,.25,1) both;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      padding: 9px 18px;
      color: #c2bfd6;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .edition-tabs a:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }

    .edition-tabs a.active {
      color: #fff;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    a:focus-visible {
      outline: 2px solid #c9bdff;
      outline-offset: 3px;
    }

    /* Heading */

    .results-head {
      margin-bottom: 18px;
      text-align: center;
      animation: heading-arrive 750ms 100ms cubic-bezier(.2,.75,.25,1) both;
    }

    .year {
      color: #fff;
      font-family: var(--results-font);
      font-size: clamp(48px, 10vw, 92px);
      font-weight: var(--font-weight);
      line-height: 1;
      text-shadow:
        -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
        0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000;
    }

    .sub {
      margin-top: 10px;
      color: #c2bfd6;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .round-picker {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 14px auto 20px;
    }

    .round-picker button {
      min-height: 36px;
      padding: 8px 15px;
      color: #d2cde5;
      font: 700 12px "Montserrat", sans-serif;
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, color .2s ease;
    }

    .round-picker button:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); color: #fff; }
    .round-picker button.active { color: #fff; background: linear-gradient(135deg,#6f5bd9,#4d3da6); border-color: transparent; }
    .round-picker button.add-round { border-style: dashed; color: #c7baff; }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 12px;
      color: #ffd28a;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 210, 138, 0.1);
      border: 1px solid rgba(255, 210, 138, 0.3);
      border-radius: 999px;
    }

    [hidden] { display: none !important; }

    @keyframes header-arrive {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes tab-arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes heading-arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes row-arrive {
      from { opacity: 0; transform: translateX(-14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Scoreboard */

    .board-wrap {
      container-type: inline-size;
      width: 100%;
      max-width: var(--board-w);
      margin: 0 auto;
      padding: clamp(12px, 2.2vw, 26px);
      background:
        radial-gradient(ellipse at 0% 0%, rgba(120, 90, 255, .28), transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(60, 150, 255, .16), transparent 50%),
        linear-gradient(160deg, #241b7c, var(--board-bg) 62%, #150f4a);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(6, 4, 30, .5), inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .board {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      grid-template-rows: repeat(var(--per-col, 8), var(--row-h));
      column-gap: var(--col-gap);
      row-gap: var(--row-gap);
    }

    .row {
      position: relative;
      display: flex;
      gap: var(--cell-gap);
      overflow: hidden;
      border-radius: var(--row-radius);
      box-shadow: 0 4px 14px rgba(6, 4, 36, .38);
      min-width: 0;
      height: var(--row-h);
      color: var(--text);
      font-family: var(--results-font);
      font-size: var(--font-size);
      font-weight: var(--font-weight);
      line-height: 1;
      transform-origin: center left;
      /* "backwards" (not "both") so the hover effect still works after the intro */
      animation: row-arrive 520ms cubic-bezier(.2,.75,.25,1) backwards;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .row:hover {
      z-index: 1;
      transform: translateX(5px) scale(1.012);
      filter: brightness(1.12);
    }

    .row:nth-child(1) { animation-delay: 180ms; }
    .row:nth-child(2) { animation-delay: 220ms; }
    .row:nth-child(3) { animation-delay: 260ms; }
    .row:nth-child(4) { animation-delay: 300ms; }
    .row:nth-child(5) { animation-delay: 340ms; }
    .row:nth-child(6) { animation-delay: 380ms; }
    .row:nth-child(7) { animation-delay: 420ms; }
    .row:nth-child(8) { animation-delay: 460ms; }
    .row:nth-child(n+9) { animation-delay: 500ms; }

    .cell {
      display: flex;
      align-items: center;
    }

    .rank {
      flex: none;
      justify-content: center;
      width: var(--rank-w);
      font-weight: 800;
      background: linear-gradient(180deg, color-mix(in srgb, var(--rank-bg) 88%, #fff), var(--rank-bg));
      border-radius: var(--row-radius) 0 0 var(--row-radius);
    }

    .flag {
      flex: none;
      width: var(--flag-w);
      overflow: hidden;
      background: var(--flag-bg);
    }

    .name {
      flex: 1;
      min-width: 0;
      padding: 0 var(--name-pad);
      color: var(--name-text);
      font-weight: 800;
      background: var(--name-bg);
    }

    .points {
      flex: none;
      justify-content: center;
      width: var(--points-w);
      margin-left: 3px;
      color: var(--points-text);
      font-weight: 900;
      background: var(--points-bg);
      border-radius: 0 var(--row-radius) var(--row-radius) 0;
    }

    .country {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Flag image: the full rectangular flag (local file or flagcdn.com) */

    .flag-img {
      display: block;
      flex: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .row .flag-img {
      animation: flag-pop 700ms cubic-bezier(.2,.75,.25,1) backwards;
      animation-delay: inherit;
      transition: transform 400ms cubic-bezier(.2,.75,.25,1);
    }

    .row:hover .flag-img {
      transform: scale(1.12);
    }

    @keyframes flag-pop {
      from { opacity: 0; transform: scale(1.35); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Light sweep across a row on hover */

    .row::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .28) 50%, transparent 65%);
      transform: translateX(-120%);
    }

    .row:hover::after {
      transform: translateX(120%);
      transition: transform 650ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .row, .row .flag-img { animation: none; }
      .row::after { display: none; }
    }

    /* While editing with ?data, skip the intro animation so typing feels instant */
    body.editing .row {
      animation: none;
    }

    .empty {
      padding: 46px 18px;
      color: #fff;
      font-family: var(--results-font);
      font-size: clamp(16px, 3vw, 22px);
      text-align: center;
      background: var(--rank-bg);
    }

    /* Size tuner (only with ?tune) */

    body.tuning main {
      padding-bottom: 56vh;
    }

    .tuner {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      max-height: 52vh;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      overflow: auto;
      background: rgba(17, 19, 27, 0.96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .tuner > * { max-width: 560px; margin-left: auto; margin-right: auto; }

    .tuner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .tuner h2 { font-size: 15px; }
    .tuner h2 small { margin-left: 8px; color: #65d5d0; font-size: 11px; font-weight: 600; }
    .tuner.collapsed #tuneBody { display: none; }

    .tune-row {
      display: grid;
      grid-template-columns: 1fr 1.4fr 52px;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: #c2bfd6;
      font-size: 12px;
      font-weight: 600;
    }

    .tune-row input { width: 100%; }
    .tune-row output { text-align: right; color: #fff; }

    .tune-login {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px auto 4px;
    }

    .tune-login input {
      flex: 1 1 150px;
      padding: 10px 12px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .tuner button {
      padding: 10px 16px;
      color: #fff;
      font: 700 12px "Montserrat", sans-serif;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }

    .tuner button.ghost {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .tuner button.small { padding: 6px 12px; }

    .tune-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tune-note { min-height: 18px; margin-top: 10px; color: #65d5d0; font-size: 12px; }
    .tune-note.error { color: #ff9b9b; }

    .tool-tabs { display: flex; gap: 6px; }

    .tuner button.tab {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .tuner button.tab.active {
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    .tool-mode { margin-bottom: 10px; color: #65d5d0; font-size: 12px; font-weight: 600; }

    .data-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      grid-template-areas:
        "rank country points"
        "rank heart   btns";
      gap: 6px 8px;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .data-rank { grid-area: rank; color: #c2bfd6; font-size: 12px; font-weight: 700; text-align: center; }
    .data-country { grid-area: country; }
    .data-points { grid-area: points; width: 92px; }
    .data-heart { grid-area: heart; }
    .data-btns { grid-area: btns; display: flex; gap: 4px; }

    .data-row input {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .data-row .data-heart { font-size: 11px; font-weight: 500; }

    .tuner .data-btns button {
      padding: 8px 10px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .edition-tools {
      margin: 0 auto 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }

    .edition-tools summary {
      color: #65d5d0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .edition-form {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .edition-form label {
      display: flex;
      flex: 1 1 150px;
      flex-direction: column;
      gap: 4px;
      color: #c2bfd6;
      font-size: 11px;
      font-weight: 600;
    }

    .edition-form label:first-child:has(input[type="number"]) { flex: 0 0 110px; }

    .edition-form input {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .hint {
      margin-top: 10px;
      color: #c2bfd6;
      font-size: 12px;
      font-weight: 600;
    }

    .row.clickable { cursor: pointer; }
    /* Voting-only entrants count as voters but are excluded from the finalist board. */
    .row.voter-only { display: none; }

    .row.clickable:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    /* ---------- Detail window (opens when a country is clicked) ---------- */

    dialog.detail {
      position: fixed;
      inset: 0;
      margin: auto;
      width: min(660px, calc(100% - 24px));
      max-width: none;
      max-height: min(88vh, 780px);
      padding: 0;
      overflow: visible;
      color: #fff;
      font-family: var(--results-font);
      background: transparent;
      border: 0;
    }

    dialog.detail::backdrop {
      background: rgba(8, 6, 30, 0.76);
      backdrop-filter: blur(4px);
    }

    dialog.detail[open] { animation: detail-in 420ms cubic-bezier(.2,.9,.25,1.08); }
    dialog.detail[open]::backdrop { animation: backdrop-in 320ms ease; }
    dialog.detail.closing { animation: detail-out 200ms ease forwards; }
    dialog.detail.closing::backdrop { animation: backdrop-out 200ms ease forwards; }

    @keyframes detail-in {
      from { opacity: 0; transform: translateY(34px) scale(.92); }
      to { opacity: 1; transform: none; }
    }
    @keyframes detail-out {
      to { opacity: 0; transform: translateY(18px) scale(.96); }
    }
    @keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes backdrop-out { to { opacity: 0; } }

    .detail-card {
      max-height: min(88vh, 780px);
      padding: 16px;
      overflow: auto;
      background:
        radial-gradient(ellipse at 0% 0%, rgba(120, 90, 255, .3), transparent 55%),
        linear-gradient(160deg, #261d80, var(--board-bg) 65%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(4, 2, 24, .65);
    }

    .detail-head {

    /* Rows slide in one after another every time the list is drawn (open or switch tab) */

    .vline {
      display: flex;
      min-height: 46px;
      margin-bottom: 5px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(6, 4, 36, .3);
      animation: line-in 460ms cubic-bezier(.2,.75,.25,1) backwards;
      animation-delay: calc(var(--i, 0) * 55ms + 120ms);
    }

    @keyframes line-in {
      from { opacity: 0; transform: translateX(-22px); }
      to { opacity: 1; transform: none; }
    }

    .vpoints {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 58px;
      font-size: 20px;
      font-weight: 900;

      flex-wrap: wrap;

    .chip {
      display: inline-flex;

    @keyframes chip-in {
      from { opacity: 0; transform: scale(.7); }

    .chip .flag-img {
      width: 34px;
      height: 24px;
      border-radius: 4px;

    .detail-empty {
      padding: 14px;

      font-size: 14px;
      background: rgba(255, 255, 255, .08);

    /* Header blocks fly in once, when the window opens */

    dialog.detail.fresh .detail-rank,
    dialog.detail.fresh .detail-name .flag-img,
    dialog.detail.fresh .detail-name h2,
    dialog.detail.fresh .detail-total,
    dialog.detail.fresh .detail-close {
      animation: part-in 520ms cubic-bezier(.2,.8,.25,1) backwards;
    }
    dialog.detail.fresh .detail-name .flag-img { animation-name: part-flag; animation-delay: 80ms; }
    dialog.detail.fresh .detail-name h2 { animation-delay: 140ms; }
    dialog.detail.fresh .detail-total { animation-delay: 200ms; }
    dialog.detail.fresh .detail-close { animation-delay: 260ms; }

    @keyframes part-in { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
    @keyframes part-flag { from { opacity: 0; transform: scale(1.5); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      dialog.detail[open], dialog.detail[open]::backdrop, dialog.detail.closing,
      .vline, .chip, .detail-empty, dialog.detail.fresh * { animation: none !important; }

    @media (max-width: 720px) {

      .detail-rank { width: 46px; font-size: 18px; }
      .detail-total { min-width: 68px; font-size: 17px; }

    @keyframes sheet-in { from { opacity: .4; transform: translateY(100%); } to { opacity: 1; transform: none; } }
    @keyframes sheet-out { to { opacity: .4; transform: translateY(100%); } }

    /* Points editor: votes */

    .vote-group {

      margin-bottom: 10px;

    .data-category-title {

      color: #65d5d0;
      font-size: 12px;
      font-weight: 800;

    .data-item {

    /* =========================================================
       EXTRAS: search, sort, winner strip, share, tie ranks...
    ========================================================= */

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .skip {
      position: absolute;

      left: 12px;
      z-index: 200;
      padding: 10px 16px;

      font: 800 13px "Montserrat", sans-serif;
      text-decoration: none;
      background: #fff;
      border-radius: 10px;
    }

    .skip:focus { top: 12px; }

    .nav-icon.active { background: rgba(255, 255, 255, 0.18); }

    .ws-label {

    .ws-tile {
      display: flex;
      align-items: stretch;
      height: 46px;

      font-weight: 800;

    .ws-tile .flag-img { width: 64px; height: 100%; }
    .ws-name, .ws-pts { display: flex; align-items: center; padding: 0 14px; }
    .ws-pts { color: #1b1830; font-weight: 900; background: #ffcf4a; }

    .toolbar {

    .search input {

    .sort button.active { color: #fff; background: linear-gradient(135deg, #6f5bd9, #4d3da6); border-color: transparent; }
    .pill:focus-visible, .sort button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    /* Search: other countries fade out */

    .row { transition: transform 180ms ease, filter 180ms ease, opacity 250ms ease; }
    .row.dim { opacity: .22; filter: saturate(.4); }
    .row.match { box-shadow: 0 0 0 2px #ffcf4a, 0 6px 22px rgba(255, 207, 74, .3); }

    .row.gold .rank { color: #1b1830; background: linear-gradient(180deg, #ffe07a, #ffcf4a); }

      font: 700 13px "Montserrat", sans-serif;

    ========================================================= */

    /* =========================================================
       LOOK OF THE REFERENCE PHOTO
       separate blocks: rounded rank, sharp rectangular flag,
       white name block, rounded points
    ========================================================= */

    :root { --cell-gap: 4px; }

    .row,
    .row.gold,
    .row.match,
    .row.dim { overflow: visible; box-shadow: none; border-radius: 0; }

    .row::after { display: none; }

    .row .cell { box-shadow: 0 3px 10px rgba(6, 4, 36, .4); }

    .rank { border-radius: calc(var(--row-h) * .34); }

    .row .flag { margin: 0; border-radius: 0; }

    .name { border-radius: 0; }

    .points { margin-left: 0; border-radius: calc(var(--row-h) * .34); }

    /* A matching ring for the leader and for search matches */
    .row.gold .rank { box-shadow: 0 3px 10px rgba(6, 4, 36, .4), 0 0 0 2px rgba(255, 207, 74, .7); }
    .row.match .name { box-shadow: 0 0 0 2px #ffcf4a; }

    /* Detail window: same blocks, same gaps, sharp flags */
    .detail-head { gap: 4px; box-shadow: none; }
    .detail-name { gap: 4px; }
    .detail-rank, .detail-total, .detail-close { margin-left: 0; border-radius: 12px; box-shadow: 0 3px 10px rgba(6, 4, 36, .4); }
    .detail-name .flag-img { border-radius: 0; box-shadow: 0 3px 10px rgba(6, 4, 36, .4); }
    .detail-name h2 { border-radius: 0; box-shadow: 0 3px 10px rgba(6, 4, 36, .4); }
    .chip .flag-img { border-radius: 0; box-shadow: none; }


    /* =========================================================
       CUT-OFF ROUNDED SHAPE (like the reference photo)
       rank: round on the left, flat on the right
       name + points: connected, round only on the far right
       the flag keeps a little air on both sides
    ========================================================= */

    .row { gap: 0; }

    .row .cell { box-shadow: none; }

    .rank { border-radius: calc(var(--row-h) * .34) 0 0 calc(var(--row-h) * .34); }

    .row .flag { margin: 0 4px; border-radius: 0; }

    .name { border-radius: 0; }

    /* thin dark divider between the name and the points, as in the photo */
    .points { margin-left: 2px; border-radius: 0 calc(var(--row-h) * .34) calc(var(--row-h) * .34) 0; }

    .row.gold .rank { box-shadow: 0 0 0 2px rgba(255, 207, 74, .7); }

    /* Detail window header: same shape */
    .detail-head { gap: 0; }
    .detail-name { gap: 0; }
    .detail-rank, .detail-total, .detail-close, .detail-name .flag-img, .detail-name h2 { box-shadow: none; }
    .detail-rank { border-radius: 14px 0 0 14px; }
    .detail-name .flag-img { margin: 0 4px; border-radius: 0; }
    .detail-name h2 { border-radius: 0; }
    .detail-total { margin-left: 2px; border-radius: 0; }
    .detail-close { margin-left: 2px; border-radius: 0 14px 14px 0; }


    .tie-note {
      max-width: var(--board-w);
      margin: 12px auto 0;
      padding: 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .detail-tie { margin-top: 10px; color: #ffd86b; font: 700 12px "Montserrat", sans-serif; }


    /* =========================================================
       DETAILED VOTES: dark window, flags with a faint rounded outline
    ========================================================= */

    .detail-card {
      background:
        radial-gradient(ellipse at 0% 0%, rgba(90, 60, 200, .2), transparent 55%),
        linear-gradient(160deg, #15103f, #0c092d 70%);
      border-color: rgba(255, 255, 255, .12);
    }

    .vline { box-shadow: none; }

    .vnames {
      color: #fff;
      background: rgba(255, 255, 255, .07);
    }

    .chip .flag-img {
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .3);
    }


    /* Save as image */

    .save-wrap { position: relative; display: inline-block; }

    .save-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      z-index: 40;
      display: grid;
      gap: 2px;
      width: 236px;
      padding: 6px;
      background: #1a1560;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
      transform: translateX(-50%);
      animation: heading-arrive 220ms ease backwards;
    }

    .save-menu[hidden] { display: none; }

    .save-menu button {
      display: grid;
      gap: 2px;
      padding: 9px 12px;
      color: #fff;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }

    .save-menu button:hover, .save-menu button:focus-visible { background: rgba(255, 255, 255, .1); outline: none; }
    .save-menu b { font: 800 13px "Montserrat", sans-serif; }
    .save-menu span { color: #b9b4d6; font: 600 11px "Montserrat", sans-serif; }


    /* Voting progress and the automatic Grand Final line-up */

    .vote-status {
      max-width: 620px;
      margin: 10px auto 0;
      padding: 8px 14px;
      color: #e6dfff;
      font: 600 12px/1.5 "Montserrat", sans-serif;
      text-align: center;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
    }

    .row.pending .points { color: #8d89b8; }
    .row.pending .name { color: #5c5990; }
    .row.pending .rank { opacity: .75; }


    .data-note { margin: 8px 0 0; color: #b9b4d6; font-size: 12px; }

  
    /* =========================================================
       REFRESH: faster rendering + cleaner design
       (kept last so it overrides the earlier rules)
    ========================================================= */

    /* Fixed backgrounds repaint on every scroll frame; a fixed layer is composited instead */
    body { background: #101522; background-attachment: scroll; }
    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(ellipse at 10% 0%, rgba(112, 83, 213, .28), transparent 42%),
        radial-gradient(ellipse at 100% 35%, rgba(52, 166, 175, .14), transparent 40%),
        linear-gradient(145deg, #171329, #101522 65%, #171329);
    }

    /* Heavy blurs are the most common cause of jank on phones */
    @media (max-width: 900px), (hover: none) {
      .pill-header, .tuner, dialog.detail::backdrop {
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .pill-header { background: rgba(34, 30, 64, .92); }
      .row .flag-img { animation: none; }
      .row:nth-child(n+7) { animation: none; }
    }
    .row:nth-child(n+13) { animation: none; }
    .row { contain: layout style; }
    .board-wrap { contain: layout style; }

    /* Sticky hover on touch screens made rows jump after a tap */
    @media (hover: none) {
      .row:hover { transform: none; filter: none; }
      .row:hover .flag-img { transform: none; }
    }

    /* One stroke instead of eight stacked text-shadows */
    .year {
      text-shadow: 0 6px 24px rgba(111, 91, 217, .45);
      -webkit-text-stroke: 6px #000;
      paint-order: stroke fill;
    }

    /* ---- Design ---- */
    .edition-tabs a.active { box-shadow: 0 8px 22px rgba(111, 91, 217, .45); }
    .sub { display: inline-block; padding: 6px 16px; background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 999px; }

    .board-wrap {
      border-radius: 26px;
      box-shadow: 0 30px 70px rgba(6, 4, 30, .55), 0 0 0 1px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.1);
    }

    .row.silver .rank { color: #1b1830; background: linear-gradient(180deg, #f2f5fb, #b9c2d6); }
    .row.bronze .rank { color: #2a1405; background: linear-gradient(180deg, #f6c08c, #c47a3d); }
    .row.gold .rank   { background: linear-gradient(180deg, #ffe58a, #f2b705); }
    .row .points { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .row:focus-visible { outline: 2px solid #c9bdff; outline-offset: 3px; }

    .toolbar .search input:focus { outline: 2px solid #8c78ff; outline-offset: 2px; }

    /* ---- ?tune and ?data panel ---- */
    .tuner {
      max-height: 58vh;
      padding-top: 18px;
      background: rgba(14, 12, 32, .98);
      border-top: 1px solid rgba(255,255,255,.16);
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -18px 50px rgba(0, 0, 0, .5);
      overscroll-behavior: contain;
    }
    .tuner::before {
      position: sticky; top: -10px; display: block; width: 44px; height: 4px; margin: -8px auto 12px;
      content: ""; background: rgba(255,255,255,.25); border-radius: 4px;
    }
    .tuner > * { max-width: 680px; }
    body.tuning main { padding-bottom: 62vh; }

    .tool-tabs { padding: 4px; background: rgba(255,255,255,.06); border-radius: 999px; }
    .tuner button.tab { padding: 8px 18px; background: transparent; border-color: transparent; color: #c2bfd6; }
    .tuner button.tab.active { color: #fff; box-shadow: 0 4px 14px rgba(111, 91, 217, .5); }

    .tune-h {
      margin: 18px 0 10px; padding-bottom: 6px; color: #65d5d0; font-size: 11px; font-weight: 800;
      letter-spacing: 1.4px; text-transform: uppercase; border-bottom: 1px solid var(--border);
    }
    .tune-h:first-child { margin-top: 4px; }
    .tune-row { padding: 6px 10px; background: rgba(255,255,255,.04); border-radius: 10px; }
    .tune-row input[type="range"] { accent-color: #8c78ff; height: 28px; }
    .tune-row output { font-variant-numeric: tabular-nums; }

    .preset-bar { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .tuner button.preset {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; text-align: left;
      background: rgba(255,255,255,.06); border-color: var(--border); border-radius: 12px;
    }
    .preset .dots { display: inline-flex; }
    .preset .dots i { width: 14px; height: 14px; margin-right: -4px; border: 2px solid #0e0c20; border-radius: 50%; }
    .preset b { font-size: 12px; }

    .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .color-row {
      display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px;
      padding: 6px 10px 6px 6px; color: #c2bfd6; font-size: 12px; font-weight: 600;
      background: rgba(255,255,255,.04); border-radius: 10px;
    }
    .color-row input[type="color"] { width: 40px; height: 32px; padding: 0; background: none; border: 0; border-radius: 8px; cursor: pointer; }
    .color-row output { color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; text-transform: uppercase; }

    #sizesTool > .tune-actions,
    #dataTool > .tune-actions:last-of-type {
      position: sticky; bottom: -14px; z-index: 2; margin-top: 14px; padding: 10px 0 4px;
      background: linear-gradient(180deg, transparent, rgba(14,12,32,.98) 30%);
    }
    #tuneConfirm, #dataConfirm { background: linear-gradient(135deg, #20b67a, #14815a); }

    .data-filter {
      width: 100%; margin: 0 0 12px; padding: 10px 14px; color: #fff; font: 600 13px "Montserrat", sans-serif;
      background: rgba(0,0,0,.3); border: 1px solid var(--border); border-radius: 999px;
    }
    .data-filter:focus, .data-row input:focus, .edition-form input:focus { outline: 2px solid #8c78ff; outline-offset: 1px; }

    .data-item[hidden] { display: none !important; }
    .data-row {
      padding: 10px; background: rgba(255,255,255,.045); border: 1px solid var(--border); border-radius: 14px;
    }
    .data-rank {
      display: grid; place-items: center; width: 28px; height: 28px; background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      color: #fff; border-radius: 50%; font-size: 11px;
    }
    .data-item:nth-of-type(1) .data-rank { background: linear-gradient(135deg, #ffe58a, #f2b705); color: #1b1830; }
    .data-points { font-variant-numeric: tabular-nums; text-align: right; }
    .tuner .data-btns { flex-wrap: wrap; justify-content: flex-end; }
    .tuner .data-btns button { min-height: 34px; border-radius: 10px; }
    .data-category-title { margin: 16px 0 8px; color: #65d5d0; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; }
    .edition-tools { border: 1px solid var(--border); }
    .vote-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
  
    /* ---------- Phone performance pass ---------- */
    html { scroll-behavior: auto; }
    @media (max-width: 720px), (hover: none) {
      html { scroll-behavior: auto; }
      /* no intro animations: they re-run on every re-render and cost a lot on weak GPUs */
      .row .flag-img, .vline, .chip { animation: none !important; }
      .row, .row .cell { box-shadow: none !important; }
      .row { transition: none; will-change: auto; }
      .row::after { display: none; }
      .row.dim { filter: none; opacity: .3; }
      .board-wrap { box-shadow: none; }
      .year { -webkit-text-stroke: 4px #000; text-shadow: none; }
      dialog.detail[open], dialog.detail.closing { animation-duration: 160ms; }
      dialog.detail[open]::backdrop, dialog.detail.closing::backdrop { animation: none; }
      .edition-tabs a, .round-picker button { transition: none; }
      .edition-tabs a:hover, .round-picker button:hover, .nav-icon:hover { transform: none; }
    }
    /* ---------- Light animation: transform + opacity only, short, first rows only ---------- */
    @keyframes lite-in {
      from { opacity: 0; transform: translate3d(0, 10px, 0); }
      to   { opacity: 1; transform: none; }
    }
    @media (max-width: 720px), (hover: none) {
      .pill-header      { animation: lite-in 300ms ease-out both !important; }
      .results-head     { animation: lite-in 340ms 40ms ease-out both !important; }
      .edition-tabs a   { animation: lite-in 280ms ease-out both !important; }
      .winner-strip     { animation: lite-in 320ms 120ms ease-out backwards !important; }
      .row              { animation: lite-in 300ms ease-out backwards !important; }
      .row:nth-child(1) { animation-delay: 80ms !important; }
      .row:nth-child(2) { animation-delay: 110ms !important; }
      .row:nth-child(3) { animation-delay: 140ms !important; }
      .row:nth-child(4) { animation-delay: 170ms !important; }
      .row:nth-child(5) { animation-delay: 200ms !important; }
      .row:nth-child(6) { animation-delay: 230ms !important; }
      .row:nth-child(7) { animation-delay: 260ms !important; }
      .row:nth-child(8) { animation-delay: 290ms !important; }
      .row:nth-child(n+9) { animation: none !important; }
      .row { transition: transform 120ms ease-out; }
      .row:active { transform: scale(.985); }
      .tab-arrive-off { animation: none; }
    }
    .board.nofx .row, body.editing .row { animation: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .pill-header, .results-head, .edition-tabs a, .winner-strip, .row { animation: none !important; }
    }

    /* skip layout/paint work for dialog content and tools while hidden */
    .tuner[hidden], dialog.detail:not([open]) { display: none; }
    .detail-section { content-visibility: auto; contain-intrinsic-size: auto 240px; }
  </style>
</head>
