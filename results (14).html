  <script>
    /* =========================================================
       EDITIONS AND RESULTS  (edit this part)
       - One entry per edition. Rows are listed from 1st place down.
       - Each row is { country, points }. Optional: rank, heart, votes.
       - votes = the points THIS country gave. Order: 12, 10, 8, 7, 6, 5, 4, 3, 2, 1
           votes: { jury: ["Ukraine", "Georgia", ...], tele: ["Spain", ...] }
         "Points received" is worked out automatically from everyone's votes.
         Edit votes in the browser with results.html?data instead of typing them.
       - You can also edit points in the browser: open results.html?data
       - An edition with an empty results list shows a "coming soon" message.

       FLAG IMAGES
       Every row shows the full rectangular flag of the country.
       Flags are picked up automatically from the folder set in FLAG_FOLDER.
       The file name is the country name in lowercase with dashes:
         "France"          -> images/flags/france.png
         "North Macedonia" -> images/flags/north-macedonia.png
       As soon as a country name is typed (or added to a list), its flag appears.
       If there is no file for a country, flagcdn.com is used as a backup (needs internet).
       For one special row, add  heart: "images/flags/other-file.png"  (image override).
       Countries missing from FLAG_CODES below need a file or an override.
    ========================================================= */

    const FLAG_FOLDER = "images/flags/";    // the folder that holds your flag files ("" = only use flagcdn.com)
    const FLAG_EXTS = [".png", ".svg", ".webp", ".jpg"];   // file types to look for, in this order (remove the ones you don't use)

    const FLAG_CODES = {
      "albania":"al","andorra":"ad","armenia":"am","australia":"au","austria":"at","azerbaijan":"az",
      "belarus":"by","belgium":"be","bosnia-and-herzegovina":"ba","bulgaria":"bg","croatia":"hr",
      "cyprus":"cy","czechia":"cz","czech-republic":"cz","denmark":"dk","estonia":"ee","finland":"fi",
      "france":"fr","georgia":"ge","germany":"de","greece":"gr","hungary":"hu","iceland":"is",
      "ireland":"ie","israel":"il","italy":"it","latvia":"lv","lithuania":"lt","luxembourg":"lu",
      "malta":"mt","moldova":"md","monaco":"mc","montenegro":"me","morocco":"ma","netherlands":"nl",
      "north-macedonia":"mk","norway":"no","poland":"pl","portugal":"pt","romania":"ro","russia":"ru",
      "san-marino":"sm","serbia":"rs","slovakia":"sk","slovenia":"si","spain":"es","sweden":"se",
      "switzerland":"ch","turkey":"tr","turkiye":"tr","ukraine":"ua","united-kingdom":"gb","uk":"gb",
      "england":"gb-eng","scotland":"gb-sct","wales":"gb-wls","kosovo":"xk","liechtenstein":"li",
      "kazakhstan":"kz","kyrgyzstan":"kg","uzbekistan":"uz","tajikistan":"tj","turkmenistan":"tm",
      "vietnam":"vn","cambodia":"kh","laos":"la","mongolia":"mn","bhutan":"bt","philippines":"ph",
      "bangladesh":"bd","thailand":"th","rep-of-korea":"kr","republic-of-korea":"kr","south-korea":"kr",
      "north-korea":"kp","nepal":"np","malaysia":"my","japan":"jp","china":"cn","india":"in",
      "indonesia":"id","singapore":"sg","myanmar":"mm","sri-lanka":"lk","pakistan":"pk","brunei":"bn",
      "timor-leste":"tl","taiwan":"tw","hong-kong":"hk","maldives":"mv","afghanistan":"af",
      "usa":"us","united-states":"us","canada":"ca","brazil":"br","mexico":"mx","argentina":"ar",
      "new-zealand":"nz","south-africa":"za","egypt":"eg","lebanon":"lb","tunisia":"tn","algeria":"dz",
      "jordan":"jo","saudi-arabia":"sa","united-arab-emirates":"ae","qatar":"qa","iran":"ir"
    };

    // Vote groups and the order of the points a country can give.
    const VOTE_GROUPS = [
      { key: "jury", label: "Jury" },
      { key: "tele", label: "Televote" }
    ];
    const VOTE_POINTS = [12, 10, 8, 7, 6, 5, 4, 3, 2, 1];

    // CUSTOM STATUSES (the pills in the country's detail window).
    // A status colour is chosen like this: a colour picked for that country wins,
    // otherwise the colour for the status name below, otherwise STATUS_DEFAULT_COLOR.
    // Add your own statuses here, or just type any new name in results.html?data.
    const STATUS_COLORS = {
      "Host":               "#ffcf4a",
      "Winner":             "#f5b301",
      "Big 5":              "#4d8dff",
      "Automatic finalist": "#3be08a",
      "Qualified through Second Chance": "#ff9f45",
      "Wildcard":           "#ff6bd6",
      "Debut":              "#b46bff",
      "Returning":          "#35c9c3",
      "Withdrawn":          "#8a87a6",
      "Disqualified":       "#e5484d"
    };
    const STATUS_DEFAULT_COLOR = "#6f5bd9";

    // Editions: published results (from the voting page and the ?data editor) appear on their own.
    // Add a line here only to name an edition, give it a host city, or show a message until it has results.
    //   host: "Armenia"  makes the host-country rule of the tie-break work.
    const EDITIONS = [
      { year: 2029, city: "Zürich, Switzerland", results: [],
        emptyText: "Results will appear here after the Grand Final in Zürich." }
    ];

    // Qualifiers are decided automatically once ALL countries have finished their jury and televote:
    // the top of each semifinal goes through to the Grand Final.
    const QUALIFIERS_PER_SEMI = 10;

    // Second Chance: the countries that go through to the Grand Final when they win it.
    // (Any round whose name contains "Second Chance" works this way. One edition can override it with
    //  secondChance: 2 in its EDITIONS line.)
    const QUALIFIERS_SECOND_CHANCE = 1;

    /* =========================================================
       PAGE CODE (no need to edit below)
    ========================================================= */

    const $ = (id) => document.getElementById(id);
    const board = $("board");
    const columnQuery = window.matchMedia("(max-width: 720px)");

    // Published results (from the database) and unpublished edits (?data only)
    let savedData = {};
    let drafts = {};
    let afterRoundChange = () => {};

    // Subsets (Semifinal 1, ...) are shared through the database like the Grand Final:
    //   savedRounds[year] = published subsets  [{ name, rows }]
    //   draftRounds[year] = the subset list being edited with ?data (names, in order)
    let savedRounds = {};
    let draftRounds = {};

    // Editions added with ?data (year -> host city). A city can also replace the one in the file.
    // In draftCities, null means "delete this added edition".
    let savedCities = {};
    let draftCities = {};

    // Editions written in the file, plus the ones added with ?data, in year order.
    function allEditions() {
      const list = EDITIONS.map((edition) => ({ ...edition }));
      const cities = { ...savedCities, ...draftCities };

      Object.keys(cities).forEach((key) => {
        const year = Number(key);
        const city = cities[key];
        const found = list.find((edition) => edition.year === year);

        if (city === null) {
          if (found && !EDITIONS.some((edition) => edition.year === year)) list.splice(list.indexOf(found), 1);
          return;
        }

        if (found) found.city = city;
        else list.push({ year, city, results: [] });
      });

      return list.sort((a, b) => a.year - b.year);
    }

    const rowsFor = (edition) =>
      drafts[edition.year] || savedData[edition.year] || edition.results;
    let activeRound = "Grand Final";

    const roundDataKey = (year, round) => "resultsRoundData:" + year + ":" + encodeURIComponent(round);

    function savedRoundRows(year, name) {
      const found = (savedRounds[year] || []).find((round) => round.name.toLowerCase() === String(name).toLowerCase());
      return found ? found.rows : [];
    }

    function roundNames(year) {
      return draftRounds[year] ? draftRounds[year].slice() : (savedRounds[year] || []).map((round) => round.name);
    }

    function roundRows(edition, round = activeRound) {
      if (round === "Grand Final") return rowsFor(edition);
      return drafts[roundDataKey(edition.year, round)] || savedRoundRows(edition.year, round);
    }

    // Links like results.html#2028/semifinal-1 open a subset directly.
    const roundKey = (name) => slug(name) || name;

    function hashRoundSlug() {
      try { return decodeURIComponent(location.hash.replace("#", "").split("/")[1] || ""); }
      catch (error) { return ""; }
    }

    function goToYear(year) {
      activeRound = "Grand Final";
      history.replaceState(
        null,
        "",
        location.pathname + location.search.replace(/([?&]edition=)\d+/, "$1" + year) + "#" + year
      );
    }

    function selectRound(name) {
      activeRound = name;
      const hash = "#" + currentYear() + (name === "Grand Final" ? "" : "/" + roundKey(name));
      history.replaceState(null, "", location.pathname + location.search + hash);
    }

    function currentYear() {
      const wanted =
        new URLSearchParams(location.search).get("edition") ||
        location.hash.replace("#", "").split("/")[0];

      if (allEditions().some((edition) => String(edition.year) === wanted)) {
        return Number(wanted);
      }

      // Default: the latest edition that has results.
      const withResults = allEditions().filter((edition) => rowsFor(edition).length);
      return (withResults[withResults.length - 1] || allEditions()[0]).year;
    }

    function slug(name) {
      return String(name)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    // Every place a flag could come from, best first.
    function flagUrls(item) {
      const key = slug(item.country);
      const urls = [];

      if (item.heart) urls.push(item.heart);
      if (FLAG_FOLDER && key) FLAG_EXTS.forEach((ext) => urls.push(FLAG_FOLDER + key + ext));
      if (FLAG_CODES[key]) urls.push("https://flagcdn.com/w160/" + FLAG_CODES[key] + ".png");

      return urls;
    }

    const flagSrc = (item) => flagUrls(item)[0] || "";

    const same = (a, b) =>
      String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();

    // Keep votes tidy: { jury: [10 names], tele: [10 names] } (blank = no vote)
    function cleanVotes(votes) {
      if (!votes) return undefined;
      const out = {};

      VOTE_GROUPS.forEach(({ key }) => {
        const raw = votes[key];
        if (!raw) return;
        const list = Array.isArray(raw) ? raw : Object.values(raw);
        const names = VOTE_POINTS.map((_, i) => String(list[i] || "").trim());
        if (names.some(Boolean)) out[key] = names;
      });

      return Object.keys(out).length ? out : undefined;
    }

    // Statuses: [{ text, color? }]. color is optional (#rrggbb); without it the colour follows the status name.
    const isHex = (value) => /^#[0-9a-f]{6}$/i.test(String(value || ""));

    function cleanStatuses(list) {
      const raw = Array.isArray(list) ? list : Object.values(list || {});
      const out = [];

      raw.forEach((item) => {
        const text = String((item && typeof item === "object" ? item.text : item) || "").trim();
        if (!text || out.some((other) => same(other.text, text))) return;
        out.push({ text, ...(item && isHex(item.color) ? { color: item.color.toLowerCase() } : {}) });
      });

      return out;
    }

    const statusProp = (item) => {
      const list = cleanStatuses(item.statuses);
      return list.length ? { statuses: list } : {};
    };

    // How a country votes: both jury and televote (default), jury only, or televote only.
    const votesVia = (row) => (row && (row.voting === "jury" || row.voting === "tele") ? row.voting : "both");
    const mayVote = (row, key) => votesVia(row) === "both" || votesVia(row) === key;
    const votingProp = (item) => (votesVia(item) === "both" ? {} : { voting: item.voting });
    const votingLabel = (item) => ({ jury: "Jury only", tele: "Televote only" }[votesVia(item)] || "Jury + televote");

    function presetColor(text) {
      const key = String(text || "").trim().toLowerCase();
      const name = Object.keys(STATUS_COLORS).find((item) => item.toLowerCase() === key);
      return name ? STATUS_COLORS[name] : "";
    }

    const statusColor = (status) =>
      (isHex(status.color) && status.color) || presetColor(status.text) || STATUS_DEFAULT_COLOR;

    // Dark or white text, whichever reads better on the pill colour.
    function statusInk(hex) {
      const n = parseInt(hex.slice(1), 16);
      const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
      return lum > 0.6 ? "#1b1830" : "#ffffff";
    }

    function paintStatus(el, status) {
      const bg = statusColor(status);
      el.textContent = status.text;
      el.style.background = bg;
      el.style.color = statusInk(bg);
    }

    function statusPill(status, tag) {
      const el = document.createElement(tag || "span");
      el.className = "spill";
      paintStatus(el, status);
      return el;
    }

    const groupsWithVotes = (rows) =>
      VOTE_GROUPS.filter(({ key }) => rows.some((row) => row.votes && row.votes[key]));

    // Remember which file worked (and which countries have none) so each flag is only searched for once.
    const flagFound = new Map();
    const flagMissing = new Set();

    function initials(name) {
      const words = String(name).replace(/[^\p{L}\p{N} ]/gu, " ").split(/\s+/).filter(Boolean);
      const letters = words.length > 1 ? words.map((word) => word[0]).join("") : (words[0] || "?");
      return letters.slice(0, 3).toUpperCase();
    }

    // Shown when no flag file exists for a country: its letters on a coloured block.
    function flagFallback(name) {
      const block = document.createElement("div");
      const hue = [...String(name)].reduce((sum, char) => (sum * 31 + char.charCodeAt(0)) % 360, 17);
      block.className = "flag-img flag-fallback";
      block.style.setProperty("--h", hue);
      block.textContent = initials(name);
      block.setAttribute("aria-hidden", "true");
      return block;
    }

    function flagImage(name, rows, eager) {
      const key = slug(name);
      if (flagMissing.has(key)) return flagFallback(name);

      const row = rows.find((item) => same(item.country, name));
      let urls = flagUrls(row || { country: name });
      if (flagFound.has(key)) urls = [flagFound.get(key), ...urls.filter((url) => url !== flagFound.get(key))];

      const image = document.createElement("img");
      let tried = 0;

      image.className = "flag-img";
      image.alt = "";
      image.decoding = "async";
      image.loading = eager === false ? "lazy" : "eager";
      image.fetchPriority = eager === false ? "low" : "auto";

      image.addEventListener("load", () => flagFound.set(key, urls[tried]));

      // If a file is missing, try the next source; if all fail, show the letters instead.
      image.addEventListener("error", () => {
        tried += 1;
        if (tried < urls.length) {
          image.src = encodeURI(urls[tried]);
        } else {
          flagMissing.add(key);
          if (image.parentNode) image.replaceWith(flagFallback(name));
          else image.style.visibility = "hidden";
        }
      });

      if (urls.length) image.src = encodeURI(urls[0]);
      else return flagFallback(name);

      return image;
    }

    /* ---------- Ranks (ties share a place), stats and the extras on each row ---------- */

    const view = { key: "", year: 0, edition: null, rows: [], finalists: [], groups: [], hasVotes: false,
                   stats: new Map(), official: new Map(), qualified: null };
    let qualFilter = "all";   // all | yes | no  (semifinals only)
    let query = "";

    /* ---------- Running order (from the participants page) ---------- */

    let people = {};

    function usePeople(data) {
      const out = {};

      Object.keys(data || {}).forEach((year) => {
        if (!Number.isInteger(Number(year))) return;
        const value = data[year];
        const raw = Array.isArray(value) ? value : value && value.entries;
        const list = Array.isArray(raw) ? raw : (raw && typeof raw === "object" ? Object.values(raw) : []);

        out[year] = list.filter((entry) => entry && entry.country).map((entry) => ({
          country: String(entry.country).trim(),
          semi: String(entry.semi || "").trim(),
          inFinal: entry.inFinal === undefined ? true : Boolean(entry.inFinal),
          semiOrder: Number(entry.semiOrder) || 0,
          finalOrder: Number(entry.finalOrder) || 0
        }));
      });

      people = out;
    }

    // country -> position in the running order of the shown round
    function runOrderFor(year, round) {
      const grand = round === "Grand Final";
      const order = new Map();

      (people[year] || []).forEach((entry) => {
        if (grand && !entry.inFinal) return;
        const number = grand ? entry.finalOrder : (slug(entry.semi) === slug(round) ? entry.semiOrder : 0);
        if (number > 0) order.set(slug(entry.country), number);
      });

      return order;
    }

    /* ---------- Tie-break rules (as at the Eurovision Song Contest) ----------
       Countries level on points are separated by:
         1. more televote (audience) points
         2. points from more voting countries
         3. a countback of point values: most 12s, then 10s, 8s ... down to 1
         4. the earlier position in the running order
            (if that decides a tie for 1st and the earlier song is the host country, the later one wins)
       Returns { diff, reason }: diff < 0 means "a goes first"; reason says what decided it. */

    function tieBreak(a, b, ctx) {
      const sa = ctx.stats.get(a.country.toLowerCase()) || {};
      const sb = ctx.stats.get(b.country.toLowerCase()) || {};

      const teleA = sa.tele || 0, teleB = sb.tele || 0;
      if (teleA !== teleB) return { diff: teleB - teleA, reason: "more televote points" };

      const votersA = sa.voters || 0, votersB = sb.voters || 0;
      if (votersA !== votersB) return { diff: votersB - votersA, reason: "points from more countries" };

      for (const value of VOTE_POINTS) {
        const countA = (sa.counts && sa.counts[value]) || 0;
        const countB = (sb.counts && sb.counts[value]) || 0;
        if (countA !== countB) return { diff: countB - countA, reason: "more " + value + "-point scores" };
      }

      const runA = ctx.run.get(slug(a.country)) || 1e9;
      const runB = ctx.run.get(slug(b.country)) || 1e9;
      if (runA !== runB) return { diff: runA - runB, reason: "an earlier place in the running order" };

      return { diff: 0, reason: "" };
    }

    // The finalists from first to last. Without any votes or running order they keep the order they were entered in.
    function orderFinalists(finalists, ctx) {
      const index = new Map(finalists.map((item, i) => [item, i]));
      const everyRank = finalists.length > 0 && finalists.every((item) => item.rank);

      const list = finalists.slice().sort((a, b) => {
        if (everyRank) return a.rank - b.rank;                       // ranks typed in by hand win

        const pa = pointsOf(a), pb = pointsOf(b);
        if (pa === null || pb === null) {
          if (pa === pb) return index.get(a) - index.get(b);
          return pa === null ? 1 : -1;
        }
        if (pa !== pb) return pb - pa;

        return tieBreak(a, b, ctx).diff || index.get(a) - index.get(b);
      });

      // Host rule: a tie for 1st decided only by the running order goes to the later song if the earlier one is the host
      let hostSwap = null;
      if (ctx.host && list.length > 1 && pointsOf(list[0]) !== null && pointsOf(list[0]) === pointsOf(list[1])) {
        const result = tieBreak(list[0], list[1], ctx);
        if (result.reason === "an earlier place in the running order" && same(list[0].country, ctx.host)) {
          hostSwap = { winner: list[1], loser: list[0] };
          list.splice(0, 2, list[1], list[0]);
        }
      }

      return { list, hostSwap };
    }

    // Place and, for countries level on points, a short explanation
    function officialRanks(list, ctx) {
      const official = new Map();
      const why = (first, second) => (ctx.hostSwap && ctx.hostSwap.winner === first && ctx.hostSwap.loser === second)
        ? "the host country rule" : tieBreak(first, second, ctx).reason;

      list.forEach((item, i) => {
        const previous = list[i - 1];
        const next = list[i + 1];
        const points = pointsOf(item);
        const withPrevious = previous && points !== null && pointsOf(previous) === points;
        const withNext = next && points !== null && pointsOf(next) === points;

        let rank = i + 1;
        let tie = false;
        let note = "";

        // Nothing could separate them: they share the place (shown as =5)
        if (withPrevious && !why(previous, item)) { rank = official.get(previous.country.toLowerCase()).rank; tie = true; }
        if (withNext && !why(item, next)) tie = true;

        if (withNext && why(item, next)) note = "Level on " + points + " points: ahead of " + next.country + " on " + why(item, next) + ".";
        else if (withPrevious && why(previous, item)) note = "Level on " + points + " points: behind " + previous.country + " on " + why(previous, item) + ".";
        else if (tie) note = "Level on " + points + " points.";

        official.set(item.country.toLowerCase(), points === null
          ? { rank: null, tie: false, note: "" }
          : { rank: item.rank || rank, tie: item.rank ? false : tie, note });
      });

      return official;
    }

    /* ---------- Voting progress, qualifiers and the Grand Final line-up ---------- */

    const isSemifinal = (name) => /semi/i.test(String(name));
    const isSecondChance = (name) => /second\s*chance/i.test(String(name));
    const isQualifyingRound = (name) => isSemifinal(name) || isSecondChance(name);

    // How many countries go through from this round
    const qualifierCount = (name, edition) => (isSecondChance(name)
      ? Number((edition && edition.secondChance) || QUALIFIERS_SECOND_CHANCE)
      : QUALIFIERS_PER_SEMI);

    // Has every voting country finished BOTH its jury and its televote (and are the points in)?
    function votingProgress(rows) {
      const contestants = rows.filter((row) => !row.voterOnly);

      const done = rows.filter((row) => {
        const expected = Math.min(VOTE_POINTS.length, contestants.length - (row.voterOnly ? 0 : 1));
        if (expected < 1) return false;

        // only the groups this country votes in have to be finished
        return VOTE_GROUPS.every(({ key }) =>
          !mayVote(row, key) || ((row.votes && row.votes[key]) || []).filter(Boolean).length >= expected);
      }).length;

      const allVoted = rows.length > 0 && done === rows.length;
      const pointsIn = contestants.length > 0 && contestants.every((row) => pointsOf(row) !== null);

      return { total: rows.length, done, allVoted, pointsIn, complete: allVoted && pointsIn };
    }

    // The "Qualified through Second Chance" status (also a close spelling of it)
    const isSecondChanceStatus = (text) => /qualified.*second\s*chance/i.test(String(text || ""));

    // Countries that qualified through Second Chance: every country carrying that status in any round
    // of the edition, plus the winners of Second Chance rounds whose voting is finished.
    // Returns a Map: slug -> country name.
    function secondChanceCountries(edition) {
      const found = new Map();
      const mark = (name) => {
        const key = slug(name);
        if (key && !found.has(key)) found.set(key, String(name).trim());
      };

      [rowsFor(edition), ...roundNames(edition.year).map((name) => roundRows(edition, name))].forEach((list) =>
        (list || []).forEach((row) => {
          if (!row.voterOnly && cleanStatuses(row.statuses).some((status) => isSecondChanceStatus(status.text))) mark(row.country);
        }));

      roundNames(edition.year).filter(isSecondChance).forEach((name) =>
        (qualifiersFor(edition, name) || []).forEach(mark));

      return found;
    }

    // The countries that go through from a finished semifinal or Second Chance (null while voting goes on)
    function qualifiersFor(edition, roundName) {
      const rows = roundRows(edition, roundName);
      if (!votingProgress(rows).complete) return null;

      const stats = statsFor(rows);
      const ctx = { stats, run: runOrderFor(edition.year, roundName), host: "" };
      const list = orderFinalists(rows.filter((row) => !row.voterOnly), ctx).list;

      return list.slice(0, Math.min(qualifierCount(roundName, edition), list.length)).map((row) => row.country);
    }

    // The Grand Final rows plus, by themselves: the automatic finalists (from the participants page)
    // and the qualifiers of every semifinal whose voting is finished.
    function grandFinalRows(edition, rows) {
      const year = edition.year;
      const have = new Set(rows.filter((row) => !row.voterOnly).map((row) => slug(row.country)));
      const run = runOrderFor(year, "Grand Final");
      const extra = [];
      const waiting = [];
      const via = new Map();      // country -> the round it qualified from

      const add = (country, from) => {
        const key = slug(country);
        if (!key || have.has(key)) return;
        have.add(key);
        extra.push({ country, pending: true, from });
      };

      (people[year] || [])
        .filter((entry) => !entry.semi && entry.inFinal)
        .forEach((entry) => add(entry.country, "Automatic finalist"));

      roundNames(year).filter(isQualifyingRound).forEach((name) => {
        const roundRowsNow = roundRows(edition, name);
        if (!roundRowsNow.length) return;

        const list = qualifiersFor(edition, name);
        if (list) list.forEach((country) => { via.set(slug(country), name); add(country, name); });
        else waiting.push({ name, progress: votingProgress(roundRowsNow) });
      });

      secondChanceCountries(edition).forEach((name, key) => { via.set(key, "Second Chance"); add(name, "Second Chance"); });

      extra.sort((a, b) =>
        (run.get(slug(a.country)) || 1e9) - (run.get(slug(b.country)) || 1e9) || a.country.localeCompare(b.country));

      return { rows: rows.concat(extra), waiting, via };
    }

    // The short line under the title
    function renderVoteStatus(lineup) {
      let text = "";

      if (activeRound === "Grand Final") {
        const noPoints = !view.finalists.some((item) => pointsOf(item) !== null);

        if (lineup.waiting.length) {
          text = "Finalists so far. Still waiting for " + lineup.waiting.map((item) =>
            item.name + " (" + item.progress.done + " of " + item.progress.total + " countries have voted)").join(" and ") +
            ". Qualifiers join the Grand Final by themselves once everyone has voted.";
        } else if (noPoints && view.finalists.some((item) => item.pending)) {
          text = "The line-up is complete. Results will appear after the Grand Final.";
        }
      } else if (isQualifyingRound(activeRound) && view.progress) {
        const p = view.progress;
        const n = Math.min(qualifierCount(activeRound, view.edition), view.finalists.length);

        if (p.complete) text = n === 1
          ? "Voting is complete. The winner goes through to the Grand Final."
          : "Voting is complete. The top " + n + " go through to the Grand Final.";
        else if (p.allVoted) text = "All countries have voted. Waiting for the final points before the qualifiers are decided.";
        else text = "Voting in progress: " + p.done + " of " + p.total + " countries have voted. " +
          "The qualifiers are decided once every country has finished its jury and televote.";
      }

      if (view.progress && view.progress.complete && view.secondExtra) {
        text += " " + view.secondExtra + (view.secondExtra === 1 ? " more qualifies" : " more qualify") + " through Second Chance.";
      }

      $("voteStatus").hidden = !text;
      $("voteStatus").textContent = text;
    }

    // Places where equal values share the same rank (two countries on 120 are both 5th).
    function rankLabels(list, valueOf) {
      return list.map((item) => {
        const value = valueOf(item);
        if (value === null || value === undefined || Number.isNaN(value)) return { rank: null, tie: false };
        const higher = list.filter((other) => valueOf(other) > value).length;
        const tie = list.some((other) => other !== item && valueOf(other) === value);
        return { rank: higher + 1, tie };
      });
    }

    const pointsOf = (item) =>
      item.points === undefined || item.points === null || item.points === "" ? null : Number(item.points);

    // Jury points, televote points and number of 12s each country received.
    function statsFor(rows) {
      const stats = new Map();
      rows.filter((row) => !row.voterOnly).forEach((row) => {
        const entry = { twelves: 0, voters: 0, counts: {}, givers: new Set() };
        VOTE_GROUPS.forEach(({ key }) => { entry[key] = 0; });
        stats.set(row.country.toLowerCase(), entry);
      });

      rows.forEach((giver) => {
        VOTE_GROUPS.forEach(({ key }) => {
          if (!mayVote(giver, key)) return;
          ((giver.votes && giver.votes[key]) || []).forEach((name, position) => {
            const entry = stats.get(String(name || "").trim().toLowerCase());
            if (!entry || same(name, giver.country)) return;
            entry[key] += VOTE_POINTS[position];
            entry.counts[VOTE_POINTS[position]] = (entry.counts[VOTE_POINTS[position]] || 0) + 1;
            entry.givers.add(giver.country.toLowerCase());
            if (position === 0) entry.twelves += 1;
          });
        });
      });

      stats.forEach((entry) => { entry.voters = entry.givers.size; });

      return stats;
    }

    // Semifinals: a country qualified when it is a finalist in the Grand Final of the same year.
    // Before the voting is finished only the Second Chance qualifiers are marked; nobody is marked "out" yet.
    const isQualified = (item) => {
      if (view.qualified) return view.qualified.has(slug(item.country));
      return isQualifyingRound(activeRound) && view.secondChance && view.secondChance.has(slug(item.country)) ? true : null;
    };

    function buildRow(item, index, rows, clickable, meta) {
      meta = meta || {};
      const row = document.createElement("div");
      row.className = "row" + (item.voterOnly ? " voter-only" : "") + (meta.gold ? " gold" : "") + (!meta.pending && Number(meta.rank) === 2 ? " silver" : "") + (!meta.pending && Number(meta.rank) === 3 ? " bronze" : "") + (meta.pending ? " pending" : "") +
        (meta.qual === true ? " qualified" : meta.qual === false ? " eliminated" : "");
      row.dataset.country = item.country;

      const rank = document.createElement("div");
      rank.className = "cell rank";
      rank.textContent = meta.pending ? "–" : String(meta.rank || item.rank || index + 1).padStart(2, "0");
      if (meta.note) rank.title = meta.note;

      if (meta.tie) {
        const eq = document.createElement("sup");
        eq.className = "eq";
        eq.title = "Tied on points";
        eq.textContent = "=";
        rank.prepend(eq);
      }

      const flag = document.createElement("div");
      flag.className = "cell flag";
      flag.append(flagImage(item.country, rows, index < 12));

      const name = document.createElement("div");
      name.className = "cell name";

      const country = document.createElement("span");
      country.className = "country";
      country.textContent = item.country;
      country.title = item.country;
      name.append(country);

      const points = document.createElement("div");
      points.className = "cell points";
      const shown = meta.value !== undefined ? meta.value : item.points;
      points.textContent = meta.pending ? "–" : (shown === undefined || shown === null ? "" : shown);

      row.append(rank, flag, name, points);

      if (clickable) {
        row.classList.add("clickable");
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        row.setAttribute("aria-label", item.country + (meta.rank ? ", place " + meta.rank : "") + (shown !== undefined && shown !== null ? ", " + shown + " points" : "") +
          (meta.qual === true ? ", qualified for the Grand Final" : meta.qual === false ? ", did not qualify" : "") + ": show detailed points");
        row.addEventListener("click", () => openDetail(item.country));
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openDetail(item.country);
          }
        });
      }

      return row;
    }

    // Draws the rows in the official order (semifinals can filter qualifiers).
    function renderBoard() {
      const { finalists, rows, official, hasVotes } = view;

      const shown = finalists.filter((item) =>
        qualFilter === "all" || !view.qualified || (qualFilter === "yes") === isQualified(item));

      board.textContent = "";
      const frag = document.createDocumentFragment();

      shown.forEach((item, position) => {
        const place = official.get(item.country.toLowerCase()) || {};

        frag.append(buildRow(item, position, rows, hasVotes && !item.pending, {
          pending: pointsOf(item) === null,
          rank: place.rank,
          tie: place.tie,
          note: place.note,
          value: item.points,
          gold: place.rank === 1 && Number(item.points) > 0,
          qual: isQualified(item)
        }));
      });

      board.append(frag);
      layoutColumns();
      applySearch();
    }

    // Slides the rows from their old place to the new one.
    function withFlip(update) {
      const first = new Map();
      board.querySelectorAll(".row").forEach((row) => first.set(row.dataset.country, row.getBoundingClientRect()));
      board.classList.add("nofx");
      update();
      setTimeout(() => board.classList.remove("nofx"), 800);

      if (reduceMotion.matches || board.children.length > (columnQuery.matches ? 30 : 40)) return;

      board.querySelectorAll(".row").forEach((row) => {
        const before = first.get(row.dataset.country);
        if (!before) return;
        const after = row.getBoundingClientRect();
        const dx = before.left - after.left;
        const dy = before.top - after.top;
        if (!dx && !dy) return;

        row.animate(
          [{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }],
          { duration: columnQuery.matches ? 380 : 650, easing: "cubic-bezier(.3,.8,.25,1)" }
        );
      });
    }

    const live = (text) => {
      $("live").textContent = "";
      setTimeout(() => { $("live").textContent = text; }, 40);
    };

    function applySearch() {
      const wanted = slug(query);
      let hits = 0;

      board.querySelectorAll(".row").forEach((row) => {
        const hit = !wanted || slug(row.dataset.country).includes(wanted);
        row.classList.toggle("dim", !hit);
        row.classList.toggle("match", Boolean(wanted) && hit);
        if (hit) hits += 1;
      });

      applySearch.hits = hits;
      return hits;
    }

    function renderQualButtons() {
      const box = $("qualFilter");
      box.hidden = !view.qualified;
      box.innerHTML = "";
      if (!view.qualified) { qualFilter = "all"; return; }

      const yes = view.finalists.filter((item) => isQualified(item)).length;
      const options = [
        ["all", "All " + view.finalists.length],
        ["yes", "✓ Qualified " + yes],
        ["no", "✕ Out " + (view.finalists.length - yes)]
      ];

      options.forEach(([key, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.classList.toggle("active", key === qualFilter);
        button.setAttribute("aria-pressed", String(key === qualFilter));
        button.addEventListener("click", () => {
          if (qualFilter === key) return;
          qualFilter = key;
          renderQualButtons();
          withFlip(renderBoard);
          live(label);
        });
        box.append(button);
      });
    }

    // The country in first place (named in the page title)
    function leaderOf() {
      const list = view.finalists.filter((item) => pointsOf(item) !== null);
      return list.find((item) => (view.official.get(item.country.toLowerCase()) || {}).rank === 1) || list[0] || null;
    }

    // Page title and the text shown when the link is shared.
    function updateMeta(edition, top) {
      const grand = activeRound === "Grand Final";
      const verb = grand ? " won" : " finished first";
      const title = edition.year + " " + (grand ? "Results" : activeRound + " Results") +
        (top ? " – " + top.country + verb : "") + " | Eurovision Rewind";
      const text = top
        ? "Eurovision Rewind " + edition.year + (edition.city ? " in " + edition.city : "") + ": " + top.country + verb +
          " with " + pointsOf(top) + " points. See the full scoreboard and who voted for whom."
        : "Eurovision Rewind scoreboards for every edition.";

      document.title = title;
      $("metaDesc").setAttribute("content", text);
      $("ogTitle").setAttribute("content", title);
      $("ogDesc").setAttribute("content", text);
    }

    /* ---------- Share links ---------- */

    // #2028 (Grand Final), #2028/semifinal-1, and with a country: #2028/grand-final/france
    function hashFor(country) {
      const round = activeRound !== "Grand Final" ? "/" + roundKey(activeRound) : (country ? "/grand-final" : "");
      return "#" + currentYear() + round + (country ? "/" + slug(country) : "");
    }

    function shareUrl(country) {
      const url = new URL(location.href);
      url.searchParams.delete("data");
      url.searchParams.delete("tune");
      if (url.searchParams.has("edition")) url.searchParams.set("edition", currentYear());
      url.hash = hashFor(country);
      return url.toString();
    }

    function toast(text) {
      const box = $("toast");
      // A modal window hides everything behind it, so show the message inside it.
      (detail.open ? detail : document.body).append(box);
      box.textContent = text;
      box.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => box.classList.remove("show"), 2200);
    }

    async function copyLink(url) {
      try {
        await navigator.clipboard.writeText(url);
      } catch (error) {
        const field = document.createElement("textarea");
        field.value = url;
        field.style.cssText = "position:fixed;opacity:0";
        document.body.append(field);
        field.select();
        try { document.execCommand("copy"); } catch (inner) { /* the link is in the address bar anyway */ }
        field.remove();
      }
      toast("Link copied");
    }

    // A link like #2028/grand-final/france opens that country's window.
    function openFromHash() {
      let wanted = "";
      try { wanted = decodeURIComponent(location.hash.replace("#", "").split("/")[2] || ""); } catch (error) { wanted = ""; }
      if (!wanted || detail.open || !view.hasVotes) return;

      const found = view.finalists.find((item) => slug(item.country) === wanted);
      if (found) openDetail(found.country);
    }

    function layoutColumns() {
      const count = board.children.length;
      const columns = columnQuery.matches ? 1 : 2;
      board.style.setProperty("--per-col", Math.max(1, Math.ceil(count / columns)));
    }

    function render() {
      const year = currentYear();
      const edition = allEditions().find((item) => item.year === year);

      // Work out which subset is open before reading any rows.
      const rounds = ["Grand Final", ...roundNames(year)];
      const wanted = hashRoundSlug();
      if (wanted) {
        activeRound = rounds.find((round) => roundKey(round) === wanted || round === wanted) || "Grand Final";
      } else if (!rounds.includes(activeRound)) {
        activeRound = "Grand Final";
      }

      let rows = roundRows(edition, activeRound);

      // Grand Final: automatic finalists and the qualifiers of finished semifinals are added by themselves
      let lineup = { waiting: [] };
      if (activeRound === "Grand Final") {
        lineup = grandFinalRows(edition, rows);
        rows = lineup.rows;
      }

      const finalists = rows.filter((item) => !item.voterOnly);
      const customised = activeRound !== "Grand Final" || Boolean(savedData[year] || drafts[year]);
      const hasVotes = groupsWithVotes(rows).length > 0;

      $("tabs").innerHTML = "";
      allEditions().forEach((item) => {
        const link = document.createElement("a");
        link.href = "#" + item.year;
        link.textContent = item.year;
        if (item.year === year) {
          link.classList.add("active");
          link.setAttribute("aria-current", "true");
        }
        $("tabs").append(link);
      });

      $("year").textContent = edition.year;
      $("sub").textContent = activeRound + " · " + edition.city;

      const roundPicker = $("roundPicker");
      roundPicker.innerHTML = "";
      roundPicker.hidden = rounds.length < 2;
      rounds.forEach((round) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = round;
        button.classList.toggle("active", round === activeRound);
        button.setAttribute("aria-pressed", String(round === activeRound));
        button.addEventListener("click", () => { selectRound(round); render(); afterRoundChange(); });
        roundPicker.append(button);
      });

      $("hint").hidden = !hasVotes;
      $("hint").textContent = "Tap a country to see who gave and received its points.";

      board.innerHTML = "";
      const hasResults = finalists.length > 0;
      board.hidden = !hasResults;
      $("empty").hidden = hasResults;
      $("empty").textContent = activeRound === "Grand Final"
        ? (edition.emptyText || "Results for this edition are coming soon.")
        : "Results for " + activeRound + " are coming soon." +
          (new URLSearchParams(location.search).has("data") ? " Add its countries with the editor below." : "");

      // Everything the board and toolbar need
      const groups = groupsWithVotes(rows);

      if (view.key !== year + "|" + activeRound) { qualFilter = "all"; view.key = year + "|" + activeRound; }

      view.year = year;
      view.edition = edition;
      view.rows = rows;
      view.groups = groups;
      view.hasVotes = hasVotes;
      view.stats = statsFor(rows);

      // Order the countries with the tie-break rules
      const ctx = { stats: view.stats, run: runOrderFor(year, activeRound), host: edition.host || "" };
      const ordered = orderFinalists(finalists, ctx);
      ctx.hostSwap = ordered.hostSwap;
      view.finalists = ordered.list;
      view.official = officialRanks(ordered.list, ctx);

      const anyTie = [...view.official.values()].some((place) => place.note);
      $("tieNote").hidden = !anyTie;
      $("tieNote").textContent = "Countries level on points are separated by televote points, then points from more countries, " +
        "then the most 12s, 10s, 8s… and finally the running order. Tap the rank to see what decided it.";

      // Semifinals and Second Chance: once every country has finished voting, the top of the table qualifies.
      view.qualified = null;
      view.progress = null;
      view.via = lineup.via || new Map();
      view.secondChance = secondChanceCountries(edition);
      view.secondExtra = 0;
      if (isQualifyingRound(activeRound) && hasResults) {
        view.progress = votingProgress(rows);
        if (view.progress.complete) {
          view.qualified = new Set(ordered.list.slice(0, Math.min(qualifierCount(activeRound, edition), ordered.list.length))
            .map((item) => slug(item.country)));

          // Qualified through Second Chance: also a qualifier here, even outside the top of the table
          finalists.forEach((item) => {
            const key = slug(item.country);
            if (view.secondChance.has(key) && !view.qualified.has(key)) { view.qualified.add(key); view.secondExtra += 1; }
          });
        }
      }

      renderVoteStatus(lineup);
      document.querySelector(".save-wrap").hidden = !finalists.some((item) => pointsOf(item) !== null);

      $("toolbar").hidden = !hasResults;
      renderQualButtons();
      updateMeta(edition, hasResults ? leaderOf() : null);

      renderBoard();
      openFromHash();
    }

    /* ---------- Detail window: who gave and received a country's points ---------- */

    const detail = $("detail");
    const detailState = { country: "", group: "" };

    function votesLine(points, names, rows) {
      const line = document.createElement("div");
      line.className = "vline";

      const value = document.createElement("div");
      value.className = "vpoints";
      value.textContent = points;

      const list = document.createElement("div");
      list.className = "vnames";

      names.forEach((name) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        const label = document.createElement("span");
        label.textContent = name;
        chip.append(flagImage(name, rows), label);
        list.append(chip);
      });

      line.append(value, list);
      return line;
    }

    function emptyNote(text) {
      const note = document.createElement("div");
      note.className = "detail-empty";
      note.textContent = text;
      return note;
    }

    function renderDetail() {
      const edition = allEditions().find((item) => item.year === currentYear());
      const rows = roundRows(edition, activeRound);
      const finalists = rows.filter((item) => !item.voterOnly);
      const index = finalists.findIndex((item) => same(item.country, detailState.country));

      if (index < 0) {
        if (detail.open) detail.close();
        return;
      }

      const row = finalists[index];
      const groups = groupsWithVotes(rows);
      if (!groups.some((group) => group.key === detailState.group)) {
        detailState.group = groups.length ? groups[0].key : "";
      }
      const group = detailState.group;

      const place = view.official.get(row.country.toLowerCase()) || {};
      $("detailRank").textContent = (place.tie ? "=" : "") + String(row.rank || place.rank || index + 1).padStart(2, "0");
      $("detailTotal").textContent = (row.points ?? "") + " pts";

      const received12 = statsFor(rows).get(row.country.toLowerCase()) || {};
      const facts = [];
      if (received12.twelves) facts.push("12 points × " + received12.twelves);
      groups.forEach(({ key, label }) => facts.push(label + " " + (received12[key] || 0)));
      if (votesVia(row) !== "both") facts.push("Votes: " + votingLabel(row));
      $("detailStats").textContent = facts.join("  ·  ");

      $("detailTie").hidden = !place.note;
      $("detailTie").textContent = place.note || "";

      const qual = isQualified(row);
      $("detailQual").hidden = qual === null;
      $("detailQual").className = "qpill " + (qual ? "yes" : "no");
      $("detailQual").textContent = qual ? "✓ Qualified for the Grand Final" : "✕ Did not qualify";

      // Automatic status: a country that qualified through Second Chance
      const given = Array.isArray(row.statuses) ? row.statuses : Object.values(row.statuses || {});
      const throughSecondChance = view.secondChance && view.secondChance.has(slug(row.country));
      const statuses = cleanStatuses(throughSecondChance
        ? given.concat([{ text: "Qualified through Second Chance" }])
        : given);
      $("detailStatuses").innerHTML = "";
      $("detailStatuses").hidden = !statuses.length;
      statuses.forEach((status) => $("detailStatuses").append(statusPill(status)));

      $("detailName").innerHTML = "";
      const title = document.createElement("h2");
      title.id = "detailTitle";
      title.textContent = row.country;
      $("detailName").append(flagImage(row.country, rows), title);

      $("detailTabs").innerHTML = "";
      if (groups.length > 1) {
        groups.forEach(({ key, label }) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = label;
          button.classList.toggle("active", key === group);
          button.addEventListener("click", () => {
            detailState.group = key;
            renderDetail();
          });
          $("detailTabs").append(button);
        });
      }

      // Points received: everyone whose list names this country
      const received = [];
      let receivedSum = 0;

      VOTE_POINTS.forEach((points, position) => {
        const givers = rows
          .filter((giver) => mayVote(giver, group) && giver.votes && giver.votes[group] && same(giver.votes[group][position], row.country))
          .map((giver) => giver.country);

        if (givers.length) {
          received.push([points, givers]);
          receivedSum += points * givers.length;
        }
      });

      $("receivedTotal").textContent = received.length ? receivedSum + " pts" : "";
      $("detailReceived").innerHTML = "";
      if (received.length) received.forEach(([points, givers]) => $("detailReceived").append(votesLine(points, givers, rows)));
      else $("detailReceived").append(emptyNote("No points received."));

      // Points given: this country's own list
      const own = (row.votes && row.votes[group]) || [];
      $("detailGiven").innerHTML = "";
      let any = false;

      VOTE_POINTS.forEach((points, position) => {
        if (own[position]) {
          any = true;
          $("detailGiven").append(votesLine(points, [own[position]], rows));
        }
      });

      if (!any) {
        $("detailGiven").append(emptyNote(mayVote(row, group)
          ? "No votes entered for this country."
          : row.country + " votes by " + (votesVia(row) === "jury" ? "jury only" : "televote only") + ", so it gave no " +
            groups.find((item) => item.key === group).label + " points."));
      }

      // Stagger the rows and chips so they slide in one after another.
      detail.querySelectorAll(".vline").forEach((line, i) => {
        line.style.setProperty("--i", i);
        line.querySelectorAll(".chip").forEach((chip, j) => chip.style.setProperty("--i", i + j));
      });
    }

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    // Count the total up from 0 when the window opens.
    function countUp(element) {
      const target = parseInt(element.textContent, 10);
      if (!Number.isFinite(target) || target <= 0 || reduceMotion.matches) return;

      const start = performance.now();
      const duration = 800;

      const step = (now) => {
        const t = Math.min(1, (now - start) / duration);
        element.textContent = Math.round(target * (1 - Math.pow(1 - t, 3))) + " pts";
        if (t < 1 && detail.open) requestAnimationFrame(step);
        else element.textContent = target + " pts";
      };

      element.textContent = "0 pts";
      requestAnimationFrame(step);
    }

    let closeTimer = 0;
    let freshTimer = 0;

    function closeDetail() {
      if (!detail.open || detail.classList.contains("closing")) return;

      if (reduceMotion.matches) {
        detail.close();
        return;
      }

      detail.classList.add("closing");
      closeTimer = setTimeout(() => {
        detail.classList.remove("closing");
        detail.close();
      }, 200);
    }

    let lastFocus = null;

    function openDetail(country) {
      detailState.country = country;
      if (!detail.open) lastFocus = document.activeElement;
      history.replaceState(null, "", location.pathname + location.search + hashFor(country));
      clearTimeout(closeTimer);
      detail.classList.remove("closing");
      renderDetail();

      if (!detail.open) {
        detail.classList.add("fresh");
        detail.showModal();

    /* ---------- Save the scoreboard as an image ----------
       The picture is drawn on a fixed template (not generated): the same blocks as the page,
       on the page's background. Flags come from the same sources as the page. */

    const IMAGE_TEMPLATES = {
      full:   { width: 1080, height: 0,    top: 0,  header: 300, label: "" },
      square: { width: 1080, height: 1080, top: 8,  header: 275, label: "TOP 8" },
      story:  { width: 1080, height: 1920, top: 12, header: 430, label: "TOP 12" }
    };

    // The first flag file that loads (CORS allowed, so the picture can be saved)
    function loadImage(urls) {
      return new Promise((resolve) => {
        let at = 0;

        const next = () => {
          if (at >= urls.length) { resolve(null); return; }
          const image = new Image();
          const timer = setTimeout(() => { image.onload = image.onerror = null; at += 1; next(); }, 7000);
          image.crossOrigin = "anonymous";
          image.onload = () => { clearTimeout(timer); resolve(image); };
          image.onerror = () => { clearTimeout(timer); at += 1; next(); };
          image.src = encodeURI(urls[at]);
        };

        next();
      });
    }

    function flagForImage(item) {
      const key = slug(item.country);
      let urls = flagUrls(item).map((url) => url.replace("/w160/", "/w320/"));
      if (flagFound.has(key)) urls = [flagFound.get(key), ...urls];
      return loadImage(urls);
    }

    // Rounded rectangle with a radius for each corner [top-left, top-right, bottom-right, bottom-left]
    function roundedBox(ctx, x, y, w, h, radii) {
      const [tl, tr, br, bl] = radii;
      ctx.beginPath();
      ctx.moveTo(x + tl, y);
      ctx.lineTo(x + w - tr, y);
      ctx.arcTo(x + w, y, x + w, y + tr, tr);
      ctx.lineTo(x + w, y + h - br);
      ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
      ctx.lineTo(x + bl, y + h);
      ctx.arcTo(x, y + h, x, y + h - bl, bl);
      ctx.lineTo(x, y + tl);
      ctx.arcTo(x, y, x + tl, y, tl);
      ctx.closePath();
    }

    function fitText(ctx, text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) return text;
      let cut = text;
      while (cut.length > 1 && ctx.measureText(cut + "…").width > maxWidth) cut = cut.slice(0, -1);
      return cut + "…";
    }

    // Text with space between the letters
    function spacedText(ctx, text, centerX, y, spacing) {
      const letters = [...text];
      const widths = letters.map((letter) => ctx.measureText(letter).width);
      const total = widths.reduce((sum, width) => sum + width, 0) + spacing * (letters.length - 1);
      let x = centerX - total / 2;
      const align = ctx.textAlign;
      ctx.textAlign = "left";
      letters.forEach((letter, i) => { ctx.fillText(letter, x, y); x += widths[i] + spacing; });
      ctx.textAlign = align;
    }

    function glow(ctx, x, y, radius, color) {
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    }

    async function buildImage(key) {
      const tpl = IMAGE_TEMPLATES[key];
      const list = view.finalists.filter((item) => pointsOf(item) !== null).slice(0, tpl.top || 1e9);
      if (!list.length) throw new Error("no results");

      const rowFont = (getComputedStyle(document.querySelector(".row .name") || document.body).fontFamily) || "Montserrat, sans-serif";
      const yearStyle = getComputedStyle($("year"));
      const yearFont = yearStyle.fontFamily || rowFont;
      const brandFont = "Montserrat, sans-serif";

      try {
        await Promise.all([
          document.fonts.load("800 40px " + rowFont),
          document.fonts.load("800 100px " + yearFont),
          document.fonts.load("800 20px Montserrat")
        ]);
        await document.fonts.ready;
      } catch (error) { /* the fallback font is fine */ }

      const flags = await Promise.all(list.map(flagForImage));
      const logoSource = document.querySelector(".header-wrapper img");
      const logo = logoSource && logoSource.src ? await loadImage([logoSource.src]) : null;

      // Layout
      const W = tpl.width;
      const margin = 70;
      const gap = key === "full" ? 8 : 12;
      const footer = 100;
      let rowH, H;

      if (key === "full") {
        rowH = 64;
        H = tpl.header + list.length * (rowH + gap) - gap + footer + 20;
      } else {
        H = tpl.height;
        const room = H - tpl.header - footer - 20;
        rowH = Math.min(key === "story" ? 100 : 92, Math.floor((room + gap) / list.length) - gap);
      }

      const boardH = list.length * (rowH + gap) - gap;
      const top = key === "full" ? tpl.header : tpl.header + Math.max(0, (H - tpl.header - footer - 20 - boardH) / 2);

      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");

      // Background
      const background = ctx.createLinearGradient(0, 0, 0, H);
      background.addColorStop(0, "#241b7c");
      background.addColorStop(0.55, "#1a1560");
      background.addColorStop(1, "#110c3c");
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, W, H);
      glow(ctx, 0, 0, W * 0.9, "rgba(120, 90, 255, .38)");
      glow(ctx, W, H, W * 0.9, "rgba(60, 150, 255, .22)");

      // Header
      const grand = activeRound === "Grand Final";
      const city = (view.edition && view.edition.city) || "";
      const yearSize = key === "story" ? 200 : key === "square" ? 120 : 150;
      const yearY = key === "story" ? 330 : key === "square" ? 182 : 205;

      ctx.textBaseline = "alphabetic";
      ctx.textAlign = "center";
      ctx.fillStyle = "#cfc8ff";
      ctx.font = "800 22px " + brandFont;
      spacedText(ctx, "EUROVISION REWIND", W / 2, key === "story" ? 90 : key === "square" ? 56 : 66, 7);

      ctx.font = "800 " + yearSize + "px " + yearFont;
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.round(yearSize / 14);
      ctx.strokeStyle = "#000";
      ctx.strokeText(String(view.year), W / 2, yearY);
      ctx.fillStyle = "#fff";
      ctx.fillText(String(view.year), W / 2, yearY);

      ctx.fillStyle = "#cfc8ff";
      ctx.font = "800 " + (key === "story" ? 30 : 25) + "px " + brandFont;
      const sub = [grand ? "GRAND FINAL" : activeRound.toUpperCase(), city.toUpperCase(), tpl.label].filter(Boolean).join("  ·  ");
      spacedText(ctx, sub, W / 2, yearY + (key === "story" ? 70 : key === "square" ? 50 : 56), 3);

      // Rows (the same blocks as the page)
      const r = rowH * 0.34;
      const rankW = Math.round(rowH * 0.95);
      const flagW = Math.round(rowH * 1.4);
      const pointsW = Math.round(rowH * 1.5);
      const air = 6;
      const rowW = W - margin * 2;

      list.forEach((item, i) => {
        const y = top + i * (rowH + gap);
        const x = margin;
        const place = view.official.get(item.country.toLowerCase()) || {};
        const qualified = isQualified(item);
        const first = place.rank === 1 && Number(item.points) > 0;

        // rank
        let rankFill = ctx.createLinearGradient(0, y, 0, y + rowH);
        let rankInk = "#fff";
        if (first) { rankFill.addColorStop(0, "#ffe07a"); rankFill.addColorStop(1, "#ffcf4a"); rankInk = "#1b1830"; }
        else if (qualified === true) { rankFill.addColorStop(0, "#5cf0a3"); rankFill.addColorStop(1, "#1fb46c"); rankInk = "#052a1a"; }
        else { rankFill.addColorStop(0, "#7b4bd9"); rankFill.addColorStop(1, "#5a2aa3"); }
        ctx.fillStyle = rankFill;
        roundedBox(ctx, x, y, rankW, rowH, [r, 0, 0, r]);
        ctx.fill();
        ctx.fillStyle = rankInk;
        ctx.font = "800 " + Math.round(rowH * 0.42) + "px " + rowFont;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText((place.tie ? "=" : "") + String(place.rank || i + 1).padStart(2, "0"), x + rankW / 2, y + rowH / 2 + 1);

        // flag (sharp corners, like the page)
        const fx = x + rankW + air;
        ctx.save();
        ctx.beginPath();
        ctx.rect(fx, y, flagW, rowH);
        ctx.clip();
        const image = flags[i];
        if (image) {
          const scale = Math.max(flagW / image.width, rowH / image.height);
          const dw = image.width * scale, dh = image.height * scale;
          ctx.drawImage(image, fx + (flagW - dw) / 2, y + (rowH - dh) / 2, dw, dh);
        } else {
          const hue = [...item.country].reduce((sum, char) => (sum * 31 + char.charCodeAt(0)) % 360, 17);
          ctx.fillStyle = "hsl(" + hue + ", 45%, 32%)";
          ctx.fillRect(fx, y, flagW, rowH);
          ctx.fillStyle = "#fff";
          ctx.font = "800 " + Math.round(rowH * 0.34) + "px " + brandFont;
          ctx.fillText(initials(item.country), fx + flagW / 2, y + rowH / 2 + 1);
        }
        ctx.restore();

        // name
        const nx = fx + flagW + air;
        const nameW = x + rowW - pointsW - 3 - nx;
        ctx.fillStyle = qualified === false ? "#e6e4f1" : "#ffffff";
        ctx.fillRect(nx, y, nameW, rowH);
        ctx.fillStyle = "#1c1a55";
        ctx.font = "800 " + Math.round(rowH * 0.42) + "px " + rowFont;
        ctx.textAlign = "left";
        ctx.fillText(fitText(ctx, item.country, nameW - rowH * 0.6), nx + rowH * 0.3, y + rowH / 2 + 1);

        // points
        const px = x + rowW - pointsW;
        ctx.fillStyle = "#ffffff";
        roundedBox(ctx, px, y, pointsW, rowH, [0, r, r, 0]);
        ctx.fill();
        ctx.fillStyle = "#1c1a55";
        ctx.font = "900 " + Math.round(rowH * 0.44) + "px " + rowFont;
        ctx.textAlign = "center";
        ctx.fillText(String(item.points), px + pointsW / 2, y + rowH / 2 + 1);
      });

      // Footer
      const footY = H - 52;
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#b9b4d6";
      ctx.font = "700 20px " + brandFont;
      const host = /^(localhost|127\.|\[)/.test(location.hostname) ? "" : location.hostname;
      const brand = "EUROVISION REWIND" + (host ? "  ·  " + host.toUpperCase() : "");

      if (logo) {
        const logoH = 46;
        const logoW = logo.width * (logoH / logo.height);
        ctx.font = "800 20px " + brandFont;
        const textW = ctx.measureText(brand).width + (brand.length - 1) * 4;
        const startX = W / 2 - (logoW + 16 + textW) / 2;
        ctx.drawImage(logo, startX, footY - logoH + 12, logoW, logoH);
        ctx.textAlign = "left";
        let tx = startX + logoW + 16;
        [...brand].forEach((letter) => { ctx.fillText(letter, tx, footY); tx += ctx.measureText(letter).width + 4; });
      } else {
        ctx.font = "800 20px " + brandFont;
        spacedText(ctx, brand, W / 2, footY, 4);
      }

      return canvas;
    }

    function closeSaveMenu() {
      $("saveMenu").hidden = true;
      $("saveBtn").setAttribute("aria-expanded", "false");
    }

    async function saveImage(key) {
      closeSaveMenu();
      toast("Creating your image…");

      try {
        const canvas = await buildImage(key);
        const blob = await new Promise((resolve, reject) =>
          canvas.toBlob((result) => (result ? resolve(result) : reject(new Error("no image"))), "image/png"));

        const name = "eurovision-rewind-" + view.year + "-" + roundKey(activeRound) + (key === "full" ? "" : "-" + key) + ".png";
        const file = new File([blob], name, { type: "image/png" });

        // On phones the share sheet has "Save image"; everywhere else the file downloads.
        if (matchMedia("(pointer: coarse)").matches && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: document.title });
            toast("Image ready");
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return;
          }
        }

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = name;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 4000);
        toast("Image saved");
      } catch (error) {
        toast("Could not create the image");
      }
    }

    document.addEventListener("keydown", (event) => {

    });


    // "/" jumps to the search box
    document.addEventListener("keydown", (event) => {
      if (event.key !== "/" || event.ctrlKey || event.metaKey || event.altKey || detail.open) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable) return;

    /* ---------- Database + admin sign-in (shared) ---------- */

    const CFG = window.STATUS_CONFIG || {};
    const configured =
      CFG.dbUrl && CFG.apiKey && !/YOUR-/.test(CFG.dbUrl + CFG.apiKey);
    const BASE = (CFG.dbUrl || "").replace(/\/$/, "");
    const STYLE_URL = BASE + "/results-style.json";
    const DATA_URL = BASE + "/results-data.json";
    const PEOPLE_URL = BASE + "/participants.json";
    const SESSION_KEY = "statusAdminSession";

    let session = null;
    try {
      session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    } catch (error) {
      session = null;
    }

    let showLogin = () => {};

    async function getToken() {
      if (!session) throw new Error("Sign in first.");

      if (session.expiresAt - Date.now() > 60000) return session.idToken;

      const response = await fetch(
        "https://securetoken.googleapis.com/v1/token?key=" + CFG.apiKey,
        {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "grant_type=refresh_token&refresh_token=" +
                encodeURIComponent(session.refreshToken)
        }
      );
      const data = await response.json();

      if (!response.ok) {
        session = null;
        localStorage.removeItem(SESSION_KEY);
        showLogin();
        throw new Error("Your session ended. Please sign in again.");
      }

      session = {
        ...session,
        idToken: data.id_token,
        refreshToken: data.refresh_token,
        expiresAt: Date.now() + Number(data.expires_in) * 1000
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      return session.idToken;
    }

    async function publish(url, payload) {
      const token = await getToken();
      const response = await fetch(url + "?auth=" + encodeURIComponent(token), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        let detail = "";
        try { detail = (await response.json()).error || ""; } catch (error) { detail = ""; }

        throw new Error(
          /permission/i.test(detail)
            ? "Permission denied. Add the results rules in Firebase (see the instructions) and Publish."
            : "Could not save (error " + response.status + (detail ? ": " + detail : "") + ")."
        );
      }
    }

    /* ---------- Saved sizes (shared by every visitor) ----------

    const SIZE_VARS = [
      ["board-w",    "Board width",          500, 1400],
      ["row-h",      "Row height",            30,   90],
      ["row-gap",    "Space between rows",     0,   16],
      ["col-gap",    "Space between columns",  0,   60],

      { name: "Sunset",   colors: { "board-bg": "#3a1030", "rank-bg": "#e2465c", "flag-bg": "#5a1c45", "name-bg": "#fff3e6", "points-bg": "#ffd28a", "text": "#ffffff", "name-text": "#3a1030", "points-text": "#3a1030" } },
      { name: "Mint",     colors: { "board-bg": "#0e2a2e", "rank-bg": "#14a38b", "flag-bg": "#17424a", "name-bg": "#eafff8", "points-bg": "#eafff8", "text": "#04201c", "name-text": "#0e2a2e", "points-text": "#0e2a2e" } },
      { name: "Mono",     colors: { "board-bg": "#14141a", "rank-bg": "#3b3b46", "flag-bg": "#22222a", "name-bg": "#f4f4f6", "points-bg": "#f4f4f6", "text": "#ffffff", "name-text": "#14141a", "points-text": "#14141a" } },
      { name: "Gold",     colors: { "board-bg": "#1d1608", "rank-bg": "#b8860b", "flag-bg": "#2d2410", "name-bg": "#fff8e1", "points-bg": "#ffe082", "text": "#1d1608", "name-text": "#3b2a00", "points-text": "#3b2a00" } }
    ];

    const STYLE_CACHE = "resultsStyleCache";

    function clearInlineSizes() {
      SIZE_VARS.concat(COLOR_VARS).forEach(([name]) =>
        document.documentElement.style.removeProperty("--" + name));

    function applySaved() {
      clearInlineSizes();
      const set = savedStyle[mode()] || {};

      SIZE_VARS.forEach(([name]) => {
        const value = set[name];
        if (typeof value === "string" && /^\d+(\.\d+)?px$/.test(value)) {
          document.documentElement.style.setProperty("--" + name, value);

      });

          document.documentElement.style.setProperty("--" + name, value);
        }
      });
    }

    function useSaved(data) {
      savedStyle = {
        desktop: (data && data.desktop) || {},
        mobile: (data && data.mobile) || {}

    try {
      useSaved(JSON.parse(localStorage.getItem(STYLE_CACHE) || "null"));

    const stylesReady = !configured ? Promise.resolve() : fetch(STYLE_URL, { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : null))
      .then((data) => {
        const fresh = data ? JSON.stringify(data) : null;
        let same = false;
        try { same = fresh !== null && localStorage.getItem(STYLE_CACHE) === fresh; } catch (error) { /* ignore */ }
        if (same) return;

    /* ---------- Saved results (points) shared by every visitor ---------- */

    const DATA_CACHE = "resultsDataCache";
    let afterDataLoad = () => {};

    const listOf = (value) => Array.isArray(value) ? value : Object.values(value || {});

    function normRow(item) {
      return {
        country: String(item.country),
        points: item.points,
        ...(item.heart ? { heart: String(item.heart) } : {}),
        ...(item.rank ? { rank: item.rank } : {}),
        ...(item.voterOnly ? { voterOnly: true } : {}),
        ...votingProp(item),
        ...statusProp(item),
