<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171329">

  <title>Results | Eurovision Rewind</title>
  <meta name="description" content="Eurovision Rewind scoreboards for every edition.">
  <link rel="icon" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.460.0"></script>

  <style>
    :root {
      --white: #ffffff;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Montserrat", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at 10% 0%, rgba(112, 83, 213, .25), transparent 40%),
        radial-gradient(ellipse at 100% 35%, rgba(52, 166, 175, .13), transparent 38%),
        linear-gradient(145deg, #171329, #101522 65%, #171329);
      background-attachment: fixed;
    }

    @media (hover: none) {
      body { background-attachment: scroll; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .header-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 18px;
    }

    .pill-header {
      display: flex;
      animation: header-arrive 700ms cubic-bezier(.2,.75,.25,1) both;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      min-height: 62px;
      padding: 8px 16px;
      background: var(--glass, rgba(255, 255, 255, 0.09));
      border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.20));
      border-radius: 999px;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      max-width: 125px;
      height: 42px;
      flex-shrink: 0;
      text-decoration: none;
    }

    .brand img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      padding: 0;
      color: white;
      background: transparent;
      border: 0;
      border-radius: 50%;
      text-decoration: none;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .nav-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .nav-icon svg {
      display: block;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .nav-icon:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    /* MAIN (empty - add your content here) */

    main {
      width: min(1180px, 94%);
      margin: 0 auto;
      padding: 26px 0 80px;
    }

    /* =========================
       CUSTOM FONT
       Put your font file in a "fonts" folder and name it results-font.ttf
       (or .otf / .woff / .woff2), or change the file names below.
    ========================= */

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-MediumItalic.otf") format("opentype");
      font-weight: 500;
      font-style: italic;
      font-display: swap;
    }

    /* =========================
       SCOREBOARD SIZES AND COLOURS
       Change any value here. Open results.html?tune to adjust them with sliders.
    ========================= */

    :root {
      --results-font: "ResultsFont", "Neulis", "Montserrat", sans-serif;
      --font-weight: 700;

      /* Shapes: height and width */
      --board-w: 1100px;                          /* whole board */
      --row-h: clamp(38px, 5.2cqw, 56px);         /* height of every row */
      --row-gap: 4px;                             /* space between rows */
      --col-gap: 22px;                            /* space between the two columns */
      --cell-gap: 0px;                            /* space between rank / name / points (0 = connected) */
      --rank-w: clamp(40px, 6cqw, 64px);          /* rank block width */
      --points-w: clamp(56px, 8.5cqw, 92px);      /* points block width */
      --heart-size: clamp(24px, 3.5cqw, 38px);    /* heart flag size */
      --font-size: clamp(14px, 2.25cqw, 24px);    /* text size */
      --name-pad: 12px;                           /* space inside the name block */
      --heart-gap: 10px;                          /* space between heart and country name */

      /* Colours */
      --board-bg: #571f64;
      --rank-bg: #7b2c8a;
      --name-bg: #913e9f;
      --points-bg: #7b2c8a;
      --text: #ffffff;

    }

    @media (max-width: 720px) {
      :root {
        --row-h: 46px;
        --row-gap: 4px;
        --rank-w: 46px;
        --points-w: 66px;
        --heart-size: 28px;
        --font-size: 17px;
        --name-pad: 8px;
        --heart-gap: 7px;
      }
    }

    /* Edition tabs */

    .edition-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
    }

    .edition-tabs a {
      min-width: 74px;
      animation: tab-arrive 500ms cubic-bezier(.2,.75,.25,1) both;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      padding: 9px 18px;
      color: #c2bfd6;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .edition-tabs a:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }

    .edition-tabs a.active {
      color: #fff;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    a:focus-visible {
      outline: 2px solid #c9bdff;
      outline-offset: 3px;
    }

    /* Heading */

    .results-head {
      margin-bottom: 18px;
      text-align: center;
      animation: heading-arrive 750ms 100ms cubic-bezier(.2,.75,.25,1) both;
    }

    .year {
      color: #fff;
      font-family: var(--results-font);
      font-size: clamp(48px, 10vw, 92px);
      font-weight: var(--font-weight);
      line-height: 1;
      text-shadow:
        -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
        0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000;
    }

    .sub {
      margin-top: 10px;
      color: #c2bfd6;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 12px;
      color: #ffd28a;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 210, 138, 0.1);
      border: 1px solid rgba(255, 210, 138, 0.3);
      border-radius: 999px;
    }

    [hidden] { display: none !important; }

    @keyframes header-arrive {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes tab-arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes heading-arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes row-arrive {
      from { opacity: 0; transform: translateX(-14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Scoreboard */

    .board-wrap {
      container-type: inline-size;
      width: 100%;
      max-width: var(--board-w);
      margin: 0 auto;
      padding: clamp(8px, 1.4vw, 14px);
        background: none;
    }

    .board {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      grid-template-rows: repeat(var(--per-col, 8), var(--row-h));
      column-gap: var(--col-gap);
      row-gap: var(--row-gap);
    }

    .row {
      display: flex;
      gap: var(--cell-gap);
      min-width: 0;
      height: var(--row-h);
      color: var(--text);
      font-family: var(--results-font);
      font-size: var(--font-size);
      font-weight: var(--font-weight);
      line-height: 1;
      transform-origin: center left;
      /* "backwards" (not "both") so the hover effect still works after the intro */
      animation: row-arrive 520ms cubic-bezier(.2,.75,.25,1) backwards;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .row:hover {
      z-index: 1;
      transform: translateX(5px) scale(1.012);
      filter: brightness(1.12);
    }

    .row:nth-child(1) { animation-delay: 180ms; }
    .row:nth-child(2) { animation-delay: 220ms; }
    .row:nth-child(3) { animation-delay: 260ms; }
    .row:nth-child(4) { animation-delay: 300ms; }
    .row:nth-child(5) { animation-delay: 340ms; }
    .row:nth-child(6) { animation-delay: 380ms; }
    .row:nth-child(7) { animation-delay: 420ms; }
    .row:nth-child(8) { animation-delay: 460ms; }
    .row:nth-child(n+9) { animation-delay: 500ms; }

    .cell {
      display: flex;
      align-items: center;
    }

    .rank {
      flex: none;
      justify-content: center;
      width: var(--rank-w);
      background: var(--rank-bg);
    }

    .name {
      flex: 1;
      min-width: 0;
      gap: var(--heart-gap);
      padding: 0 var(--name-pad);
      background: var(--name-bg);
    }

    .points {
      flex: none;
      justify-content: center;
      width: var(--points-w);
      background: var(--points-bg);
    }

    .country {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Heart image (one image file per country) */

    .heart-img {
      flex: none;
      width: var(--heart-size);
      height: auto;
      aspect-ratio: 10 / 9;
      object-fit: contain;
      transition: transform 220ms cubic-bezier(.2,.75,.25,1);
    }

    .row:hover .heart-img {
      transform: scale(1.12) rotate(-4deg);
    }

    /* While editing with ?data, skip the intro animation so typing feels instant */
    body.editing .row {
      animation: none;
    }

    .empty {
      padding: 46px 18px;
      color: #fff;
      font-family: var(--results-font);
      font-size: clamp(16px, 3vw, 22px);
      text-align: center;
      background: var(--rank-bg);
    }

    /* Size tuner (only with ?tune) */

    body.tuning main {
      padding-bottom: 56vh;
    }

    .tuner {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      max-height: 52vh;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      overflow: auto;
      background: rgba(17, 19, 27, 0.96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .tuner > * { max-width: 560px; margin-left: auto; margin-right: auto; }

    .tuner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .tuner h2 { font-size: 15px; }
    .tuner h2 small { margin-left: 8px; color: #65d5d0; font-size: 11px; font-weight: 600; }
    .tuner.collapsed #tuneBody { display: none; }

    .tune-row {
      display: grid;
      grid-template-columns: 1fr 1.4fr 52px;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: #c2bfd6;
      font-size: 12px;
      font-weight: 600;
    }

    .tune-row input { width: 100%; }
    .tune-row output { text-align: right; color: #fff; }

    .tune-login {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px auto 4px;
    }

    .tune-login input {
      flex: 1 1 150px;
      padding: 10px 12px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .tuner button {
      padding: 10px 16px;
      color: #fff;
      font: 700 12px "Montserrat", sans-serif;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }

    .tuner button.ghost {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .tuner button.small { padding: 6px 12px; }

    .tune-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tune-note { min-height: 18px; margin-top: 10px; color: #65d5d0; font-size: 12px; }
    .tune-note.error { color: #ff9b9b; }

    .tool-tabs { display: flex; gap: 6px; }

    .tuner button.tab {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .tuner button.tab.active {
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    .tool-mode { margin-bottom: 10px; color: #65d5d0; font-size: 12px; font-weight: 600; }

    .data-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      grid-template-areas:
        "rank country points"
        "rank heart   btns";
      gap: 6px 8px;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .data-rank { grid-area: rank; color: #c2bfd6; font-size: 12px; font-weight: 700; text-align: center; }
    .data-country { grid-area: country; }
    .data-points { grid-area: points; width: 92px; }
    .data-heart { grid-area: heart; }
    .data-btns { grid-area: btns; display: flex; gap: 4px; }

    .data-row input {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .data-row .data-heart { font-size: 11px; font-weight: 500; }

    .tuner .data-btns button {
      padding: 8px 10px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .hint {
      margin-top: 10px;
      color: #c2bfd6;
      font-size: 12px;
      font-weight: 600;
    }

    .row.clickable { cursor: pointer; }

    .row.clickable:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    /* ---------- Detail window (opens when a country is clicked) ---------- */

    dialog.detail {
      width: min(660px, calc(100% - 24px));
      max-width: none;
      max-height: min(88vh, 780px);
      padding: 0;
      overflow: visible;
      color: #fff;
      font-family: var(--results-font);
      background: transparent;
      border: 0;
    }

    dialog.detail::backdrop {
      background: rgba(8, 8, 16, 0.74);
      backdrop-filter: blur(3px);
    }

    dialog.detail[open] {
      animation: detail-in 280ms cubic-bezier(.2,.75,.25,1);
    }

    @keyframes detail-in {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: none; }
    }

    .detail-card {
      max-height: min(88vh, 780px);
      padding: 14px;
      overflow: auto;
      background: var(--board-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .detail-head {
      display: flex;
      align-items: stretch;
      min-height: 54px;
      font-weight: var(--font-weight);
    }

    .detail-rank,
    .detail-total,
    .detail-close {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      background: var(--rank-bg);
    }

    .detail-rank { width: 58px; font-size: 22px; }
    .detail-total { min-width: 84px; padding: 0 10px; font-size: 20px; white-space: nowrap; }

    .detail-name {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0 14px;
      background: var(--name-bg);
    }

    .detail-name h2 {
      min-width: 0;
      overflow: hidden;
      font-size: 22px;
      font-weight: inherit;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-name .heart-img { width: 38px; }

    .detail-close {
      width: 46px;
      color: #fff;
      font: inherit;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.28);
      border: 0;
      cursor: pointer;
    }

    .detail-close:focus-visible,
    .detail-tabs button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .detail-tabs {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .detail-tabs button {
      padding: 8px 18px;
      color: #e9d3f0;
      font: 700 12px "Montserrat", sans-serif;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      cursor: pointer;
    }

    .detail-tabs button.active { color: #fff; background: #7b2c8a; border-color: transparent; }

    .detail-section h3 {
      display: flex;
      justify-content: space-between;
      margin: 18px 0 8px;
      color: #e9d3f0;
      font: 700 12px "Montserrat", sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .vline {
      display: flex;
      min-height: 46px;
      margin-bottom: 4px;
    }

    .vpoints {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 58px;
      font-size: 20px;
      font-weight: var(--font-weight);
      background: var(--rank-bg);
    }

    .vnames {
      display: flex;
      flex: 1;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 16px;
      min-width: 0;
      padding: 8px 14px;
      font-size: 16px;
      font-weight: var(--font-weight);
      background: var(--name-bg);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .chip .heart-img { width: 30px; }

    .detail-empty {
      padding: 14px;
      color: #e9d3f0;
      font-size: 14px;
      background: var(--rank-bg);
    }

    @media (max-width: 720px) {
      dialog.detail { margin: auto 0 0; width: 100%; }
      .detail-card { padding: 10px; }
      .detail-rank { width: 46px; font-size: 18px; }
      .detail-total { min-width: 66px; font-size: 17px; }
      .detail-name h2 { font-size: 18px; }
      .detail-name .heart-img { width: 32px; }
      .vpoints { width: 46px; font-size: 17px; }
      .vnames { font-size: 14px; padding: 8px 10px; }
      .chip .heart-img { width: 26px; }
    }

    /* Points editor: votes */

    .vote-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
      color: #c2bfd6;
      font-size: 12px;
      font-weight: 600;
    }

    .data-item {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .data-item .data-row {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .votes-editor {
      margin-top: 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }

    .votes-editor h4 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: #65d5d0;
      font-size: 12px;
    }

    .votes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .vote-pick { display: flex; align-items: center; gap: 8px; }

    .vote-pick span {
      width: 22px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .vote-pick select {
      flex: 1;
      min-width: 0;
      padding: 8px;
      color: #fff;

    @media (max-width: 700px) {

    @media (prefers-reduced-motion: reduce) {

      *, *::before, *::after {
        transition: none !important;

        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

            <button type="button" class="ghost" id="dataReset">Reset edition to default</button>

  <dialog class="detail" id="detail" aria-labelledby="detailTitle">
    <div class="detail-card">
      <div class="detail-head">
        <div class="detail-rank" id="detailRank"></div>
        <div class="detail-name" id="detailName"></div>
        <div class="detail-total" id="detailTotal"></div>
        <button type="button" class="detail-close" id="detailClose" aria-label="Close">✕</button>
      </div>

      <div class="detail-tabs" id="detailTabs"></div>

      <section class="detail-section">
        <h3>Points received <span id="receivedTotal"></span></h3>
        <div id="detailReceived"></div>
      </section>

      <section class="detail-section">
        <h3>Points given</h3>
        <div id="detailGiven"></div>
      </section>
    </div>
  </dialog>

  <script src="status-config.js"></script>
  <script>
    /* =========================================================
       EDITIONS AND RESULTS  (edit this part)
       - One entry per edition. Rows are listed from 1st place down.
       - Each row is { country, points }. Optional: rank, heart, votes.
       - votes = the points THIS country gave. Order: 12, 10, 8, 7, 6, 5, 4, 3, 2, 1
           votes: { jury: ["Ukraine", "Georgia", ...], tele: ["Spain", ...] }
         "Points received" is worked out automatically from everyone's votes.
         Edit votes in the browser with results.html?data instead of typing them.
       - You can also edit points in the browser: open results.html?data
       - An edition with an empty results list shows a "coming soon" message.

       HEART IMAGES
       Every row shows a heart image. Its file is found from the country name:
         "France"          -> images/hearts/france.png
         "North Macedonia" -> images/hearts/north-macedonia.png
       For one special row, add  heart: "images/hearts/other-file.png".
       Change HEART_FOLDER / HEART_EXT if your files are named differently.
    ========================================================= */

    const HEART_FOLDER = "images/hearts/";
    const HEART_EXT = ".png";

    const SAMPLE_BASE = [
      { country: "France",          points: 248 },
      { country: "Ukraine",         points: 177 },
      { country: "Georgia",         points: 176 },
      { country: "Armenia",         points: 175 },
      { country: "Spain",           points: 152 },
      { country: "Albania",         points: 145 },
      { country: "North Macedonia", points: 141 },
      { country: "Poland",          points: 139 },
      { country: "Netherlands",     points: 93 },
      { country: "Malta",           points: 92 },
      { country: "Italy",           points: 73 },
      { country: "Portugal",        points: 73 },
      { country: "Croatia",         points: 70 },
      { country: "Azerbaijan",      points: 66 },
      { country: "Cyprus",          points: 50 },
      { country: "Montenegro",      points: 49 }
    ];

    // Vote groups and the order of the points a country can give.
    const VOTE_GROUPS = [
      { key: "jury", label: "Jury" },
      { key: "tele", label: "Televote" }
    ];
    const VOTE_POINTS = [12, 10, 8, 7, 6, 5, 4, 3, 2, 1];

    // DEMO VOTES so you can try the detail window. Delete this and the
    // ".map(...)" below when you have real votes.
    const SAMPLE_ROWS = SAMPLE_BASE.map((row, index) => {
      const hash = (text) => [...text].reduce((sum, char) => sum + char.charCodeAt(0), 0);
      const others = SAMPLE_BASE.map((item) => item.country).filter((name) => name !== row.country);
      const pick = (seed) => others
        .map((name) => [name, (hash(name) * (index + 3) + seed * 7) % 97])
        .sort((a, b) => a[1] - b[1])
        .slice(0, 10)
        .map(([name]) => name);

      return { ...row, votes: { jury: pick(1), tele: pick(5) } };
    });

    const EDITIONS = [
      { year: 2026, city: "Vienna, Austria",     sample: true, results: SAMPLE_ROWS },
      { year: 2027, city: "Zagreb, Croatia",     sample: true, results: SAMPLE_ROWS },
      { year: 2028, city: "Yerevan, Armenia",    sample: true, results: SAMPLE_ROWS },
      { year: 2029, city: "Zürich, Switzerland", results: [],
        emptyText: "Results will appear here after the Grand Final in Zürich." }
    ];

    /* =========================================================
       PAGE CODE (no need to edit below)
    ========================================================= */

    const $ = (id) => document.getElementById(id);
    const board = $("board");
    const columnQuery = window.matchMedia("(max-width: 720px)");

    // Published results (from the database) and unpublished edits (?data only)
    let savedData = {};
    let drafts = {};

    const rowsFor = (edition) =>
      drafts[edition.year] || savedData[edition.year] || edition.results;

    function currentYear() {
      const wanted =
        new URLSearchParams(location.search).get("edition") ||
        location.hash.replace("#", "");

      if (EDITIONS.some((edition) => String(edition.year) === wanted)) {
        return Number(wanted);
      }

      // Default: the latest edition that has results.
      const withResults = EDITIONS.filter((edition) => rowsFor(edition).length);
      return (withResults[withResults.length - 1] || EDITIONS[0]).year;
    }

    function slug(name) {
      return String(name)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    const heartSrc = (item) =>
      item.heart || HEART_FOLDER + slug(item.country) + HEART_EXT;

    const same = (a, b) =>
      String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();

    // Keep votes tidy: { jury: [10 names], tele: [10 names] } (blank = no vote)
    function cleanVotes(votes) {
      if (!votes) return undefined;
      const out = {};

      VOTE_GROUPS.forEach(({ key }) => {
        const raw = votes[key];
        if (!raw) return;
        const list = Array.isArray(raw) ? raw : Object.values(raw);
        const names = VOTE_POINTS.map((_, i) => String(list[i] || "").trim());
        if (names.some(Boolean)) out[key] = names;
      });

      return Object.keys(out).length ? out : undefined;
    }

    const groupsWithVotes = (rows) =>
      VOTE_GROUPS.filter(({ key }) => rows.some((row) => row.votes && row.votes[key]));

    function heartImage(name, rows) {
      const row = rows.find((item) => same(item.country, name));
      const image = document.createElement("img");
      image.className = "heart-img";
      image.src = encodeURI(heartSrc(row || { country: name }));
      image.alt = "";
      image.decoding = "async";
      // A missing image keeps its space but stays invisible.
      image.addEventListener("error", () => { image.style.visibility = "hidden"; });
      return image;
    }

    function buildRow(item, index, rows, clickable) {
      const row = document.createElement("div");
      row.className = "row";

      const rank = document.createElement("div");
      rank.className = "cell rank";
      rank.textContent = String(item.rank || index + 1).padStart(2, "0");

      const name = document.createElement("div");
      name.className = "cell name";
      name.append(heartImage(item.country, rows));

      const country = document.createElement("span");
      country.className = "country";
      country.textContent = item.country;
      name.append(country);

      const points = document.createElement("div");
      points.className = "cell points";
      points.textContent = item.points === undefined || item.points === null ? "" : item.points;

      row.append(rank, name, points);

      if (clickable) {
        row.classList.add("clickable");
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        row.setAttribute("aria-label", item.country + ": show detailed points");
        row.addEventListener("click", () => openDetail(item.country));
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openDetail(item.country);
          }
        });
      }

      return row;
    }

    function layoutColumns() {
      const count = board.children.length;
      const columns = columnQuery.matches ? 1 : 2;
      board.style.setProperty("--per-col", Math.max(1, Math.ceil(count / columns)));
    }

    function render() {
      const year = currentYear();
      const edition = EDITIONS.find((item) => item.year === year);
      const rows = rowsFor(edition);
      const customised = Boolean(savedData[year] || drafts[year]);
      const hasVotes = groupsWithVotes(rows).length > 0;

      $("tabs").innerHTML = "";
      EDITIONS.forEach((item) => {
        const link = document.createElement("a");
        link.href = "#" + item.year;
        link.textContent = item.year;
        if (item.year === year) {
          link.classList.add("active");
          link.setAttribute("aria-current", "true");
        }
        $("tabs").append(link);
      });

      $("year").textContent = edition.year;
      $("sub").textContent = "Grand Final · " + edition.city;
      $("badge").hidden = !edition.sample || customised;
      $("hint").hidden = !hasVotes;
      $("hint").textContent = "Tap a country to see who gave and received its points.";
      document.title = edition.year + " Results | Eurovision Rewind";

      board.innerHTML = "";
      const hasResults = rows.length > 0;
      board.hidden = !hasResults;
      $("empty").hidden = hasResults;
      $("empty").textContent =
        edition.emptyText || "Results for this edition are coming soon.";

      rows.forEach((item, index) => board.append(buildRow(item, index, rows, hasVotes)));
      layoutColumns();
    }

    /* ---------- Detail window: who gave and received a country's points ---------- */

    const detail = $("detail");
    const detailState = { country: "", group: "" };

    function votesLine(points, names, rows) {
      const line = document.createElement("div");
      line.className = "vline";

      const value = document.createElement("div");
      value.className = "vpoints";
      value.textContent = points;

      const list = document.createElement("div");
      list.className = "vnames";

      names.forEach((name) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        const label = document.createElement("span");
        label.textContent = name;
        chip.append(heartImage(name, rows), label);
        list.append(chip);
      });

      line.append(value, list);
      return line;
    }

    function emptyNote(text) {
      const note = document.createElement("div");
      note.className = "detail-empty";
      note.textContent = text;
      return note;
    }

    function renderDetail() {
      const edition = EDITIONS.find((item) => item.year === currentYear());
      const rows = rowsFor(edition);
      const index = rows.findIndex((item) => same(item.country, detailState.country));

      if (index < 0) {
        if (detail.open) detail.close();
        return;
      }

      const row = rows[index];
      const groups = groupsWithVotes(rows);
      if (!groups.some((group) => group.key === detailState.group)) {
        detailState.group = groups.length ? groups[0].key : "";
      }
      const group = detailState.group;

      $("detailRank").textContent = String(row.rank || index + 1).padStart(2, "0");
      $("detailTotal").textContent = (row.points ?? "") + " pts";

      $("detailName").innerHTML = "";
      const title = document.createElement("h2");
      title.id = "detailTitle";
      title.textContent = row.country;
      $("detailName").append(heartImage(row.country, rows), title);

      $("detailTabs").innerHTML = "";
      if (groups.length > 1) {
        groups.forEach(({ key, label }) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = label;
          button.classList.toggle("active", key === group);
          button.addEventListener("click", () => {
            detailState.group = key;
            renderDetail();
          });
          $("detailTabs").append(button);
        });
      }

      // Points received: everyone whose list names this country
      const received = [];
      let receivedSum = 0;

      VOTE_POINTS.forEach((points, position) => {
        const givers = rows
          .filter((giver) => giver.votes && giver.votes[group] && same(giver.votes[group][position], row.country))
          .map((giver) => giver.country);

        if (givers.length) {
          received.push([points, givers]);
          receivedSum += points * givers.length;
        }
      });

      $("receivedTotal").textContent = received.length ? receivedSum + " pts" : "";
      $("detailReceived").innerHTML = "";
      if (received.length) received.forEach(([points, givers]) => $("detailReceived").append(votesLine(points, givers, rows)));
      else $("detailReceived").append(emptyNote("No points received."));

      // Points given: this country's own list
      const own = (row.votes && row.votes[group]) || [];
      $("detailGiven").innerHTML = "";
      let any = false;

      VOTE_POINTS.forEach((points, position) => {
        if (own[position]) {
          any = true;
          $("detailGiven").append(votesLine(points, [own[position]], rows));
        }
      });

      if (!any) $("detailGiven").append(emptyNote("No votes entered for this country."));
    }

    function openDetail(country) {
      detailState.country = country;
      renderDetail();
      if (!detail.open) detail.showModal();
    }

    $("detailClose").addEventListener("click", () => detail.close());

    // A click on the dimmed area (outside the card) closes the window.
    detail.addEventListener("click", (event) => {
      if (event.target === detail) detail.close();
    });

    window.addEventListener("hashchange", render);
    columnQuery.addEventListener("change", layoutColumns);

    /* ---------- Database + admin sign-in (shared) ---------- */

    const CFG = window.STATUS_CONFIG || {};
    const configured =
      CFG.dbUrl && CFG.apiKey && !/YOUR-/.test(CFG.dbUrl + CFG.apiKey);
    const BASE = (CFG.dbUrl || "").replace(/\/$/, "");
    const STYLE_URL = BASE + "/results-style.json";
    const DATA_URL = BASE + "/results-data.json";
    const SESSION_KEY = "statusAdminSession";

    let session = null;
    try {
      session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    } catch (error) {
      session = null;
    }

    let showLogin = () => {};

    async function getToken() {
      if (!session) throw new Error("Sign in first.");

      if (session.expiresAt - Date.now() > 60000) return session.idToken;

      const response = await fetch(
        "https://securetoken.googleapis.com/v1/token?key=" + CFG.apiKey,
        {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "grant_type=refresh_token&refresh_token=" +
                encodeURIComponent(session.refreshToken)
        }
      );
      const data = await response.json();

      if (!response.ok) {
        session = null;
        localStorage.removeItem(SESSION_KEY);
        showLogin();
        throw new Error("Your session ended. Please sign in again.");
      }

      session = {
        ...session,
        idToken: data.id_token,
        refreshToken: data.refresh_token,
        expiresAt: Date.now() + Number(data.expires_in) * 1000
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      return session.idToken;
    }

    async function publish(url, payload) {
      const token = await getToken();
      const response = await fetch(url + "?auth=" + encodeURIComponent(token), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        let detail = "";
        try { detail = (await response.json()).error || ""; } catch (error) { detail = ""; }

        throw new Error(
          /permission/i.test(detail)
            ? "Permission denied. Add the results rules in Firebase (see the instructions) and Publish."
            : "Could not save (error " + response.status + (detail ? ": " + detail : "") + ")."
        );
      }
    }

    /* ---------- Saved sizes (shared by every visitor) ----------
       Desktop and phone layouts are saved separately. */

    const SIZE_VARS = [
      ["board-w",    "Board width",          500, 1400],
      ["row-h",      "Row height",            30,   90],
      ["row-gap",    "Space between rows",     0,   16],
      ["col-gap",    "Space between columns",  0,   60],
      ["rank-w",     "Rank block width",      30,  120],
      ["points-w",   "Points block width",    50,  160],
      ["heart-size", "Heart size",            18,   70],
      ["font-size",  "Text size",             12,   40]
    ];

    const STYLE_CACHE = "resultsStyleCache";
    let savedStyle = { desktop: {}, mobile: {} };

    const mode = () => (columnQuery.matches ? "mobile" : "desktop");

    function clearInlineSizes() {
      SIZE_VARS.forEach(([name]) =>
        document.documentElement.style.removeProperty("--" + name));
    }

    function applySaved() {
      clearInlineSizes();
      const set = savedStyle[mode()] || {};

      SIZE_VARS.forEach(([name]) => {
        const value = set[name];
        if (typeof value === "string" && /^\d+(\.\d+)?px$/.test(value)) {
          document.documentElement.style.setProperty("--" + name, value);
        }
      });
    }

    function useSaved(data) {
      savedStyle = {
        desktop: (data && data.desktop) || {},
        mobile: (data && data.mobile) || {}
      };
      applySaved();
    }

    try {
      useSaved(JSON.parse(localStorage.getItem(STYLE_CACHE) || "null"));
    } catch (error) {
      useSaved(null);
    }

    const stylesReady = !configured ? Promise.resolve() : fetch(STYLE_URL, { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : null))
      .then((data) => {
        useSaved(data);
        if (data) localStorage.setItem(STYLE_CACHE, JSON.stringify(data));
        else localStorage.removeItem(STYLE_CACHE);
      })
      .catch(() => {});

    columnQuery.addEventListener("change", () => {
      if (!document.body.classList.contains("tuning")) applySaved();
    });

    /* ---------- Saved results (points) shared by every visitor ---------- */

    const DATA_CACHE = "resultsDataCache";
    let afterDataLoad = () => {};

    function useData(data) {
      savedData = {};

      Object.keys(data || {}).forEach((year) => {
        const list = Array.isArray(data[year]) ? data[year] : Object.values(data[year] || {});
        const rows = list
          .filter((item) => item && item.country)
          .map((item) => ({
            country: String(item.country),
            points: item.points,
            ...(item.heart ? { heart: String(item.heart) } : {}),
            ...(item.rank ? { rank: item.rank } : {}),
            ...(cleanVotes(item.votes) ? { votes: cleanVotes(item.votes) } : {})
          }));

        if (rows.length) savedData[year] = rows;
      });
    }

    try {
      useData(JSON.parse(localStorage.getItem(DATA_CACHE) || "null"));
    } catch (error) {
      useData(null);
    }

    if (configured) {
      fetch(DATA_URL, { cache: "no-store" })
        .then((response) => (response.ok ? response.json() : null))
        .then((data) => {
          useData(data);
          if (data) localStorage.setItem(DATA_CACHE, JSON.stringify(data));
          else localStorage.removeItem(DATA_CACHE);
          render();
          afterDataLoad();
        })
        .catch(() => {});
    }

    /* ---------- Tools: results.html?tune (sizes)  and  results.html?data (points) ---------- */

    const params = new URLSearchParams(location.search);
    const wantsSizes = params.has("tune");
    const wantsData = params.has("data");

    if (wantsSizes || wantsData) {
      document.body.classList.add("tuning");
      if (wantsData) document.body.classList.add("editing");
      $("tuner").hidden = false;

      const note = (text, isError) => {
        $("tuneNote").textContent = text;
        $("tuneNote").classList.toggle("error", Boolean(isError));
      };

      showLogin = () => { $("tuneLogin").hidden = Boolean(session); };

      $("tuneLogin").addEventListener("submit", async (event) => {
        event.preventDefault();
        note("Signing in...");

        try {
          const response = await fetch(
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + CFG.apiKey,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: $("tuneEmail").value.trim(),
                password: $("tunePassword").value,
                returnSecureToken: true
              })
            }
          );
          const data = await response.json();
          if (!response.ok) throw new Error("Wrong email or password.");

          session = {
            email: data.email,
            idToken: data.idToken,
            refreshToken: data.refreshToken,
            expiresAt: Date.now() + Number(data.expiresIn) * 1000
          };
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          $("tunePassword").value = "";
          showLogin();
          note("Signed in. Now press Confirm & publish.");
        } catch (error) {
          note(error.message, true);
        }
      });

      /* Tabs */

      const tools = [];
      if (wantsSizes) tools.push(["sizes", "Sizes", "sizesTool"]);
      if (wantsData) tools.push(["data", "Points", "dataTool"]);

      const tabButtons = {};

      function showTool(id) {
        tools.forEach(([key, , panelId]) => {
          $(panelId).hidden = key !== id;
          tabButtons[key].classList.toggle("active", key === id);
        });
        note("");
      }

      tools.forEach(([key, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab";
        button.textContent = label;
        button.addEventListener("click", () => showTool(key));
        tabButtons[key] = button;
        $("toolTabs").append(button);
      });

      $("toolToggle").addEventListener("click", () => {
        const collapsed = $("tuner").classList.toggle("collapsed");
        $("toolToggle").textContent = collapsed ? "Show" : "Hide";
      });

      /* ----- Sizes tool ----- */

      if (wantsSizes) {
        let changed = {};

        const measure = (name) => {
          const row = board.querySelector(".row");
          if (!row) return 0;

          const sizes = {
            "board-w": document.querySelector(".board-wrap").getBoundingClientRect().width,
            "row-h": row.getBoundingClientRect().height,
            "row-gap": parseFloat(getComputedStyle(board).rowGap) || 0,
            "col-gap": parseFloat(getComputedStyle(board).columnGap) || 0,
            "rank-w": row.querySelector(".rank").getBoundingClientRect().width,
            "points-w": row.querySelector(".points").getBoundingClientRect().width,
            "heart-size": (row.querySelector(".heart-img") || row).getBoundingClientRect().width,
            "font-size": parseFloat(getComputedStyle(row).fontSize)
          };

          return Math.round(sizes[name]);
        };

        function buildSliders() {
          $("tuneRows").innerHTML = "";
          $("tuneMode").textContent =
            "Editing the " + (mode() === "mobile" ? "phone" : "desktop") + " layout";

          SIZE_VARS.forEach(([name, label, min, max]) => {
            const wrap = document.createElement("label");
            wrap.className = "tune-row";

            const text = document.createElement("span");
            text.textContent = label;

            const input = document.createElement("input");
            input.type = "range";
            input.min = min;
            input.max = max;

            const output = document.createElement("output");
            const start = Math.min(max, Math.max(min, measure(name)));
            input.value = start;
            output.textContent = start + "px";

            // Moving a slider is the live preview. Nothing is saved yet.
            input.addEventListener("input", () => {
              document.documentElement.style.setProperty("--" + name, input.value + "px");
              output.textContent = input.value + "px";
              changed[name] = input.value + "px";
              note("Previewing. Press Confirm & publish to save for everyone.");
            });

            wrap.append(text, input, output);
            $("tuneRows").append(wrap);
          });
        }

        $("tuneConfirm").addEventListener("click", async () => {
          if (!configured) return note("Fill in status-config.js first.", true);
          if (!session) { showLogin(); return note("Sign in below, then press Confirm again.", true); }
          if (!Object.keys(changed).length) return note("Nothing to publish yet. Move a slider first.");

          note("Publishing...");

          try {
            const next = {
              desktop: { ...savedStyle.desktop },
              mobile: { ...savedStyle.mobile }
            };
            next[mode()] = { ...next[mode()], ...changed };

            await publish(STYLE_URL, next);
            savedStyle = next;
            localStorage.setItem(STYLE_CACHE, JSON.stringify(next));
            changed = {};
            note("Published. Everyone sees the new sizes now.");
          } catch (error) {
            note(error.message, true);
          }
        });

        $("tuneUndo").addEventListener("click", () => {
          changed = {};
          applySaved();
          buildSliders();
          note("Back to the last published sizes.");
        });

        $("tuneReset").addEventListener("click", async () => {
          if (!configured) return note("Fill in status-config.js first.", true);
          if (!session) { showLogin(); return note("Sign in below, then press Reset again.", true); }

          note("Resetting...");

          try {
            const next = { ...savedStyle, [mode()]: {} };
            await publish(STYLE_URL, next);
            savedStyle = next;
            localStorage.setItem(STYLE_CACHE, JSON.stringify(next));
            changed = {};
            applySaved();
            buildSliders();
            note("Reset. This layout is back to the default sizes.");
          } catch (error) {
            note(error.message, true);
          }
        });

        stylesReady.then(buildSliders);
      }

      /* ----- Points tool ----- */

      if (wantsData) {
        const editionNow = () => EDITIONS.find((item) => item.year === currentYear());
        let voteGroup = VOTE_GROUPS[0].key;
        const openVotes = new Set();

        const copyRows = (rows) => rows.map((item) => ({
          country: item.country,
          points: item.points,
          ...(item.heart ? { heart: item.heart } : {}),
          ...(item.votes ? { votes: JSON.parse(JSON.stringify(item.votes)) } : {})
        }));

        function draft() {
          const edition = editionNow();
          if (!drafts[edition.year]) drafts[edition.year] = copyRows(rowsFor(edition));
          return drafts[edition.year];
        }

        function cleanRows(rows) {
          return rows
            .filter((item) => String(item.country).trim())
            .map((item) => {
              const points = Number(item.points);
              const votes = cleanVotes(item.votes);

              return {
                country: String(item.country).trim(),
                points: item.points !== "" && Number.isFinite(points) ? points : 0,
                ...(String(item.heart || "").trim() ? { heart: String(item.heart).trim() } : {}),
                ...(votes ? { votes } : {})
              };
            });
        }

        function makeInput(className, value, placeholder, type) {
          const input = document.createElement("input");
          input.className = className;
          input.type = type || "text";
          input.value = value === undefined || value === null ? "" : value;
          input.placeholder = placeholder || "";
          if (type === "number") input.inputMode = "numeric";
          return input;
        }

        function makeButton(label, action, title) {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.action = action;
          button.textContent = label;
          button.title = title;
          button.setAttribute("aria-label", title);
          return button;
        }

        function buildGroupButtons() {
          $("voteGroups").innerHTML = "";
          $("voteGroups").hidden = VOTE_GROUPS.length < 2;

          const label = document.createElement("span");
          label.textContent = "Votes you are editing:";
          $("voteGroups").append(label);

          VOTE_GROUPS.forEach(({ key, label: text }) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "tab" + (key === voteGroup ? " active" : "");
            button.textContent = text;
            button.addEventListener("click", () => {
              voteGroup = key;
              buildEditor();
            });
            $("voteGroups").append(button);
          });
        }

        function buildVotesEditor(item, rows) {
          const box = document.createElement("div");
          box.className = "votes-editor";

          const title = document.createElement("h4");
          const groupLabel = VOTE_GROUPS.find((group) => group.key === voteGroup).label;
          const text = document.createElement("span");
          text.textContent = "Points given by " + item.country + " · " + groupLabel;
          const clear = makeButton("Clear", "clear-votes", "Clear these votes");
          title.append(text, clear);

          const grid = document.createElement("div");
          grid.className = "votes-grid";

          const names = [...new Set(rows
            .map((row) => String(row.country).trim())
            .filter((name) => name && !same(name, item.country)))];

          const current = (item.votes && item.votes[voteGroup]) || [];

          VOTE_POINTS.forEach((points, position) => {
            const wrap = document.createElement("label");
            wrap.className = "vote-pick";

            const value = document.createElement("span");
            value.textContent = points;

            const select = document.createElement("select");
            select.dataset.position = position;
            select.append(new Option("-", ""));
            names.forEach((name) => select.append(new Option(name, name)));

            const chosen = current[position] || "";
            if (chosen && !names.some((name) => same(name, chosen))) select.append(new Option(chosen, chosen));
            select.value = chosen;

            wrap.append(value, select);
            grid.append(wrap);
          });

          box.append(title, grid);
          return box;
        }

        function buildEditor() {
          const edition = editionNow();
          const rows = rowsFor(edition);

          $("dataMode").textContent =
            "Editing " + edition.year +
            (drafts[edition.year] ? " · unpublished changes" : "") +
            " · switch edition with the year tabs";

          buildGroupButtons();
          $("dataRows").innerHTML = "";

          rows.forEach((item, index) => {
            const wrapper = document.createElement("div");
            wrapper.className = "data-item";
            wrapper.dataset.index = index;

            const line = document.createElement("div");
            line.className = "data-row";

            const rank = document.createElement("span");
            rank.className = "data-rank";
            rank.textContent = String(index + 1).padStart(2, "0");

            const buttons = document.createElement("span");
            buttons.className = "data-btns";
            buttons.append(
              makeButton("↑", "up", "Move up"),
              makeButton("↓", "down", "Move down"),
              makeButton("Votes", "votes", "Edit the points this country gave"),
              makeButton("✕", "remove", "Remove row")
            );

            line.append(
              rank,
              makeInput("data-country", item.country, "Country"),
              makeInput("data-points", item.points, "Points", "number"),
              makeInput("data-heart", item.heart || "", heartSrc(item)),
              buttons
            );

            wrapper.append(line);

            if (item.country && openVotes.has(item.country.trim().toLowerCase())) {
              wrapper.append(buildVotesEditor(item, rows));
            }

            $("dataRows").append(wrapper);
          });
        }

        const indexOf = (element) => Number(element.closest(".data-item").dataset.index);

        // Remember the name before it is edited, so votes that mention it can follow a rename.
        $("dataRows").addEventListener("focusin", (event) => {
          if (event.target.classList.contains("data-country")) {
            event.target.dataset.previous = event.target.value;
          }
        });

        $("dataRows").addEventListener("input", (event) => {
          if (!event.target.closest(".data-row")) return;

          const line = event.target.closest(".data-row");
          const item = draft()[indexOf(event.target)];
          const field = event.target;

          if (field.classList.contains("data-country")) {
            item.country = field.value;
            line.querySelector(".data-heart").placeholder = heartSrc(item);
          } else if (field.classList.contains("data-points")) {
            item.points = field.value === "" ? "" : Number(field.value);
          } else if (field.classList.contains("data-heart")) {
            if (field.value.trim()) item.heart = field.value.trim();
            else delete item.heart;
          }

          render();
          note("Previewing. Press Confirm & publish to save for everyone.");
        });

        $("dataRows").addEventListener("change", (event) => {
          const field = event.target;

          // A country was renamed: update every vote that named it.
          if (field.classList.contains("data-country")) {
            const before = (field.dataset.previous || "").trim();
            const after = field.value.trim();

            if (before && after && !same(before, after)) {
              draft().forEach((row) => {
                Object.values(row.votes || {}).forEach((list) => {
                  list.forEach((name, i) => { if (same(name, before)) list[i] = after; });
                });
              });
              openVotes.delete(before.toLowerCase());
              openVotes.add(after.toLowerCase());
            }

            buildEditor();
            render();
            return;
          }

          // A vote was picked
          if (field.matches(".vote-pick select")) {
            const item = draft()[indexOf(field)];
            item.votes = item.votes || {};
            item.votes[voteGroup] = item.votes[voteGroup] || VOTE_POINTS.map(() => "");
            item.votes[voteGroup][Number(field.dataset.position)] = field.value;

            const picked = item.votes[voteGroup].filter(Boolean);
            const repeated = picked.length !== new Set(picked.map((name) => name.toLowerCase())).size;

            render();
            note(
              repeated
                ? item.country + " has given points to the same country twice."
                : "Previewing. Press Confirm & publish to save for everyone.",
              repeated
            );
          }
        });

        $("dataRows").addEventListener("click", (event) => {
          const button = event.target.closest("button[data-action]");
          if (!button) return;

          const index = indexOf(button);
          const rows = draft();
          const action = button.dataset.action;

          if (action === "remove") rows.splice(index, 1);

          if (action === "up" && index > 0) {
            [rows[index - 1], rows[index]] = [rows[index], rows[index - 1]];
          }

          if (action === "down" && index < rows.length - 1) {
            [rows[index + 1], rows[index]] = [rows[index], rows[index + 1]];
          }

          if (action === "votes") {
            const key = String(rows[index].country || "").trim().toLowerCase();
            if (!key) return note("Type the country name first.");
            if (openVotes.has(key)) openVotes.delete(key);
            else openVotes.add(key);
          }

          if (action === "clear-votes") {
            if (rows[index].votes) delete rows[index].votes[voteGroup];
          }

          buildEditor();
          render();
        });

        $("dataAdd").addEventListener("click", () => {
          draft().push({ country: "", points: 0 });
          buildEditor();
          render();

          const countries = $("dataRows").querySelectorAll(".data-country");
          countries[countries.length - 1].focus();
        });

        $("dataSort").addEventListener("click", () => {
          draft().sort((a, b) => (Number(b.points) || 0) - (Number(a.points) || 0));
          buildEditor();
          render();
          note("Sorted by points. Tied countries keep their order.");
        });

        // Add up the points every country received (all vote groups) and use them as the totals.
        $("dataCalc").addEventListener("click", () => {
          const rows = draft();

          if (!groupsWithVotes(rows).length) return note("There are no votes to add up yet.", true);

          rows.forEach((row) => {
            let sum = 0;

            rows.forEach((giver) => {
              VOTE_GROUPS.forEach(({ key }) => {
                const list = (giver.votes && giver.votes[key]) || [];
                VOTE_POINTS.forEach((points, position) => {
                  if (same(list[position], row.country)) sum += points;
                });
              });
            });

            row.points = sum;
          });

          buildEditor();
          render();
          note("Points now match the votes. Use Sort by points if the order changed.");
        });

        $("dataUndo").addEventListener("click", () => {
          delete drafts[editionNow().year];
          buildEditor();
          render();
          note("Back to the last published results for this edition.");
        });

        $("dataConfirm").addEventListener("click", async () => {
          const edition = editionNow();

          if (!configured) return note("Fill in status-config.js first.", true);
          if (!drafts[edition.year]) return note("Nothing to publish yet. Edit a row first.");
          if (!session) { showLogin(); return note("Sign in below, then press Confirm again.", true); }

          const rows = cleanRows(drafts[edition.year]);
          const next = { ...savedData };
          if (rows.length) next[edition.year] = rows;
          else delete next[edition.year];

          note("Publishing...");

          try {
            await publish(DATA_URL, next);
            savedData = next;
            delete drafts[edition.year];
            localStorage.setItem(DATA_CACHE, JSON.stringify(next));
            buildEditor();
            render();
            note("Published. Everyone sees the new points now.");
          } catch (error) {
            note(error.message, true);
          }
        });

        $("dataReset").addEventListener("click", async () => {
          const edition = editionNow();

          if (!configured) return note("Fill in status-config.js first.", true);
          if (!session) { showLogin(); return note("Sign in below, then press Reset again.", true); }

          const next = { ...savedData };
          delete next[edition.year];

          note("Resetting...");

          try {
            await publish(DATA_URL, next);
            savedData = next;
            delete drafts[edition.year];
            localStorage.setItem(DATA_CACHE, JSON.stringify(next));
            buildEditor();
            render();
            note("Reset. This edition shows the rows written in results.html.");
          } catch (error) {
            note(error.message, true);
          }
        });

        window.addEventListener("hashchange", buildEditor);
        afterDataLoad = buildEditor;
        buildEditor();
      }

      showTool(tools[0][0]);
      showLogin();
    }

    render();

    // Render Lucide icons.
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>

</body>
</html>
