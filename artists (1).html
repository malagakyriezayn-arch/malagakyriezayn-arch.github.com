<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171329">

  <title>Artists | Eurovision Rewind</title>
  <meta name="description" content="Meet the artists of Eurovision Rewind: their songs, countries and more details.">
  <link rel="icon" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.460.0"></script>

  <style>
    :root {
      --white: #ffffff;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Montserrat", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at 10% 0%, rgba(112, 83, 213, .25), transparent 40%),
        radial-gradient(ellipse at 100% 35%, rgba(52, 166, 175, .13), transparent 38%),
        linear-gradient(145deg, #171329, #101522 65%, #171329);
      background-attachment: fixed;
    }

    @media (hover: none) {
      body { background-attachment: scroll; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* NAVIGATION */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 13px 5%;
      background: rgba(19, 17, 39, .72);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .nav-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.075);
      box-shadow: 0 8px 30px rgba(0,0,0,.16);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      color: #d0ccdf;
      font-size: 11px;
      font-weight: 600;
      transition: .25s ease;
    }

    .nav-link svg {
      width: 16px;
      height: 16px;
    }

    .nav-link:hover {
      color: white;
      background: rgba(255,255,255,.09);
    }

    .nav-link.active {
      color: white;
      background: linear-gradient(135deg, #806be8, #5545ae);
      box-shadow: 0 4px 18px rgba(103,81,210,.25);
    }

    .nav-home {
      width: 40px;
      padding: 0;
    }

    /* MAIN (empty - add your content here) */

    main {
      width: min(1180px, 94%);
      margin: 0 auto;
      padding: 30px 0 80px;
    }

    /* =========================
       CUSTOM FONT
       Put the font files in a "fonts" folder next to this page.
    ========================= */

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-MediumItalic.otf") format("opentype");
      font-weight: 500;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --artist-font: "ResultsFont", "Neulis", "Montserrat", sans-serif;
      --muted: rgba(255, 255, 255, 0.7);
      --line: rgba(255, 255, 255, 0.16);
    }

    [hidden] { display: none !important; }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid #c9bdff;
      outline-offset: 3px;
    }

    /* Page heading */

    .page-head {
      margin-bottom: 26px;
      text-align: center;
    }

    .page-head h1 {
      color: #fff;
      font-family: var(--artist-font);
      font-size: clamp(38px, 8vw, 68px);
      font-weight: 500;
      letter-spacing: -1px;
      line-height: 1.05;
    }

    .page-head p {
      max-width: 560px;
      margin: 12px auto 0;
      color: var(--muted);
      font-family: var(--artist-font);
      font-size: clamp(14px, 2vw, 17px);
      font-weight: 400;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 12px;
      color: #ffd28a;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 210, 138, 0.1);
      border: 1px solid rgba(255, 210, 138, 0.3);
      border-radius: 999px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 26px;
    }

    .chips button {
      min-width: 74px;
      padding: 9px 18px;
      color: #c2bfd6;
      font: 700 13px "Montserrat", sans-serif;
      letter-spacing: 0.6px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .chips button:hover { color: #fff; background: rgba(255, 255, 255, 0.13); }

    .chips button.active {
      color: #fff;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    .empty {
      padding: 40px 18px;
      color: var(--muted);
      font-family: var(--artist-font);
      font-size: 17px;
      text-align: center;
    }

    /* =========================
       ARTIST CARD
       Heart flag on the left (glow colour set per artist), photo on the right,
       song and artist in black pills.
    ========================= */

    .artists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 470px), 1fr));
      gap: clamp(20px, 3vw, 30px);
      align-items: start;
    }

    .artist {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      animation: artist-in 0.55s cubic-bezier(.2,.75,.25,1) backwards;
      animation-delay: calc(var(--i, 0) * 80ms);
    }

    @keyframes artist-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: none; }
    }

    .artist-card {
      --glow: #4da3ff;
      --px: 50%;
      --py: 20%;
      --zoom: 1;
      --flip: 1;
      --shade: 0.45;
      --heart-scale: 1;
      --glow-power: 1;
      --ratio: 2 / 1;
      --pill-bg: #000;
      --pill-fg: #fff;

      position: relative;
      container-type: inline-size;
      aspect-ratio: var(--ratio);
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 45%, color-mix(in srgb, var(--glow) 24%, transparent), transparent 62%),
        #151728;
      border: 1px solid var(--line);
      border-radius: 22px;
    }

    /* The photo covers the whole card */
    .artist-photo-wrap {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      transform: scaleX(var(--flip));
    }

    .artist-photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--px) var(--py);
      transform: scale(var(--zoom));
      transform-origin: var(--px) var(--py);
    }

    /* Darkens the photo so the heart and the pills stay readable */
    .artist-card::after {
      position: absolute;
      inset: 0;
      z-index: 1;
      content: "";
      pointer-events: none;
      background:
        linear-gradient(90deg, rgb(5 6 14 / calc(var(--shade) * 1.1)) 0%, rgb(5 6 14 / calc(var(--shade) * 0.15)) 58%, transparent 100%),
        linear-gradient(0deg, rgb(5 6 14 / calc(var(--shade) * 0.9)) 0%, transparent 55%);
    }

    .artist-card.heart-right::after {
      background:
        linear-gradient(270deg, rgb(5 6 14 / calc(var(--shade) * 1.1)) 0%, rgb(5 6 14 / calc(var(--shade) * 0.15)) 58%, transparent 100%),
        linear-gradient(0deg, rgb(5 6 14 / calc(var(--shade) * 0.9)) 0%, transparent 55%);
    }

    .artist-heart {
      position: absolute;
      top: -9%;
      left: -8%;
      z-index: 2;
      height: calc(112% * var(--heart-scale));
      width: auto;
      aspect-ratio: 10 / 9;
      object-fit: contain;
      filter:
        drop-shadow(0 0 calc(1.6cqw * var(--glow-power)) var(--glow))
        drop-shadow(0 0 calc(4.5cqw * var(--glow-power)) color-mix(in srgb, var(--glow) 50%, transparent));
    }

    .artist-card.heart-right .artist-heart { left: auto; right: -8%; }

    .artist-pills {
      position: absolute;
      right: 5%;
      bottom: 9%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2.2cqw;
      max-width: 58%;
    }

    .artist-card.heart-right .artist-pills {
      right: auto;
      left: 5%;
      align-items: flex-start;
    }

    .pill {
      max-width: 100%;
      margin: 0;
      padding: 1.2cqw 4cqw;
      overflow: hidden;
      color: var(--pill-fg);
      font-family: var(--artist-font);
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--pill-bg);
      border-radius: 999px;
    }

    .pill-song { font-size: 4.4cqw; font-weight: 500; }
    .pill-name { font-size: 3.6cqw; font-weight: 400; }

    /* More details (dropdown) */

    .more {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 18px;
      color: #fff;
      font-family: var(--artist-font);
      font-size: 15px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .more:hover { background: rgba(255, 255, 255, 0.12); }

    .more svg,
    .more .chev {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
    }

    .more[aria-expanded="true"] svg,
    .more[aria-expanded="true"] .chev { transform: rotate(180deg); }

    .details {
      display: grid;
      grid-template-rows: 0fr;
      visibility: hidden;
      transition: grid-template-rows 0.35s ease, visibility 0.35s;
    }

    .details.open { grid-template-rows: 1fr; visibility: visible; }

    .details-inner { min-height: 0; overflow: hidden; }

    .details-body {
      padding: 18px 20px 20px;
      font-family: var(--artist-font);
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .details-meta {
      margin-bottom: 10px;
      color: #d4c7ff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .details-body p {
      margin: 0 0 12px;
      color: rgba(255, 255, 255, 0.86);
      font-size: 15px;
      line-height: 1.75;
    }

    .facts {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 18px;
      margin: 14px 0 4px;
    }

    .facts dt {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .facts dd { margin: 0; color: #fff; font-size: 15px; font-weight: 500; }

    .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    .link-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 18px;
      color: #211c45;
      font: 700 13px "Montserrat", sans-serif;
      background: #fff;
      border-radius: 999px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .link-button:hover { background: #eee9ff; transform: translateY(-2px); }
    .link-button svg { width: 15px; height: 15px; }

    /* =========================
       ADD PANEL (artists.html?add)
    ========================= */

    body.adding main { padding-bottom: 68vh; }

    .add-panel {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 900;
      max-height: 62vh;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      overflow: auto;
      background: rgba(17, 19, 27, 0.97);
      border-top: 1px solid var(--line);
    }

    .add-panel > * { max-width: 640px; margin-left: auto; margin-right: auto; }

    .add-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .add-top h2 { font-size: 16px; }
    .add-panel.collapsed #addBody { display: none; }

    .editor {
      margin-bottom: 14px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .editor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #65d5d0;
      font-size: 12px;
      font-weight: 700;
    }

    .editor-btns { display: flex; gap: 4px; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .field input[type="text"],
    .field input[type="password"],
    .field textarea,
    .sub-row input,
    .add-login input {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      color: #fff;
      font: 600 14px "Montserrat", sans-serif;
      letter-spacing: 0;
      text-transform: none;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .field textarea { min-height: 96px; resize: vertical; }
    .field .count { align-self: flex-end; font-weight: 500; }

    .field input[type="color"] {
      width: 56px;
      height: 38px;
      padding: 2px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
    }

    .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .inline input[type="text"] { flex: 1 1 180px; width: auto; }

    .thumb { width: 64px; height: 40px; object-fit: cover; background: #1d2033; border-radius: 8px; }

    .sub-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .sub-row input:first-child { flex: 0 0 36%; }
    .sub-row input:nth-child(2) { flex: 1; }

    .add-panel button,
    .file-button {
      padding: 10px 16px;
      color: #fff;
      font: 700 12px "Montserrat", sans-serif;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }

    .add-panel button.ghost,
    .file-button { background: rgba(255, 255, 255, 0.09); border-color: var(--line); }

    .add-panel button.small { padding: 7px 12px; }
    .editor-btns button, .sub-row button { padding: 7px 11px; font-size: 13px; }

    .add-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .add-login { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .add-login input { flex: 1 1 150px; width: auto; }
    .add-note { min-height: 18px; margin-top: 10px; color: #65d5d0; font-size: 12px; }
    .add-note.error { color: #ff9b9b; }
    .add-empty { margin-bottom: 14px; color: var(--muted); font-size: 13px; }

    /* Editor: collapsible cards, preview, position buttons, sliders */

    body.adding .artist { animation: none; }

    .editor-head { display: flex; align-items: center; gap: 8px; }

    .add-panel button.toggle {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section-title {
      margin: 16px 0 8px;
      color: #65d5d0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .editor-preview { max-width: 460px; margin-bottom: 10px; }
    .editor-preview .artist-card { cursor: grab; touch-action: none; }
    .editor-preview .artist-card.dragging { cursor: grabbing; }
    .drag-hint { margin-bottom: 8px; color: var(--muted); font-size: 11px; }

    .pos-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .pos-grid button { padding: 8px 14px; font-size: 14px; }

    .range-row {
      display: grid;
      grid-template-columns: 112px 1fr 46px;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .range-row input { width: 100%; }
    .range-row output { color: #fff; text-align: right; }

    .field select {
      width: 100%;
      padding: 10px 12px;
      color: #fff;
      font: 600 14px "Montserrat", sans-serif;
      letter-spacing: 0;
      text-transform: none;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .field select option { color: #000; }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 520px) {
      .row2 { grid-template-columns: 1fr; }
    }

    /* MOBILE */

    @media (max-width: 560px) {
      .site-header {
        padding: 10px 12px;
      }

      .navbar {
        gap: 8px;
      }

      .brand-logo {
        width: 35px;
        height: 35px;
      }

      .nav-pill {
        gap: 2px;
        padding: 4px;
      }

      .nav-link {
        min-height: 35px;
        padding: 0 9px;
        font-size: 0;
      }

      .nav-home {
        width: 35px;
      }

      main {
        width: 92%;
        padding-top: 22px;
        padding-bottom: 60px;
      }
    }

    @media (max-width: 350px) {
      .brand-logo {
        width: 29px;
        height: 29px;
      }

      .nav-link {
        padding: 0 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">

      <a class="brand" href="index.html" aria-label="Eurovision Rewind home">
        <img
          class="brand-logo"
          src="images/logo.png"
          alt="Eurovision Rewind logo"
          width="43"
          height="43"
        >
      </a>

      <div class="nav-pill">

        <a class="nav-link nav-home"
           href="index.html"
           aria-label="Home"
           title="Home">
          <i data-lucide="house"></i>
        </a>

        <a class="nav-link"
           href="2029.html#overview"
           aria-label="Edition overview"
           title="Overview">
          <i data-lucide="layout-grid"></i>
        </a>

        <a class="nav-link"
           href="2029.html#countries"
           aria-label="Countries"
           title="Countries">
          <i data-lucide="flag"></i>
        </a>

        <a class="nav-link"
           href="results.html#2029"
           aria-label="Results"
           title="Results">
          <i data-lucide="trophy"></i>
        </a>

        <a class="nav-link active"
           href="artists.html"
           aria-label="Artists"
           title="Artists"
           aria-current="page">
          <i data-lucide="mic-vocal"></i>
        </a>

      </div>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <h1>Artists</h1>
      <p>Meet the artists behind the songs. Open More details on a card to learn about them.</p>
      <span class="badge" id="badge" hidden>Sample card - add your own with artists.html?add</span>
    </section>

    <nav class="chips" id="chips" aria-label="Filter by edition" hidden></nav>

    <div class="artists-grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Artist profiles are coming soon.</p>
  </main>

  <section class="add-panel" id="addPanel" aria-label="Add artists" hidden>
    <div class="add-top">
      <h2>Artist cards</h2>
      <button type="button" class="ghost small" id="addToggle">Hide</button>
    </div>

    <div id="addBody">
      <div id="editors"></div>

      <div class="add-actions">
        <button type="button" class="ghost" id="artistAdd">Add artist</button>
        <button type="button" id="artistConfirm">Confirm &amp; publish</button>
        <button type="button" class="ghost" id="artistUndo">Undo</button>
        <button type="button" class="ghost" id="artistClear">Remove all</button>
      </div>

      <div class="add-actions">
        <button type="button" class="ghost" id="artistSortName">Sort A-Z</button>
        <button type="button" class="ghost" id="artistSortYear">Sort by edition</button>
        <button type="button" class="ghost" id="artistExport">Export backup</button>
        <button type="button" class="ghost" id="artistImport">Import backup</button>
        <input type="file" id="artistImportFile" accept=".json,application/json" hidden>
      </div>

      <form class="add-login" id="addLogin" hidden>
        <input type="text" id="addEmail" placeholder="Admin email" autocomplete="username">
        <input type="password" id="addPassword" placeholder="Password" autocomplete="current-password">
        <button type="submit">Sign in</button>
      </form>

      <p class="add-note" id="addNote" role="status"></p>
    </div>
  </section>

  <script src="status-config.js"></script>
  <script>
    /* =========================================================
       ARTIST CARDS
       Add and edit them in the browser with  artists.html?add
       Each artist: name, song, country, year, photo, heart, glow, bio, facts, links

       HEART IMAGES
       The heart flag is found from the country name:
         "Greece" -> images/hearts/greece.png
       Type a different path in the card editor to use another file.
    ========================================================= */

    const HEART_FOLDER = "images/hearts/";
    const HEART_EXT = ".png";
    const DEFAULT_GLOW = "#4da3ff";

    // One sample card, shown only until you publish your first artist.
    const heartSvg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 90'>" +
      "<defs><clipPath id='h'><path d='M50 88C20 62 2 44 2 25 2 11 13 2 26 2c11 0 20 6 24 15C54 8 63 2 74 2c13 0 24 9 24 23 0 19-18 37-48 63z'/></clipPath></defs>" +
      "<path fill='#fff' d='M50 88C20 62 2 44 2 25 2 11 13 2 26 2c11 0 20 6 24 15C54 8 63 2 74 2c13 0 24 9 24 23 0 19-18 37-48 63z'/>" +
      "<g transform='translate(7 6.3) scale(.86)'><g clip-path='url(#h)'>" +
      [0, 1, 2, 3, 4, 5, 6, 7, 8].map((i) => `<rect y='${i * 10}' width='100' height='10' fill='${i % 2 ? "#fff" : "#0d5eaf"}'/>`).join("") +
      "<rect width='50' height='50' fill='#0d5eaf'/><rect x='20' width='10' height='50' fill='#fff'/><rect y='20' width='50' height='10' fill='#fff'/>" +
      "</g></g></svg>";

    const photoSvg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='xMidYMid slice'>" +
      "<rect width='100' height='100' fill='#323654'/><circle cx='50' cy='38' r='17' fill='#878bb0'/>" +
      "<path d='M12 100c2-26 17-40 38-40s36 14 38 40z' fill='#878bb0'/></svg>";

    const SAMPLE_ARTISTS = [{
      name: "Artist",
      song: "Song Title",
      country: "Greece",
      year: "",
      photo: "data:image/svg+xml," + encodeURIComponent(photoSvg),
      heart: "data:image/svg+xml," + encodeURIComponent(heartSvg),
      glow: DEFAULT_GLOW,
      bio: "This is a sample card. Open artists.html?add to add the real artists, with a photo, a heart flag and more details.",
      facts: [{ label: "Language", value: "Greek" }],
      links: []
    }];

    /* =========================================================
       PAGE CODE (no need to edit below)
    ========================================================= */

    const $ = (id) => document.getElementById(id);
    const adding = new URLSearchParams(location.search).has("add");

    const CFG = window.STATUS_CONFIG || {};
    const configured = CFG.dbUrl && CFG.apiKey && !/YOUR-/.test(CFG.dbUrl + CFG.apiKey);
    const ARTISTS_URL = (CFG.dbUrl || "").replace(/\/$/, "") + "/artists.json";
    const CACHE_KEY = "artistsCache";
    const SESSION_KEY = "statusAdminSession";

    let saved = [];
    let draft = null;                       // unpublished edits (?add only)
    let yearFilter = location.hash.replace("#", "");
    const openDetails = new Set();          // which "More details" dropdowns are open

    const listOf = (value) => Array.isArray(value) ? value : Object.values(value || {});
    const current = () => draft || saved;

    /* ---------- Safe links, pictures and colours ---------- */

    function safeLink(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      if (/^(https?:\/\/|mailto:)/i.test(text)) return text;
      if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return "";
      if (/^www\./i.test(text)) return "https://" + text;
      if (/^[^\s\/#?]+\.[a-z]{2,}(\/.*)?$/i.test(text) && !/\.(html?|php)$/i.test(text)) return "https://" + text;
      return text;
    }

    function safeImage(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      if (/^data:image\/(png|jpe?g|webp|gif|svg\+xml)[;,]/i.test(text)) return text;
      if (/^https?:\/\//i.test(text)) return text;
      if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return "";
      return text;
    }

    const imageSrc = (value) => {
      const safe = safeImage(value);
      return /^data:/i.test(safe) ? safe : encodeURI(safe).replace(/%25([0-9A-F]{2})/g, "%$1");
    };

    const isExternal = (url) => /^https?:\/\//i.test(url) && new URL(url).host !== location.host;

    function slug(name) {
      return String(name)
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .toLowerCase().replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    const heartSrc = (artist) =>
      artist.heart || (artist.country ? HEART_FOLDER + slug(artist.country) + HEART_EXT : "");

    const num = (value, fallback) =>
      (value === "" || value === null || value === undefined || !Number.isFinite(Number(value))) ? fallback : Number(value);
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const RATIOS = { "2 / 1": "Wide (2:1)", "16 / 9": "Video (16:9)", "3 / 2": "Photo (3:2)", "1 / 1": "Square (1:1)" };

    function tidy(artist) {
      return {
        name: String(artist.name || "").trim().slice(0, 80),
        song: String(artist.song || "").trim().slice(0, 100),
        country: String(artist.country || "").trim().slice(0, 60),
        year: String(artist.year || "").trim().slice(0, 4),
        photo: safeImage(artist.photo),
        heart: safeImage(artist.heart),
        glow: /^#[0-9a-f]{6}$/i.test(artist.glow || "") ? artist.glow : DEFAULT_GLOW,

        // Photo and card look (all optional)
        photoX: clamp(num(artist.photoX, 50), 0, 100),
        photoY: clamp(num(artist.photoY, 20), 0, 100),
        zoom: clamp(num(artist.zoom, 1), 1, 3),
        flip: Boolean(artist.flip),
        shade: clamp(num(artist.shade, 45), 0, 90),
        hideHeart: Boolean(artist.hideHeart),
        heartSize: clamp(num(artist.heartSize, 100), 50, 170),
        heartSide: artist.heartSide === "right" ? "right" : "left",
        glowPower: clamp(num(artist.glowPower, 100), 0, 250),
        pillStyle: ["white", "accent"].includes(artist.pillStyle) ? artist.pillStyle : "black",
        ratio: Object.keys(RATIOS).includes(artist.ratio) ? artist.ratio : "2 / 1",

        bio: String(artist.bio || "").trim().slice(0, 1200),
        facts: listOf(artist.facts)
          .filter((fact) => fact && (String(fact.label || "").trim() || String(fact.value || "").trim()))
          .map((fact) => ({ label: String(fact.label || "").trim().slice(0, 40), value: String(fact.value || "").trim().slice(0, 120) })),
        links: listOf(artist.links)
          .filter((link) => link && safeLink(link.url))
          .map((link) => ({ label: String(link.label || "").trim().slice(0, 40), url: safeLink(link.url) }))
      };
    }

    const hasContent = (artist) => Boolean(artist.name || artist.song || artist.photo);
    const hasDetails = (artist) => Boolean(artist.bio || artist.facts.length || artist.links.length || artist.country || artist.year);

    /* ---------- Building a card ---------- */

    function img(className, source, hideOnError) {
      const image = document.createElement("img");
      image.className = className;
      image.src = source;
      image.alt = "";
      image.decoding = "async";
      image.addEventListener("error", () => { image.style.visibility = "hidden"; });
      return image;
    }

    // The picture card itself. Used on the page and in the editor preview.
    function buildCard(artist) {
      const card = document.createElement("div");
      card.className = "artist-card" + (artist.heartSide === "right" ? " heart-right" : "");

      const set = (name, value) => card.style.setProperty(name, value);
      set("--glow", artist.glow);
      set("--px", artist.photoX + "%");
      set("--py", artist.photoY + "%");
      set("--zoom", artist.zoom);
      set("--flip", artist.flip ? -1 : 1);
      set("--shade", artist.shade / 100);
      set("--heart-scale", artist.heartSize / 100);
      set("--glow-power", artist.glowPower / 100);
      set("--ratio", artist.ratio);

      const pill = { black: ["#000", "#fff"], white: ["#fff", "#14122a"], accent: [artist.glow, "#0b0b14"] }[artist.pillStyle];
      set("--pill-bg", pill[0]);
      set("--pill-fg", pill[1]);

      if (artist.photo) {
        const wrap = document.createElement("div");
        wrap.className = "artist-photo-wrap";
        wrap.append(img("artist-photo", imageSrc(artist.photo)));
        card.append(wrap);
      }

      const heart = heartSrc(artist);
      if (heart && !artist.hideHeart) card.append(img("artist-heart", imageSrc(heart)));

      const pills = document.createElement("div");
      pills.className = "artist-pills";

      if (artist.song) {
        const song = document.createElement("p");
        song.className = "pill pill-song";
        song.textContent = artist.song;
        pills.append(song);
      }

      if (artist.name) {
        const name = document.createElement("p");
        name.className = "pill pill-name";
        name.textContent = artist.name;
        pills.append(name);
      }

      card.append(pills);
      return card;
    }

    function buildArtist(raw, index, key = index) {
      const artist = tidy(raw);
      const wrapper = document.createElement("article");
      wrapper.className = "artist";
      wrapper.style.setProperty("--i", index);

      wrapper.append(buildCard(artist));

      if (hasDetails(artist)) {
        const id = "details-" + index;
        const startOpen = openDetails.has(key);
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "more";
        toggle.setAttribute("aria-expanded", String(startOpen));
        toggle.setAttribute("aria-controls", id);

        const label = document.createElement("span");
        label.textContent = startOpen ? "Hide details" : "More details";
        const chevron = document.createElement("i");
        chevron.setAttribute("data-lucide", "chevron-down");
        chevron.setAttribute("aria-hidden", "true");
        toggle.append(label, chevron);

        const panel = document.createElement("div");
        panel.className = "details" + (startOpen ? " open" : "");
        panel.id = id;
        panel.setAttribute("role", "region");

        const inner = document.createElement("div");
        inner.className = "details-inner";
        const body = document.createElement("div");
        body.className = "details-body";

        const meta = [artist.country, artist.year].filter(Boolean).join(" · ");
        if (meta) {
          const line = document.createElement("div");
          line.className = "details-meta";
          line.textContent = meta;
          body.append(line);
        }

        artist.bio.split(/\n{2,}/).filter(Boolean).forEach((paragraph) => {
          const text = document.createElement("p");
          text.textContent = paragraph;
          body.append(text);
        });

        if (artist.facts.length) {
          const list = document.createElement("dl");
          list.className = "facts";
          artist.facts.forEach((fact) => {
            const term = document.createElement("dt");
            term.textContent = fact.label;
            const value = document.createElement("dd");
            value.textContent = fact.value;
            list.append(term, value);
          });
          body.append(list);
        }

        if (artist.links.length) {
          const links = document.createElement("div");
          links.className = "links";
          artist.links.forEach((item) => {
            const link = document.createElement("a");
            link.className = "link-button";
            link.href = item.url;
            if (isExternal(item.url)) { link.target = "_blank"; link.rel = "noopener noreferrer"; }
            const text = document.createElement("span");
            text.textContent = item.label || "Open link";
            const icon = document.createElement("i");
            icon.setAttribute("data-lucide", isExternal(item.url) ? "arrow-up-right" : "arrow-right");
            icon.setAttribute("aria-hidden", "true");
            link.append(text, icon);
            links.append(link);
          });
          body.append(links);
        }

        inner.append(body);
        panel.append(inner);

        toggle.addEventListener("click", () => {
          const open = panel.classList.toggle("open");
          if (open) openDetails.add(key); else openDetails.delete(key);
          toggle.setAttribute("aria-expanded", String(open));
          label.textContent = open ? "Hide details" : "More details";
        });

        wrapper.append(toggle, panel);
      }

      return wrapper;
    }

    function render() {
      const useSample = !adding && !draft && saved.length === 0;
      const all = useSample ? SAMPLE_ARTISTS : current();
      const years = [...new Set(all.map((artist) => String(artist.year || "").trim()).filter(Boolean))].sort();

      if (yearFilter && !years.includes(yearFilter)) yearFilter = "";

      $("chips").hidden = years.length < 2;
      $("chips").innerHTML = "";
      ["", ...years].forEach((year) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = year || "All";
        button.classList.toggle("active", year === yearFilter);
        button.setAttribute("aria-pressed", String(year === yearFilter));
        button.addEventListener("click", () => {
          yearFilter = year;
          history.replaceState(null, "", location.pathname + location.search + (year ? "#" + year : ""));
          render();
        });
        $("chips").append(button);
      });

      const shown = all
        .map((artist, key) => ({ artist, key }))
        .filter(({ artist }) => hasContent(tidy(artist)) && (!yearFilter || String(artist.year || "").trim() === yearFilter));

      $("grid").innerHTML = "";
      shown.forEach(({ artist, key }, index) => $("grid").append(buildArtist(artist, index, key)));

      $("badge").hidden = !useSample;
      $("empty").hidden = shown.length > 0;
      if (window.lucide) window.lucide.createIcons();
    }

    /* ---------- Loading what is published ---------- */

    function useSaved(data) {
      saved = listOf(data).filter((item) => item && typeof item === "object").map(tidy).filter(hasContent);
    }

    try {
      useSaved(JSON.parse(localStorage.getItem(CACHE_KEY) || "null"));
    } catch (error) {
      useSaved(null);
    }

    render();

    if (configured) {
      fetch(ARTISTS_URL, { cache: "no-store" })
        .then((response) => (response.ok ? response.json() : null))
        .then((data) => {
          useSaved(data);
          if (data) localStorage.setItem(CACHE_KEY, JSON.stringify(data));
          else localStorage.removeItem(CACHE_KEY);
          if (!draft) render();
          if (adding && typeof buildEditors === "function") buildEditors();
        })
        .catch(() => {});
    }

    window.addEventListener("hashchange", () => {
      yearFilter = location.hash.replace("#", "");
      render();
    });

    /* =========================================================
       artists.html?add  (the editor)
    ========================================================= */

    let buildEditors = null;

    if (adding) {
      document.body.classList.add("adding");
      $("addPanel").hidden = false;

      const note = (text, isError) => {
        $("addNote").textContent = text;
        $("addNote").classList.toggle("error", Boolean(isError));
      };

      const edit = () => {
        if (!draft) draft = saved.map((artist) => JSON.parse(JSON.stringify(artist)));
        return draft;
      };

      /* ----- Admin sign-in (shared with the other pages) ----- */

      let session = null;
      try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (error) { session = null; }

      const showLogin = () => { $("addLogin").hidden = Boolean(session); };

      async function getToken() {
        if (!session) throw new Error("Sign in first.");
        if (session.expiresAt - Date.now() > 60000) return session.idToken;

        const response = await fetch(
          "https://securetoken.googleapis.com/v1/token?key=" + CFG.apiKey,
          {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(session.refreshToken)
          }
        );
        const data = await response.json();

        if (!response.ok) {
          session = null;
          localStorage.removeItem(SESSION_KEY);
          showLogin();
          throw new Error("Your session ended. Please sign in again.");
        }

        session = {
          ...session,
          idToken: data.id_token,
          refreshToken: data.refresh_token,
          expiresAt: Date.now() + Number(data.expires_in) * 1000
        };
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        return session.idToken;
      }

      $("addLogin").addEventListener("submit", async (event) => {
        event.preventDefault();
        note("Signing in...");

        try {
          const response = await fetch(
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + CFG.apiKey,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: $("addEmail").value.trim(),
                password: $("addPassword").value,
                returnSecureToken: true
              })
            }
          );
          const data = await response.json();
          if (!response.ok) throw new Error("Wrong email or password.");

          session = {
            email: data.email,
            idToken: data.idToken,
            refreshToken: data.refreshToken,
            expiresAt: Date.now() + Number(data.expiresIn) * 1000
          };
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          $("addPassword").value = "";
          showLogin();
          note("Signed in. Now press Confirm & publish.");
        } catch (error) {
          note(error.message, true);
        }
      });

      /* ----- One editor per artist ----- */

      const el = (tag, props = {}, ...children) => {
        const element = document.createElement(tag);
        Object.assign(element, props);
        children.forEach((child) => element.append(child));
        return element;
      };

      const field = (label, ...controls) =>
        el("label", { className: "field" }, el("span", { textContent: label }), ...controls);

      const text = (prop, value, placeholder) => {
        const input = el("input", { type: "text", value: value || "", placeholder: placeholder || "" });
        input.dataset.prop = prop;
        return input;
      };

      const action = (label, name, title, ghost = true) => {
        const button = el("button", { type: "button", textContent: label, title });
        button.dataset.action = name;
        button.setAttribute("aria-label", title);
        if (ghost) button.className = "ghost";
        return button;
      };

      const section = (title) => el("div", { className: "section-title", textContent: title });

      // A slider that shows its value. Typing changes are applied by the shared input handler.
      const range = (label, prop, value, min, max, step, unit) => {
        const input = el("input", { type: "range", min, max, step, value });
        input.dataset.prop = prop;
        input.dataset.unit = unit;
        return el("div", { className: "range-row" },
          el("span", { textContent: label }), input, el("output", { textContent: value + unit }));
      };

      const select = (prop, value, options) => {
        const element = el("select");
        Object.entries(options).forEach(([optionValue, label]) => element.append(new Option(label, optionValue)));
        element.value = value;
        element.dataset.prop = prop;
        return element;
      };

      const check = (prop, label, checked) => {
        const input = el("input", { type: "checkbox", checked });
        input.dataset.prop = prop;
        return el("label", { className: "check" }, input, el("span", { textContent: label }));
      };

      const subRows = (artist, kind, a, b, labelA, labelB) => {
        const wrap = el("div");
        (artist[kind] || []).forEach((item, position) => {
          const row = el("div", { className: "sub-row" });
          row.dataset.kind = kind;
          row.dataset.position = position;
          row.append(text(a, item[a], labelA), text(b, item[b], labelB), action("✕", "remove-sub", "Remove"));
          wrap.append(row);
        });
        return wrap;
      };

      // Which editor cards are expanded (by position in the list)
      const openEditors = new Set();

      function remap(map) {
        const next = [...openEditors].map(map).filter((index) => index !== null && index >= 0);
        openEditors.clear();
        next.forEach((index) => openEditors.add(index));
      }

      const titleOf = (artist, index, open) =>
        (open ? "▾ " : "▸ ") + (index + 1) + ". " +
        ([artist.name, artist.song].filter(Boolean).join(" · ") || "New artist");

      buildEditors = function () {
        const list = current();
        $("editors").innerHTML = "";

        if (!list.length) {
          $("editors").append(el("p", { className: "add-empty", textContent: "No artists yet. Press Add artist to make the first card." }));
          return;
        }

        list.forEach((raw, index) => {
          const view = tidy(raw);
          const open = openEditors.has(index);
          const box = el("div", { className: "editor" });
          box.dataset.index = index;

          const toggle = action(titleOf(view, index, open), "toggle-editor", open ? "Collapse" : "Expand");
          toggle.classList.add("toggle");
          const buttons = el("span", { className: "editor-btns" },
            action("↑", "up", "Move up"),
            action("↓", "down", "Move down"),
            action("⧉", "duplicate", "Duplicate this artist"),
            action("✕", "remove", "Remove artist"));
          box.append(el("div", { className: "editor-head" }, toggle, buttons));
          $("editors").append(box);

          if (!open) return;

          box.append(el("div", { className: "row2" },
            field("Artist name", text("name", raw.name, "Artist")),
            field("Song title", text("song", raw.song, "Song Title"))));

          box.append(el("div", { className: "row2" },
            field("Country", text("country", raw.country, "Greece")),
            field("Edition (year)", text("year", raw.year, "2028"))));

          // ---- Photo
          box.append(section("Photo"));

          const uploaded = /^data:image\//i.test(raw.photo || "");
          const photoInput = text("photo", uploaded ? "Uploaded photo" : raw.photo, "images/artists/name.jpg or https://...");
          photoInput.disabled = uploaded;
          const thumb = el("img", { className: "thumb", alt: "" });
          if (raw.photo && safeImage(raw.photo)) thumb.src = imageSrc(raw.photo); else thumb.hidden = true;
          thumb.addEventListener("error", () => { thumb.hidden = true; });
          const file = el("input", { type: "file", accept: "image/*", hidden: true });
          file.dataset.action = "upload";
          const upload = el("label", { className: "file-button", textContent: "Upload photo" }, file);
          const photoRow = el("div", { className: "inline" }, thumb, photoInput, upload);
          if (raw.photo) photoRow.append(action("Remove", "remove-photo", "Remove the photo"));
          box.append(field("Picture (it covers the whole card)", photoRow));

          // ---- Preview and position
          box.append(section("Preview and photo position"));
          box.append(el("div", { className: "editor-preview" }, buildCard(view)));
          box.append(el("p", { className: "drag-hint", textContent: "Drag the preview to move the photo, or use the buttons." }));

          box.append(el("div", { className: "pos-grid" },
            action("←", "pos-left", "Move the photo left"),
            action("→", "pos-right", "Move the photo right"),
            action("↑", "pos-up", "Move the photo up"),
            action("↓", "pos-down", "Move the photo down"),
            action("−", "zoom-out", "Zoom out"),
            action("+", "zoom-in", "Zoom in"),
            action("⇋ Flip", "flip", "Flip the photo"),
            action("Reset", "pos-reset", "Reset the photo position")));

          box.append(range("Zoom", "zoom", view.zoom, 1, 3, 0.05, "×"));
          box.append(range("Left / right", "photoX", view.photoX, 0, 100, 1, "%"));
          box.append(range("Up / down", "photoY", view.photoY, 0, 100, 1, "%"));
          box.append(range("Darken photo", "shade", view.shade, 0, 90, 1, "%"));

          // ---- Heart, glow and card style
          box.append(section("Heart flag, glow and style"));

          const auto = raw.country ? HEART_FOLDER + slug(raw.country) + HEART_EXT : "images/hearts/country.png";
          box.append(field("Heart flag image (leave empty to use the country name)",
            text("heart", /^data:/i.test(raw.heart || "") ? "" : raw.heart, auto)));

          box.append(check("hideHeart", "Hide the heart on this card", view.hideHeart));
          box.append(el("div", { className: "row2" },
            field("Heart side", select("heartSide", view.heartSide, { left: "Left", right: "Right" })),
            field("Card shape", select("ratio", view.ratio, RATIOS))));
          box.append(range("Heart size", "heartSize", view.heartSize, 50, 170, 1, "%"));
          box.append(range("Glow strength", "glowPower", view.glowPower, 0, 250, 5, "%"));

          const color = el("input", { type: "color", value: view.glow });
          color.dataset.prop = "glow";
          box.append(el("div", { className: "row2" },
            field("Glow colour", el("div", { className: "inline" }, color, action("Reset", "reset-glow", "Use the default glow colour"))),
            field("Pill style", select("pillStyle", view.pillStyle, { black: "Black pills", white: "White pills", accent: "Glow-colour pills" }))));

          // ---- More details (the dropdown on the page)
          box.append(section("More details (the dropdown)"));

          const bio = el("textarea", { value: raw.bio || "", maxLength: 1200, placeholder: "A short introduction to the artist" });
          bio.dataset.prop = "bio";
          const count = el("span", { className: "count", textContent: bio.value.length + " / 1200" });
          bio.addEventListener("input", () => { count.textContent = bio.value.length + " / 1200"; });
          box.append(field("Biography", bio, count));

          box.append(field("Facts (for example Language, Songwriter)",
            subRows(raw, "facts", "label", "value", "Label", "Value"),
            action("Add fact", "add-fact", "Add a fact")));

          box.append(field("Links (buttons)",
            subRows(raw, "links", "label", "url", "Button text", "https://..."),
            action("Add link", "add-link", "Add a link")));
        });
      };

      const indexOf = (element) => Number(element.closest(".editor").dataset.index);

      // Redraw the little preview (and the toggle title) without rebuilding the form.
      function refreshBox(box, index) {
        const view = tidy(current()[index]);
        const preview = box.querySelector(".editor-preview");
        if (preview) preview.replaceChildren(buildCard(view));

        const toggle = box.querySelector(".toggle");
        if (toggle) toggle.textContent = titleOf(view, index, true);
      }

      // Move every slider to the stored value (after a button or a drag).
      function syncSliders(box, index) {
        const view = tidy(current()[index]);
        box.querySelectorAll('input[type="range"][data-prop]').forEach((slider) => {
          slider.value = view[slider.dataset.prop];
          slider.nextElementSibling.textContent = slider.value + slider.dataset.unit;
        });
      }

      // Typing changes the preview straight away. Nothing is saved yet.
      $("editors").addEventListener("input", (event) => {
        const target = event.target;
        const prop = target.dataset.prop;
        if (!prop || target.disabled) return;

        const index = indexOf(target);
        const box = target.closest(".editor");
        const artist = edit()[index];
        const row = target.closest(".sub-row");
        const value = target.type === "checkbox" ? target.checked
          : target.type === "range" ? Number(target.value)
          : target.value;

        if (row) artist[row.dataset.kind][Number(row.dataset.position)][prop] = value;
        else artist[prop] = value;

        if (target.type === "range") target.nextElementSibling.textContent = target.value + target.dataset.unit;

        // Keep the automatic heart image hint up to date without rebuilding the form.
        if (prop === "country") {
          box.querySelector('[data-prop="heart"]').placeholder =
            target.value.trim() ? HEART_FOLDER + slug(target.value) + HEART_EXT : "images/hearts/country.png";
        }

        if (prop === "photo") {
          const thumb = box.querySelector(".thumb");
          const safe = safeImage(target.value);
          thumb.hidden = !safe;
          if (safe) thumb.src = imageSrc(safe);
        }

        refreshBox(box, index);
        render();
        note("Previewing on the page. Press Confirm & publish to share it.");
      });

      // Make a photo small enough to store with the card (max 900px wide, JPEG).
      function resizePhoto(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("Could not read that file."));
          reader.onload = () => {
            const picture = new Image();
            picture.onerror = () => reject(new Error("That file is not a picture."));
            picture.onload = () => {
              const scale = Math.min(1, 900 / picture.width);
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(picture.width * scale));
              canvas.height = Math.max(1, Math.round(picture.height * scale));
              const context = canvas.getContext("2d");
              context.fillStyle = "#1d2033";
              context.fillRect(0, 0, canvas.width, canvas.height);
              context.drawImage(picture, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/jpeg", 0.8));
            };
            picture.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      $("editors").addEventListener("change", async (event) => {
        const target = event.target;
        if (target.dataset.action !== "upload" || !target.files[0]) return;

        const index = indexOf(target);
        note("Preparing the photo...");

        try {
          const data = await resizePhoto(target.files[0]);
          edit()[index].photo = data;
          buildEditors();
          render();
          note("Photo added (" + Math.round(data.length * 0.75 / 1024) + " KB). Press Confirm & publish to share it.");
        } catch (error) {
          note(error.message, true);
        }
      });

      // Drag the preview to move the photo
      let drag = null;

      $("editors").addEventListener("pointerdown", (event) => {
        const card = event.target.closest(".editor-preview .artist-card");
        if (!card) return;

        const index = indexOf(card);
        const view = tidy(current()[index]);
        if (!view.photo) return;

        drag = { card, index, x: event.clientX, y: event.clientY, px: view.photoX, py: view.photoY, w: card.clientWidth, h: card.clientHeight };
        card.setPointerCapture(event.pointerId);
        card.classList.add("dragging");
      });

      $("editors").addEventListener("pointermove", (event) => {
        if (!drag) return;

        const px = clamp(Math.round(drag.px - ((event.clientX - drag.x) / drag.w) * 100), 0, 100);
        const py = clamp(Math.round(drag.py - ((event.clientY - drag.y) / drag.h) * 100), 0, 100);
        const artist = edit()[drag.index];

        artist.photoX = px;
        artist.photoY = py;
        drag.card.style.setProperty("--px", px + "%");
        drag.card.style.setProperty("--py", py + "%");
        syncSliders(drag.card.closest(".editor"), drag.index);
        render();
      });

      const endDrag = () => {
        if (!drag) return;
        drag.card.classList.remove("dragging");
        drag = null;
        note("Previewing on the page. Press Confirm & publish to share it.");
      };

      $("editors").addEventListener("pointerup", endDrag);
      $("editors").addEventListener("pointercancel", endDrag);

      $("editors").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;

        const box = button.closest(".editor");
        const index = indexOf(button);
        const name = button.dataset.action;

        // Position buttons update the preview in place (no form rebuild).
        const POSITION = {
          "pos-left":  (a, v) => { a.photoX = clamp(v.photoX + 5, 0, 100); },
          "pos-right": (a, v) => { a.photoX = clamp(v.photoX - 5, 0, 100); },
          "pos-up":    (a, v) => { a.photoY = clamp(v.photoY + 5, 0, 100); },
          "pos-down":  (a, v) => { a.photoY = clamp(v.photoY - 5, 0, 100); },
          "zoom-in":   (a, v) => { a.zoom = clamp(Math.round((v.zoom + 0.1) * 100) / 100, 1, 3); },
          "zoom-out":  (a, v) => { a.zoom = clamp(Math.round((v.zoom - 0.1) * 100) / 100, 1, 3); },
          "flip":      (a, v) => { a.flip = !v.flip; },
          "pos-reset": (a) => { a.photoX = 50; a.photoY = 20; a.zoom = 1; a.flip = false; }
        };

        if (POSITION[name]) {
          const list = edit();
          POSITION[name](list[index], tidy(list[index]));
          syncSliders(box, index);
          refreshBox(box, index);
          render();
          note("Previewing on the page. Press Confirm & publish to share it.");
          return;
        }

        // Opening or closing a card is only a view change, not an edit.
        if (name === "toggle-editor") {
          if (openEditors.has(index)) openEditors.delete(index); else openEditors.add(index);
          buildEditors();
          return;
        }

        const list = edit();
        const artist = list[index];

        if (name === "remove") {
          list.splice(index, 1);
          remap((i) => (i === index ? null : i > index ? i - 1 : i));
        }

        if (name === "up" && index > 0) {
          [list[index - 1], list[index]] = [list[index], list[index - 1]];
          remap((i) => (i === index ? index - 1 : i === index - 1 ? index : i));
        }

        if (name === "down" && index < list.length - 1) {
          [list[index + 1], list[index]] = [list[index], list[index + 1]];
          remap((i) => (i === index ? index + 1 : i === index + 1 ? index : i));
        }

        if (name === "duplicate") {
          list.splice(index + 1, 0, JSON.parse(JSON.stringify(artist)));
          remap((i) => (i > index ? i + 1 : i));
          openEditors.add(index + 1);
        }

        if (name === "remove-photo") artist.photo = "";
        if (name === "reset-glow") artist.glow = DEFAULT_GLOW;
        if (name === "add-fact") (artist.facts = artist.facts || []).push({ label: "", value: "" });
        if (name === "add-link") (artist.links = artist.links || []).push({ label: "", url: "" });

        if (name === "remove-sub") {
          const row = button.closest(".sub-row");
          artist[row.dataset.kind].splice(Number(row.dataset.position), 1);
        }

        buildEditors();
        render();
      });

      $("artistAdd").addEventListener("click", () => {
        const list = edit();
        list.push({ name: "", song: "", country: "", year: yearFilter, photo: "", heart: "", glow: DEFAULT_GLOW, bio: "", facts: [], links: [] });
        openEditors.add(list.length - 1);
        buildEditors();
        render();

        const names = $("editors").querySelectorAll('[data-prop="name"]');
        names[names.length - 1].focus();
      });

      // ----- Sorting, backup and restore -----

      $("artistSortName").addEventListener("click", () => {
        const label = (artist) => String(artist.name || artist.song || "").toLowerCase();
        edit().sort((a, b) => label(a).localeCompare(label(b)));
        openEditors.clear();
        buildEditors();
        render();
        note("Sorted A-Z. Press Confirm & publish to keep the new order.");
      });

      $("artistSortYear").addEventListener("click", () => {
        const label = (artist) => String(artist.name || artist.song || "").toLowerCase();
        edit().sort((a, b) => String(b.year || "").localeCompare(String(a.year || "")) || label(a).localeCompare(label(b)));
        openEditors.clear();
        buildEditors();
        render();
        note("Sorted by edition, newest first. Press Confirm & publish to keep the new order.");
      });

      $("artistExport").addEventListener("click", () => {
        const data = JSON.stringify(current().map(tidy), null, 2);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
        link.download = "artists-backup.json";
        link.click();
        URL.revokeObjectURL(link.href);
        note("Backup downloaded (artists-backup.json).");
      });

      $("artistImport").addEventListener("click", () => $("artistImportFile").click());

      $("artistImportFile").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        event.target.value = "";
        if (!file) return;

        try {
          const imported = listOf(JSON.parse(await file.text())).filter((item) => item && typeof item === "object");
          if (!imported.length) throw new Error("There are no artists in that file.");

          draft = imported.map(tidy);
          openEditors.clear();
          buildEditors();
          render();
          note("Imported " + draft.length + " artist(s). Press Confirm & publish to share them.");
        } catch (error) {
          note(error instanceof SyntaxError ? "That file is not a valid backup." : error.message, true);
        }
      });

      $("artistUndo").addEventListener("click", () => {
        draft = null;
        openEditors.clear();
        buildEditors();
        render();
        note("Back to the last published artists.");
      });

      $("artistClear").addEventListener("click", () => {
        if (!current().length) return note("There are no artists to remove.");
        if (!confirm("Remove all artist cards?")) return;

        draft = [];
        openEditors.clear();
        buildEditors();
        render();
        note("All cards removed here. Press Confirm & publish to remove them for everyone.");
      });

      $("artistConfirm").addEventListener("click", async () => {
        if (!draft) return note("Nothing to publish yet. Add or edit an artist first.");
        if (!configured) return note("Fill in status-config.js first.", true);
        if (!session) { showLogin(); return note("Sign in below, then press Confirm again.", true); }

        const artists = draft.map(tidy).filter(hasContent);
        note("Publishing...");

        try {
          const token = await getToken();
          const response = await fetch(ARTISTS_URL + "?auth=" + encodeURIComponent(token), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(artists)
          });

          if (!response.ok) {
            let detail = "";
            try { detail = (await response.json()).error || ""; } catch (error) { detail = ""; }

            throw new Error(
              /permission/i.test(detail)
                ? "Permission denied. Add the artists rule in Firebase (see the instructions) and Publish."
                : "Could not save (error " + response.status + (detail ? ": " + detail : "") + ")."
            );
          }

          saved = artists;
          draft = null;
          if (artists.length) localStorage.setItem(CACHE_KEY, JSON.stringify(artists));
          else localStorage.removeItem(CACHE_KEY);
          buildEditors();
          render();
          note("Published. Everyone sees the artists now.");
        } catch (error) {
          note(error.message, true);
        }
      });

      $("addToggle").addEventListener("click", () => {
        const collapsed = $("addPanel").classList.toggle("collapsed");
        $("addToggle").textContent = collapsed ? "Show" : "Hide";
      });

      showLogin();
      buildEditors();
    }

    // Render Lucide icons.
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>

</body>
</html>
