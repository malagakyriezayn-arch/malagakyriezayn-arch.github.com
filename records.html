<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171329">

  <title>Records and hall of fame | Eurovision Rewind</title>
  <meta name="description" content="The winners, records and leaderboards of Eurovision Rewind.">
  <link rel="icon" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.460.0"></script>

  <style>
    :root {
      --white: #ffffff;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Montserrat", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at 10% 0%, rgba(112, 83, 213, .25), transparent 40%),
        radial-gradient(ellipse at 100% 35%, rgba(52, 166, 175, .13), transparent 38%),
        linear-gradient(145deg, #171329, #101522 65%, #171329);
      background-attachment: fixed;
    }

    @media (hover: none) {
      body { background-attachment: scroll; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* NAVIGATION */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 13px 5%;
      background: rgba(19, 17, 39, .72);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .nav-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.075);
      box-shadow: 0 8px 30px rgba(0,0,0,.16);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      color: #d0ccdf;
      font-size: 11px;
      font-weight: 600;
      transition: .25s ease;
    }

    .nav-link svg {
      width: 16px;
      height: 16px;
    }

    .nav-link:hover {
      color: white;
      background: rgba(255,255,255,.09);
    }

    .nav-link.active {
      color: white;
      background: linear-gradient(135deg, #806be8, #5545ae);
      box-shadow: 0 4px 18px rgba(103,81,210,.25);
    }

    .nav-home {
      width: 40px;
      padding: 0;
    }

    /* MAIN (empty - add your content here) */

    main {
      width: min(1180px, 94%);
      margin: 0 auto;
      padding: 30px 0 80px;
    }

    /* =========================
       CUSTOM FONT
       Put the font files in a "fonts" folder next to this page.
    ========================= */

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "ResultsFont";
      src: url("fonts/Neulis-MediumItalic.otf") format("opentype");
      font-weight: 500;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --artist-font: "ResultsFont", "Neulis", "Montserrat", sans-serif;
      --muted: rgba(255, 255, 255, 0.7);
      --line: rgba(255, 255, 255, 0.16);
      --rank-bg: #7b2c8a;
      --name-bg: #913e9f;
      --board-bg: #571f64;
    }

    [hidden] { display: none !important; }

    a:focus-visible,
    button:focus-visible,
    select:focus-visible {
      outline: 2px solid #c9bdff;
      outline-offset: 3px;
    }

    .page-head { margin-bottom: 22px; text-align: center; }

    .page-head h1 {
      color: #fff;
      font-family: var(--artist-font);
      font-size: clamp(36px, 7.5vw, 62px);
      font-weight: 500;
      letter-spacing: -1px;
      line-height: 1.05;
    }

    .page-head p {
      max-width: 580px;
      margin: 12px auto 0;
      color: var(--muted);
      font-family: var(--artist-font);
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 12px;
      color: #ffd28a;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 210, 138, 0.1);
      border: 1px solid rgba(255, 210, 138, 0.3);
      border-radius: 999px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .chips a,
    .chips button {
      min-width: 74px;
      padding: 9px 18px;
      color: #c2bfd6;
      font: 700 13px "Montserrat", sans-serif;
      letter-spacing: 0.6px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .chips a:hover,
    .chips button:hover { color: #fff; background: rgba(255, 255, 255, 0.13); }

    .chips .active {
      color: #fff;
      background: linear-gradient(135deg, #6f5bd9, #4d3da6);
      border-color: transparent;
    }

    .empty {
      padding: 40px 18px;
      color: var(--muted);
      font-family: var(--artist-font);
      font-size: 17px;
      text-align: center;
    }

    .heart-img {
      flex: none;
      width: 34px;
      height: auto;
      aspect-ratio: 10 / 9;
      object-fit: contain;
    }

    select.pick {
      padding: 10px 14px;
      color: #fff;
      font: 600 13px "Montserrat", sans-serif;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    select.pick option { color: #000; }

    /* =========================
       RECORDS AND HALL OF FAME
    ========================= */

    .section-title {
      margin: 34px 0 14px;
      color: #d4c7ff;
      font-family: var(--artist-font);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .section-title:first-of-type { margin-top: 0; }

    /* Hall of fame: one card per winner */
    .hof-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr));
      gap: 16px;
    }

    .hof {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 22px 16px 18px;
      overflow: hidden;
      color: #fff;
      font-family: var(--artist-font);
      text-align: center;
      background:
        radial-gradient(circle at 50% 26%, rgba(255, 207, 74, 0.22), transparent 62%),
        rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 207, 74, 0.28);
      border-radius: 22px;
      transition: transform 0.2s ease, background 0.2s ease;
      animation: rise 0.5s ease backwards;
      animation-delay: calc(var(--i, 0) * 60ms);
    }

    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    .hof:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.1); }

    .hof .year {
      color: #ffcf4a;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 3px;
    }

    .hof .big-heart {
      width: 112px;
      height: auto;
      aspect-ratio: 10 / 9;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(255, 207, 74, 0.55));
    }

    .hof h3 { font-size: 26px; font-weight: 500; line-height: 1.1; }
    .hof .sub { color: var(--muted); font-size: 14px; }
    .hof .facts { margin-top: 6px; color: #d4c7ff; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }

    /* Record cards */
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 14px;
    }

    .rec {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 18px 18px 16px;
      font-family: var(--artist-font);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 20px;
      animation: rise 0.5s ease backwards;
      animation-delay: calc(var(--i, 0) * 40ms);
    }

    .rec .label {
      color: #d4c7ff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .rec .value {
      color: #fff;
      font-size: 40px;
      font-weight: 500;
      line-height: 1;
    }

    .rec .value small { margin-left: 4px; color: var(--muted); font-size: 15px; font-weight: 400; }

    .holders { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }

    .holder {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: #fff;
      font-size: 17px;
      font-weight: 500;
    }

    .holder:hover .t { text-decoration: underline; }
    .holder .heart-img { width: 32px; }
    .holder .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .holder small { color: var(--muted); font-size: 13px; font-weight: 400; white-space: nowrap; }
    .rec .note { margin-top: auto; color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* Leaderboards use the scoreboard look */
    .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 26px; }

    .board h3 {
      margin-bottom: 10px;
      color: #d4c7ff;
      font-family: var(--artist-font);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .line {
      display: flex;
      align-items: stretch;
      min-height: 48px;
      margin-bottom: 4px;
      color: #fff;
      font-family: var(--artist-font);
      font-weight: 500;
    }

    .line .a, .line .c {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      background: var(--rank-bg);
    }

    .line .a { min-width: 50px; font-size: 19px; }
    .line .c { min-width: 60px; font-size: 17px; }

    .line .b {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 6px 14px;
      background: var(--name-bg);
      font-size: 17px;
    }

    .line .b .heart-img { width: 32px; }
    .line .b .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.line:hover .t { text-decoration: underline; }

    .subnav { margin-top: 28px; text-align: center; font-size: 13px; }
    .subnav a { margin: 0 8px; color: #d4c7ff; text-decoration: underline; text-underline-offset: 3px; }

    /* MOBILE */

    @media (max-width: 560px) {
      .site-header {
        padding: 10px 12px;
      }

      .navbar {
        gap: 8px;
      }

      .brand-logo {
        width: 35px;
        height: 35px;
      }

      .nav-pill {
        gap: 2px;
        padding: 4px;
      }

      .nav-link {
        min-height: 35px;
        padding: 0 9px;
        font-size: 0;
      }

      .nav-home {
        width: 35px;
      }

      main {
        width: 92%;
        padding-top: 22px;
        padding-bottom: 60px;
      }
    }

    @media (max-width: 350px) {
      .brand-logo {
        width: 29px;
        height: 29px;
      }

      .nav-link {
        padding: 0 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

  <script>


/* Shows a message on the page instead of leaving it blank if something goes wrong. */
window.addEventListener("error", function (event) {
  var main = document.querySelector("main");
  if (!main || main.dataset.errorShown) return;
  main.dataset.errorShown = "1";
  var note = document.createElement("p");
  note.className = "empty";
  note.textContent = "Something went wrong while loading this page: " + event.message;
  main.prepend(note);
});

/* =========================================================
   Eurovision Rewind - shared helpers
   Used by participants.html, matrix.html and country.html
   (and, if present, by artists.html and results.html for heart flags).

   Keep this file in the same folder as the pages, next to status-config.js.
========================================================= */

(function () {
  "use strict";

  const CFG = window.STATUS_CONFIG || {};
  const configured = Boolean(CFG.dbUrl && CFG.apiKey && !/YOUR-/.test(CFG.dbUrl + CFG.apiKey));
  const BASE = (CFG.dbUrl || "").replace(/\/$/, "");

  /* ---------- Heart flags ----------
     Every country is shown by a heart image. The file is found from the country name:
       "North Macedonia" -> images/hearts/north-macedonia.png
     A different file can be set for any country with participants.html?add (Hearts tab). */

  const HEART_FOLDER = "images/hearts/";
  const HEART_EXT = ".png";

  const VOTE_GROUPS = [
    { key: "jury", label: "Jury" },
    { key: "tele", label: "Televote" }
  ];
  const VOTE_POINTS = [12, 10, 8, 7, 6, 5, 4, 3, 2, 1];

  // Editions that always exist. More can be added with results.html?data.
  const EDITIONS_BASE = [
    { year: 2026, city: "Vienna, Austria" },
    { year: 2027, city: "Zagreb, Croatia" },
    { year: 2028, city: "Yerevan, Armenia" },
    { year: 2029, city: "Zürich, Switzerland" }
  ];

  const listOf = (value) => Array.isArray(value) ? value : Object.values(value || {});

  const same = (a, b) =>
    String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();

  function slug(name) {
    return String(name || "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/&/g, "and")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  function safeImage(value) {
    const text = String(value || "").trim();
    if (!text) return "";
    if (/^data:image\/(png|jpe?g|webp|gif|svg\+xml)[;,]/i.test(text)) return text;
    if (/^https?:\/\//i.test(text)) return text;
    if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return "";
    return text;
  }

  const imageSrc = (value) => {
    const safe = safeImage(value);
    return /^data:/i.test(safe) ? safe : encodeURI(safe).replace(/%25([0-9A-F]{2})/g, "%$1");
  };

  /* ---------- Loading data (cached in the browser, refreshed from the database) ---------- */

  const NODES = {
    hearts: "hearts",
    results: "results-data",
    participants: "participants",
    artists: "artists"
  };

  const store = {};

  function cached(name) {
    if (name in store) return store[name];
    try {
      store[name] = JSON.parse(localStorage.getItem("rw:" + name) || "null");
    } catch (error) {
      store[name] = null;
    }
    return store[name];
  }

  function keep(name, data) {
    store[name] = data;
    try {
      if (data && Object.keys(data).length) localStorage.setItem("rw:" + name, JSON.stringify(data));
      else localStorage.removeItem("rw:" + name);
    } catch (error) { /* storage full or blocked */ }
  }

  function load(name) {
    if (!configured) return Promise.resolve(cached(name));

    return fetch(BASE + "/" + NODES[name] + ".json", { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : null))
      .then((data) => { keep(name, data); return data; })
      .catch(() => cached(name));
  }

  /* ---------- Heart lookups ---------- */

  // Preview a set of heart replacements without saving it in the browser.
  const setHearts = (map) => { store.hearts = map; };

  const heartMap = () => {
    const raw = cached("hearts");
    return raw && typeof raw === "object" ? raw : {};
  };

  // override (a row's own heart) -> the replacement set for this country -> images/hearts/<country>.png
  function heartPath(country, override) {
    return safeImage(override) || safeImage(heartMap()[slug(country)]) || HEART_FOLDER + slug(country) + HEART_EXT;
  }

  // A missing image keeps its space but stays invisible.
  function heartImg(country, className, override) {
    const image = document.createElement("img");
    image.className = className || "heart-img";
    image.src = imageSrc(heartPath(country, override));
    image.alt = "";
    image.decoding = "async";
    image.addEventListener("error", () => { image.style.visibility = "hidden"; });
    return image;
  }

  /* ---------- Results and votes ---------- */

  function cleanVotes(votes) {
    if (!votes) return undefined;
    const out = {};

    VOTE_GROUPS.forEach(({ key }) => {
      const raw = votes[key];
      if (!raw) return;
      const list = listOf(raw);
      const names = VOTE_POINTS.map((_, i) => String(list[i] || "").trim());
      if (names.some(Boolean)) out[key] = names;
    });

    return Object.keys(out).length ? out : undefined;
  }

  function normRow(item) {
    return {
      country: String(item.country),
      points: item.points,
      ...(item.heart ? { heart: String(item.heart) } : {}),
      ...(item.voterOnly ? { voterOnly: true } : {}),
      ...(cleanVotes(item.votes) ? { votes: cleanVotes(item.votes) } : {})
    };
  }

  // { 2028: { city, grand: [rows], rounds: [{ name, rows }] } }
  function normalizeResults(data) {
    const out = {};

    Object.keys(data || {}).forEach((year) => {
      if (!Number.isInteger(Number(year))) return;
      const value = data[year];
      const rows = (list) => listOf(list).filter((item) => item && item.country).map(normRow);

      out[year] = {
        city: value && !Array.isArray(value) && value.city ? String(value.city) : "",
        grand: Array.isArray(value) ? rows(value) : rows(value && value.grand),
        rounds: Array.isArray(value) ? [] : listOf(value && value.rounds)
          .filter((round) => round && round.name)
          .map((round) => ({ name: String(round.name), rows: rows(round.rows) }))
      };
    });

    return out;
  }

  // Points one country gave another. group: "jury", "tele" or "total" (all groups added together).
  function pointsFor(giver, receiver, group) {
    const keys = group === "total" ? VOTE_GROUPS.map((item) => item.key) : [group];
    let sum = 0;

    keys.forEach((key) => {
      const list = (giver.votes && giver.votes[key]) || [];
      const position = list.findIndex((name) => same(name, receiver));
      if (position >= 0) sum += VOTE_POINTS[position];
    });

    return sum;
  }

  const groupsWithVotes = (rows) =>
    VOTE_GROUPS.filter(({ key }) => rows.some((row) => row.votes && row.votes[key]));

  /* ---------- Editions ---------- */

  // Every year that has a name, results or participants.
  function editions(results, participants) {
    const map = new Map(EDITIONS_BASE.map((edition) => [edition.year, edition.city]));

    Object.keys(results || {}).forEach((year) => {
      const city = results[year].city;
      if (city) map.set(Number(year), city);
      else if (!map.has(Number(year))) map.set(Number(year), "");
    });

    Object.keys(participants || {}).forEach((year) => {
      if (Number.isInteger(Number(year)) && !map.has(Number(year))) map.set(Number(year), "");
    });

    return [...map.entries()].map(([year, city]) => ({ year, city })).sort((a, b) => a.year - b.year);
  }

  /* ---------- Participants ---------- */

  function normEntry(item) {
    const number = (value) => (Number.isFinite(Number(value)) && value !== "" && value !== null ? Number(value) : 0);

    return {
      country: String(item.country || "").trim().slice(0, 60),
      artist: String(item.artist || "").trim().slice(0, 80),
      song: String(item.song || "").trim().slice(0, 100),
      semi: String(item.semi || "").trim().slice(0, 40),
      inFinal: item.inFinal === undefined ? true : Boolean(item.inFinal),
      semiOrder: number(item.semiOrder),
      finalOrder: number(item.finalOrder)
    };
  }

  // { 2029: [entries] }
  function normalizeParticipants(data) {
    const out = {};

    Object.keys(data || {}).forEach((year) => {
      if (!Number.isInteger(Number(year))) return;
      const value = data[year];
      const list = listOf(Array.isArray(value) ? value : value && value.entries)
        .filter((item) => item && item.country)
        .map(normEntry);
      if (list.length) out[year] = list;
    });

    return out;
  }

  /* ---------- Demo data (shown only until you publish real results) ---------- */

  const SAMPLE = [
    ["France", 248], ["Ukraine", 177], ["Georgia", 176], ["Armenia", 175],
    ["Spain", 152], ["Albania", 145], ["North Macedonia", 141], ["Poland", 139],
    ["Netherlands", 93], ["Malta", 92], ["Italy", 73], ["Portugal", 73],
    ["Croatia", 70], ["Azerbaijan", 66], ["Cyprus", 50], ["Montenegro", 49]
  ];

  function sampleResults() {
    const names = SAMPLE.map(([name]) => name);
    const hash = (text) => [...text].reduce((sum, char) => sum + char.charCodeAt(0), 0);

    const pick = (name, index, seed) => names
      .filter((other) => other !== name)
      .map((other) => [other, (hash(other) * (index + 3) + seed * 7) % 97])
      .sort((a, b) => a[1] - b[1])
      .slice(0, 10)
      .map(([other]) => other);

    const rows = SAMPLE.map(([country, points], index) =>
      normRow({ country, points, votes: { jury: pick(country, index, 1), tele: pick(country, index, 5) } }));

    return { 2028: { city: "Yerevan, Armenia", grand: rows, rounds: [], sample: true } };
  }

  function sampleParticipants() {
    return {
      2028: SAMPLE.map(([country], index) => normEntry({
        country,
        artist: "Artist",
        song: "Song Title",
        semi: index < 8 ? "Semi-final 1" : "Semi-final 2",
        inFinal: true,
        semiOrder: (index % 8) + 1,
        finalOrder: index + 1
      }))
    };
  }

  /* ---------- Admin sign-in (the same login as the other editors) ---------- */

  const SESSION_KEY = "statusAdminSession";
  let session = null;

  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (error) { session = null; }

  function saveSession(next) {
    session = next;
    if (next) localStorage.setItem(SESSION_KEY, JSON.stringify(next));
    else localStorage.removeItem(SESSION_KEY);
  }

  async function signIn(email, password) {
    const response = await fetch(
      "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + CFG.apiKey,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, returnSecureToken: true })
      }
    );
    const data = await response.json();
    if (!response.ok) throw new Error("Wrong email or password.");

    saveSession({
      email: data.email,
      idToken: data.idToken,
      refreshToken: data.refreshToken,
      expiresAt: Date.now() + Number(data.expiresIn) * 1000
    });
  }

  async function getToken() {
    if (!session) throw new Error("Sign in first.");
    if (session.expiresAt - Date.now() > 60000) return session.idToken;

    const response = await fetch(
      "https://securetoken.googleapis.com/v1/token?key=" + CFG.apiKey,
      {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(session.refreshToken)
      }
    );
    const data = await response.json();

    if (!response.ok) {
      saveSession(null);
      throw new Error("Your session ended. Please sign in again.");
    }

    saveSession({
      ...session,
      idToken: data.id_token,
      refreshToken: data.refresh_token,
      expiresAt: Date.now() + Number(data.expires_in) * 1000
    });

    return session.idToken;
  }

  // Writes a whole node ("participants", "hearts") to the database.
  async function publish(name, payload) {
    const token = await getToken();
    const response = await fetch(BASE + "/" + NODES[name] + ".json?auth=" + encodeURIComponent(token), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      let detail = "";
      try { detail = (await response.json()).error || ""; } catch (error) { detail = ""; }

      throw new Error(
        /permission/i.test(detail)
          ? 'Permission denied. Add the "' + NODES[name] + '" rule in Firebase (see the instructions) and Publish.'
          : "Could not save (error " + response.status + (detail ? ": " + detail : "") + ")."
      );
    }

    keep(name, payload);
  }

  window.RW = {
    configured,
    HEART_FOLDER, HEART_EXT, VOTE_GROUPS, VOTE_POINTS, EDITIONS_BASE,
    listOf, same, slug, safeImage, imageSrc,
    cached, load, keep, setHearts, heartMap, heartPath, heartImg,
    cleanVotes, normRow, normalizeResults, pointsFor, groupsWithVotes,
    editions, normEntry, normalizeParticipants,
    sampleResults, sampleParticipants,
    signedIn: () => Boolean(session),
    userEmail: () => (session && session.email) || "",
    signIn, signOut: () => saveSession(null), publish
  };
})();

  
  </script>
  <script>
    (function () {
      const root = document.getElementById("root");
      let usingSample = false;

      const el = (tag, className, text) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      };

      const link = (name) => "country.html?c=" + encodeURIComponent(RW.slug(name));
      const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

      /* ---------- Data ---------- */

      // Three made-up editions, used only until real results are published.
      function demo() {
        const base = RW.sampleResults()[2028].grand;
        const out = {};

        [2026, 2027, 2028].forEach((year, shift) => {
          const rows = base
            .map((row, index) => ({ ...row, points: base[(index + shift * 5) % base.length].points }))
            .sort((a, b) => b.points - a.points);
          out[year] = { city: "", grand: rows, rounds: [] };
        });

        return out;
      }

      function gather() {
        let results = RW.normalizeResults(RW.cached("results"));
        usingSample = !Object.values(results).some((edition) => edition.grand.some((row) => !row.voterOnly));
        if (usingSample) results = demo();

        return {
          results,
          participants: RW.normalizeParticipants(RW.cached("participants")),
          artists: RW.listOf(RW.cached("artists")).filter((item) => item && typeof item === "object")
        };
      }

      // Every finalist of every Grand Final, with the numbers the records need
      function build(data) {
        const entries = [];
        const years = Object.keys(data.results).map(Number).sort((a, b) => a - b);

        years.forEach((year) => {
          const rows = data.results[year].grand;
          const finalists = rows.filter((row) => !row.voterOnly);
          const people = data.participants[year] || [];

          finalists.forEach((row, index) => {
            const entry = people.find((item) => RW.same(item.country, row.country));
            const artist = data.artists.find((item) => RW.same(item.country, row.country) && String(item.year) === String(year));

            // 12 points received from any voter, in any group (jury or televote)
            let twelves = 0;
            rows.forEach((giver) => {
              RW.VOTE_GROUPS.forEach(({ key }) => {
                const list = (giver.votes && giver.votes[key]) || [];
                if (list.length && RW.same(list[0], row.country)) twelves += 1;
              });
            });

            entries.push({
              year, place: index + 1, country: row.country, heart: row.heart,
              points: Number(row.points) || 0, twelves,
              artist: (entry && entry.artist) || (artist && artist.name) || "",
              song: (entry && entry.song) || (artist && artist.song) || "",
              rows, count: finalists.length
            });
          });
        });

        return { entries, years };
      }

      /* ---------- Small helpers ---------- */

      // Everything that has the highest (or lowest) value
      const best = (list, value, lowest) => {
        if (!list.length) return [];
        const target = lowest ? Math.min(...list.map(value)) : Math.max(...list.map(value));
        return list.filter((item) => value(item) === target);
      };

      function heartFor(name, heart, className) {
        return RW.heartImg(name, className || "heart-img", heart);
      }

      function holder(name, detail, heart) {
        const row = el("a", "holder");
        row.href = link(name);
        row.append(heartFor(name, heart), el("span", "t", name));
        if (detail) row.append(el("small", "", detail));
        return row;
      }

      function recordCard(label, value, unit, holders, note, index) {
        const card = el("div", "rec");
        card.style.setProperty("--i", index);
        card.append(el("div", "label", label));

        const big = el("div", "value", String(value));
        if (unit) big.append(el("small", "", unit));
        card.append(big);

        const list = el("div", "holders");
        holders.slice(0, 3).forEach((item) => list.append(holder(item.name, item.detail, item.heart)));
        if (holders.length > 3) list.append(el("div", "note", "and " + (holders.length - 3) + " more"));
        card.append(list);

        if (note) card.append(el("div", "note", note));
        return card;
      }

      function leaderLine(rank, name, value, heart) {
        const row = el("a", "line");
        row.href = link(name);
        row.append(el("div", "a", String(rank).padStart(2, "0")));
        const middle = el("div", "b");
        middle.append(heartFor(name, heart), el("span", "t", name));
        row.append(middle, el("div", "c", String(value)));
        return row;
      }

      /* ---------- The page ---------- */

      function render() {
        const data = gather();
        const { entries, years } = build(data);

        root.innerHTML = "";
        document.getElementById("badge").hidden = !usingSample;

        if (!entries.length) {
          root.append(el("p", "empty", "No Grand Final results have been published yet."));
          return;
        }

        const winners = entries.filter((entry) => entry.place === 1);
        const second = (year) => entries.find((entry) => entry.year === year && entry.place === 2);
        const margin = (winner) => { const runnerUp = second(winner.year); return runnerUp ? winner.points - runnerUp.points : null; };

        /* ----- Hall of fame ----- */

        root.append(el("h2", "section-title", "Hall of fame"));
        const hof = el("div", "hof-grid");

        winners.slice().reverse().forEach((winner, index) => {
          const card = el("a", "hof");
          card.href = "results.html#" + winner.year;
          card.style.setProperty("--i", index);
          card.append(el("span", "year", String(winner.year)),
            heartFor(winner.country, winner.heart, "big-heart"),
            el("h3", "", winner.country));

          const details = [winner.artist, winner.song].filter(Boolean).join(" - ");
          if (details) card.append(el("span", "sub", details));

          const gap = margin(winner);
          card.append(el("span", "facts", winner.points + " points" + (gap !== null ? " · +" + gap : "")));
          hof.append(card);
        });
        root.append(hof);

        /* ----- Records ----- */

        root.append(el("h2", "section-title", "Records"));
        const grid = el("div", "rec-grid");
        let n = 0;
        const add = (card) => { if (card) grid.append(card); };

        // Most wins
        const wins = new Map();
        winners.forEach((winner) => wins.set(RW.slug(winner.country), (wins.get(RW.slug(winner.country)) || 0) + 1));
        const mostWins = Math.max(...wins.values());
        const winHolders = [...wins.entries()].filter(([, count]) => count === mostWins)
          .map(([key]) => winners.find((winner) => RW.slug(winner.country) === key))
          .map((winner) => ({ name: winner.country, heart: winner.heart }));
        add(recordCard("Most wins", mostWins, mostWins === 1 ? "win" : "wins", winHolders,
          mostWins === 1 ? "Every winner has won once so far." : "", n++));

        // Highest and lowest winning score
        const highWin = best(winners, (e) => e.points);
        add(recordCard("Highest winning score", highWin[0].points, "points",
          highWin.map((e) => ({ name: e.country, detail: String(e.year), heart: e.heart })), "", n++));

        if (winners.length > 1) {
          const lowWin = best(winners, (e) => e.points, true);
          add(recordCard("Lowest winning score", lowWin[0].points, "points",
            lowWin.map((e) => ({ name: e.country, detail: String(e.year), heart: e.heart })), "", n++));
        }

        // Margins
        const withMargin = winners.filter((winner) => margin(winner) !== null);
        if (withMargin.length) {
          const big = best(withMargin, margin);
          add(recordCard("Biggest winning margin", "+" + margin(big[0]), "points",
            big.map((e) => ({ name: e.country, detail: e.year + " · ahead of " + second(e.year).country, heart: e.heart })), "", n++));

          if (withMargin.length > 1) {
            const close = best(withMargin, margin, true);
            add(recordCard("Closest finish", "+" + margin(close[0]), margin(close[0]) === 1 ? "point" : "points",
              close.map((e) => ({ name: e.country, detail: e.year + " · ahead of " + second(e.year).country, heart: e.heart })), "", n++));
          }
        }

        // Points without winning, and the lowest score
        const losers = entries.filter((entry) => entry.place > 1);
        if (losers.length) {
          const topLoser = best(losers, (e) => e.points);
          add(recordCard("Most points without winning", topLoser[0].points, "points",
            topLoser.map((e) => ({ name: e.country, detail: e.year + " · #" + e.place, heart: e.heart })), "", n++));
        }

        if (entries.length > 1) {
          const lowest = best(entries, (e) => e.points, true);
          add(recordCard("Fewest points", lowest[0].points, lowest[0].points === 1 ? "point" : "points",
            lowest.map((e) => ({ name: e.country, detail: e.year + " · #" + e.place, heart: e.heart })), "", n++));
        }

        // Maximum scores
        const maxEntries = entries.filter((entry) => entry.twelves > 0);
        if (maxEntries.length) {
          const top = best(maxEntries, (e) => e.twelves);
          add(recordCard("Most maximum scores in one final", top[0].twelves, "x 12 points",
            top.map((e) => ({ name: e.country, detail: String(e.year), heart: e.heart })), "Counted across jury and televote.", n++));
        }

        // Per country totals (used by the next records and the leaderboards)
        const countries = new Map();
        entries.forEach((entry) => {
          const key = RW.slug(entry.country);
          if (!countries.has(key)) countries.set(key, { name: entry.country, heart: entry.heart, entries: [] });
          countries.get(key).entries.push(entry);
        });

        const stats = [...countries.values()].map((country) => ({
          name: country.name,
          heart: country.heart,
          editions: country.entries.length,
          wins: country.entries.filter((e) => e.place === 1).length,
          podiums: country.entries.filter((e) => e.place <= 3).length,
          twelves: country.entries.reduce((sum, e) => sum + e.twelves, 0),
          average: country.entries.reduce((sum, e) => sum + e.place, 0) / country.entries.length
        }));

        const mostEditions = best(stats, (s) => s.editions);
        if (mostEditions[0].editions > 1) {
          add(recordCard("Most editions", mostEditions[0].editions, "editions",
            mostEditions.map((s) => ({ name: s.name, heart: s.heart })), "", n++));
        }

        const mostPodiums = best(stats.filter((s) => s.podiums > 0), (s) => s.podiums);
        if (mostPodiums.length) {
          add(recordCard("Most podium finishes", mostPodiums[0].podiums, "top 3",
            mostPodiums.map((s) => ({ name: s.name, heart: s.heart })), "", n++));
        }

        const mostTwelves = best(stats.filter((s) => s.twelves > 0), (s) => s.twelves);
        if (mostTwelves.length) {
          add(recordCard("Most maximum scores ever", mostTwelves[0].twelves, "x 12 points",
            mostTwelves.map((s) => ({ name: s.name, heart: s.heart })), "All editions added together.", n++));
        }

        const consistent = stats.filter((s) => s.editions >= 2);
        if (consistent.length) {
          const bestAverage = best(consistent, (s) => Math.round(s.average * 10) / 10, true);
          add(recordCard("Best average placing", (Math.round(bestAverage[0].average * 10) / 10).toFixed(1), "",
            bestAverage.map((s) => ({ name: s.name, detail: plural(s.editions, "edition", "editions"), heart: s.heart })),
            "Only countries with at least two editions.", n++));
        }

        // Who gave whom the most points
        const given = new Map();
        const pairs = new Map();

        years.forEach((year) => {
          data.results[year].grand.forEach((giver) => {
            RW.VOTE_GROUPS.forEach(({ key }) => {
              ((giver.votes && giver.votes[key]) || []).forEach((receiver, position) => {
                if (!receiver || RW.same(receiver, giver.country)) return;
                const points = RW.VOTE_POINTS[position];
                const direction = RW.slug(giver.country) + ">" + RW.slug(receiver);
                const entry = given.get(direction) || { from: giver.country, to: receiver, points: 0 };
                entry.points += points;
                given.set(direction, entry);

                const names = [giver.country, receiver].sort((a, b) => a.localeCompare(b));
                const pairKey = names.map(RW.slug).join("+");
                const pair = pairs.get(pairKey) || { names, points: 0 };
                pair.points += points;
                pairs.set(pairKey, pair);
              });
            });
          });
        });

        const topGiven = best([...given.values()], (item) => item.points);
        if (topGiven.length) {
          add(recordCard("Most points from one country to another", topGiven[0].points, "points",
            topGiven.map((item) => ({ name: item.from, detail: "→ " + item.to })), "All editions added together.", n++));
        }

        const topPair = best([...pairs.values()], (item) => item.points);
        if (topPair.length) {
          add(recordCard("Best friends", topPair[0].points, "points",
            topPair.slice(0, 1).flatMap((item) => item.names.map((name) => ({ name }))),
            "Points the two exchanged, in both directions.", n++));
        }

        // Jury and televote
        let both = 0;
        let disagreed = 0;
        let compared = 0;

        years.forEach((year) => {
          const rows = data.results[year].grand;
          const finalists = rows.filter((row) => !row.voterOnly);
          if (!RW.groupsWithVotes(rows).length || RW.groupsWithVotes(rows).length < 2) return;

          const topOf = (group) => {
            const totals = finalists.map((row) => ({ row, total: rows.reduce((sum, giver) => sum + RW.pointsFor(giver, row.country, group), 0) }));
            const max = Math.max(...totals.map((item) => item.total));
            return max > 0 ? totals.find((item) => item.total === max).row.country : null;
          };

          const jury = topOf("jury");
          const tele = topOf("tele");
          if (!jury || !tele) return;

          compared += 1;
          if (RW.same(jury, tele)) { if (RW.same(jury, finalists[0].country)) both += 1; } else disagreed += 1;
        });

        if (compared) {
          add(recordCard("Won jury and televote", both, both === 1 ? "edition" : "editions", [],
            "Out of " + plural(compared, "edition", "editions") + " with both kinds of votes.", n++));
          add(recordCard("Jury and televote disagreed", disagreed, disagreed === 1 ? "edition" : "editions", [],
            "The jury and the public had different favourites.", n++));
        }

        root.append(grid);

        /* ----- Leaderboards ----- */

        root.append(el("h2", "section-title", "Leaderboards"));
        const boards = el("div", "boards");

        const board = (title, list, value, unit) => {
          const items = list.filter((item) => value(item) > 0);
          if (!items.length) return;

          const section = el("section", "board");
          section.append(el("h3", "", title));
          items.sort((a, b) => value(b) - value(a) || a.name.localeCompare(b.name))
            .slice(0, 5)
            .forEach((item, index) => section.append(leaderLine(index + 1, item.name, value(item) + (unit || ""), item.heart)));
          boards.append(section);
        };

        board("Most wins", stats, (s) => s.wins);
        board("Most podiums", stats, (s) => s.podiums);
        board("Most maximum scores", stats, (s) => s.twelves);
        board("Most editions", stats.filter((s) => s.editions > 1), (s) => s.editions);

        if (boards.children.length) root.append(boards);

        document.title = "Records and hall of fame | Eurovision Rewind";
      }

      render();
      Promise.all([RW.load("hearts"), RW.load("results"), RW.load("participants"), RW.load("artists")]).then(render);
    })();

    if (window.lucide) window.lucide.createIcons();
  </script>
