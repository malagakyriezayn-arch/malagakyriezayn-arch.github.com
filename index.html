
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <!-- Icon library -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      /* Customize the header here */
      --pill-bg: rgba(255, 255, 255, 0.12);
      --pill-border: rgba(255, 255, 255, 0.25);
      --icon-color: #ffffff;
      --icon-hover: rgba(255, 255, 255, 0.16);
      --pill-radius: 999px;
      --pill-blur: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: #11131b;
      background-image:
        radial-gradient(at top left, #39345b, transparent 50%),
        radial-gradient(at bottom right, #183d4b, transparent 50%);
    }

    /* Header placement */
    .header-wrapper {
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Rounded transparent rectangle */
    .pill-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      min-height: 64px;

      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: var(--pill-radius);

      -webkit-backdrop-filter: blur(var(--pill-blur));
      backdrop-filter: blur(var(--pill-blur));

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      max-width: 100%;
    }

    /* Replaceable logo */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      text-decoration: none;
    }

    .brand img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Optional text beside the logo */
    .brand-name {
      color: var(--icon-color);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      color: var(--icon-color);
      background: transparent;
      border-radius: 50%;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .nav-icon:hover {
      background: var(--icon-hover);
      transform: translateY(-2px);
    }

    .nav-icon svg {
      width: 21px;
      height: 21px;
      stroke-width: 1.8;
    }

    .nav-icon:focus-visible,
    .brand:focus-visible {
      outline: 2px solid var(--icon-color);
      outline-offset: 3px;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .pill-header {
        gap: 4px;
        padding: 6px 8px;
      }

      .brand {
        width: 38px;
        height: 38px;
      }

      .nav-icon {
        width: 38px;
        height: 38px;
      }

      .nav-icons {
        gap: 1px;
      }

      .brand-name {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header class="header-wrapper">
    <nav class="pill-header" aria-label="Main navigation">

      <!-- LOGO: Replace the image URL below -->
      <a class="brand" href="index.html" aria-label="Home">
        <img
          src="assets/logo.png"
          alt="Website logo"
        >
      </a>

      <!-- OPTIONAL WEBSITE NAME: Remove this if unnecessary -->
      <a class="brand-name" href="index.html">
        My Website
      </a>

      <!-- NAVIGATION ICONS: Copy a link to add another icon -->
      <div class="nav-icons">

        <a class="nav-icon" href="index.html"
           aria-label="Home" title="Home">
          <i data-lucide="house"></i>
        </a>

        <a class="nav-icon" href="about.html"
           aria-label="About" title="About">
          <i data-lucide="circle-user-round"></i>
        </a>

        <a class="nav-icon" href="projects.html"
           aria-label="Projects" title="Projects">
          <i data-lucide="layout-grid"></i>
        </a>

        <a class="nav-icon" href="settings.html"
           aria-label="Settings" title="Settings">
          <i data-lucide="settings"></i>
        </a>

      </div>
    </nav>
  </header>

  <main style="padding: 48px 20px; text-align: center;">
    <h1>Welcome to my website</h1>
    <p>Your content goes here.</p>
  </main>

  <script>
    // Render all replaceable icons
    lucide.createIcons();
  </script>

</body>
</html>
