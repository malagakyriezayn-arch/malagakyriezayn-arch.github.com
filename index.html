<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gradient Site</title>
    <style>
        body {
            /* Ensures the background covers the whole mobile screen */
            margin: 0;
            min-height: 100vh; 
            
            /* Gradient: Starts at Deep Blue (#1a2a6c) and fades to Coral (#f4a261) */
            background: linear-gradient(#1a2a6c, #f4a261);
            
            /* Optional: Centers text nicely on mobile */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
</body>
</html>
