
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <title>Eurovision Rewind</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at 10% 0%, #59428b88, transparent 45%),
        radial-gradient(ellipse at 100% 35%, #19849f55, transparent 45%),
        linear-gradient(135deg, #11131b, #171827 55%, #101c27);
      background-attachment: fixed;
    }

    body.modal-open { overflow: hidden; }

    button, a { -webkit-tap-highlight-color: transparent; }

    /* Navigation */
    .header-wrapper {
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    .pill-header {
      width: 100%;
      max-width: 1100px;
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 9px 18px;
      border: 1px solid #ffffff35;
      border-radius: 999px;
      background: #ffffff12;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px #0002;
    }

    .brand {
      display: flex;
      align-items: center;
      max-width: 120px;
      height: 42px;
      flex-shrink: 0;
    }

    .brand img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .brand-name {
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
    }

    .nav-icon {
      width: 44px;
      height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: transparent;
      border: 0;
      border-radius: 50%;
      text-decoration: none;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .nav-icon:hover {
      background: #ffffff20;
      transform: translateY(-2px);
    }

    .nav-icon svg {
      display: block;
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Home page */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 80px 22px;
      text-align: center;
    }

    main h1 {
      font-size: clamp(32px, 6vw, 58px);
      margin-bottom: 14px;
    }

    main p {
      color: #ffffffb8;
      line-height: 1.7;
    }

    /* Archive overlay */
    .archive-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #08091499;
      backdrop-filter: blur(0);
      -webkit-backdrop-filter: blur(0);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .3s, visibility .3s, backdrop-filter .3s;
    }

    .archive-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .archive-modal {
      width: min(100%, 950px);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      padding: clamp(18px, 4vw, 34px);
      background: #171827f5;
      border: 1px solid #ffffff25;
      border-radius: 26px;
      box-shadow: 0 24px 100px #0007;
      opacity: 0;
      transform: translateY(20px) scale(.98);
      transition: transform .3s, opacity .3s;
    }

    .archive-overlay.open .archive-modal {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .archive-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .archive-heading h2 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
    }

    .archive-subtitle {
      margin: 10px 0 24px;
      color: #ffffffa8;
      font-size: 14px;
      line-height: 1.6;
    }

    .archive-close {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: white;
      background: #ffffff12;
      border: 1px solid #ffffff20;
      border-radius: 50%;
      cursor: pointer;
    }

    .archive-close:hover { background: #ffffff25; }

    .archive-close svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* Edition cards */
    .edition-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .edition-card {
      position: relative;
      display: block;
      aspect-ratio: 1;
      min-width: 0;
      overflow: hidden;
      color: white;
      text-decoration: none;
      border: 1px solid #ffffff25;
      border-radius: 21px;
      background: linear-gradient(145deg, #343653, #111722);
      isolation: isolate;
      opacity: 0;
      transform: translateY(20px);
    }

    .archive-overlay.open .edition-card {
      animation: appear .45s ease forwards;
      animation-delay: calc(var(--i) * 80ms + 80ms);
    }

    @keyframes appear {
      to { opacity: 1; transform: translateY(0); }
    }

    .edition-card:hover {
      border-color: #ffffff90;
    }

    .edition-image {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--position, center);
      transition: transform .4s;
    }

    .edition-card:hover .edition-image {
      transform: scale(1.06);
    }

    .edition-card::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background: linear-gradient(
        to bottom,
        #08091405 10%,
        #08091420 35%,
        #080914e8 100%
      );
    }

    .trophy-placeholder {
      position: absolute;
      inset: 0;
      z-index: -2;
      display: grid;
      place-items: center;
      color: #ffffffa0;
    }

    .trophy-placeholder svg {
      width: 42px;
      height: 42px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .edition-content {
      position: absolute;
      right: 13px;
      bottom: 14px;
      left: 13px;
    }

    .edition-year {
      display: block;
      margin-bottom: 6px;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 800;
    }

    .edition-country {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .edition-song {
      display: block;
      color: #ffffffc9;
      font-size: 12px;
      line-height: 1.4;
    }

    .edition-slogan {
      display: inline-block;
      margin-top: 9px;
      padding: 5px 8px;
      background: #ffffff20;
      border: 1px solid #ffffff25;
      border-radius: 999px;
      font-size: 10px;
    }

    @media (max-width: 700px) {
      .header-wrapper { padding: 12px; }
      .pill-header { gap: 7px; padding: 7px 10px; }
      .brand { max-width: 76px; height: 35px; }
      .brand-name { font-size: 12px; }
      .nav-icons { gap: 1px; }
      .nav-icon { width: 36px; height: 36px; }
      .nav-icon svg { width: 19px; height: 19px; }
      .edition-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .edition-card { border-radius: 16px; }
      .edition-content { right: 9px; bottom: 10px; left: 9px; }
      .edition-year { font-size: 23px; }
      .edition-country { font-size: 11px; }
      .edition-song { font-size: 10px; }
      .edition-slogan { margin-top: 6px; font-size: 9px; }
    }

    @media (max-width: 380px) {
      .pill-header { gap: 4px; padding: 6px; }
      .brand { max-width: 54px; height: 30px; }
      .brand-name { display: none; }
      .nav-icons { flex: 1; justify-content: flex-end; }
      .nav-icon { flex: 1; max-width: 42px; }
      .edition-grid { gap: 8px; }
      .edition-content { right: 7px; bottom: 8px; left: 7px; }
      .edition-year { font-size: 19px; }
      .edition-country, .edition-song { font-size: 9px; }
      .edition-slogan { font-size: 8px; padding: 4px 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <header class="header-wrapper">
    <nav class="pill-header" aria-label="Main navigation">

      <a class="brand" href="index.html" aria-label="Home">
        <img src="IMG_20261024_195602.png" alt="Eurovision Rewind">
      </a>

      <a class="brand-name" href="index.html">Eurovision Rewind</a>

      <div class="nav-icons">

        <a class="nav-icon" href="index.html" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 10 9-7 9 7"></path>
            <path d="M5 9v12h14V9"></path>
            <path d="M9 21v-7h6v7"></path>
          </svg>
        </a>

        <a class="nav-icon" href="about.html" aria-label="About" title="About">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
          </svg>
        </a>

        <button class="nav-icon" id="archive-open" type="button"
                aria-label="Edition archive" title="Edition archive">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          </svg>
        </button>

        <a class="nav-icon" href="settings.html"
           aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.7-1.4-2.4 1.4-1.1a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.8 1l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1 0 2Z" transform="translate(-1 -1) scale(1.08)"></path>
          </svg>
        </a>

      </div>
    </nav>
  </header>

  <main>
    <h1>Eurovision Rewind</h1>
    <p>Revisit the editions, discover the winning entries, and explore the archive.</p>
  </main>

  <div class="archive-overlay" id="archive-overlay" aria-hidden="true">
    <section class="archive-modal" role="dialog" aria-modal="true"
             aria-labelledby="archive-title">

      <div class="archive-heading">
        <h2 id="archive-title">Edition Archive</h2>

        <button class="archive-close" id="archive-close"
                type="button" aria-label="Close archive">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m18 6-12 12M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <p class="archive-subtitle">
        Choose an edition to explore its history and winning entry.
      </p>

      <div class="edition-grid" id="edition-grid"></div>
    </section>
  </div>

  <script>
    // EDIT YOUR EDITION INFORMATION HERE.
    const editions = [
      {
        year: 2026,
        slogan: "Grand Ouverture",
        flag: "🇭🇷",
        winnerCountry: "Croatia",
        winnerSong: "Rim Tim Tagi Dim",
        winnerImage: "images (36).jpeg",
        page: "2026.html",
        imagePosition: "50% 35%"
      },
      {
        year: 2027,
        slogan: "Feel Alive",
        flag: "🏆",
        winnerCountry: "Winner to be added",
        winnerSong: "Winning song to be added",
        winnerImage: "images/2027-winner.png",
        page: "2027.html",
        imagePosition: "center"
      },
      {
        year: 2028,
        slogan: "Beyond Border",
        flag: "🏆",
        winnerCountry: "Winner to be added",
        winnerSong: "Winning song to be added",
        winnerImage: "images/2028-winner.png",
        page: "2028.html",
        imagePosition: "center"
      }
    ];

    const openButton = document.getElementById("archive-open");
    const closeButton = document.getElementById("archive-close");
    const overlay = document.getElementById("archive-overlay");
    const grid = document.getElementById("edition-grid");

    let previousFocus = null;

    function safeText(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function renderEditions() {
      grid.innerHTML = editions.map((edition, index) => `
        <a
          class="edition-card"
          href="${safeText(edition.page)}"
          style="--i:${index};--position:${safeText(edition.imagePosition || "center")}"
        >
          <div class="trophy-placeholder" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"></path>
              <path d="M7 6H4v3a4 4 0 0 0 4 4M17 6h3v3a4 4 0 0 1-4 4"></path>
            </svg>
          </div>

          <img
            class="edition-image"
            src="${safeText(edition.winnerImage)}"
            alt=""
          >

          <div class="edition-content">
            <span class="edition-year">${safeText(edition.year)}</span>
            <span class="edition-country">${safeText(edition.flag)} ${safeText(edition.winnerCountry)}</span>
            <span class="edition-song">${safeText(edition.winnerSong)}</span>
            <span class="edition-slogan">${safeText(edition.slogan)}</span>
          </div>
        </a>
      `).join("");

      grid.querySelectorAll(".edition-image").forEach(img => {
        img.addEventListener("error", () => img.remove(), { once: true });
      });
    }

    function openArchive() {
      previousFocus = document.activeElement;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      closeButton.focus();
    }

    function closeArchive() {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");

      if (previousFocus) previousFocus.focus();
    }

    openButton.addEventListener("click", openArchive);
    closeButton.addEventListener("click", closeArchive);

    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeArchive();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && overlay.classList.contains("open")) {
        closeArchive();
      }
    });

    renderEditions();
  </script>

</body>
</html>
