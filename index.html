
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <!-- Icon library -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      /* Customize the header here */
      --pill-bg: rgba(255, 255, 255, 0.12);
      --pill-border: rgba(255, 255, 255, 0.25);
      --icon-color: #ffffff;
      --icon-hover: rgba(255, 255, 255, 0.16);
      --pill-radius: 999px;
      --pill-blur: 18px;
    }

    
  
/* Header wrapper adapts to the screen */
.header-wrapper {
  display: flex;
  justify-content: center;
  width: 100%;
  padding: clamp(10px, 2vw, 24px);
  box-sizing: border-box;
}

/* Pill expands with the available screen width */
.pill-header {
  display: flex;
  align-items: center;
  gap: clamp(6px, 1.2vw, 18px);

  width: 100%;
  max-width: 1100px;
  min-width: 0;
  box-sizing: border-box;

  padding: clamp(7px, 1.2vw, 14px)
           clamp(10px, 2vw, 24px);

  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  border-radius: 999px;

  -webkit-backdrop-filter: blur(var(--pill-blur));
  backdrop-filter: blur(var(--pill-blur));

  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
}

/* Logo */
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;

  width: clamp(34px, 3.5vw, 48px);
  height: clamp(34px, 3.5vw, 48px);

  border-radius: 50%;
  overflow: hidden;
}

.brand img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Website name */
.brand-name {
  color: var(--icon-color);
  font-size: clamp(13px, 1.2vw, 17px);
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}

/* Navigation icons */
.nav-icons {
  display: flex;
  align-items: center;
  gap: clamp(3px, 0.8vw, 12px);

  margin-left: auto;
  min-width: 0;
}

.nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;

  width: clamp(34px, 3.5vw, 48px);
  height: clamp(34px, 3.5vw, 48px);

  color: var(--icon-color);
  background: transparent;
  border-radius: 50%;
  text-decoration: none;
  transition: background 0.2s, transform 0.2s;
}

.nav-icon:hover {
  background: var(--icon-hover);
  transform: translateY(-2px);
}

.nav-icon svg {
  width: clamp(17px, 1.8vw, 23px);
  height: clamp(17px, 1.8vw, 23px);
  stroke-width: 1.8;
}

/* Medium screens and tablets */
@media (max-width: 700px) {
  .header-wrapper {
    padding: 12px;
  }

  .pill-header {
    max-width: none;
    gap: 8px;
    padding: 8px 12px;
  }

  .brand {
    width: 38px;
    height: 38px;
  }

  .brand-name {
    font-size: 14px;
  }

  .nav-icons {
    gap: 3px;
  }

  .nav-icon {
    width: 38px;
    height: 38px;
  }

  .nav-icon svg {
    width: 19px;
    height: 19px;
  }
}

/* Small phones */
@media (max-width: 420px) {
  .header-wrapper {
    padding: 10px;
  }

  .pill-header {
    width: 100%;
    gap: 6px;
    padding: 7px 9px;
  }

  .brand {
    width: 34px;
    height: 34px;
  }

  .brand-name {
    display: none;
  }

  .nav-icons {
    flex: 1;
    justify-content: flex-end;
    gap: 2px;
  }

  .nav-icon {
    flex: 1 1 0;
    min-width: 0;
    max-width: 44px;
    height: 34px;
  }

  .nav-icon svg {
    width: 18px;
    height: 18px;
  }
}
