
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <!-- Icon library -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      /* Customize the header here */
      --pill-bg: rgba(255, 255, 255, 0.12);
      --pill-border: rgba(255, 255, 255, 0.25);
      --icon-color: #ffffff;
      --icon-hover: rgba(255, 255, 255, 0.16);
      --pill-radius: 999px;
      --pill-blur: 18px;
    }

    
/* Header positioning */
.header-wrapper {
  display: flex;
  justify-content: center;
  width: 100%;
  padding: 20px 16px;
  box-sizing: border-box;
}

/* Responsive glass pill */
.pill-header {
  display: flex;
  align-items: center;
  gap: clamp(4px, 1vw, 12px);

  width: fit-content;
  max-width: 100%;
  min-width: 0;

  padding: clamp(5px, 1vw, 9px)
           clamp(7px, 1.5vw, 14px);

  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  border-radius: 999px;

  -webkit-backdrop-filter: blur(var(--pill-blur));
  backdrop-filter: blur(var(--pill-blur));

  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
}

/* Logo */
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;

  width: clamp(34px, 4vw, 46px);
  height: clamp(34px, 4vw, 46px);

  border-radius: 50%;
  overflow: hidden;
}

.brand img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Website name */
.brand-name {
  color: var(--icon-color);
  font-size: clamp(12px, 1.2vw, 16px);
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}

/* Navigation icons */
.nav-icons {
  display: flex;
  align-items: center;
  gap: clamp(1px, 0.5vw, 6px);
  min-width: 0;
}

.nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 1 auto;

  width: clamp(34px, 4vw, 46px);
  height: clamp(34px, 4vw, 46px);

  color: var(--icon-color);
  background: transparent;
  border-radius: 50%;
  text-decoration: none;

  transition: background 0.2s, transform 0.2s;
}

.nav-icon:hover {
  background: var(--icon-hover);
  transform: translateY(-2px);
}

.nav-icon svg {
  width: clamp(17px, 2vw, 22px);
  height: clamp(17px, 2vw, 22px);
  flex-shrink: 0;
  stroke-width: 1.8;
}

/* Keyboard accessibility */
.nav-icon:focus-visible,
.brand:focus-visible {
  outline: 2px solid var(--icon-color);
  outline-offset: 2px;
}

/* Mobile screens */
@media (max-width: 480px) {
  .header-wrapper {
    padding: 14px 10px;
  }

  .pill-header {
    gap: 3px;
    padding: 5px 7px;
  }

  .brand {
    width: 34px;
    height: 34px;
  }

  .brand-name {
    display: none;
  }

  .nav-icons {
    gap: 0;
  }

  .nav-icon {
    width: 34px;
    height: 34px;
  }

  .nav-icon svg {
    width: 18px;
    height: 18px;
  }
}

/* Very narrow phones */
@media (max-width: 350px) {
  .header-wrapper {
    padding-inline: 6px;
  }

  .pill-header {
    gap: 1px;
    padding: 4px;
  }

  .brand,
  .nav-icon {
    width: 30px;
    height: 30px;
  }

  .nav-icon svg {
    width: 16px;
    height: 16px;
  }
}
