
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11131b">

  <title>Eurovision Rewind</title>
  <meta name="description" content="Explore the Eurovision Rewind archive and its editions.">

  <!-- Montserrat font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide icon library -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.09);
      --glass-border: rgba(255, 255, 255, 0.20);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.70);
      --blur: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      font-family: "Montserrat", sans-serif;
      background:
        radial-gradient(ellipse at 10% 0%, rgba(105, 74, 190, 0.42), transparent 45%),
        radial-gradient(ellipse at 100% 35%, rgba(25, 132, 160, 0.30), transparent 45%),
        linear-gradient(135deg, #11131b, #171827 55%, #101c27);
      background-attachment: fixed;
    }

    body.archive-is-open {
      overflow: hidden;
    }

    button, a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* NAVIGATION */

    .header-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 18px;
    }

    .pill-header {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      min-height: 62px;
      padding: 8px 16px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      -webkit-backdrop-filter: blur(var(--blur));
      backdrop-filter: blur(var(--blur));
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      max-width: 125px;
      height: 42px;
      flex-shrink: 0;
      text-decoration: none;
    }

    .brand img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      padding: 0;
      color: white;
      background: transparent;
      border: 0;
      border-radius: 50%;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .nav-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .nav-icon svg {
      display: block;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .nav-icon:focus-visible,
    .archive-close:focus-visible,
    .edition-card:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    /* HOMEPAGE */

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(50px, 9vw, 100px) 22px;
      text-align: center;
    }

    main h1 {
      margin: 0 0 18px;
      font-size: clamp(30px, 6vw, 58px);
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    main p {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(13px, 2vw, 17px);
      line-height: 1.8;
    }

    /* ARCHIVE OVERLAY */

    .archive-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(7, 8, 17, 0.55);
      -webkit-backdrop-filter: blur(0);
      backdrop-filter: blur(0);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.3s ease,
        visibility 0.3s ease,
        backdrop-filter 0.3s ease;
    }

    .archive-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    /* ARCHIVE MODAL */

    .archive-modal {
      width: min(100%, 960px);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      padding: clamp(18px, 4vw, 34px);
      background: rgba(22, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      box-shadow: 0 24px 100px rgba(0, 0, 0, 0.40);
      opacity: 0;
      transform: translateY(22px) scale(0.98);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .archive-overlay.open .archive-modal {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .archive-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .archive-heading h2 {
      margin: 0;
      font-size: clamp(23px, 4vw, 34px);
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .archive-subtitle {
      margin: 10px 0 25px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .archive-close {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      padding: 0;
      color: white;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .archive-close:hover {
      background: rgba(255, 255, 255, 0.17);
      transform: rotate(90deg);
    }

    .archive-close svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
    }

    /* EDITION GRID */

    .edition-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(12px, 2vw, 20px);
    }

    .edition-card {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      color: white;
      text-decoration: none;
      background:
        radial-gradient(circle at 25% 15%, rgba(124, 91, 210, 0.45), transparent 55%),
        linear-gradient(145deg, #292b48, #111722);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      isolation: isolate;
      opacity: 0;
      transform: translateY(24px) scale(0.97);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .archive-overlay.open .edition-card {
      animation: cardAppear 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      animation-delay: calc(80ms + var(--card-index, 0) * 80ms);
    }

    @keyframes cardAppear {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .edition-card:hover {
      border-color: rgba(255, 255, 255, 0.60);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.30);
    }

    .edition-image {
      position: absolute;
      inset: 0;
      z-index: -2;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--image-position, center);
      transition: transform 0.4s ease;
    }

    .edition-card:hover .edition-image {
      transform: scale(1.06);
    }

    .edition-card::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background: linear-gradient(
        to bottom,
        rgba(8, 9, 20, 0.03) 5%,
        rgba(8, 9, 20, 0.18) 35%,
        rgba(8, 9, 20, 0.91) 100%
      );
    }

    .edition-placeholder {
      position: absolute;
      inset: 0;
      z-index: -2;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.75);
    }

    .edition-placeholder svg {
      width: 42px;
      height: 42px;
      stroke: currentColor;
    }

    .edition-content {
      position: absolute;
      right: 13px;
      bottom: 14px;
      left: 13px;
      text-align: left;
    }

    .edition-year {
      display: block;
      margin-bottom: 6px;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    /* COUNTRY TEXT AND FLAG IMAGE */

    .edition-country-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      margin-bottom: 4px;
      vertical-align: middle;
    }

    .country-flag {
      display: block;
      width: 30px;
      height: 20px;
      flex: 0 0 auto;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .edition-country {
      display: block;
      min-width: 0;
      font-size: clamp(11px, 1.4vw, 14px);
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .edition-song {
      display: -webkit-box;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.78);
      font-size: clamp(10px, 1.2vw, 12px);
      line-height: 1.5;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .edition-slogan {
      display: inline-block;
      margin-top: 9px;
      padding: 5px 8px;
      color: rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    @media (max-width: 700px) {
      .header-wrapper {
        padding: 12px;
      }

      .pill-header {
        min-height: 54px;
        padding: 6px 10px;
      }

      .brand {
        max-width: 90px;
        height: 36px;
      }

      .nav-icons {
        gap: 2px;
      }

      .nav-icon {
        width: 38px;
        height: 38px;
      }

      .nav-icon svg {
        width: 20px;
        height: 20px;
      }

      .edition-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .edition-card {
        border-radius: 17px;
      }

      .edition-content {
        right: 9px;
        bottom: 10px;
        left: 9px;
      }

      .edition-year {
        font-size: 23px;
      }

      .edition-country {
        font-size: 11px;
      }

      .country-flag {
        width: 26px;
        height: 18px;
        border-radius: 4px;
      }

      .edition-song {
        font-size: 10px;
      }

      .edition-slogan {
        margin-top: 6px;
        padding: 4px 6px;
        font-size: 8px;
      }
    }

    @media (max-width: 380px) {
      .pill-header {
        padding: 5px 7px;
      }

      .brand {
        max-width: 62px;
        height: 31px;
      }

      .nav-icons {
        gap: 0;
      }

      .nav-icon {
        width: 35px;
        height: 35px;
      }

      .nav-icon svg {
        width: 18px;
        height: 18px;
      }

      .archive-overlay {
        padding: 8px;
      }

      .archive-modal {
        max-height: calc(100dvh - 16px);
        padding: 15px;
        border-radius: 21px;
      }

      .archive-subtitle {
        margin-bottom: 18px;
        font-size: 12px;
      }

      .edition-grid {
        gap: 8px;
      }

      .edition-content {
        right: 7px;
        bottom: 8px;
        left: 7px;
      }

      .edition-year {
        font-size: 19px;
      }

      .edition-country,
      .edition-song {
        font-size: 9px;
      }

      .country-flag {
        width: 22px;
        height: 15px;
        border-radius: 3px;
      }

      .edition-country-row {
        gap: 4px;
      }

      .edition-slogan {
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <header class="header-wrapper">
    <nav class="pill-header" aria-label="Main navigation">

      <a class="brand" href="index.html" aria-label="Home">
        <img src="IMG_20261024_195602.png" alt="Eurovision Rewind logo">
      </a>

      <div class="nav-icons">

        <a class="nav-icon" href="index.html" aria-label="Home" title="Home">
          <i data-lucide="house"></i>
        </a>

        <a class="nav-icon" href="about.html" aria-label="About" title="About">
          <i data-lucide="circle-user-round"></i>
        </a>

        <button class="nav-icon"
                id="archive-open"
                type="button"
                aria-label="Edition archive"
                title="Edition archive"
                aria-haspopup="dialog"
                aria-controls="archive-overlay">
          <i data-lucide="layout-grid"></i>
        </button>

        <a class="nav-icon"
           href="settings.html"
           aria-label="Settings"
           title="Settings">
          <i data-lucide="settings"></i>
        </a>

      </div>
    </nav>
  </header>

  <!-- HOMEPAGE -->
  <main>
    <h1>Eurovision Rewind</h1>
    <p>
      Revisit the editions, discover the winning entries,
      and explore the history of Eurovision Rewind.
    </p>
  </main>

  <!-- ARCHIVE OVERLAY -->
  <div class="archive-overlay"
       id="archive-overlay"
       aria-hidden="true">

    <section class="archive-modal"
             role="dialog"
             aria-modal="true"
             aria-labelledby="archive-title">

      <div class="archive-heading">
        <h2 id="archive-title">Edition Archive</h2>

        <button class="archive-close"
                id="archive-close"
                type="button"
                aria-label="Close archive">
          <i data-lucide="x"></i>
        </button>
      </div>

      <p class="archive-subtitle">
        Select an edition to explore its results, entries, and history.
      </p>

      <div class="edition-grid" id="edition-grid"></div>
    </section>
  </div>

  <!-- WEBSITE JAVASCRIPT -->
  <script>
    /*
      EDITION SETTINGS

      winnerFlag is the path to the flag image in your repository.
      winnerImage is the path to the winner image.
      page is the HTML page that opens when the card is clicked.

      Leave winnerFlag empty if the winner's flag has not been added yet.
    */

    const editions = [
      {
        year: 2026,
        slogan: "Grand Ouverture",
        winnerFlag: "Flag_of_Croatia.png",
        winnerCountry: "Croatia",
        winnerSong: "Rim Tim Tagi Dim",
        winnerImage: "images/images (36).jpeg",
        imagePosition: "50% 35%",
        page: "2026.html"
      },
      {
        year: 2027,
        slogan: "Feel Alive",
        winnerFlag: "Flag_of_Croatia.png",
        winnerCountry: "Croatia",
        winnerSong: "Andromeda",
        winnerImage: "images/image (1).jpeg",
        imagePosition: "center",
        page: "2027.html"
      },
      {
        year: 2028,
        slogan: "Beyond Borders",
        winnerFlag: "images/Civil_Ensign_of_Switzerland_(Pantone).svg.png",
        winnerCountry: "Switzerland",
        winnerSong: "The Code",
        winnerImage: "images/Nemo-Switzerland-Eurovision.jpg",
        imagePosition: "center",
        page: "2028.html"
      }
    ];

    const openButton = document.getElementById("archive-open");
    const closeButton = document.getElementById("archive-close");
    const overlay = document.getElementById("archive-overlay");
    const grid = document.getElementById("edition-grid");

    let previousFocus = null;

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function initializeIcons() {
      if (window.lucide && typeof window.lucide.createIcons === "function") {
        window.lucide.createIcons();
      } else {
        console.error(
          "Lucide failed to load. Check your internet connection or CDN access."
        );
      }
    }

    function renderEditions() {
      grid.innerHTML = editions.map((edition, index) => {
        const flagHTML = edition.winnerFlag
          ? `
            <img
              class="country-flag"
              src="${escapeHTML(edition.winnerFlag)}"
              alt="${escapeHTML(edition.winnerCountry)} flag"
            >
          `
          : "";

        return `
          <a
            class="edition-card"
            href="${escapeHTML(edition.page)}"
            style="--card-index:${index};--image-position:${escapeHTML(edition.imagePosition || "center")}"
            aria-label="${escapeHTML(
              edition.year + " edition, " +
              edition.winnerCountry + ", " +
              edition.winnerSong
            )}"
          >
            <div class="edition-placeholder" aria-hidden="true">
              <i data-lucide="trophy"></i>
            </div>

            <img
              class="edition-image"
              src="${escapeHTML(edition.winnerImage)}"
              alt=""
            >

            <div class="edition-content">
              <span class="edition-year">
                ${escapeHTML(edition.year)}
              </span>

              <span class="edition-country-row">
                ${flagHTML}
                <span class="edition-country">
                  ${escapeHTML(edition.winnerCountry)}
                </span>
              </span>

              <span class="edition-song">
                ${escapeHTML(edition.winnerSong)}
              </span>

              <span class="edition-slogan">
                ${escapeHTML(edition.slogan)}
              </span>
            </div>
          </a>
        `;
      }).join("");

      // Missing winner images leave the gradient background visible.
      grid.querySelectorAll(".edition-image").forEach(image => {
        image.addEventListener("error", () => {
          image.remove();
        }, { once: true });
      });

      // Hide missing flag images without leaving broken-image icons.
      grid.querySelectorAll(".country-flag").forEach(image => {
        image.addEventListener("error", () => {
          image.remove();
        }, { once: true });
      });

      // Initialize icons added to the archive cards.
      initializeIcons();
    }

    function openArchive() {
      previousFocus = document.activeElement;

      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("archive-is-open");

      closeButton.focus();
    }

    function closeArchive() {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("archive-is-open");

      if (previousFocus) {
        previousFocus.focus();
      }
    }

    openButton.addEventListener("click", openArchive);
    closeButton.addEventListener("click", closeArchive);

    overlay.addEventListener("click", event => {
      if (event.target === overlay) {
        closeArchive();
      }
    });

    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        overlay.classList.contains("open")
      ) {
        closeArchive();
      }
    });

    // Render the edition cards and initialize every Lucide icon.
    renderEditions();
    initializeIcons();
  </script>

</body>
</html>
