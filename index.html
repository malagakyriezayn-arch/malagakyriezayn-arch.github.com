
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eurovision Rewind</title>
  <meta name="theme-color" content="#11131b">
  <meta name="description" content="Explore the Eurovision Rewind archive.">

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --pill-bg: rgba(255, 255, 255, 0.10);
      --pill-border: rgba(255, 255, 255, 0.22);
      --icon-color: #ffffff;
      --icon-hover: rgba(255, 255, 255, 0.16);
      --pill-blur: 20px;
      --pill-radius: 999px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background-color: #11131b;
      background-image:
        radial-gradient(
          ellipse at 10% 0%,
          rgba(105, 74, 190, 0.45),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 100% 35%,
          rgba(25, 132, 160, 0.35),
          transparent 45%
        ),
        linear-gradient(
          135deg,
          #11131b 0%,
          #171827 50%,
          #101c27 100%
        );
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
    }

    body.archive-is-open {
      overflow: hidden;
    }

    /* HEADER */

    .header-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: clamp(10px, 2vw, 24px);
    }

    .pill-header {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.2vw, 18px);
      width: 100%;
      max-width: 1100px;
      min-width: 0;
      padding: clamp(7px, 1.2vw, 14px)
               clamp(10px, 2vw, 24px);
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: var(--pill-radius);
      -webkit-backdrop-filter: blur(var(--pill-blur));
      backdrop-filter: blur(var(--pill-blur));
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 1 auto;
      width: auto;
      max-width: clamp(60px, 15vw, 180px);
      height: clamp(34px, 3.5vw, 48px);
      min-width: 0;
      overflow: hidden;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .brand-name {
      color: var(--icon-color);
      font-size: clamp(13px, 1.2vw, 17px);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: clamp(3px, 0.8vw, 12px);
      margin-left: auto;
      min-width: 0;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: clamp(34px, 3.5vw, 48px);
      height: clamp(34px, 3.5vw, 48px);
      padding: 0;
      color: var(--icon-color);
      background: transparent;
      border: 0;
      border-radius: 50%;
      text-decoration: none;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .nav-icon:hover {
      background: var(--icon-hover);
      transform: translateY(-2px);
    }

    .nav-icon svg {
      display: block;
      width: clamp(17px, 1.8vw, 23px);
      height: clamp(17px, 1.8vw, 23px);
      flex-shrink: 0;
      stroke-width: 1.8;
    }

    .brand:focus-visible,
    .brand-name:focus-visible,
    .nav-icon:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }

    /* HOME PAGE */

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding:
        clamp(28px, 6vw, 80px)
        clamp(16px, 4vw, 32px);
      text-align: center;
    }

    main h1 {
      margin-bottom: 16px;
      font-size: clamp(28px, 5vw, 56px);
    }

    main p {
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(14px, 2vw, 18px);
      line-height: 1.7;
    }

    /* ARCHIVE OVERLAY */

    .archive-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(7, 8, 17, 0.58);
      -webkit-backdrop-filter: blur(0);
      backdrop-filter: blur(0);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.3s ease,
        backdrop-filter 0.35s ease,
        visibility 0.3s ease;
    }

    .archive-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    /* ARCHIVE WINDOW */

    .archive-modal {
      width: min(100%, 1000px);
      max-height: min(850px, calc(100dvh - 48px));
      overflow-y: auto;
      padding: clamp(20px, 4vw, 36px);
      background: rgba(21, 23, 38, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 30px;
      box-shadow: 0 24px 100px rgba(0, 0, 0, 0.42);
      transform: translateY(22px) scale(0.98);
      opacity: 0;
      transition:
        transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
        opacity 0.3s ease;
    }

    .archive-overlay.open .archive-modal {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .archive-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .archive-heading h2 {
      margin: 0;
      font-size: clamp(23px, 4vw, 34px);
      letter-spacing: -0.8px;
    }

    .archive-subtitle {
      margin: 0 0 28px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 14px;
      line-height: 1.6;
    }

    .archive-close {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 42px;
      height: 42px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .archive-close:hover {
      background: rgba(255, 255, 255, 0.17);
      transform: rotate(90deg);
    }

    .archive-close svg {
      width: 20px;
      height: 20px;
    }

    /* EDITION GRID */

    .edition-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(12px, 2.2vw, 22px);
    }

    .edition-card {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      min-width: 0;
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(
          circle at 25% 15%,
          rgba(124, 91, 210, 0.55),
          transparent 55%
        ),
        linear-gradient(145deg, #292b48, #111722);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      text-decoration: none;
      isolation: isolate;
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
    }

    .archive-overlay.open .edition-card {
      animation: tileAppear 0.55s cubic-bezier(0.2, 0.8, 0.2, 1)
        forwards;
      animation-delay: calc(100ms + var(--tile-index, 0) * 90ms);
    }

    .edition-card:hover {
      z-index: 2;
      border-color: rgba(255, 255, 255, 0.55);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    .edition-card:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }

    .edition-image {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--image-position, 50% 50%);
      transition: transform 0.45s ease;
    }

    .edition-card:hover .edition-image {
      transform: scale(1.07);
    }

    .edition-card::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background: linear-gradient(
        180deg,
        rgba(8, 9, 20, 0.05) 5%,
        rgba(8, 9, 20, 0.10) 30%,
        rgba(8, 9, 20, 0.88) 100%
      );
    }

    .edition-placeholder {
      position: absolute;
      inset: 0;
      z-index: -2;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.75);
    }

    .edition-placeholder svg {
      width: 38px;
      height: 38px;
      stroke-width: 1.4;
    }

    .edition-content {
      position: absolute;
      right: 14px;
      bottom: 16px;
      left: 14px;
      text-align: left;
    }

    .edition-year {
      display: block;
      margin-bottom: 7px;
      font-size: clamp(21px, 3vw, 30px);
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .edition-country {
      display: block;
      margin-bottom: 5px;
      font-size: clamp(12px, 1.5vw, 15px);
      font-weight: 700;
      line-height: 1.35;
    }

    .edition-song {
      display: -webkit-box;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.75);
      font-size: clamp(10px, 1.3vw, 13px);
      line-height: 1.45;
      text-overflow: ellipsis;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .edition-slogan {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 8px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    @keyframes tileAppear {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* TABLETS */

    @media (max-width: 700px) {
      .header-wrapper {
        padding: 12px;
      }

      .pill-header {
        max-width: none;
        gap: 8px;
        padding: 8px 12px;
      }

      .brand {
        max-width: 100px;
        height: 38px;
      }

      .brand-name {
        font-size: 14px;
      }

      .nav-icons {
        gap: 3px;
      }

      .nav-icon {
        width: 38px;
        height: 38px;
      }

      .nav-icon svg {
        width: 19px;
        height: 19px;
      }

      .archive-overlay {
        padding: 14px;
      }

      .archive-modal {
        max-height: calc(100dvh - 28px);
        padding: 22px;
        border-radius: 24px;
      }

      .edition-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .edition-card {
        border-radius: 18px;
      }

      .edition-content {
        right: 10px;
        bottom: 12px;
        left: 10px;
      }

      .edition-year {
        font-size: 23px;
      }

      .edition-slogan {
        margin-top: 7px;
        font-size: 9px;
      }
    }

    /* MOBILE PHONES */

    @media (max-width: 420px) {
      .header-wrapper {
        padding: 10px;
      }

      .pill-header {
        width: 100%;
        max-width: none;
        gap: 6px;
        padding: 7px 9px;
      }

      .brand {
        max-width: 75px;
        height: 34px;
      }

      .brand-name {
        display: none;
      }

      .nav-icons {
        flex: 1;
        justify-content: flex-end;
        gap: 2px;
      }

      .nav-icon {
        flex: 1 1 0;
        min-width: 0;
        max-width: 44px;
        height: 34px;
      }

      .nav-icon svg {
        width: 18px;
        height: 18px;
      }

      .archive-overlay {
        padding: 8px;
      }

      .archive-modal {
        max-height: calc(100dvh - 16px);
        padding: 16px;
        border-radius: 21px;
      }

      .archive-subtitle {
        margin-bottom: 18px;
        font-size: 12px;
      }

      .edition-grid {
        gap: 9px;
      }

      .edition-card {
        border-radius: 15px;
      }

      .edition-content {
        right: 8px;
        bottom: 9px;
        left: 8px;
      }

      .edition-year {
        margin-bottom: 4px;
        font-size: 21px;
      }

      .edition-country {
        margin-bottom: 3px;
        font-size: 11px;
      }

      .edition-song {
        font-size: 10px;
      }

      .edition-slogan {
        padding: 4px 6px;
        font-size: 8px;
      }
    }

    @media (max-width: 350px) {
      .header-wrapper {
        padding: 8px 6px;
      }

      .pill-header {
        gap: 2px;
        padding: 5px;
      }

      .brand {
        max-width: 60px;
        height: 30px;
      }

      .nav-icons {
        gap: 0;
      }

      .nav-icon {
        height: 30px;
      }

      .nav-icon svg {
        width: 16px;
        height: 16px;
      }

      .archive-heading h2 {
        font-size: 21px;
      }

      .edition-grid {
        gap: 7px;
      }

      .edition-content {
        right: 6px;
        bottom: 7px;
        left: 6px;
      }

      .edition-year {
        font-size: 18px;
      }

      .edition-country,
      .edition-song {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <header class="header-wrapper">
    <nav class="pill-header" aria-label="Main navigation">

      <a class="brand" href="index.html" aria-label="Home">
        <img
          src="IMG_20261024_195602.png"
          alt="Eurovision Rewind logo"
        >
      </a>

      <a class="brand-name" href="index.html">
        Eurovision Rewind
      </a>

      <div class="nav-icons">

        <a class="nav-icon"
           href="index.html"
           aria-label="Home"
           title="Home">
          <i data-lucide="house"></i>
        </a>

        <a class="nav-icon"
           href="about.html"
           aria-label="About"
           title="About">
          <i data-lucide="circle-user-round"></i>
        </a>

        <button class="nav-icon"
                id="archive-open"
                type="button"
                aria-label="Edition archive"
                title="Edition archive"
                aria-haspopup="dialog"
                aria-controls="archive-overlay">
          <i data-lucide="layout-grid"></i>
        </button>

        <a class="nav-icon"
           href="settings.html"
           aria-label="Settings"
           title="Settings">
          <i data-lucide="settings"></i>
        </a>

      </div>
    </nav>
  </header>

  <!-- HOME CONTENT -->
  <main>
    <h1>Eurovision Rewind</h1>
    <p>
      Revisit the editions, discover the winning entries,
      and explore the history of Eurovision Rewind.
    </p>
  </main>

  <!-- EDITION ARCHIVE -->
  <div class="archive-overlay"
       id="archive-overlay"
       aria-hidden="true">

    <section class="archive-modal"
             role="dialog"
             aria-modal="true"
             aria-labelledby="archive-title">

      <div class="archive-heading">
        <h2 id="archive-title">Edition Archive</h2>

        <button class="archive-close"
                id="archive-close"
                type="button"
                aria-label="Close edition archive">
          <i data-lucide="x"></i>
        </button>
      </div>

      <p class="archive-subtitle">
        Select an edition to explore its results, entries, and history.
      </p>

      <div class="edition-grid" id="edition-grid"></div>

    </section>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    /*
      EDITION DATA

      Add or edit editions in this array.

      winnerImage: path to the winner image.
      imagePosition: image focus, e.g. "50% 30%".
      page: HTML page opened when the tile is clicked.

      2027 and 2028 winner information is placeholder content.
    */

    const editions = [
      {
        year: 2026,
        slogan: "Grand Ouverture",
        flag: "🇭🇷",
        winnerCountry: "Croatia",
        winnerSong: "Rim Tim Tagi Dim",
        winnerImage: "images/2026-winner.png",
        imagePosition: "50% 35%",
        page: "2026.html"
      },
      {
        year: 2027,
        slogan: "Feel Alive",
        flag: "🏆",
        winnerCountry: "Winner to be added",
        winnerSong: "Winning entry to be added",
        winnerImage: "images/2027-winner.png",
        imagePosition: "50% 50%",
        page: "2027.html"
      },
      {
        year: 2028,
        slogan: "Beyond Border",
        flag: "🏆",
        winnerCountry: "Winner to be added",
        winnerSong: "Winning entry to be added",
        winnerImage: "images/2028-winner.png",
        imagePosition: "50% 50%",
        page: "2028.html"
      }
    ];

    const archiveOpen = document.getElementById("archive-open");
    const archiveClose = document.getElementById("archive-close");
    const archiveOverlay = document.getElementById("archive-overlay");
    const editionGrid = document.getElementById("edition-grid");

    let previouslyFocusedElement = null;

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function renderEditions() {
      editionGrid.innerHTML = editions.map((edition, index) => `
        <a
          class="edition-card"
          href="${escapeHTML(edition.page)}"
          style="--tile-index:${index};--image-position:${escapeHTML(edition.imagePosition || "50% 50%")}"
          aria-label="${escapeHTML(
            edition.year + " edition: " +
            edition.winnerCountry + ", " +
            edition.winnerSong
          )}"
        >
          <div class="edition-placeholder" aria-hidden="true">
            <i data-lucide="trophy"></i>
          </div>

          <img
            class="edition-image"
            src="${escapeHTML(edition.winnerImage)}"
            alt=""
            loading="lazy"
          >

          <div class="edition-content">
            <span class="edition-year">
              ${escapeHTML(edition.year)}
            </span>

            <span class="edition-country">
              ${escapeHTML(edition.flag)}
              ${escapeHTML(edition.winnerCountry)}
            </span>

            <span class="edition-song">
              ${escapeHTML(edition.winnerSong)}
            </span>

            <span class="edition-slogan">
              ${escapeHTML(edition.slogan)}
            </span>
          </div>
        </a>
      `).join("");

      editionGrid.querySelectorAll(".edition-image").forEach(image => {
        image.addEventListener("error", () => {
          image.remove();
        }, { once: true });
      });

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function openArchive() {
      previouslyFocusedElement = document.activeElement;

      archiveOverlay.classList.add("open");
      archiveOverlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("archive-is-open");

      archiveClose.focus();
    }

    function closeArchive() {
      archiveOverlay.classList.remove("open");
      archiveOverlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("archive-is-open");

      if (previouslyFocusedElement) {
        previouslyFocusedElement.focus();
      }
    }

    archiveOpen.addEventListener("click", openArchive);
    archiveClose.addEventListener("click", closeArchive);

    // Close when the backdrop itself is clicked.
    archiveOverlay.addEventListener("click", event => {
      if (event.target === archiveOverlay) {
        closeArchive();
      }
    });

    // Close with Escape.
    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        archiveOverlay.classList.contains("open")
      ) {
        closeArchive();
      }
    });

    // Render archive cards, then initialize all Lucide icons.
    renderEditions();

    if (window.lucide) {
      lucide.createIcons();
    } else {
      console.error(
        "Lucide did not load. Check your internet connection."
      );
    }
  </script>

</body>
</html>
